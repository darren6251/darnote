                    </div>
                </div>

                {/* COLUMN 3: MAIN EDITOR */}
                <main className="flex-1 flex flex-col min-w-0 bg-white dark:bg-bg-base relative transition-colors duration-300">
                    {activeLog ? (
                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col h-full">
                            <header className="h-16 flex items-center justify-between px-6 lg:px-10 border-b border-slate-200 dark:border-border-subtle bg-white dark:bg-bg-panel shrink-0 z-10 shadow-sm">
                                <div className="flex-1 flex items-center gap-2 mr-4 min-w-0">
                                    <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-xl font-bold outline-none w-full text-slate-900 dark:text-white placeholder-slate-400 truncate" placeholder="Title your mistake..."/>
                                    
                                    {/* Auto-Title Group */}
                                    <div className="flex items-center gap-2 shrink-0 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
                                        <button onClick={handleAutoTitle} disabled={isAutoTitleLoading || (!activeLog.questionImages?.length && !activeLog.imageUrl)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold transition-colors ${isAutoTitleLoading ? 'bg-brand-main/20 text-brand-main animate-pulse' : 'text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 hover:shadow-sm'}`}>
                                            {isAutoTitleLoading ? <div className="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <Icons.Scan className="w-3 h-3"/>}
                                            <span className="hidden sm:inline">Auto-Title</span>
                                        </button>
                                        <button onClick={() => setPracticeConfig({ isOpen: true, mode: 'single' })} className="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 hover:shadow-sm transition-colors" title="Generate Drill Questions">
                                            <Icons.Brain className="w-3 h-3"/> <span className="hidden sm:inline">Drill</span>
                                        </button>
                                    </div>
                                    <AnimatePresence>
                                        {ocrPendingToast > 0 && (
                                            <motion.div initial={{opacity:0, scale:0.8}} animate={{opacity:1, scale:1}} exit={{opacity:0}} className="bg-orange-100 dark:bg-orange-500/20 text-orange-700 dark:text-orange-400 text-[10px] font-bold px-2 py-1 rounded-md flex items-center gap-1.5 shrink-0"><div className="w-1.5 h-1.5 rounded-full bg-orange-500 animate-pulse"/>Auto-OCR: {ocrPendingToast}s</motion.div>
                                        )}
                                    </AnimatePresence>
                                </div>
                                <div className="flex items-center gap-3 shrink-0">
                                    <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-1.5 rounded-lg text-xs font-bold border transition-colors ${activeLog.mastered ? 'bg-green-500/10 border-green-500 text-green-700 dark:text-green-400' : 'bg-red-500/10 border-red-500 text-red-700 dark:text-red-400'}`}>
                                        {activeLog.mastered ? 'Mastered' : 'Needs Review'}
                                    </button>
                                    <div className="h-6 w-px bg-slate-200 dark:bg-border-subtle mx-1"></div>
                                    <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-2 rounded-lg transition-colors border ${!user ? 'cursor-not-allowed opacity-50 bg-slate-100 dark:bg-slate-800 text-slate-400 border-transparent' : isAiOpen ? 'bg-brand-main text-white border-brand-main shadow-md' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-border-subtle text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`} title="AI Tutor">
                                        <Icons.Bot className="w-4 h-4"/>
                                    </button>
                                    <button onClick={() => handleDelete(activeLog.id)} className="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-500/10 text-slate-400 hover:text-red-500 transition-colors border border-transparent hover:border-red-200 dark:hover:border-red-500/30">
                                        <Icons.Trash className="w-4 h-4"/>
                                    </button>
                                </div>
                            </header>

                            <div className="flex-1 overflow-y-auto p-6 lg:p-10 scroll-smooth">
                                <div className="max-w-5xl mx-auto space-y-6">
                                    
                                    {/* 1. Metadata Strip */}
                                    <div className="bg-white dark:bg-bg-panel p-4 rounded-xl shadow-sm border border-slate-200 dark:border-border-subtle flex flex-wrap gap-6 items-center">
                                        <div className="flex-1 min-w-[200px] flex items-center gap-3">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider w-16 shrink-0">Subject</label>
                                            <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="input-field py-1.5">
                                                <option>General</option>
                                                {subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-1 min-w-[200px] flex items-center gap-3">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider w-10 shrink-0">Topic</label>
                                            <div className="flex gap-2 flex-1">
                                                {activeLog.subject !== 'General' && currentSub ? (
                                                    <><select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field py-1.5 flex-1"><option value="">-- Unassigned --</option>{currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}</select><button onClick={() => addTopicToSubject(activeLog.subject)} className="px-2.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand-main hover:text-white transition-colors text-slate-500 border border-slate-200 dark:border-border-subtle flex-shrink-0" title="Add Topic"><Icons.Plus className="w-4 h-4"/></button></>
                                                ) : ( <input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field py-1.5 flex-1" placeholder="Type here..." disabled={activeLog.subject !== 'General'}/> )}
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3 shrink-0">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Type</label>
                                            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-slate-200 dark:border-border-subtle">
                                                {['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`px-4 py-1 rounded-md text-xs font-bold transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-bg-panel shadow-sm text-brand-main dark:text-brand-accent' : 'text-slate-500'}`}>{t}</button>))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* 2. Uploaders side-by-side to save vertical space */}
                                    <div className="bg-white dark:bg-bg-panel p-5 rounded-xl shadow-sm border border-slate-200 dark:border-border-subtle relative">
                                        
                                        {/* Big Compare Button */}
                                        <div className="absolute top-5 left-1/2 -translate-x-1/2 z-10 hidden md:block">
                                            <button onClick={() => setCompareMode(true)} className="bg-brand-main text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg hover:bg-brand-hover transition-colors flex items-center gap-2 border-2 border-white dark:border-bg-panel" title="Side-by-Side View">
                                                <Icons.Columns className="w-4 h-4"/> Compare Full Screen
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 relative">
                                            <div className="hidden md:block absolute left-1/2 top-10 bottom-0 w-px bg-slate-200 dark:bg-border-subtle -translate-x-1/2"></div>
                                            
                                            <div className="space-y-4">
                                                <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label="Question Image" isUploading={uploadingQ} onImageClick={() => setCompareMode(true)} />
                                                <div>
                                                    <button onClick={() => setShowOcrText(!showOcrText)} className="text-[10px] font-bold flex items-center gap-1.5 text-brand-main hover:text-brand-hover transition-colors"><Icons.Scan className="w-3.5 h-3.5"/> {showOcrText ? "Hide Extracted Text" : "View Extracted Text"}</button>
                                                    <AnimatePresence>
                                                        {showOcrText && (
                                                            <motion.div initial={{height:0, opacity:0}} animate={{height:'auto', opacity:1}} exit={{height:0, opacity:0}} className="overflow-hidden">
                                                                <textarea value={activeLog.questionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="mt-2 w-full p-3 text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-border-subtle rounded-lg font-mono text-slate-600 dark:text-slate-400 focus:outline-none focus:border-brand-main min-h-[100px]" placeholder="AI will extract text here automatically..." />
                                                            </motion.div>
                                                        )}
                                                    </AnimatePresence>
                                                </div>
                                            </div>

                                            <div>
                                                <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Marking Scheme" isUploading={uploadingS} onImageClick={() => setCompareMode(true)} />
                                            </div>
                                        </div>
                                    </div>

                                    {/* 3. Analysis & Corrections - Maximizing study space */}
                                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                                        <div className="lg:col-span-3 bg-white dark:bg-bg-panel rounded-xl border border-slate-200 dark:border-border-subtle shadow-sm flex flex-col min-h-[300px]">
                                            <div className="px-5 py-3 border-b border-slate-200 dark:border-border-subtle bg-slate-50 dark:bg-slate-900/50 flex justify-between items-center rounded-t-xl">
                                                <span className="text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider flex items-center gap-2"><Icons.Brain className="w-4 h-4 text-brand-main"/> Post-Mortem Analysis</span>
                                                <span className="text-[10px] font-medium bg-slate-200 dark:bg-slate-800 text-slate-500 px-2 py-0.5 rounded">Markdown Supported</span>
                                            </div>
                                            <textarea className="flex-1 w-full p-5 bg-transparent outline-none resize-none text-sm leading-relaxed text-slate-800 dark:text-slate-200 placeholder-slate-400 font-mono" placeholder="• Why did I get this wrong?&#10;• What was the conceptual gap?&#10;• How do I avoid this next time?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/>
                                        </div>
                                        
                                        <div className="lg:col-span-1 flex flex-col gap-4">
                                            <div className="bg-white dark:bg-bg-panel p-5 rounded-xl shadow-sm border border-slate-200 dark:border-border-subtle flex-1 flex flex-col justify-center relative overflow-hidden">
                                                <div className="absolute top-0 right-0 w-2 h-full bg-green-500/20"></div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 block">Correct Answer</label>
                                                <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-border-subtle focus:border-green-500 rounded-lg px-3 py-3 font-mono text-xl font-bold text-green-700 dark:text-green-400 outline-none transition-colors" placeholder="e.g. 42"/>
                                            </div>
                                            <div className="bg-white dark:bg-bg-panel p-5 rounded-xl shadow-sm border border-slate-200 dark:border-border-subtle flex-1 flex flex-col justify-center relative overflow-hidden">
                                                <div className="absolute top-0 right-0 w-2 h-full bg-red-500/20"></div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 block">Marks Lost</label>
                                                <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-border-subtle focus:border-red-500 rounded-lg px-3 py-3 font-bold text-xl text-red-600 dark:text-red-400 outline-none transition-colors" placeholder="e.g. -2"/>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="h-4"></div>
                                </div>
                            </div>
                        </motion.div>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-center text-slate-400 h-full bg-slate-50 dark:bg-bg-base">
                            <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center p-8">
                                <div className="w-20 h-20 bg-white dark:bg-bg-panel rounded-full flex items-center justify-center mb-6 mx-auto shadow-sm border border-slate-200 dark:border-border-subtle">
                                    <Icons.Book className="w-8 h-8 text-slate-400 dark:text-slate-500"/>
                                </div>
                                <h2 className="text-xl font-bold text-slate-700 dark:text-white mb-2">No Mistake Selected</h2>
                                <p className="text-sm max-w-sm mx-auto mb-6 text-slate-500">Select an existing error from the list or create a new entry to start reviewing.</p>
                                <button onClick={createLog} className="btn-primary mx-auto"><Icons.Plus className="w-4 h-4"/> Log First Mistake</button>
                            </motion.div>
                        </div>
                    )}

                    <AnimatePresence>
                        {isAiOpen && activeLog && user && (
                            <AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/>
                        )}
                    </AnimatePresence>

                    {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
