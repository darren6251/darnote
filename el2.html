                                            <div className="glass-card p-6 flex-1 flex flex-col justify-center relative overflow-hidden group">
                                                <div className="absolute inset-0 bg-gradient-to-br from-red-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                                <label className="text-[10px] font-black text-red-500 uppercase tracking-widest mb-3 block relative z-10">Damage Taken (Marks)</label>
                                                <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-transparent border-b-2 border-red-500/30 focus:border-red-500 px-2 py-2 font-mono text-3xl font-black text-red-400 outline-none relative z-10 transition-colors" placeholder="-1"/>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="h-10"></div> {/* Bottom padding */}
                                </div>
                            </div>
                        </motion.div>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-center h-full relative z-0">
                            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-10 mix-blend-overlay"></div>
                            <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center relative z-10 p-12 glass-card border-dashed border-white/20">
                                <div className="w-24 h-24 bg-white/5 rounded-full flex items-center justify-center mb-8 mx-auto border border-white/10 shadow-[0_0_50px_rgba(255,255,255,0.05)]">
                                    <Icons.Bug className="w-12 h-12 text-zinc-500"/>
                                </div>
                                <h2 className="text-2xl font-black text-white mb-3 uppercase tracking-widest">No Failure Selected</h2>
                                <p className="text-zinc-400 max-w-sm mx-auto font-mono text-sm leading-relaxed mb-8">
                                    Are you perfectly flawless? Doubt it. Click a log on the left or create a new one to document your shame.
                                </p>
                                <button onClick={createLog} className="bg-gradient-to-r from-accent to-neon text-white px-8 py-3 rounded-xl font-black uppercase tracking-widest text-sm hover:shadow-[0_0_30px_rgba(236,72,153,0.4)] transition-all transform active:scale-95">Log First Mistake</button>
                            </motion.div>
                        </div>
                    )}

                    {/* Chat Slideover */}
                    <AnimatePresence>
                        {isAiOpen && activeLog && user && (
                            <AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/>
                        )}
                    </AnimatePresence>

                    {/* Practice Modal */}
                    {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root')); 
    root.render(<App />);
</script>
</body>
</html>
