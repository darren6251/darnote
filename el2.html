                    <div className="p-5 border-b border-white/5 bg-surface/80 backdrop-blur-md sticky top-0 z-10 space-y-4">
                        <h2 className="text-2xl font-bold text-white tracking-tight">Logbook</h2>
                        <div className="relative">
                            <input type="text" placeholder="Search logs..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="w-full bg-black/40 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-sm focus:border-primary outline-none text-white transition-all shadow-inner"/>
                            <div className="absolute left-3 top-3 text-zinc-500"><Icons.Scan className="w-5 h-5"/></div>
                        </div>
                        <button onClick={createLog} className="w-full py-3 border-2 border-dashed border-white/10 rounded-xl text-zinc-400 hover:text-white hover:border-white/30 hover:bg-white/5 transition-all text-sm font-bold flex items-center justify-center gap-2">
                            <Icons.Plus className="w-4 h-4"/> New Entry
                        </button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3">
                        {isLoadingLogs && <div className="text-center text-zinc-500 py-10 animate-pulse">Scanning Archive...</div>}
                        {filteredLogs.map(l => (
                            <motion.div key={l.id} layoutId={l.id} onClick={()=>setActiveLogId(l.id)} initial={{opacity:0, y:10}} animate={{opacity:1, y:0}} className={`group relative p-4 rounded-2xl cursor-pointer border transition-all duration-200 ${activeLogId===l.id ? 'bg-primary/10 border-primary shadow-[0_0_20px_rgba(99,102,241,0.15)]' : 'bg-surface border-white/5 hover:border-white/10 hover:bg-white/5'}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <h4 className={`font-bold text-sm leading-tight line-clamp-2 ${activeLogId===l.id ? 'text-white' : 'text-zinc-300'}`}>{l.title}</h4>
                                    {l.mastered && <div className="text-success"><Icons.Check className="w-4 h-4"/></div>}
                                </div>
                                <div className="flex items-center justify-between text-xs mt-3">
                                    <div className="flex gap-2">
                                        <span className="px-2 py-0.5 rounded bg-white/5 text-zinc-400 border border-white/5">{l.subject}</span>
                                        <span className={`px-2 py-0.5 rounded font-bold ${l.questionType==='MC'?'text-primary':'text-accent'}`}>{l.questionType}</span>
                                    </div>
                                    <span className="text-zinc-600 font-mono">{new Date(l.createdAt).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span>
                                </div>
                                <button onClick={(e) => handleDelete(l.id, e)} className="absolute top-2 right-2 p-1.5 bg-red-500 rounded-lg text-white opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-600 scale-90 hover:scale-100"><Icons.Trash className="w-3 h-3"/></button>
                            </motion.div>
                        ))}
                        {hasMore && !isLoadingLogs && (<button onClick={() => fetchLogs(true)} className="w-full py-3 text-xs text-primary font-bold opacity-50 hover:opacity-100">Load More Records</button>)}
                    </div>
                </div>

                {/* --- EDITOR (Main Stage) --- */}
                <main className="flex-1 flex flex-col bg-bg relative overflow-hidden">
                    {activeLog ? (
                        <>
                        {/* EDITOR HEADER */}
                        <header className="h-[70px] border-b border-white/5 bg-surface/80 backdrop-blur-md flex items-center justify-between px-6 z-20">
                             <div className="flex items-center gap-4 flex-1">
                                 <div className="h-8 w-1 bg-gradient-to-b from-primary to-accent rounded-full"></div>
                                 <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-xl font-bold outline-none text-white w-full placeholder-zinc-600 font-sans tracking-tight" placeholder="Untitled Anomaly"/>
                             </div>
                             <div className="flex items-center gap-3">
                                 <button onClick={handleAutoTitle} disabled={isAutoTitleLoading} className={`px-3 py-1.5 rounded-lg text-xs font-bold border border-white/10 flex items-center gap-2 transition-all ${isAutoTitleLoading ? 'bg-primary/20 text-primary animate-pulse' : 'text-zinc-400 hover:text-white hover:bg-white/5'}`}>
                                     {isAutoTitleLoading ? <div className="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <Icons.Scan className="w-4 h-4"/>} Auto-Scan
                                 </button>
                                 <div className="h-6 w-px bg-white/10"></div>
                                 <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${activeLog.mastered ? 'bg-success/10 border-success text-success shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'bg-surface border-white/10 text-zinc-400 hover:text-white'}`}>
                                     {activeLog.mastered ? 'MASTERED' : 'MARK COMPLETE'}
                                 </button>
                                 <button onClick={()=>setIsAiOpen(!isAiOpen)} className={`p-2 rounded-xl transition-all ${isAiOpen ? 'bg-white text-black' : 'bg-white/5 text-zinc-400 hover:text-white'}`}><Icons.Bot className="w-5 h-5"/></button>
                             </div>
                        </header>

                        {/* EDITOR BODY */}
                        <div className="flex-1 overflow-y-auto p-6 md:p-8 scroll-smooth">
                            <div className="max-w-6xl mx-auto grid grid-cols-12 gap-6">
                                {/* METADATA BAR */}
                                <div className="col-span-12 grid grid-cols-1 md:grid-cols-4 gap-4 p-4 rounded-3xl bg-surface border border-white/5 shadow-lg">
                                    <div>
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-1">Subject</label>
                                        <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="w-full bg-black/40 border border-white/10 rounded-lg px-2 py-2 text-sm text-white outline-none focus:border-primary"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-1">Topic</label>
                                        <div className="flex gap-2">
                                            {activeLog.subject !== 'General' && currentSub ? (
                                                <>
                                                <select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="flex-1 bg-black/40 border border-white/10 rounded-lg px-2 py-2 text-sm text-white outline-none focus:border-primary"><option value="">-- Select --</option>{currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}</select>
                                                <button onClick={() => addTopicToSubject(activeLog.subject)} className="px-2 bg-white/5 rounded-lg hover:bg-white/10 text-white">+</button>
                                                </>
                                            ) : <input className="w-full bg-black/40 border border-white/10 rounded-lg px-2 py-2 text-sm text-white outline-none" placeholder="Topic..." value={activeLog.topic} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} />}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-1">Answer Key</label>
                                        <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-success/10 border border-success/30 rounded-lg px-2 py-2 text-sm text-success font-bold font-mono outline-none focus:border-success" placeholder="Correct Ans"/>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-1">Score Impact</label>
                                        <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-danger/10 border border-danger/30 rounded-lg px-2 py-2 text-sm text-danger font-bold font-mono outline-none focus:border-danger" placeholder="- Marks"/>
                                    </div>
                                </div>

                                {/* LEFT COLUMN: EVIDENCE */}
                                <div className="col-span-12 lg:col-span-5 space-y-6">
                                    <div className="bg-surface p-5 rounded-3xl border border-white/5 shadow-xl relative overflow-hidden group">
                                         <div className="absolute top-0 right-0 w-20 h-20 bg-primary/10 blur-3xl pointer-events-none"></div>
                                         <h3 className="font-bold text-white mb-4 flex items-center gap-2"><Icons.Image className="text-zinc-500"/> The Problem</h3>
                                         <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label="Question Source" isUploading={uploadingQ} />
                                         <div className="mt-4 pt-4 border-t border-white/5">
                                             <button onClick={() => setShowOcrText(!showOcrText)} className="text-xs text-zinc-500 hover:text-white flex items-center gap-2 transition-colors mb-2"><Icons.File className="w-3 h-3"/> Toggle OCR Text Layer</button>
                                             {showOcrText && <textarea value={activeLog.questionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-xs font-mono text-zinc-400 focus:border-primary outline-none h-32" placeholder="AI extracted text will appear here..." />}
                                         </div>
                                    </div>
                                    <div className="bg-surface p-5 rounded-3xl border border-white/5 shadow-xl">
                                         <h3 className="font-bold text-white mb-4 flex items-center gap-2"><Icons.Check className="text-zinc-500"/> Marking Scheme</h3>
                                         <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Official Answer" isUploading={uploadingS} />
                                    </div>
                                </div>

                                {/* RIGHT COLUMN: AUTOPSY */}
                                <div className="col-span-12 lg:col-span-7 flex flex-col h-full min-h-[500px]">
                                    <div className="flex-1 bg-surface rounded-3xl border border-white/5 shadow-xl flex flex-col overflow-hidden relative">
                                        <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-5 pointer-events-none"></div>
                                        <div className="p-4 border-b border-white/5 bg-white/5 flex justify-between items-center">
                                            <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-accent"></div><span className="font-bold text-sm text-white uppercase tracking-wider">Analysis Protocol</span></div>
                                            <span className="text-[10px] text-zinc-500 font-mono">MARKDOWN ENABLED</span>
                                        </div>
                                        <textarea className="flex-1 w-full bg-transparent p-6 text-base text-zinc-200 leading-relaxed outline-none resize-none font-sans placeholder-zinc-700" placeholder="# Why did I fail?&#10;&#10;1. Concept Error: ...&#10;2. Careless Mistake: ...&#10;3. The Fix: ..." value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/>
                                        <div className="p-4 border-t border-white/5 bg-black/20 text-xs text-zinc-500 flex gap-4">
                                            <span>Type **bold** for emphasis</span>
                                            <span>Use `code` for formulas</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-center relative">
                            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(99,102,241,0.1),transparent)] pointer-events-none"></div>
                            <div className="text-center space-y-4">
                                <div className="w-24 h-24 bg-surface rounded-3xl border border-white/10 flex items-center justify-center mx-auto shadow-2xl rotate-3 hover:rotate-0 transition-transform duration-500">
                                    <Icons.Bug className="w-10 h-10 text-zinc-600"/>
                                </div>
                                <h1 className="text-3xl font-bold text-white tracking-tight">System Ready.</h1>
                                <p className="text-zinc-500">Select a failure to begin analysis.</p>
                            </div>
                        </div>
                    )}
                    
                    {/* AI SIDEBAR */}
                    <AnimatePresence>{isAiOpen && activeLog && user && (
                        <motion.div initial={{x:400, opacity:0}} animate={{x:0, opacity:1}} exit={{x:400, opacity:0}} className="absolute top-0 right-0 bottom-0 w-[400px] z-50 border-l border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                             <AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/>
                        </motion.div>
                    )}</AnimatePresence>
                    
                    {/* PRACTICE MODAL */}
                    {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                </main>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
