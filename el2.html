                            <input type="text" placeholder="Search database..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="input-field pl-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNzE3MTdhIiBzdHJva2Utd2lkdGg9IjIiPjxjaXJjbGUgY3g9IjExIiBjeT0iMTEiIHI9IjgiLz48cGF0aCBkPSJtMjEgMjEtNC4zLTQuMyIvPjwvc3ZnPg==')] bg-no-repeat bg-[length:16px] bg-[14px_center]"/>
                            <button onClick={(e)=>{e.stopPropagation(); setShowSortMenu(!showSortMenu)}} className={`p-3 rounded-xl border transition-all duration-300 ${typeFilter !== 'ALL' ? 'text-brand border-brand/50 bg-brand/5 shadow-[0_0_10px_rgba(0,229,255,0.1)]' : 'border-zinc-200 dark:border-white/10 hover:bg-zinc-100 dark:hover:bg-white/5 text-zinc-500'}`} title="Sort & Filter"><Icons.Sort className="w-5 h-5"/></button>
                            {showSortMenu && (<div className="absolute right-0 top-[calc(100%+8px)] w-48 bg-white dark:bg-surface border border-zinc-200 dark:border-white/10 rounded-xl shadow-2xl z-50 py-2" onClick={e=>e.stopPropagation()}><div className="px-4 py-2 text-[10px] font-bold text-brand uppercase tracking-widest">Sort Protocol</div><button onClick={()=>{setSortBy('date-desc'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2.5 text-xs font-medium hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors ${sortBy==='date-desc'?'text-brand bg-brand/5':''}`}>Chronological (Desc)</button><button onClick={()=>{setSortBy('date-asc'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2.5 text-xs font-medium hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors ${sortBy==='date-asc'?'text-brand bg-brand/5':''}`}>Chronological (Asc)</button><div className="h-px bg-zinc-200 dark:bg-white/10 my-2"></div><div className="px-4 py-2 text-[10px] font-bold text-brand uppercase tracking-widest">Data Type Filter</div><button onClick={()=>{setTypeFilter('ALL'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2.5 text-xs font-medium hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors ${typeFilter==='ALL'?'text-brand bg-brand/5':''}`}>All Fragments</button><button onClick={()=>{setTypeFilter('MC'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2.5 text-xs font-medium hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors ${typeFilter==='MC'?'text-brand bg-brand/5':''}`}>MC Only</button><button onClick={()=>{setTypeFilter('LQ'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2.5 text-xs font-medium hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors ${typeFilter==='LQ'?'text-brand bg-brand/5':''}`}>LQ Only</button></div>)}
                        </div>
                        <button onClick={createLog} className="w-full bg-zinc-900 dark:bg-brand text-white dark:text-obsidian py-3.5 rounded-xl font-bold text-sm hover:bg-zinc-800 dark:hover:bg-brand-dark shadow-[0_4px_14px_rgba(0,0,0,0.1)] dark:shadow-[0_0_15px_rgba(0,229,255,0.2)] transition-all flex justify-center items-center gap-2"><Icons.Plus className="w-5 h-5"/> Initialize New Log</button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-3 space-y-3 bg-zinc-50/50 dark:bg-transparent">
                        {filteredLogs.map(l => (
                            <motion.div key={l.id} onClick={()=>setActiveLogId(l.id)} onContextMenu={(e) => handleContextMenu(e, l.id)} onMouseEnter={() => handleMouseEnter(l)} onMouseLeave={handleMouseLeave} className={`p-4 rounded-2xl cursor-pointer border transition-all duration-300 relative overflow-hidden group ${activeLogId===l.id ? 'bg-white dark:bg-[#1a1c23] border-brand/50 shadow-md' : 'bg-white/50 dark:bg-surface border-transparent hover:border-zinc-300 dark:hover:border-white/10 hover:shadow-sm'}`}>
                                {activeLogId === l.id && <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-brand"></div>}
                                <div className="flex justify-between items-start mb-2">
                                    <div className="font-bold text-sm truncate pr-3 text-zinc-900 dark:text-white w-full">{l.title}</div>
                                    {l.mastered ? <div className="p-1 bg-green-500/10 rounded-full"><Icons.Check className="w-3.5 h-3.5 text-green-500"/></div> : <div className="p-1 bg-rose-500/10 rounded-full"><Icons.Target className="w-3.5 h-3.5 text-rose-500"/></div>}
                                </div>
                                <div className="flex justify-between items-center mt-3">
                                    <div className="flex gap-2">
                                        <span className={`text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wider ${activeLogId===l.id ? 'bg-brand/10 text-brand' : 'bg-zinc-100 dark:bg-white/5 text-zinc-500 dark:text-zinc-400'}`}>{l.subject}</span>
                                    </div>
                                    <div className="text-[10px] text-zinc-400 font-medium">{new Date(l.lastModified || l.createdAt).toLocaleDateString()}</div>
                                </div>
                            </motion.div>
                        ))}
                        {hasMore && !isLoadingLogs && (<button onClick={() => fetchLogs(true)} className="w-full py-4 text-xs text-brand hover:text-brand-dark font-bold mt-2 border-2 border-dashed border-zinc-200 dark:border-white/10 rounded-2xl hover:bg-brand/5 transition-all uppercase tracking-widest">Load Archives (+10)</button>)}
                        {isLoadingLogs && <div className="text-center text-brand py-6 text-xs animate-pulse font-mono tracking-widest uppercase">Fetching Data...</div>}
                    </div>
                </div>

                {/* Panel 3: Main Editor */}
                <main className="flex-1 floating-panel relative">
                    {activeLog ? (
                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col h-full bg-white dark:bg-obsidian">
                            <header className="h-[88px] flex items-center justify-between px-8 border-b border-zinc-200 dark:border-white/5 bg-white dark:bg-[#0a0a0c] shrink-0 z-10 shadow-sm">
                                <div className="flex-1 flex flex-col justify-center mr-6">
                                    <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="hero-input" placeholder="Untitled Anomaly"/>
                                    <div className="flex items-center gap-3">
                                        <button onClick={handleAutoTitle} disabled={isAutoTitleLoading || (!activeLog.questionImages?.length && !activeLog.imageUrl)} className={`flex items-center gap-2 px-3 py-1 rounded-md text-[10px] font-bold uppercase tracking-widest transition-all border ${isAutoTitleLoading ? 'bg-brand/10 border-brand/30 text-brand animate-pulse' : 'bg-zinc-50 dark:bg-white/5 border-zinc-200 dark:border-white/10 text-zinc-500 hover:bg-brand/10 hover:border-brand/30 hover:text-brand'}`}>{isAutoTitleLoading ? <div className="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <Icons.Scan className="w-3 h-3"/>} <span>Auto-Title</span></button>
                                        <AnimatePresence>{ocrPendingToast > 0 && (<motion.div initial={{opacity:0, scale:0.8}} animate={{opacity:1, scale:1}} exit={{opacity:0}} className="bg-orange-500/10 border border-orange-500/20 text-orange-500 text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-md flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-orange-500 animate-pulse"/>Auto-OCR: {ocrPendingToast}s</motion.div>)}</AnimatePresence>
                                        <div className="w-px h-3 bg-zinc-300 dark:bg-white/20"></div>
                                        <button onClick={() => setPracticeConfig({ isOpen: true, mode: 'single' })} className="flex items-center gap-2 px-3 py-1 rounded-md text-[10px] font-bold uppercase tracking-widest bg-zinc-50 dark:bg-white/5 border border-zinc-200 dark:border-white/10 text-zinc-500 hover:bg-brand hover:border-brand hover:text-obsidian transition-all"><Icons.Target className="w-3 h-3"/> Focus Drill</button>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-5 py-2.5 rounded-xl text-xs font-bold border-2 transition-all duration-300 uppercase tracking-widest shadow-sm ${activeLog.mastered ? 'bg-green-500/10 border-green-500/50 text-green-600 dark:text-green-400 hover:bg-green-500/20' : 'bg-rose-500/10 border-rose-500/50 text-rose-600 dark:text-rose-400 hover:bg-rose-500/20'}`}>{activeLog.mastered ? 'Mastered' : 'Requires Review'}</button>
                                    <div className="h-8 w-px bg-zinc-200 dark:bg-white/10 mx-2"></div>
                                    <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-3 rounded-xl transition-all duration-300 border ${!user ? 'cursor-not-allowed opacity-50 bg-zinc-50 dark:bg-white/5 border-transparent text-zinc-400' : isAiOpen ? 'bg-brand/10 border-brand/30 text-brand shadow-[0_0_15px_rgba(0,229,255,0.2)]' : 'bg-white dark:bg-surface border-zinc-200 dark:border-white/10 hover:border-brand/50 hover:text-brand text-zinc-500'}`} title={user ? "Initialize AI Terminal" : "Authentication Required"}><Icons.Bot className="w-5 h-5"/></button>
                                    <button onClick={() => handleDelete(activeLog.id)} className="p-3 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-500/10 hover:border-rose-500/30 text-zinc-400 hover:text-rose-500 transition-all border border-transparent"><Icons.Trash className="w-5 h-5"/></button>
                                </div>
                            </header>
                            
                            <div className="flex-1 overflow-y-auto p-8 lg:p-12 scroll-smooth bg-zinc-50/50 dark:bg-transparent">
                                <div className="max-w-6xl mx-auto space-y-10">
                                    
                                    {/* Metadata Row */}
                                    <div className="bg-white dark:bg-surface p-6 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5 grid grid-cols-1 md:grid-cols-3 gap-8">
                                        <div>
                                            <label className="text-[11px] font-extrabold text-zinc-400 uppercase tracking-widest mb-3 block">Subject Module</label>
                                            <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="input-field cursor-pointer"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select>
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-extrabold text-zinc-400 uppercase tracking-widest mb-3 block">Topic Node</label>
                                            <div className="flex gap-3">
                                                {activeLog.subject !== 'General' && currentSub ? (
                                                    <><select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field flex-1 cursor-pointer"><option value="">-- Select Node --</option>{currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}</select>
                                                    <button onClick={() => addTopicToSubject(activeLog.subject)} className="px-4 rounded-xl bg-zinc-100 dark:bg-white/5 hover:bg-brand hover:text-obsidian transition-colors text-zinc-500 border border-zinc-200 dark:border-white/5 shadow-sm" title="Create Node"><Icons.Plus className="w-5 h-5"/></button></>
                                                ) : ( <input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field flex-1" placeholder="Custom Node" disabled={activeLog.subject !== 'General'}/> )}
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-[11px] font-extrabold text-zinc-400 uppercase tracking-widest mb-3 block">Data Structure</label>
                                            <div className="flex bg-zinc-100 dark:bg-black/40 p-1.5 rounded-xl border border-zinc-200 dark:border-white/5 shadow-inner">
                                                {['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`flex-1 py-2.5 rounded-lg text-xs font-bold uppercase tracking-widest transition-all duration-300 ${activeLog.questionType===t ? 'bg-white dark:bg-surface shadow-md text-brand border border-zinc-200 dark:border-white/10' : 'text-zinc-500 hover:text-zinc-700 dark:hover:text-zinc-300'}`}>{t}</button>))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Upload Areas */}
                                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">
                                        <div className="bg-white dark:bg-surface p-6 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5">
                                            <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label="Question Evidence" isUploading={uploadingQ} onImageClick={() => setCompareMode(true)} />
                                            <div className="mt-4 pt-4 border-t border-zinc-100 dark:border-white/5">
                                                <button onClick={() => setShowOcrText(!showOcrText)} className="text-[11px] font-bold uppercase tracking-widest flex items-center gap-2 text-zinc-500 hover:text-brand transition-colors"><Icons.Scan className="w-4 h-4"/> {showOcrText ? "Hide Extracted Data" : "Inspect Extracted Data"}</button>
                                                <AnimatePresence>
                                                    {showOcrText && (
                                                        <motion.textarea initial={{height:0, opacity:0}} animate={{height:'auto', opacity:1}} exit={{height:0, opacity:0}} value={activeLog.questionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="mt-4 w-full p-4 text-sm bg-zinc-50 dark:bg-black/40 border border-zinc-200 dark:border-white/5 rounded-xl font-mono text-zinc-600 dark:text-zinc-300 focus:outline-none focus:ring-1 focus:ring-brand shadow-inner" rows="5" placeholder="System will extract text here automatically..." />
                                                    )}
                                                </AnimatePresence>
                                            </div>
                                        </div>
                                        <div className="bg-white dark:bg-surface p-6 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5">
                                            <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Marking Scheme" isUploading={uploadingS} onImageClick={() => setCompareMode(true)} />
                                        </div>
                                    </div>

                                    {/* Analysis & Marks */}
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-1 space-y-8">
                                            <div className="bg-white dark:bg-surface p-6 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5">
                                                <label className="text-[11px] font-extrabold text-zinc-400 uppercase tracking-widest mb-3 block">Correct Value</label>
                                                <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-emerald-50 dark:bg-emerald-900/10 border border-emerald-200 dark:border-emerald-900/30 rounded-xl px-5 py-4 font-mono text-2xl font-bold text-emerald-700 dark:text-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 shadow-inner" placeholder="Ans"/>
                                            </div>
                                            <div className="bg-white dark:bg-surface p-6 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5">
                                                <label className="text-[11px] font-extrabold text-zinc-400 uppercase tracking-widest mb-3 block">Points Deducted</label>
                                                <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-900/30 rounded-xl px-5 py-4 font-bold font-mono text-2xl text-rose-700 dark:text-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-500/50 shadow-inner" placeholder="-2"/>
                                            </div>
                                        </div>
                                        <div className="lg:col-span-2 bg-white dark:bg-surface rounded-2xl border border-zinc-200 dark:border-white/5 shadow-sm overflow-hidden flex flex-col min-h-[300px] group focus-within:border-brand focus-within:shadow-[0_0_20px_rgba(0,229,255,0.1)] transition-all">
                                            <div className="px-6 py-4 border-b border-zinc-200 dark:border-white/5 bg-zinc-50 dark:bg-black/20 flex justify-between items-center">
                                                <span className="text-xs font-extrabold text-brand uppercase tracking-widest">Logic Gap Analysis</span>
                                                <span className="text-[10px] font-mono text-zinc-400 bg-zinc-200 dark:bg-white/5 px-2 py-1 rounded">Markdown Enabled</span>
                                            </div>
                                            <textarea className="flex-1 w-full p-6 bg-transparent outline-none resize-none text-base leading-relaxed text-zinc-800 dark:text-zinc-200 placeholder-zinc-400 dark:placeholder-zinc-600" placeholder="• Why did the anomaly occur?&#10;• Identify the trap mechanism.&#10;• Formulate resolution protocol." value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/>
                                        </div>
                                    </div>
                                    
                                </div>
                            </div>
                        </motion.div>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-center text-zinc-400 h-full bg-zinc-50/50 dark:bg-transparent">
                            <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center">
                                <div className="w-24 h-24 bg-white dark:bg-surface border border-zinc-200 dark:border-white/5 rounded-[2rem] flex items-center justify-center mb-8 mx-auto shadow-lg relative overflow-hidden">
                                    <div className="absolute inset-0 bg-brand/5"></div>
                                    <Icons.Bug className="w-12 h-12 text-zinc-300 dark:text-zinc-700 relative z-10"/>
                                </div>
                                <h2 className="text-2xl font-extrabold text-zinc-800 dark:text-white mb-3">System Idle</h2>
                                <p className="text-sm text-zinc-500 max-w-sm mx-auto font-medium">Select a data fragment from the left terminal or initialize a new error log to begin analysis.</p>
                            </motion.div>
                        </div>
                    )}
                    
                    <AnimatePresence>
                        {isAiOpen && activeLog && user && (
                            <motion.div initial={{x: 400, opacity: 0}} animate={{x: 0, opacity: 1}} exit={{x: 400, opacity: 0}} transition={{type: "spring", stiffness: 300, damping: 30}} className="absolute top-0 right-0 bottom-0 w-[400px] z-30">
                                <AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/>
                            </motion.div>
                        )}
                    </AnimatePresence>
                    
                    {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                </main>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
