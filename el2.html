                                    {activeLogId === l.id && <div className="absolute left-0 top-0 bottom-0 w-1 bg-primary shadow-glow"></div>}
                                    <div className="flex justify-between items-start mb-2 gap-2">
                                        <div className={`font-semibold text-sm line-clamp-2 leading-tight ${activeLogId === l.id ? 'text-primary dark:text-blue-400' : 'text-slate-800 dark:text-slate-200'}`}>{l.title}</div>
                                        {l.mastered ? <Icons.Check className="w-4 h-4 text-green-500 shrink-0"/> : <div className="w-2 h-2 rounded-full bg-red-500 shrink-0 mt-1 shadow-[0_0_5px_rgba(239,68,68,0.8)]"/>}
                                    </div>
                                    <div className="flex flex-wrap gap-1.5 mt-2">
                                        <span className="text-[9px] font-mono font-bold px-1.5 py-0.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 text-slate-500 uppercase">{l.subject}</span>
                                        {l.topic && <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 truncate max-w-[100px]">{l.topic}</span>}
                                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ml-auto ${l.questionType==='MC' ? 'bg-primary/10 text-primary' : 'bg-accent/10 text-accent'}`}>{l.questionType}</span>
                                    </div>
                                    <div className="mt-3 text-[9px] text-slate-400 font-mono flex justify-between items-center opacity-70">
                                        <span>ID: {l.id.substring(0,6)}</span>
                                        <span>{new Date(l.lastModified || l.createdAt).toLocaleDateString()}</span>
                                    </div>
                                </motion.div>
                            ))}
                            {hasMore && !isLoadingLogs && (<button onClick={() => fetchLogs(true)} className="w-full py-3 text-xs text-primary font-bold mt-2 border border-dashed border-slate-300 dark:border-slate-700 rounded-xl hover:bg-primary/5 transition-colors uppercase tracking-widest">Load More Data</button>)}
                            {isLoadingLogs && <div className="text-center text-primary py-8 text-xs font-mono uppercase tracking-widest animate-pulse flex flex-col items-center gap-2"><Icons.Refresh className="w-4 h-4 animate-spin"/> Syncing...</div>}
                        </div>
                    </div>

                    {/* PREVIEW TOOLTIP */}
                    <AnimatePresence>
                        {previewLog && (
                            <div className="fixed z-[100] top-20 bottom-20 left-[620px] pointer-events-none flex flex-col justify-center p-4">
                                <motion.div initial={{ opacity: 0, x: -10, scale: 0.95 }} animate={{ opacity: 1, x: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.95 }} className="bg-panelBg dark:bg-panelBgDark border border-borderLight dark:border-borderDark rounded-2xl shadow-2xl p-3 max-w-sm overflow-hidden flex flex-col">
                                    <div className="text-[9px] font-bold px-1 py-1 text-slate-400 uppercase tracking-widest flex justify-between mb-2"><span>Visual Stream</span><span className={previewLog.questionType === 'MC' ? 'text-primary' : 'text-accent'}>{previewLog.questionType}</span></div>
                                    <img src={previewLog.questionImages?.[0] || previewLog.imageUrl} className="rounded-xl object-contain max-h-[40vh] bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800" />
                                    <div className="mt-3 px-1"><div className="font-bold text-sm truncate text-slate-900 dark:text-white">{previewLog.title}</div></div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* MAIN EDITOR CANVAS */}
                    <main className="flex-1 flex flex-col min-w-0 bg-appBg dark:bg-appBgDark relative">
                        {activeLog ? (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col h-full">
                                {/* Editor Header */}
                                <header className="px-8 py-5 border-b border-borderLight dark:border-borderDark bg-panelBg dark:bg-panelBgDark shrink-0 flex flex-col gap-4 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
                                    <div className="flex justify-between items-start z-10">
                                        <div className="flex-1 mr-8">
                                            <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-2xl md:text-3xl font-black outline-none w-full text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-700 transition-all border-b-2 border-transparent focus:border-primary/50 pb-1" placeholder="Untitled Record"/>
                                            <div className="flex items-center gap-3 mt-3 flex-wrap">
                                                <div className="flex items-center bg-slate-100 dark:bg-slate-900 rounded-md border border-slate-200 dark:border-slate-800 p-0.5">
                                                    <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="bg-transparent text-xs font-bold px-2 py-1 outline-none text-slate-600 dark:text-slate-300 w-28 border-r border-slate-200 dark:border-slate-700">
                                                        <option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                                    </select>
                                                    {activeLog.subject !== 'General' && currentSub ? (
                                                        <div className="flex items-center">
                                                            <select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="bg-transparent text-xs px-2 py-1 outline-none text-slate-600 dark:text-slate-300 w-32"><option value="">-- Select Topic --</option>{currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}</select>
                                                            <button onClick={() => addTopicToSubject(activeLog.subject)} className="px-2 text-slate-400 hover:text-primary transition-colors border-l border-slate-200 dark:border-slate-700 h-full"><Icons.Plus className="w-3 h-3"/></button>
                                                        </div>
                                                    ) : ( <input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="bg-transparent text-xs px-2 py-1 outline-none text-slate-600 dark:text-slate-300 w-32" placeholder="Custom Topic" disabled={activeLog.subject !== 'General'}/> )}
                                                </div>
                                                <div className="flex bg-slate-100 dark:bg-slate-900 p-0.5 rounded-md border border-slate-200 dark:border-slate-800">
                                                    {['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`px-3 py-1 rounded text-[10px] font-bold transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-slate-800 shadow-sm text-primary' : 'text-slate-500'}`}>{t}</button>))}
                                                </div>
                                                
                                                <div className="w-px h-6 bg-slate-300 dark:bg-slate-700 mx-1"></div>
                                                
                                                <button onClick={handleAutoTitle} disabled={isAutoTitleLoading || (!activeLog.questionImages?.length && !activeLog.imageUrl)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider transition-all border ${isAutoTitleLoading ? 'bg-primary/10 text-primary border-primary/20 animate-pulse' : 'bg-slate-100 dark:bg-slate-900 text-slate-500 border-slate-200 dark:border-slate-800 hover:border-primary hover:text-primary'}`}>
                                                    {isAutoTitleLoading ? <div className="w-3 h-3 border-2 border-primary border-t-transparent rounded-full animate-spin"/> : <Icons.Scan className="w-3 h-3"/>}
                                                    Auto-Scan
                                                </button>
                                                <AnimatePresence>{ocrPendingToast > 0 && (<motion.div initial={{opacity:0, scale:0.8}} animate={{opacity:1, scale:1}} exit={{opacity:0}} className="text-accent text-[10px] font-mono px-2 py-1 flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-accent animate-ping"/>Queue: {ocrPendingToast}s</motion.div>)}</AnimatePresence>
                                            </div>
                                        </div>

                                        <div className="flex flex-col items-end gap-3 shrink-0">
                                            <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-widest border-2 transition-all flex items-center gap-2 ${activeLog.mastered ? 'bg-green-500/10 border-green-500 text-green-600 dark:text-green-400 shadow-[0_0_15px_rgba(34,197,94,0.2)]' : 'bg-red-500/5 border-red-500/30 text-red-500 hover:bg-red-500/10'}`}>
                                                {activeLog.mastered ? <><Icons.Check className="w-4 h-4"/> Solved</> : <><Icons.X className="w-4 h-4"/> Review</>}
                                            </button>
                                            <div className="flex items-center gap-1">
                                                <button onClick={() => setPracticeConfig({ isOpen: true, mode: 'single' })} className="p-2.5 rounded-lg text-slate-500 hover:text-accent hover:bg-accent/10 transition-colors" title="Simulate Drill"><Icons.Target className="w-5 h-5"/></button>
                                                <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-2.5 rounded-lg transition-colors ${!user ? 'opacity-50 text-slate-400 cursor-not-allowed' : isAiOpen ? 'bg-primary/10 text-primary shadow-inner' : 'text-slate-500 hover:text-primary hover:bg-primary/10'}`} title="Activate AI"><Icons.Bot className="w-5 h-5"/></button>
                                                <button onClick={() => handleDelete(activeLog.id)} className="p-2.5 rounded-lg text-slate-500 hover:text-red-500 hover:bg-red-500/10 transition-colors ml-2"><Icons.Trash className="w-5 h-5"/></button>
                                            </div>
                                        </div>
                                    </div>
                                </header>

                                {/* Editor Body */}
                                <div className="flex-1 overflow-y-auto scroll-smooth">
                                    <div className="max-w-6xl mx-auto p-6 md:p-8 space-y-8">
                                        
                                        {/* Image Section */}
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
                                            <div className="space-y-3">
                                                <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label="Source Material" isUploading={uploadingQ} onImageClick={() => setCompareMode(true)} />
                                                <div className="flex items-center justify-between">
                                                    <button onClick={() => setShowOcrText(!showOcrText)} className="text-[10px] font-bold uppercase tracking-widest flex items-center gap-1.5 text-slate-400 hover:text-primary transition-colors ml-1"><Icons.File className="w-3 h-3"/> {showOcrText ? "Hide Transcription" : "View Transcription"}</button>
                                                </div>
                                                <AnimatePresence>
                                                    {showOcrText && (
                                                        <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                                                            <textarea value={activeLog.questionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="mt-2 w-full p-4 text-xs bg-slate-900 border border-slate-700 rounded-xl font-mono text-slate-300 focus:outline-none focus:border-primary shadow-inner resize-y min-h-[120px]" placeholder="AI transcript will output here..." />
                                                        </motion.div>
                                                    )}
                                                </AnimatePresence>
                                            </div>
                                            <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Marking Scheme" isUploading={uploadingS} onImageClick={() => setCompareMode(true)} />
                                        </div>

                                        <div className="w-full h-px bg-gradient-to-r from-transparent via-borderLight dark:via-borderDark to-transparent"></div>

                                        {/* Analysis Section */}
                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
                                            <div className="lg:col-span-4 space-y-6">
                                                <div className="bg-panelBg dark:bg-panelBgDark p-6 rounded-2xl shadow-sm border border-borderLight dark:border-borderDark relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-1 h-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.8)]"></div>
                                                    <label className="text-[10px] font-bold text-green-600 dark:text-green-500 uppercase tracking-widest mb-3 block ml-2">Verified Output</label>
                                                    <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 font-mono text-xl font-bold text-green-700 dark:text-green-400 focus:outline-none focus:border-green-500 transition-colors shadow-inner" placeholder="E.g., B or 42.0"/>
                                                </div>
                                                <div className="bg-panelBg dark:bg-panelBgDark p-6 rounded-2xl shadow-sm border border-borderLight dark:border-borderDark relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-1 h-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div>
                                                    <label className="text-[10px] font-bold text-red-600 dark:text-red-500 uppercase tracking-widest mb-3 block ml-2">Damage Taken</label>
                                                    <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 font-mono text-xl font-bold text-red-700 dark:text-red-400 focus:outline-none focus:border-red-500 transition-colors shadow-inner" placeholder="-2 pts"/>
                                                </div>
                                            </div>
                                            
                                            <div className="lg:col-span-8 bg-panelBg dark:bg-panelBgDark rounded-2xl border border-borderLight dark:border-borderDark shadow-sm overflow-hidden flex flex-col min-h-[300px] relative">
                                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-accent"></div>
                                                <div className="px-6 py-4 border-b border-borderLight dark:border-borderDark bg-slate-50 dark:bg-slate-900/30 flex justify-between items-center">
                                                    <span className="text-xs font-bold text-primary uppercase tracking-widest flex items-center gap-2"><Icons.Brain className="w-4 h-4"/> System Logic / Vulnerability Analysis</span>
                                                    <span className="text-[9px] font-mono text-slate-400 border border-slate-200 dark:border-slate-700 px-2 py-0.5 rounded">Markdown_Ready</span>
                                                </div>
                                                <textarea className="flex-1 w-full p-6 bg-transparent outline-none resize-none text-sm leading-8 text-slate-700 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-600 font-mono" placeholder="> Identify the trap...&#10;> Document the logic failure...&#10;> Establish protocol for next encounter..." value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/>
                                            </div>
                                        </div>
                                        <div className="h-10"></div> {/* Bottom spacer */}
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-slate-500 h-full">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center">
                                    <div className="w-24 h-24 bg-slate-100 dark:bg-slate-900 rounded-3xl flex items-center justify-center mb-6 mx-auto shadow-inner border border-slate-200 dark:border-slate-800">
                                        <Icons.Bug className="w-10 h-10 text-primary opacity-50"/>
                                    </div>
                                    <h2 className="text-2xl font-black text-slate-800 dark:text-slate-200 mb-3 tracking-tight">No Target Selected</h2>
                                    <p className="text-sm max-w-sm mx-auto text-slate-500">Select a record from the database or initialize a new sequence to begin documentation.</p>
                                </motion.div>
                            </div>
                        )}

                        {/* Slide-over AI Panel */}
                        <AnimatePresence>
                            {isAiOpen && activeLog && user && (
                                <motion.div initial={{ x: "100%" }} animate={{ x: 0 }} exit={{ x: "100%" }} transition={{ type: "spring", damping: 25, stiffness: 200 }} className="absolute top-0 right-0 bottom-0 w-[400px] z-30 shadow-2xl">
                                    <AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/>
                                </motion.div>
                            )}
                        </AnimatePresence>
                        {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                    </main>
                </div>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
