        useEffect(() => { fetchLogs(); }, [user, filter]);

        // --- CRUD ACTIONS ---
        const createLog = async () => { const newLog = { title: '', subject: 'General', topic: '', questionImages: [], schemeImages: [], questionType: 'MC', correctAnswer: '', marks: '', explanation: '', questionText: '', mastered: false, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() }; const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog); setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); setActiveLogId(docRef.id); };
        const updateLog = (id, updates) => { const timestampedUpdates = { ...updates, lastModified: new Date().toISOString() }; setLogs(prev => prev.map(l => l.id === id ? { ...l, ...timestampedUpdates } : l)); if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current); pendingUpdatesRef.current[id] = { ...(pendingUpdatesRef.current[id] || {}), ...timestampedUpdates }; saveTimeoutRef.current = setTimeout(async () => { const ids = Object.keys(pendingUpdatesRef.current); for (const logId of ids) { const payload = pendingUpdatesRef.current[logId]; delete pendingUpdatesRef.current[logId]; await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', logId), payload); } }, 2000); };
        const handleImageUpdate = async (data, action, type) => { if (!activeLogId) return; const isQ = type === 'question'; const setSpinner = isQ ? setUploadingQ : setUploadingS; const targetField = isQ ? 'questionImages' : 'schemeImages'; if (action === 'remove') { setLogs(currentLogs => currentLogs.map(l => { if (l.id === activeLogId) { const newArr = (l[targetField] || []).filter((_, i) => i !== data); updateLog(activeLogId, { [targetField]: newArr }); return { ...l, [targetField]: newArr }; } return l; })); return; } setSpinner(true); try { let blobToUpload = data; let preFetchedToken = null; try { preFetchedToken = await getAccessToken(); } catch(e) {} if (data instanceof File) blobToUpload = (data.type === 'application/pdf') ? data : await compressImage(data); const finalUrl = await saveToDrive(blobToUpload, `ErrorLog_${type}_${Date.now()}.jpg`, preFetchedToken); setLogs(currentLogs => { const targetLog = currentLogs.find(l => l.id === activeLogId); if (!targetLog) return currentLogs; const newArr = [...(targetLog[targetField] || []), finalUrl]; updateLog(activeLogId, { [targetField]: newArr }); return currentLogs.map(l => l.id === activeLogId ? { ...l, [targetField]: newArr } : l); }); setSpinner(false); } catch(e) { alert("Upload Failed"); setSpinner(false); } };
        const activeLog = logs.find(l => l.id === activeLogId);

        // --- NEW CHAT COMPONENT (Glass) ---
        const GlassChat = () => {
            const [input, setInput] = useState(""); const [loading, setLoading] = useState(false); const msgsRef = useRef(null);
            useEffect(() => { msgsRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMessages]);
            const send = async () => { if(!input.trim()) return; const msg = input; setInput(""); setChatMessages(p=>[...p,{role:'user',text:msg}]); setLoading(true); 
                const context = `Sub:${activeLog.subject}, Q:${activeLog.questionText}, Exp:${activeLog.explanation}`; 
                const res = await callAI(msg, `You are a strict but helpful tutor. Keep it short. Context: ${context}`, [], GEMINI_PROXY_URL);
                setChatMessages(p=>[...p,{role:'ai',text:cleanLatex(res)}]); setLoading(false);
            }
            return (
                <div className="flex flex-col h-full bg-[#111114]/90 backdrop-blur-xl border-l border-white/10">
                    <div className="p-4 border-b border-white/10 flex justify-between items-center"><span className="font-bold text-indigo-400 flex items-center gap-2"><Icons.Bot className="w-4 h-4"/> AI Tutor</span><button onClick={()=>setIsAiOpen(false)}><Icons.X className="w-4 h-4 text-zinc-500"/></button></div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {chatMessages.map((m,i)=>(<div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role==='user'?'bg-indigo-600 text-white rounded-br-none':'bg-white/10 text-zinc-200 rounded-bl-none'}`}>{m.text}</div></div>))}
                        {loading && <div className="text-xs text-zinc-500 animate-pulse">Thinking...</div>} <div ref={msgsRef}/>
                    </div>
                    <div className="p-4 border-t border-white/10"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} className="w-full bg-black/30 border border-white/10 rounded-full px-4 py-2 text-sm text-white focus:border-indigo-500 outline-none" placeholder="Ask a question..."/></div>
                </div>
            );
        };

        if (!user) return (
            <div className="h-screen w-full flex items-center justify-center relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-br from-black via-zinc-900 to-[#0c0c14]"/>
                <motion.div initial={{y:20, opacity:0}} animate={{y:0, opacity:1}} className="z-10 text-center glass-panel p-12 rounded-3xl max-w-md mx-4">
                    <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-24 h-24 mx-auto mb-6 drop-shadow-[0_0_30px_rgba(99,102,241,0.5)]"/>
                    <h1 className="text-4xl font-black mb-2 text-white">darNote 2.0</h1>
                    <p className="text-zinc-400 mb-8">The most advanced error log for students.</p>
                    <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="w-full bg-white text-black font-bold py-4 rounded-xl hover:scale-105 transition-transform flex items-center justify-center gap-3">
                        <Icons.Google className="w-5 h-5"/> Continue with Google
                    </button>
                </motion.div>
            </div>
        );

        return (
            <div className="h-screen w-full flex overflow-hidden text-sm relative">
                <StudentModal isOpen={showStudentModal} onClose={() => setShowStudentModal(false)} user={user} saveToDrive={saveToDrive} getAccessToken={getAccessToken} callGroq={callGroq} />
                {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                
                {/* --- 1. FLOATING NAV RAIL --- */}
                <motion.div initial={{x:-50, opacity:0}} animate={{x:0, opacity:1}} className="w-20 m-4 rounded-3xl glass-panel flex flex-col items-center py-6 z-20 flex-shrink-0">
                    <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-10 h-10 mb-8"/>
                    <div className="space-y-4 flex-1 w-full px-2">
                        {[{id:'all', i:Icons.Bug}, {id:'active', i:Icons.X}, {id:'mastered', i:Icons.Check}].map(item => (
                            <button key={item.id} onClick={()=>setFilter(item.id)} className={`w-full aspect-square rounded-2xl flex items-center justify-center transition-all ${filter===item.id ? 'bg-indigo-600 text-white shadow-[0_0_15px_rgba(99,102,241,0.5)]' : 'text-zinc-500 hover:bg-white/10 hover:text-white'}`}><item.i className="w-6 h-6"/></button>
                        ))}
                        <div className="w-10 h-px bg-white/10 mx-auto my-4"/>
                        <button onClick={()=>setPracticeConfig({isOpen:true, mode:'topic'})} className="w-full aspect-square rounded-2xl flex items-center justify-center text-orange-400 hover:bg-orange-500/20 transition-all"><Icons.Brain className="w-6 h-6"/></button>
                        <button onClick={()=>setShowStudentModal(true)} className="w-full aspect-square rounded-2xl flex items-center justify-center text-indigo-400 hover:bg-indigo-500/20 transition-all relative">
                            <Icons.GraduationCap className="w-6 h-6"/>
                            {studentStatus==='verified' && <div className="absolute top-3 right-3 w-2 h-2 bg-green-500 rounded-full shadow-[0_0_5px_#22c55e]"/>}
                        </button>
                    </div>
                    <img src={user.photoURL} className="w-10 h-10 rounded-full border-2 border-white/10 mb-4"/>
                </motion.div>

                {/* --- 2. LIST PANEL --- */}
                <motion.div initial={{opacity:0, y:20}} animate={{opacity:1, y:0}} className="w-80 my-4 mr-4 flex flex-col gap-4 z-10 flex-shrink-0">
                    <div className="glass-panel rounded-3xl p-4">
                        <div className="flex gap-2 mb-4">
                            <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Search logs..." className="w-full bg-black/20 border border-white/10 rounded-xl px-4 py-2 text-white outline-none focus:border-indigo-500"/>
                            <button onClick={createLog} className="bg-indigo-600 text-white p-2.5 rounded-xl hover:bg-indigo-500 shadow-lg"><Icons.Plus className="w-5 h-5"/></button>
                        </div>
                        <div className="overflow-y-auto h-[calc(100vh-140px)] space-y-2 pr-2">
                            {logs.filter(l=>l.title?.toLowerCase().includes(searchQuery.toLowerCase())).map((l, idx) => (
                                <motion.div layout initial={{opacity:0, x:-20}} animate={{opacity:1, x:0}} transition={{delay: idx*0.05}} key={l.id} onClick={()=>setActiveLogId(l.id)} className={`p-4 rounded-2xl cursor-pointer border transition-all group ${activeLogId===l.id ? 'bg-white/10 border-white/20 shadow-lg backdrop-blur-md' : 'border-transparent hover:bg-white/5'}`}>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className={`font-bold truncate ${!l.title && 'text-zinc-600 italic'}`}>{l.title || "Untitled Log"}</div>
                                        {l.mastered && <Icons.Check className="w-4 h-4 text-green-500"/>}
                                    </div>
                                    <div className="flex items-center gap-2 text-xs text-zinc-500">
                                        <span className="bg-white/5 px-2 py-0.5 rounded text-zinc-400">{l.subject}</span>
                                        <span className="truncate max-w-[80px]">{l.topic}</span>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </motion.div>

                {/* --- 3. EDITOR CANVAS --- */}
                <div className="flex-1 my-4 mr-4 relative z-0 flex flex-col">
                    {activeLog ? (
                        <motion.div key={activeLog.id} initial={{opacity:0, scale:0.98}} animate={{opacity:1, scale:1}} className="flex-1 glass-panel rounded-3xl overflow-hidden flex flex-col relative">
                            {/* Toolbar */}
                            <div className="h-16 border-b border-white/10 flex items-center justify-between px-6 bg-white/5 backdrop-blur-xl">
                                <div className="flex items-center gap-3 flex-1">
                                    <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-xl font-bold text-white outline-none w-full placeholder-zinc-600" placeholder="Untitled Mistake"/>
                                    <span className={`px-2 py-1 rounded text-[10px] font-bold border ${activeLog.questionType==='MC'?'border-indigo-500 text-indigo-400':'border-orange-500 text-orange-400'}`}>{activeLog.questionType}</span>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={()=>updateLog(activeLog.id, {mastered:!activeLog.mastered})} className={`px-4 py-1.5 rounded-full text-xs font-bold border transition-all ${activeLog.mastered?'border-green-500 text-green-400 bg-green-500/10':'border-red-500 text-red-400 bg-red-500/10'}`}>{activeLog.mastered ? 'MASTERED' : 'REVIEW'}</button>
                                    <button onClick={()=>setIsAiOpen(!isAiOpen)} className={`p-2 rounded-xl transition-all ${isAiOpen?'bg-indigo-600 text-white':'hover:bg-white/10 text-zinc-400'}`}><Icons.Bot className="w-5 h-5"/></button>
                                </div>
                            </div>
                            
                            {/* Scroll Content */}
                            <div className="flex-1 overflow-y-auto p-8 space-y-8">
                                {/* Metadata Row */}
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="glass-card p-4 rounded-2xl">
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 block">Subject</label>
                                        <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value})} className="w-full bg-transparent text-white outline-none font-medium"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select>
                                    </div>
                                    <div className="glass-card p-4 rounded-2xl col-span-2">
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 block">Topic</label>
                                        <input value={activeLog.topic||''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="w-full bg-transparent text-white outline-none font-medium" placeholder="E.g. Integration by Parts"/>
                                    </div>
                                </div>

                                {/* Images Area */}
                                <div className="grid grid-cols-2 gap-6 h-64">
                                    <div className="glass-card rounded-2xl p-4 flex flex-col relative group">
                                        <div className="flex justify-between mb-2"><span className="font-bold text-zinc-400">Question</span><button onClick={()=>document.getElementById('q_up').click()} className="text-xs text-indigo-400 hover:text-white transition-colors">+ Add</button></div>
                                        <input id="q_up" type="file" hidden onChange={e=>handleImageUpdate(e.target.files[0], 'add', 'question')} />
                                        <div className="flex-1 bg-black/20 rounded-xl border border-white/5 overflow-hidden relative">
                                            {activeLog.questionImages?.length > 0 ? <img src={activeLog.questionImages[0]} className="w-full h-full object-contain"/> : <div className="absolute inset-0 flex items-center justify-center text-zinc-600 text-xs">Drop Image Here</div>}
                                            {uploadingQ && <div className="absolute inset-0 bg-black/50 flex items-center justify-center"><div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"/></div>}
                                        </div>
                                    </div>
                                    <div className="glass-card rounded-2xl p-4 flex flex-col relative">
                                        <div className="flex justify-between mb-2"><span className="font-bold text-zinc-400">Solution</span><button onClick={()=>document.getElementById('s_up').click()} className="text-xs text-emerald-400 hover:text-white transition-colors">+ Add</button></div>
                                        <input id="s_up" type="file" hidden onChange={e=>handleImageUpdate(e.target.files[0], 'add', 'scheme')} />
                                        <div className="flex-1 bg-black/20 rounded-xl border border-white/5 overflow-hidden relative">
                                            {activeLog.schemeImages?.length > 0 ? <img src={activeLog.schemeImages[0]} className="w-full h-full object-contain"/> : <div className="absolute inset-0 flex items-center justify-center text-zinc-600 text-xs">Drop Image Here</div>}
                                             {uploadingS && <div className="absolute inset-0 bg-black/50 flex items-center justify-center"><div className="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"/></div>}
                                        </div>
                                    </div>
                                </div>

                                {/* Deep Work Area */}
                                <div className="glass-card p-6 rounded-3xl min-h-[300px] flex flex-col">
                                    <div className="flex gap-4 mb-4">
                                        <div className="flex-1">
                                            <label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest block mb-2">Why I missed this (Analysis)</label>
                                            <textarea value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})} className="w-full h-40 bg-transparent text-lg text-zinc-300 leading-relaxed outline-none resize-none placeholder-zinc-700" placeholder="Start typing..."/>
                                        </div>
                                        <div className="w-32 space-y-4">
                                            <div><label className="text-[10px] font-bold text-zinc-500 uppercase block mb-1">Ans</label><input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-green-500/10 border border-green-500/30 rounded-lg p-2 text-green-400 font-mono font-bold text-center"/></div>
                                            <div><label className="text-[10px] font-bold text-zinc-500 uppercase block mb-1">Lost</label><input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-red-500/10 border border-red-500/30 rounded-lg p-2 text-red-400 font-bold text-center"/></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            {/* AI Panel (Slide Over) */}
                            <AnimatePresence>
                                {isAiOpen && (
                                    <motion.div initial={{x:300, opacity:0}} animate={{x:0, opacity:1}} exit={{x:300, opacity:0}} className="absolute top-0 right-0 bottom-0 w-80 z-20 shadow-2xl">
                                        <GlassChat/>
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        </motion.div>
                    ) : (
                        <div className="flex-1 glass-panel rounded-3xl flex flex-col items-center justify-center text-zinc-500">
                            <motion.div animate={{y: [0, -10, 0]}} transition={{duration:3, repeat: Infinity}} className="mb-6 opacity-30">
                                <Icons.Bug className="w-24 h-24"/>
                            </motion.div>
                            <h2 className="text-2xl font-bold text-white mb-2">No Selection</h2>
                            <p>Pick a log from the left to start analyzing.</p>
                        </div>
                    )}
                </div>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
