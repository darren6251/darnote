        const compressImage = async (fileOrBlob) => {
            return new Promise((resolve) => {
                const img = new Image(); const reader = new FileReader();

                    const canvas = document.createElement('canvas'); const MAX_WIDTH = 800; let w = img.width, h = img.height;

                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);

                else { try{ const q=window.firebase.query(window.firebase.collection(window.firebase.db,'artifacts',"darnote-app",'users',user.uid,'error_logs'),window.firebase.where('subject','==',selSub),window.firebase.limit(5)); const s=await window.firebase.getDocs(q); const l=s.docs.map(d=>d.data()); ctx=`Sub:${selSub}. Top:${selTop}. Past:${l.map(x=>x.explanation).join('|')}`; }catch(e){ctx=`Focus:${selSub}/${selTop}`;} }
                const type = activeLog?.questionType || 'MC';
                const pmt = type==='MC' ? `Ctx:${ctx}. Gen 5 MCQ JSON:[{"q":"..","options":["A.."],"answer":"A","explanation":".."}]` : `Ctx:${ctx}. Gen 1 LQ JSON:{"context":"..","parts":[{"id":"a","text":"..","marks":2}]}`;
                const res = await callAI(pmt, "JSON Only", img); try{ const j=JSON.parse(res.replace(/```json|```/g,'')); if(type==='MC')setQs(j); else setLq(j); }catch(e){alert("Gen Failed");onClose();} setLoading(false);
            };
            const mark = async () => {
                setLoading(true); const pmt=`Mark. Ctx:${lq.context}. P:${JSON.stringify(lq.parts)}. A:${JSON.stringify(ans)}. Return JSON:{"totalScore":5,"maxScore":10,"generalFeedback":"..","partFeedback":{"a":{"score":1,"comment":".."}}}`;
                const res = await callAI(pmt,"JSON Only"); try{setFb(JSON.parse(res.replace(/```json|```/g,''))); setMarked(true);}catch(e){alert("Mark Failed");} setLoading(false);

                        <div className="p-4 border-t border-zinc-200 dark:border-white/10 flex justify-between items-center"><span className="text-xs text-zinc-500">{quota}/10 Today</span>{!marked&&(qs.length||lq)?<button onClick={()=>qs.length?setMarked(true):mark()} className="bg-brand text-white px-6 py-2 rounded font-bold">Check</button>:<button onClick={onClose} className="bg-zinc-200 dark:bg-white/10 px-4 py-2 rounded">Close</button>}</div>
                    </div>
                </div>

        const App = () => {

                const s = await window.firebase.getDocs(q);
                setLogs(s.docs.map(d => { const dt=d.data(); return { id:d.id, ...dt, questionImages: dt.questionImages||(dt.imageUrl?[dt.imageUrl]:[]), schemeImages: dt.schemeImages||[] }; }));
            };
            useEffect(() => { fetchLogs(); }, [user, filter]);

            const updateLog = (id, ups) => {
                setLogs(p => p.map(l => l.id === id ? { ...l, ...ups } : l));

                if (action === 'remove') { updateLog(activeLogId, { [fld]: activeLog[fld].filter((_, i) => i !== data) }); return; }
                setSp(true);

                    updateLog(activeLogId, { [fld]: [...activeLog[fld], url] });
                    if(isQ) {
                        const nq = await checkAndIncrementQuota(user, 'ocr');

                            r.readAsDataURL(blob);

                                        </div>

                                </div>
                            </div>
                        ) : (<div className="flex-1 flex flex-col items-center justify-center text-zinc-400"><Icons.Bug className="w-16 h-16 opacity-20 mb-4"/>Select a log</div>)}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-[350px] z-30 shadow-2xl"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>
                        {isPracticeOpen && <PracticeModal activeLog={activeLog} onClose={() => setIsPracticeOpen(false)} user={user} subjects={subjects} />}
                    </main>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
