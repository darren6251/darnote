                                            <AnimatePresence>{ocrPendingToast > 0 && (<motion.div initial={{opacity:0, scale:0.8}} animate={{opacity:1, scale:1}} exit={{opacity:0}} className="bg-warning/10 border border-warning/20 text-warning text-[10px] font-bold px-2 py-1 rounded-full flex items-center gap-1"><div className="w-1.5 h-1.5 rounded-full bg-warning animate-pulse"/>Auto-OCR in {ocrPendingToast}s</motion.div>)}</AnimatePresence>
                                        </div>
                                        <button onClick={() => setPracticeConfig({ isOpen: true, mode: 'single' })} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-light dark:bg-white/10 text-gray hover:bg-accent hover:text-white transition-all ml-1" title="Generate Drill Questions"><i className="fas fa-dumbbell"></i> <span className="hidden sm:inline">Drill</span></button>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${activeLog.mastered ? 'bg-success text-white shadow-ds' : 'bg-warning/10 text-warning hover:bg-warning/20'}`}>{activeLog.mastered ? <><i className="fas fa-check"></i> Mastered</> : 'Needs Review'}</button>
                                        <div className="h-6 w-px bg-light-gray dark:bg-white/10 mx-1"></div>
                                        <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-2 rounded-full transition-colors ${!user ? 'cursor-not-allowed opacity-50 bg-light text-gray' : isAiOpen ? 'bg-primary text-white shadow-ds' : 'hover:bg-light dark:hover:bg-white/10 text-gray'}`} title="AI Tutor"><i className="fas fa-robot text-lg"></i></button>
                                        <button onClick={() => handleDelete(activeLog.id)} className="p-2 rounded-full hover:bg-danger/10 text-gray hover:text-danger transition-colors"><i className="fas fa-trash-alt"></i></button>
                                    </div>
                                </header>
                                <div className="flex-1 overflow-y-auto p-6 md:p-8 scroll-smooth">
                                    <div className="max-w-4xl mx-auto space-y-6">
                                        {/* Meta Data Card */}
                                        <div className="bg-white dark:bg-surface p-6 rounded-ds shadow-ds border-t-4 border-primary grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div>
                                                <label className="text-xs font-bold text-dark dark:text-white block mb-2">Subject</label>
                                                <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="form-control bg-light dark:bg-black/20"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-dark dark:text-white block mb-2">Topic</label>
                                                <div className="flex gap-2">{activeLog.subject !== 'General' && currentSub ? (<><select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="form-control bg-light dark:bg-black/20 flex-1"><option value="">-- Select --</option>{currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}</select><button onClick={() => addTopicToSubject(activeLog.subject)} className="px-3 rounded-lg bg-light dark:bg-white/5 hover:bg-primary hover:text-white transition-colors text-gray border border-light-gray dark:border-white/10"><i className="fas fa-plus"></i></button></>) : ( <input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="form-control bg-light dark:bg-black/20 flex-1" placeholder="Custom" disabled={activeLog.subject !== 'General'}/> )}</div>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-dark dark:text-white block mb-2">Type</label>
                                                <div className="flex bg-light dark:bg-black/20 p-1 rounded-lg border border-light-gray dark:border-white/5">{['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-zinc-700 shadow-sm text-primary dark:text-white' : 'text-gray'}`}>{t}</button>))}</div>
                                            </div>
                                        </div>
                                        
                                        {/* Images & Evidence */}
                                        <div className="bg-white dark:bg-surface p-6 rounded-ds shadow-sm border border-light-gray dark:border-white/5 space-y-6">
                                            <div>
                                                <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label={<><i className="fas fa-camera text-primary"></i> Question Evidence</>} isUploading={uploadingQ} onImageClick={() => setCompareMode(true)} />
                                                <div className="mt-3">
                                                    <button onClick={() => setShowOcrText(!showOcrText)} className="text-[10px] flex items-center gap-1 text-gray hover:text-primary transition-colors font-medium bg-light dark:bg-white/5 px-2 py-1 rounded-md"><i className="fas fa-file-alt"></i> {showOcrText ? "Hide Extracted Text" : "View Extracted Text"}</button>
                                                    {showOcrText && (<textarea value={activeLog.questionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="mt-2 w-full p-4 text-xs bg-light dark:bg-black/20 border border-light-gray dark:border-white/5 rounded-lg font-mono text-gray focus:outline-none focus:ring-1 focus:ring-primary" rows="4" placeholder="AI will extract text here automatically..." />)}
                                                </div>
                                            </div>
                                            <div className="h-px bg-light-gray dark:bg-white/5"></div>
                                            <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label={<><i className="fas fa-clipboard-check text-success"></i> Marking Scheme</>} isUploading={uploadingS} onImageClick={() => setCompareMode(true)} />
                                        </div>

                                        {/* Analysis Grid */}
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            <div className="lg:col-span-1 space-y-6">
                                                <div className="bg-white dark:bg-surface p-5 rounded-ds shadow-sm border border-light-gray dark:border-white/5">
                                                    <label className="text-xs font-bold text-dark dark:text-white block mb-2"><i className="fas fa-check text-success"></i> Correct Answer</label>
                                                    <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-success/5 border border-success/20 rounded-lg px-4 py-3 font-mono text-lg font-bold text-success focus:outline-none focus:ring-2 focus:ring-success/20" placeholder="e.g. A, 42"/>
                                                </div>
                                                <div className="bg-white dark:bg-surface p-5 rounded-ds shadow-sm border border-light-gray dark:border-white/5">
                                                    <label className="text-xs font-bold text-dark dark:text-white block mb-2"><i className="fas fa-minus-circle text-danger"></i> Marks Lost</label>
                                                    <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-danger/5 border border-danger/20 rounded-lg px-4 py-3 font-bold text-danger focus:outline-none focus:ring-2 focus:ring-danger/20" placeholder="-2"/>
                                                </div>
                                            </div>
                                            <div className="lg:col-span-2 bg-white dark:bg-surface rounded-ds shadow-sm border border-light-gray dark:border-white/5 flex flex-col min-h-[250px]">
                                                <div className="px-5 py-3 border-b border-light-gray dark:border-white/5 bg-light dark:bg-white/5 flex justify-between items-center">
                                                    <span className="text-xs font-bold text-dark dark:text-white"><i className="fas fa-brain text-accent"></i> My Mistake Analysis</span>
                                                    <span className="text-[10px] text-gray bg-white dark:bg-black/20 px-2 py-0.5 rounded border border-light-gray dark:border-white/10">Markdown OK</span>
                                                </div>
                                                <textarea className="flex-1 w-full p-5 bg-transparent outline-none resize-none text-sm leading-7 text-dark dark:text-zinc-300 placeholder-gray/50" placeholder="• Record your wrong thought process...&#10;• Why did I fall for the trap?&#10;• What is the key to solving this next time?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <Dashboard logs={logs} setPracticeConfig={setPracticeConfig} />
                        )}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-[400px] z-30"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>
                        {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                    </main>
                </div>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
