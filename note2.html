const getLimits=async()=>{
 const defaults={chat_gemini:5,chat_groq:20,magic_points:10};
 try{
  const s=await window.firebase.getDoc(window.firebase.doc(window.firebase.db,'artifacts',"darnote-app",'public','data','config','main'));
  if(s.exists())return {...defaults,...s.data()};
 }catch(e){}return defaults;
};

const checkQuota=async(user,type,cost=1)=>{
 if(!user)return false;
 const limits=await getLimits();
 const d=new Date().toISOString().split('T')[0];
 const ref=window.firebase.doc(window.firebase.db,'artifacts',"darnote-app",'users',user.uid,'ai_usage',d);
 try{
  const s=await window.firebase.getDoc(ref);
  const data=s.exists()?s.data():{};
  let cur=0,max=0,field='';
  if(type==='magic'){field='magic_usage';max=limits.magic_points;cur=data.magic_usage||0;}
  else if(type==='chat_gemini'){field='chat_count';max=limits.chat_gemini;cur=data.chat_count||0;}
  else{field='chat_groq_count';max=limits.chat_groq;cur=data.chat_groq_count||0;}
  if(cur+cost>max) return false;
  await window.firebase.setDoc(ref,{[field]:window.firebase.increment(cost)},{merge:true});
  return cur+cost;
 }catch(e){return false;}
};

// UPDATED: callAI now supports array of images or single image
const callAI=async(prompt,sys="",images=null,apiUrl=GEMINI_PROXY)=>{
 let fP=prompt;if(sys)fP=`${sys}\n\nUser: ${prompt}`;
 let parts=[{text:fP}];
 if(images){
  const imgArray=Array.isArray(images)?images:[images];
  imgArray.forEach(img=>{
   let m="image/png",d=img;
   if(img.includes(",")){const s=img.split(",");m=s[0].match(/:(.*?);/)[1];d=s[1];}
   parts.push({inlineData:{mimeType:m,data:d}});
  });
 }
 try{
  const r=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}]})});
  if(!r.ok)return`Error: API Failed (${r.status})`;
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||"No response.";
 }catch(e){return`Error: ${e.message}`;}
};

const callGroq=async(prompt,sys="",img=null)=>{
 const uC=[{type:"text",text:prompt}];
 if(img){uC.push({type:"image_url",image_url:{url:img}});}
 try{
  const r=await fetch(GROQ_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:"llama-3.2-90b-vision-preview",messages:[{role:"system",content:sys},{role:"user",content:uC}]})});
  if(!r.ok)return`Error: API Failed`;
  const d=await r.json();return d.choices?.[0]?.message?.content||"Error";
 }catch(e){return`Error: ${e.message}`;}
};

   await fetch(`https://www.googleapis.com/drive/v3/files/${fd.id}/permissions`,{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})});
   return {id:fd.id,webContentLink:fd.thumbnailLink?fd.thumbnailLink.replace('=s220','=s16383'):`https://lh3.googleusercontent.com/d/${fd.id}`,webViewLink:fd.webViewLink};
  }
  return{id:fd.id,webViewLink:fd.webViewLink};
 };
 return{saveToDrive:save,isReady:r};
};

const MsgBub=({text,isUser})=>{
 const r=useRef(null);
 const p=useMemo(()=>{
  if(isUser)return{t:null,r:text};
  const m=text.match(/<thinking>([\s\S]*?)<\/thinking>/);
  return m?{t:m[1].trim(),r:text.replace(m[0],'').trim()}:{t:null,r:text};
 },[text,isUser]);
 useEffect(()=>{
  if(r.current&&!isUser){
   r.current.innerHTML=window.marked?.parse(p.r)||p.r;
   if(window.renderMathInElement)window.renderMathInElement(r.current,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});
  }else if(r.current)r.current.textContent=p.r;
 },[p.r,isUser]);
 return(<div className={`msg-content ${isUser?'text-white whitespace-pre-wrap':'text-zinc-800 dark:text-zinc-200'}`}>{p.t&&<div className="mb-2 text-xs bg-indigo-50 dark:bg-white/5 p-2 rounded text-zinc-500 font-mono whitespace-pre-wrap">{p.t}</div>}<div ref={r}/></div>);
};

const MagicNoteModal=({onClose,onGenerate,quotaInfo})=>{
 const[imgs,setImgs]=useState([]);const[desc,setDesc]=useState("");const[tier,setTier]=useState("short");const[loading,setLoading]=useState(false);
 const handleFile=async(e)=>{
  const files=Array.from(e.target.files);
  const pros=files.map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f);}));
  setImgs([...imgs,...await Promise.all(pros)]);
 };
 const run=async()=>{
  const cost=tier==='short'?1:tier==='mid'?2:3;
  if(quotaInfo.used+cost > quotaInfo.max){alert(`Not enough quota! Need ${cost}, have ${quotaInfo.max-quotaInfo.used} left.`);return;}
  setLoading(true);
  await onGenerate(imgs,desc,tier);
  setLoading(false);onClose();
 };
 return(
  <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
   <div className="bg-white dark:bg-surface w-full max-w-lg rounded-2xl shadow-2xl p-6 border border-zinc-200 dark:border-white/10">
    <div className="flex justify-between mb-4"><h2 className="text-xl font-bold flex items-center gap-2"><Icons.Magic className="w-5 h-5 text-indigo-500"/> Magic Note Generator</h2><button onClick={onClose}><Icons.X className="w-5 h-5"/></button></div>
    <div className="space-y-4">
     <div className="border-2 border-dashed border-zinc-300 dark:border-zinc-700 rounded-xl p-8 text-center hover:bg-zinc-50 dark:hover:bg-white/5 transition relative">
      <input type="file" multiple accept="image/*" onChange={handleFile} className="absolute inset-0 opacity-0 cursor-pointer"/>
      {imgs.length>0?<div className="grid grid-cols-4 gap-2">{imgs.map((src,i)=><img key={i} src={src} className="h-16 w-16 object-cover rounded shadow"/>)}</div>:<div className="text-zinc-500">Drop notes/whiteboard photos here</div>}
     </div>
     <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Instructions (e.g., 'Focus on Organic Chem mechanisms')" className="w-full bg-zinc-100 dark:bg-black/50 border border-zinc-200 dark:border-white/10 rounded-lg px-4 py-2"/>
     <div className="grid grid-cols-3 gap-2">
      {['short','mid','long'].map(t=>(<button key={t} onClick={()=>setTier(t)} className={`p-2 rounded-lg border text-sm capitalize ${tier===t?'bg-indigo-600 border-indigo-600 text-white':'border-zinc-200 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-white/5'}`}>{t} ({t==='short'?1:t==='mid'?2:3}pt)</button>))}
     </div>
     <div className="text-xs text-center text-zinc-500">Daily Quota: {quotaInfo.used}/{quotaInfo.max} Used</div>
     <button onClick={run} disabled={loading||imgs.length===0} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-500 disabled:opacity-50">{loading?'Generating... (This takes a sec)':'Generate Magic Note'}</button>
    </div>
   </div>
  </div>
 );
};

const Editor=({content,id,title,onSave,onSaveDrive,dark,ctx,driveFn})=>{
 const ed=useRef(null);const[cnt,setCnt]=useState(0);const[ai,setAi]=useState(false);const[prev,setPrev]=useState(false);
 const up=useRef(onSave);const dr=useRef(driveFn);const cch=useRef(new Map());
 useEffect(()=>{up.current=onSave;},[onSave]);useEffect(()=>{dr.current=driveFn;},[driveFn]);
 useEffect(()=>{
  const init=()=>{
   if(window.tinymce){
    if(ed.current)window.tinymce.remove(ed.current);
    window.tinymce.init({
     selector:'#tex',height:'100%',menubar:false,
     plugins:'preview importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars emoticons',
     toolbar:'undo redo | blocks | bold italic underline | alignleft aligncenter alignright | bullist numlist | table image | removeformat',
     skin:dark?'oxide-dark':'oxide',content_css:dark?'dark':'default',resize:false,paste_data_images:true,
     images_upload_handler:(b,p)=>new Promise((ok,no)=>{
      const k=`${b.blob().size}`;const c=cch.current.get(k);if(c)return c.then(ok);
      const pr=dr.current(b.blob(),b.filename(),b.blob().type,'DN_Img').then(r=>{ok(r.webContentLink||r.url);return r.webContentLink||r.url;});
      cch.current.set(k,pr);
     }),
     setup:e=>{
      ed.current=e;
      e.on('init',()=>e.setContent(content||""));
      e.on('input change keyup',()=>setTimeout(()=>up.current(e.getContent()),1000));
      e.on('contextmenu',ev=>{ev.preventDefault();const t=e.selection.getContent({format:'text'});if(t)ctx({x:ev.clientX,y:ev.clientY},t);});
     }
    });
   }
  };
  setTimeout(init,50);
  return ()=>{if(ed.current)try{window.tinymce.remove(ed.current);}catch(e){}}
 },[id,dark]);
 useEffect(()=>{if(prev&&window.renderMathInElement)window.renderMathInElement(document.getElementById('math-p'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})},[prev,content]);
 const pdf=()=>html2pdf().from(ed.current.getBody()).save(`dn-${id}.pdf`);
 const insAi=async(act)=>{
  const sel=ed.current.selection.getContent({format:'text'});if(!sel)return;
  const res=await callAI(`${act}: "${sel}"`,"Return ONLY text.");
  ed.current.selection.setContent(res);up.current(ed.current.getContent());setAi(false);
 };
 return(
  <div className="flex flex-col h-full relative">
   <div className="bg-[#edf2fa] dark:bg-[#1e1e20] p-1 flex gap-2 items-center sticky top-0 z-30 shrink-0">
    <div className="relative"><button onClick={()=>setAi(!ai)} className="px-2 py-1 bg-indigo-600 text-white rounded text-xs font-bold">AI Tools</button>
    {ai&&<div className="absolute top-full left-0 bg-white dark:bg-surface border border-zinc-200 dark:border-white/10 rounded shadow-xl z-50 w-32">{['Fix Grammar','Summarize','Expand'].map(a=><button key={a} onClick={()=>insAi(a)} className="block w-full text-left px-2 py-1 text-xs hover:bg-zinc-100 dark:hover:bg-white/5">{a}</button>)}</div>}</div>
    <button onClick={()=>setPrev(!prev)} className={`px-2 py-1 rounded text-xs font-bold ${prev?'bg-emerald-600 text-white':'bg-zinc-200 text-zinc-800'}`}>{prev?'Edit':'Math View'}</button>
    <button onClick={pdf} className="p-1"><Icons.Pdf className="w-4 h-4 text-zinc-500"/></button>
   </div>
   <div className="flex-1 relative w-full h-full"><textarea id="tex"></textarea>{prev&&<div id="math-p" className="absolute inset-0 bg-white dark:bg-onyx p-8 overflow-y-auto z-40" dangerouslySetInnerHTML={{__html:ed.current?.getContent()}}></div>}</div>
  </div>
 );
};

const Chat=({note,close,user})=>{
 const[msg,setMsg]=useState([{role:'ai',text:'Hi! Drop an image or ask away.'}]);const[inpt,setInpt]=useState('');const[ld,setLd]=useState(false);const[img,setImg]=useState(null);const[mod,setMod]=useState('gemini');const[q,setQ]=useState(0);
 useEffect(()=>{const f=async()=>{const u=await checkQuota(user,mod==='gemini'?'chat_gemini':'chat_groq',0);if(u!==false)setQ(u);};f();},[user,mod,msg]);
 const send=async()=>{
  if(!inpt.trim()&&!img)return;
  const cost=1;const u=await checkQuota(user,mod==='gemini'?'chat_gemini':'chat_groq',cost);
  if(u===false){setMsg([...msg,{role:'ai',text:'<span class="text-red-500">Quota Limit Reached.</span>'}]);return;}
  setQ(u);
  const um={role:'user',text:inpt,image:img};setMsg(p=>[...p,um]);setInpt('');setImg(null);setLd(true);
  try{
   const ctx=`Note: ${note.title}. ${note.content}`;const sys=`You are a helpful assistant. Context: ${ctx}. Use <thinking>...</thinking> for logic.`;
   const res=mod==='gemini'?await callAI(um.text||"Look at this",sys,um.image):await callGroq(um.text||"Look",sys,um.image);
   setMsg(p=>[...p,{role:'ai',text:res}]);
  }catch(e){setMsg(p=>[...p,{role:'ai',text:"Error."}]);}setLd(false);
 };
 const drop=e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f){const r=new FileReader();r.onload=ev=>setImg(ev.target.result);r.readAsDataURL(f);}};
 return(
  <div className="flex flex-col h-full bg-white dark:bg-onyx" onDrop={drop} onDragOver={e=>e.preventDefault()}>
   <div className="p-2 border-b flex justify-between items-center"><span className="font-bold text-xs flex gap-1"><Icons.Bot className="w-4 h-4"/> AI ({q} Used)</span><button onClick={close}><Icons.X className="w-4 h-4"/></button></div>
   <div className="flex gap-2 p-2 bg-zinc-100 dark:bg-white/5"><button onClick={()=>setMod('gemini')} className={`flex-1 text-[10px] font-bold py-1 rounded ${mod==='gemini'?'bg-white shadow text-indigo-600':''}`}>Gemini</button><button onClick={()=>setMod('groq')} className={`flex-1 text-[10px] font-bold py-1 rounded ${mod==='groq'?'bg-white shadow text-green-600':''}`}>ChatGPT</button></div>
   <div className="flex-1 overflow-y-auto p-4 space-y-4">{msg.map((m,i)=><div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={`max-w-[90%] p-3 rounded-xl text-sm ${m.role==='user'?'bg-indigo-600 text-white':'bg-zinc-100 dark:bg-zinc-800'}`}>{m.image&&<img src={m.image} className="max-w-full rounded mb-2"/>}<MsgBub text={m.text} isUser={m.role==='user'}/></div></div>)}{ld&&<div className="text-xs animate-pulse">Thinking...</div>}</div>
   <div className="p-3 border-t bg-white dark:bg-zinc-900 relative">
    {img&&<div className="absolute -top-12 left-4 h-10 w-10"><img src={img} className="h-full w-full rounded border"/><button onClick={()=>setImg(null)} className="absolute -top-1 -right-1 bg-red-500 rounded-full w-3 h-3"/></div>}
    <div className="flex gap-2"><input value={inpt} onChange={e=>setInpt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} className="flex-1 bg-zinc-100 dark:bg-white/5 rounded-full px-4 text-sm outline-none"/><button onClick={send}><Icons.Plus className="w-5 h-5 text-indigo-500 rotate-90"/></button></div>
   </div>
  </div>
 );
};

const App=()=>{
 const[u,sU]=useState(null);const[nts,sNts]=useState([]);const[act,sAct]=useState(null);const[q,sQ]=useState('');const[sb,sSb]=useState([]);const[filt,sFilt]=useState('all');const[aiOp,sAiOp]=useState(false);const[magOp,sMagOp]=useState(false);
 const[ld,sLd]=useState(true);const{saveToDrive,isReady}=useGoogleDrive();const[mgQt,sMgQt]=useState({used:0,max:10});
 useEffect(()=>{window.firebase.onAuthStateChanged(window.firebase.auth,x=>{sU(x);sLd(false);});},[]);
 useEffect(()=>{
  if(!u)return;const db=window.firebase.db;const uid=u.uid;
  const subU=window.firebase.onSnapshot(window.firebase.collection(db,'artifacts','darnote-app','users',uid,'subjects'),s=>sSb(s.docs.map(d=>d.data().name).sort()));
  const fetch=async()=>{
   const rf=window.firebase.collection(db,'artifacts','darnote-app','users',uid,'notes');
   let qry=window.firebase.query(rf,window.firebase.orderBy('updatedAt','desc'),window.firebase.limit(50));
   const s=await window.firebase.getDocs(qry);sNts(s.docs.map(d=>({id:d.id,...d.data()})));
   // Quota
   const qRef=window.firebase.doc(db,'artifacts','darnote-app','users',uid,'ai_usage',new Date().toISOString().split('T')[0]);
   const qs=await window.firebase.getDoc(qRef);sMgQt({used:qs.exists()?qs.data().magic_usage||0:0,max:10});
  };
  fetch();return ()=>subU();
 },[u,filt,magOp]);
 useEffect(()=>{if(u&&act){const un=window.firebase.onSnapshot(window.firebase.doc(window.firebase.db,'artifacts','darnote-app','users',u.uid,'notes',act),(d)=>{if(d.exists())sNts(p=>p.map(n=>n.id===act?{...n,...d.data()}:n));});return ()=>un();}},[act]);
 
 const crud={
  add:async(type='text')=>{const n={type,title:'',content:'',updatedAt:new Date().toISOString(),ownerId:u.uid,isFavorite:false,isPinned:false};const d=await window.firebase.addDoc(window.firebase.collection(window.firebase.db,'artifacts','darnote-app','users',u.uid,'notes'),n);sAct(d.id);sNts(p=>[...p,{id:d.id,...n}]);},
  upd:async(id,dt)=>{await window.firebase.updateDoc(window.firebase.doc(window.firebase.db,'artifacts','darnote-app','users',u.uid,'notes',id),{...dt,updatedAt:new Date().toISOString()});},
  del:async(id)=>{await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db,'artifacts','darnote-app','users',u.uid,'notes',id));sNts(p=>p.filter(n=>n.id!==id));if(act===id)sAct(null);}
 };
 
 const magicGen=async(imgs,desc,tier)=>{
  const pts=tier==='short'?1:tier==='mid'?2:3;
  await checkQuota(u,'magic',pts);
  const p=`Analyze these images. Instruction: ${desc}. Create a ${tier} detailed note in Markdown. Use $$...$$ for block math, $...$ for inline. Use \\text{} for Chemistry. Output Format: # Title, ## Sections.`;
  const res=await callAI(p,"You are an academic note taker.",imgs);
  await crud.upd(act,{content:(nts.find(n=>n.id===act)?.content||"") + "\n" + res});
 };

 const curN=nts.find(n=>n.id===act);
 if(ld)return <div className="h-screen bg-black text-white flex items-center justify-center"><Icons.Loader className="w-8 h-8"/></div>;
 if(!u)return <div className="h-screen bg-black flex items-center justify-center"><button onClick={async()=>{await window.firebase.signInWithPopup(window.firebase.auth,new window.firebase.GoogleAuthProvider());}} className="bg-white text-black px-6 py-3 rounded-full font-bold flex gap-2"><Icons.Google className="w-5 h-5"/>Sign In</button></div>;
 
 return(
  <div className={`flex h-screen w-full ${aiOp?'mr-96':''}`}>
   <div className="w-[60px] lg:w-[240px] glass-panel flex flex-col justify-between p-2 lg:p-4 z-20 shrink-0">
    <div className="space-y-4">
     <div className="flex items-center gap-2 p-2 hover:bg-zinc-100 dark:hover:bg-white/5 rounded-lg cursor-pointer"><div className="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold">{u.displayName?.[0]}</div><span className="hidden lg:block font-bold text-sm truncate">{u.displayName}</span></div>
     <nav className="space-y-1">
      <button onClick={()=>sFilt('all')} className={`w-full flex items-center gap-2 p-2 rounded-lg text-sm ${filt==='all'?'bg-indigo-100 text-indigo-600 dark:bg-white/10 dark:text-white':'text-zinc-500'}`}><Icons.Archive className="w-4 h-4"/><span className="hidden lg:block">All Notes</span></button>
      <button onClick={()=>sFilt('fav')} className={`w-full flex items-center gap-2 p-2 rounded-lg text-sm ${filt==='fav'?'bg-indigo-100 text-indigo-600 dark:bg-white/10 dark:text-white':'text-zinc-500'}`}><Icons.Star className="w-4 h-4"/><span className="hidden lg:block">Favorites</span></button>
     </nav>
    </div>
    <div className="space-y-1"><button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="w-full flex items-center gap-2 p-2 text-red-500 hover:bg-red-50 rounded-lg text-sm"><Icons.Logout className="w-4 h-4"/><span className="hidden lg:block">Logout</span></button></div>
   </div>
   <div className="w-[300px] border-r border-zinc-200 dark:border-white/10 bg-[#fbfbfb] dark:bg-[#18181b] flex flex-col shrink-0">
    <div className="p-4 border-b border-zinc-200 dark:border-white/10 space-y-2">
     <div className="flex gap-1"><input value={q} onChange={e=>sQ(e.target.value)} placeholder="Search..." className="w-full bg-zinc-200 dark:bg-black/20 rounded px-3 py-1.5 text-sm outline-none"/><button onClick={()=>crud.add('text')} className="bg-indigo-600 text-white p-1.5 rounded"><Icons.Plus className="w-4 h-4"/></button></div>
     <div className="flex justify-between items-center"><span className="text-xs font-bold text-zinc-500 uppercase">{filt}</span><button onClick={()=>sMagOp(true)} className="text-[10px] bg-gradient-to-r from-indigo-500 to-purple-500 text-white px-2 py-0.5 rounded-full flex items-center gap-1"><Icons.Magic className="w-3 h-3"/> Magic</button></div>
    </div>
    <div className="flex-1 overflow-y-auto p-2 space-y-1">
     {nts.filter(n=>n.title.toLowerCase().includes(q.toLowerCase()) && (filt==='all'||(filt==='fav'&&n.isFavorite))).map(n=>(
      <div key={n.id} onClick={()=>sAct(n.id)} className={`p-3 rounded-lg cursor-pointer text-sm border ${act===n.id?'bg-white dark:bg-white/5 border-zinc-300 dark:border-white/10 shadow-sm':'border-transparent hover:bg-zinc-100 dark:hover:bg-white/5'}`}>
       <div className="font-bold truncate mb-1 text-zinc-800 dark:text-zinc-200">{n.title||'Untitled'}</div>
       <div className="text-xs text-zinc-500 line-clamp-2">{n.content?.replace(/<[^>]*>/g,'')||'No content'}</div>
      </div>
     ))}
    </div>
   </div>
   <main className="flex-1 flex flex-col min-w-0 bg-white dark:bg-onyx relative">
    {curN?(
     <>
      <header className="h-14 border-b border-zinc-200 dark:border-white/10 flex items-center justify-between px-4">
       <input value={curN.title} onChange={e=>crud.upd(curN.id,{title:e.target.value})} placeholder="Untitled" className="bg-transparent font-bold text-lg outline-none text-zinc-900 dark:text-white"/>
       <div className="flex gap-2">
        <button onClick={()=>crud.upd(curN.id,{isFavorite:!curN.isFavorite})} className={`${curN.isFavorite?'text-yellow-500':'text-zinc-400'}`}><Icons.Star className="w-4 h-4"/></button>
        <button onClick={()=>sAiOp(!aiOp)} className={`${aiOp?'text-indigo-500':'text-zinc-400'}`}><Icons.Bot className="w-5 h-5"/></button>
        <button onClick={()=>crud.del(curN.id)} className="text-red-500"><Icons.Trash className="w-4 h-4"/></button>
       </div>
      </header>
      <div className="flex-1 relative overflow-hidden">
       <Editor content={curN.content} id={curN.id} title={curN.title} onSave={c=>crud.upd(curN.id,{content:c})} onSaveDrive={saveToDrive} dark={true} ctx={(p,t)=>{}} driveFn={saveToDrive}/>
      </div>
     </>
    ):<div className="flex-1 flex items-center justify-center text-zinc-400">Select a note</div>}
    <AnimatePresence>
     {aiOp&&<motion.div initial={{x:'100%'}} animate={{x:0}} exit={{x:'100%'}} className="absolute top-0 right-0 bottom-0 w-80 bg-white dark:bg-surface border-l z-40 shadow-xl"><Chat note={curN||{}} close={()=>sAiOp(false)} user={u}/></motion.div>}
    </AnimatePresence>
   </main>
   {magOp&&<MagicNoteModal onClose={()=>sMagOp(false)} onGenerate={magicGen} quotaInfo={mgQt}/>}
  </div>
 );
};
const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
</script></body></html>
