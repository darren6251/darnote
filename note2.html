            ShieldCheck: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>,
            ShieldClock: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><circle cx="12" cy="12" r="3"/><polyline points="12 10 12 12 13 13"/></svg>,
            Target: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            GraduationCap: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>,
            ExternalLink: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>,
            CloudUpload: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>,
            Menu: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            ChevronLeft: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg>,
            ChartBar: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
            Help: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
        };

        // ==========================================
        // AI & QUOTA HELPERS
        // ==========================================
        
        const getLimits = async () => {
            const defaults = { chat_gemini: 5, chat_groq: 20, ai_note: 10 };
            try {
                const cfgRef = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'public', 'data', 'config', 'main');
                const snap = await window.firebase.getDoc(cfgRef);
                if (snap.exists()) return { ...defaults, ...snap.data() };
            } catch(e) { console.warn("Using default limits"); }
            return defaults;
        };

        const checkAndIncrementQuota = async (user, type, costOrSubtype = 1) => {
            if (!user) return false;
            const limits = await getLimits();
            let field = '', limit = 0, cost = 1;
            
            if (type === 'chat') {
                if (costOrSubtype === 'groq') { field = 'chat_groq_count'; limit = limits.chat_groq; } 
                else { field = 'chat_count'; limit = limits.chat_gemini; }
            } else if (type === 'magic') {
                field = 'magic_point_usage';
                limit = limits.ai_note || 10;
                cost = costOrSubtype; // 1, 2, or 3
            }
            
            const today = new Date().toISOString().split('T')[0];
            const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today);
            
            try {
                const snap = await window.firebase.getDoc(ref);
                let current = snap.exists() ? (snap.data()[field] || 0) : 0;
                
                // --- STUDENT PERK SYNC ---
                const profileRef = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'settings', 'profile');
                const profileSnap = await window.firebase.getDoc(profileRef);
                const status = profileSnap.exists() ? profileSnap.data().studentStatus : null;
                const isStudent = status === 'verified' || status === 'temp_verified';
                
                // If student, they get extra buffer
                if (isStudent && current === 0 && !snap.exists()) {
                     current = -20; 
                }
                
                if (current + cost > limit) return false;
                await window.firebase.setDoc(ref, { [field]: window.firebase.increment(cost) }, { merge: true });
                return current + cost;
            } catch (e) { console.error("Quota check failed:", e); return false; }
        };

        const callAI = async (prompt, systemInstruction = "", images = null, apiUrl = GEMINI_PROXY_URL) => {
            let finalPrompt = prompt;
            if (systemInstruction) finalPrompt = `${systemInstruction}\n\nUser Request: ${prompt}`;
            
            let parts = [{ text: finalPrompt }];
            if (images) {
                const imgArray = Array.isArray(images) ? images : [images];
                imgArray.forEach(img => {
                    let mimeType = "image/png"; let data = img;
                    if (img.includes(",")) { const s = img.split(","); mimeType = s[0].match(/:(.*?);/)[1]; data = s[1]; }
                    parts.push({ inlineData: { mimeType, data } });
                });
            }

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) });
                if (!response.ok) return `Error: API Request Failed (${response.status})`;
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
            } catch (error) { return `Error: ${error.message}`; }
        };

        const callGroq = async (prompt, systemInstruction = "", imageBase64 = null) => {
            const userContent = [{ type: "text", text: prompt }];
            if (imageBase64) { 
                const imgArray = Array.isArray(imageBase64) ? imageBase64 : [imageBase64];
                imgArray.forEach(img => userContent.push({ type: "image_url", image_url: { url: img } })); 
            }
            const payload = { model: "llama-3.2-90b-vision-preview", messages: [ { role: "system", content: systemInstruction }, { role: "user", content: userContent } ] };
            try {
                const response = await fetch(GROQ_PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) return `Error: API Request Failed (${response.status})`;
                const data = await response.json();
                return data.choices?.[0]?.message?.content || "Error: Empty response.";
            } catch (error) { return `Error: ${error.message}`; }
        };

        const useGoogleDrive = () => {
            const [tokenClient, setTokenClient] = useState(null);
            const [isApiLoaded, setIsApiLoaded] = useState(false);
            useEffect(() => {
                if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return;
                const loadGapi = async () => { if (window.gapi) { await new Promise(r => window.gapi.load('client', r)); await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] }); setIsApiLoaded(true); } };
                loadGapi();
                if (window.google && window.google.accounts) { const client = window.google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: () => {} }); setTokenClient(client); }
            }, []);
            const getAccessToken = () => new Promise((resolve, reject) => {
                const stored = localStorage.getItem('darnote_gdrive_token');
                if (stored) { const { token, expiry } = JSON.parse(stored); if (Date.now() < expiry) return resolve(token); }
                if (!tokenClient) return reject("Auth not initialized");
                tokenClient.callback = (resp) => { if (resp.error) reject(resp); localStorage.setItem('darnote_gdrive_token', JSON.stringify({ token: resp.access_token, expiry: Date.now() + 3000000 })); resolve(resp.access_token); };
                tokenClient.requestAccessToken({ prompt: '' });
            });
            const saveToDrive = async (content, filename, mimeType, folderName = null, convertToDocs = false) => {
                const token = await getAccessToken();
                let parentId = null;
                if(folderName) {
                    const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`;
                    const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` }});
                    const data = await search.json();
                    if (data.files?.length > 0) parentId = data.files[0].id;
                    else { const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) }); parentId = (await create.json()).id; }
                }
                const metadata = { name: filename, mimeType: convertToDocs ? 'application/vnd.google-apps.document' : mimeType }; if (parentId) metadata.parents = [parentId];
                const form = new FormData(); form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' })); form.append('file', content instanceof Blob ? content : new Blob([content], { type: mimeType }));
                const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,thumbnailLink,webViewLink', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
                if (!uploadRes.ok) throw new Error(`Upload Failed: ${uploadRes.statusText}`);
                const fileData = await uploadRes.json();
                if (mimeType.startsWith('image/')) { await fetch(`https://www.googleapis.com/drive/v3/files/${fileData.id}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) }); return { id: fileData.id, webContentLink: fileData.thumbnailLink ? fileData.thumbnailLink.replace('=s220', '=s16383') : `https://lh3.googleusercontent.com/d/${fileData.id}`, webViewLink: `https://lh3.googleusercontent.com/d/${fileData.id}/view` }; }
                return { id: fileData.id, webViewLink: `https://lh3.googleusercontent.com/d/${fileData.id}/view` };
            };
            return { saveToDrive, isReady: isApiLoaded, getAccessToken };
        };

        const MessageBubble = ({ text, isUser }) => {
            const bubbleRef = useRef(null);
            const [showThinking, setShowThinking] = useState(false);
            const parts = useMemo(() => {
                if (isUser) return { thought: null, response: text };
                const thinkMatch = text.match(/<thinking>([\s\S]*?)<\/thinking>/);
                if (thinkMatch) return { thought: thinkMatch[1].trim(), response: text.replace(thinkMatch[0], '').trim() };
                return { thought: null, response: text };
            }, [text, isUser]);
            useEffect(() => {
                if (bubbleRef.current && !isUser) {
                    const cleanText = parts.response;
                    if (window.marked) bubbleRef.current.innerHTML = window.marked.parse(cleanText); else bubbleRef.current.textContent = cleanText;
                    if (window.renderMathInElement) window.renderMathInElement(bubbleRef.current, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '(', right: ')', display: false}, {left: '\\[', right: '\\]', display: true}], throwOnError: false });
                } else if (bubbleRef.current) bubbleRef.current.textContent = parts.response;
            }, [parts.response, isUser]);
            return (
                <div className={`message-content ${isUser ? 'whitespace-pre-wrap' : ''} ${isUser ? 'text-white' : 'text-zinc-800 dark:text-zinc-200'}`}>
                    {parts.thought && ( <div className="mb-3 rounded-lg border border-indigo-200 dark:border-indigo-900 bg-indigo-50 dark:bg-indigo-950/30 overflow-hidden"><button onClick={() => setShowThinking(!showThinking)} className="w-full flex items-center justify-between px-3 py-2 text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wide hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors"><span className="flex items-center gap-2"><Icons.Brain className="w-3 h-3"/> Thinking</span><Icons.ChevronDown className={`w-3 h-3 transition-transform ${showThinking ? 'rotate-180' : ''}`}/></button>{showThinking && <div className="px-3 py-2 text-xs text-zinc-600 dark:text-zinc-400 border-t border-indigo-200 dark:border-indigo-900 bg-white/50 dark:bg-black/20 font-mono whitespace-pre-wrap leading-relaxed">{parts.thought}</div>}</div> )}
                    <div ref={bubbleRef} />
                </div>
            );
        };

        const useDebouncedSave = (initialData, onSave, delay = 5000) => {
            const [localData, setLocalData] = useState(initialData); const debounceTimer = useRef(null);
            useEffect(() => { setLocalData(initialData); }, [initialData]);
            const updateData = useCallback((newData) => { setLocalData(newData); if (debounceTimer.current) clearTimeout(debounceTimer.current); debounceTimer.current = setTimeout(() => { onSave(newData); }, delay); }, [onSave, delay]);
            return [localData, updateData];
        };

        const LogLightbox = ({ log, onClose }) => {
            if (!log) return null;
            const qImages = log.questionImages?.length > 0 ? log.questionImages : (log.imageUrl ? [log.imageUrl] : []);
            const sImages = log.schemeImages?.length > 0 ? log.schemeImages : (log.markingSchemeUrl ? [log.markingSchemeUrl] : []);
            const rC = (src, i) => (<div key={i} className="relative group w-full flex justify-center">{src.includes('drive.google.com') ? <iframe src={src} className="w-full max-w-2xl h-[400px] rounded-xl shadow-ds bg-white" /> : <img src={src} className="max-w-full h-auto rounded-xl shadow-ds bg-white dark:bg-black" />}</div>);
            
            return (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex flex-col" onClick={onClose}>
                    <div className="flex-shrink-0 h-14 bg-zinc-900 border-b border-white/10 flex items-center justify-between px-4">
                        <h3 className="text-white font-bold text-sm truncate">{log.title}</h3>
                        <button onClick={onClose} className="p-2 bg-white/10 rounded-full text-white"><Icons.X className="w-5 h-5"/></button>
                    </div>
                    <div className="flex-1 overflow-hidden flex flex-col md:flex-row" onClick={e=>e.stopPropagation()}>
                         <div className="flex-1 overflow-y-auto p-4 space-y-4 border-b md:border-b-0 md:border-r border-white/10 bg-zinc-900/50">
                             <div className="text-xs font-bold text-zinc-400 uppercase tracking-wider sticky top-0 bg-zinc-900/90 py-2 z-10">Question</div>
                             {qImages.length ? qImages.map((src, i)=>rC(src,i)) : <div className="text-zinc-500 text-sm">No Question Image</div>}
                             <div className="text-zinc-300 text-sm p-4 bg-white/5 rounded-lg whitespace-pre-wrap">{log.questionText || "No Text"}</div>
                         </div>
                         <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-zinc-900/50">
                             <div className="text-xs font-bold text-zinc-400 uppercase tracking-wider sticky top-0 bg-zinc-900/90 py-2 z-10">Marking Scheme & Notes</div>
                             {sImages.length ? sImages.map((src, i)=>rC(src,i)) : <div className="text-zinc-500 text-sm">No Scheme Image</div>}
                             <div className="p-4 bg-indigo-500/10 border border-indigo-500/20 rounded-lg text-indigo-200 text-sm">
                                <strong className="block text-xs uppercase mb-1 text-indigo-400">Recall Point:</strong>
                                {log.explanation || "No analysis provided."}
                             </div>
                         </div>
                    </div>
                </div>
            );
        };

        const RecallWidget = ({ note, user, onOpenLog }) => {
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(false);
            
            useEffect(() => {
                if(!user || !note || !note.subject) return;
                const fetchRecall = async () => {
                    setLoading(true);
                    try {
                        let constraints = [
                            window.firebase.where('subject', '==', note.subject),
                            window.firebase.limit(10)
                        ];
                        if(note.topic) constraints.push(window.firebase.where('topic', '==', note.topic));
                        
                        const q = window.firebase.query(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), ...constraints);
                        const snap = await window.firebase.getDocs(q);
                        setLogs(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    } catch(e) { console.error("Recall Error", e); }
                    setLoading(false);
                };
                fetchRecall();
            }, [note?.subject, note?.topic, user]);

            if(!note.subject) return <div className="p-4 text-center text-zinc-500 text-sm">Tag this note with a Subject to see related mistakes.</div>;

            return (
                <div className="flex flex-col h-full bg-zinc-50 dark:bg-onyx border-l border-zinc-200 dark:border-white/5">
                     <div className="p-4 border-b border-zinc-200 dark:border-white/5 bg-white dark:bg-surface">
                         <h3 className="text-sm font-bold flex items-center gap-2 dark:text-white"><Icons.Brain className="w-4 h-4 text-rose-500"/> Recall Protocol</h3>
                         <p className="text-[10px] text-zinc-500 mt-1">Mistakes related to <strong>{note.subject}</strong></p>
                     </div>
                     <div className="flex-1 overflow-y-auto p-2 space-y-2">
                         {loading ? <div className="p-4 text-center text-zinc-400 text-xs animate-pulse">Scanning Neural Archives...</div> : 
                          logs.length === 0 ? <div className="p-8 text-center"><Icons.Check className="w-8 h-8 text-green-500 mx-auto mb-2 opacity-50"/><p className="text-xs text-zinc-500">Clean sheet! No recorded errors for this topic.</p></div> :
                          logs.map(log => (
                              <div key={log.id} onClick={()=>onOpenLog(log)} className="p-3 bg-white dark:bg-white/5 border border-zinc-200 dark:border-white/5 rounded-lg hover:border-rose-400 cursor-pointer group transition-all">
                                  <div className="flex justify-between items-start">
                                      <span className="text-xs font-semibold text-zinc-700 dark:text-zinc-300 line-clamp-2 group-hover:text-rose-500 transition-colors">{log.title}</span>
                                      {log.mastered ? <Icons.Check className="w-3 h-3 text-green-500 shrink-0"/> : <div className="w-2 h-2 rounded-full bg-rose-500 shrink-0 mt-1"></div>}
                                  </div>
                                  <div className="mt-2 flex items-center gap-2 text-[10px] text-zinc-400">
                                      <span className="bg-zinc-100 dark:bg-white/10 px-1.5 py-0.5 rounded">{log.questionType}</span>
                                      <span>{new Date(log.createdAt).toLocaleDateString()}</span>
                                  </div>
                              </div>
                          ))
                         }
                     </div>
                </div>
            );
        };

        const MindMapEditor = ({ data, onChange, onSaveToDrive }) => {
            const [nodes, setNodes] = useState(data.nodes || [{ id: 'root', text: 'Central Idea', x: 400, y: 300, color: '#4f46e5' }]);
            const [connections, setConnections] = useState(data.connections || []);
            const [draggingId, setDraggingId] = useState(null);
            const [editingId, setEditingId] = useState(null);
            const svgRef = useRef(null);

            const update = (newNodes, newConns) => {
                setNodes(newNodes);
                setConnections(newConns);
                onChange({ ...data, nodes: newNodes, connections: newConns });
            };

            const handleMouseDown = (e, id) => {
                e.stopPropagation();
                setDraggingId(id);
            };

            const handleMouseMove = (e) => {
                if (!draggingId) return;
                const rect = svgRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const newNodes = nodes.map(n => n.id === draggingId ? { ...n, x, y } : n);
                update(newNodes, connections);
            };

            const handleMouseUp = () => setDraggingId(null);

            const addNode = () => {
                const id = Date.now().toString();
                const newNode = { id, text: 'New Node', x: 400, y: 400, color: '#6366f1' };
                update([...nodes, newNode], connections);
            };

            const deleteNode = (id) => {
                if(id === 'root') return;
                const newNodes = nodes.filter(n => n.id !== id);
                const newConns = connections.filter(c => c.from !== id && c.to !== id);
                update(newNodes, newConns);
            };

            return (
                <div className="w-full h-full relative overflow-hidden bg-zinc-50 dark:bg-[#0c0c0c] mindmap-bg"
                    onMouseMove={handleMouseMove} onMouseUp={handleMouseUp}>
                    
                    <div className="absolute top-4 left-4 z-10 flex gap-2 bg-white dark:bg-zinc-800 p-2 rounded-lg shadow-ds border border-zinc-200 dark:border-zinc-700">
                        <button onClick={addNode} className="flex items-center gap-2 px-3 py-1.5 bg-indigo-600 text-white rounded-md text-sm font-bold shadow hover:bg-indigo-500">
                            <Icons.Plus className="w-4 h-4" /> Add Node
                        </button>
                    </div>

                    <div ref={svgRef} className="w-full h-full relative">
                        <svg className="w-full h-full absolute inset-0 pointer-events-none">
                            {connections.map((conn, i) => {
                                const from = nodes.find(n => n.id === conn.from);
                                const to = nodes.find(n => n.id === conn.to);
                                if (!from || !to) return null;
                                return (
                                    <line key={i} x1={from.x} y1={from.y} x2={to.x} y2={to.y} 
                                        stroke="#94a3b8" strokeWidth="2" strokeOpacity="0.5" />
                                );
                            })}
                        </svg>

                        {nodes.map(node => (
                            <motion.div
                                key={node.id}
                                initial={{ scale: 0 }} animate={{ scale: 1 }}
                                style={{ left: node.x, top: node.y, x: '-50%', y: '-50%', backgroundColor: node.id === 'root' ? '#4f46e5' : '#ffffff' }}
                                className={`absolute cursor-move min-w-[120px] p-3 rounded-xl shadow-lg border-2 flex flex-col items-center gap-2 group
                                            ${node.id === 'root' ? 'border-indigo-600 text-white' : 'border-zinc-200 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200'}`}
                                onMouseDown={(e) => handleMouseDown(e, node.id)}
                                onDoubleClick={() => setEditingId(node.id)}
                            >
                                {editingId === node.id ? (
                                    <input autoFocus 
                                        value={node.text} 
                                        onChange={(e) => update(nodes.map(n => n.id === node.id ? { ...n, text: e.target.value } : n), connections)}
                                        onBlur={() => setEditingId(null)}
                                        onKeyDown={(e) => e.key === 'Enter' && setEditingId(null)}
                                        className="bg-transparent text-center text-sm font-bold outline-none min-w-[100px] dark:text-white"
                                    />
                                ) : (
                                    <span className="text-sm font-bold text-center select-none">{node.text}</span>
                                )}
                                
                                {node.id !== 'root' && (
                                    <div className="absolute -top-3 -right-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onClick={() => deleteNode(node.id)} className="bg-red-500 text-white p-1 rounded-full shadow-sm"><Icons.X className="w-3 h-3"/></button>
                                    </div>
                                )}
                            </motion.div>
                        ))}
                    </div>
                </div>
            );
        };

                             <button onClick={() => setIsPreviewMode(!isPreviewMode)} className={`flex items-center gap-1 px-2 py-1 rounded-full text-xs font-bold transition-all ${isPreviewMode ? 'bg-emerald-600 text-white' : 'bg-zinc-200 dark:bg-white/10 text-zinc-600 dark:text-zinc-400'}`}><Icons.Eye className="w-3 h-3"/> {isPreviewMode ? 'Edit' : 'Math View'}</button>
                        </div>
                        <div className="flex gap-0.5 border-l border-zinc-300 dark:border-white/20 pl-2 mx-1">
                            <button onClick={() => html2pdf().set({ margin:0.5, filename:`darnote-${noteId}.pdf`, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2}, jsPDF:{unit:'in',format:'letter',orientation:'portrait'}}).from(editorRef.current.getBody()).save()} className="p-1 rounded hover:bg-[#dbedff] dark:hover:bg-white/10 text-zinc-700 dark:text-zinc-300"><Icons.Pdf className="w-4 h-4"/></button>
                            <div className="flex items-center gap-1 ml-1 bg-zinc-200 dark:bg-white/5 p-0.5 rounded"><button onClick={() => handleDriveSave(false)} className="p-1 rounded hover:bg-[#dbedff] dark:hover:bg-white/10 text-zinc-700 dark:text-zinc-300"><Icons.Drive className="w-4 h-4"/></button></div>
                        </div>
                    </div>
                    <div className="flex-1 overflow-hidden relative h-full w-full">
                        <textarea id="tinymce-editor"></textarea>
                        {isPreviewMode && editorRef.current && ( <div className="absolute inset-0 z-40 bg-white dark:bg-onyx overflow-y-auto p-8 message-content" id="math-preview-container" dangerouslySetInnerHTML={{ __html: editorRef.current.getContent() }}></div> )}
                    </div>
                    <div className="bg-white dark:bg-zinc-900 border-t border-zinc-200 dark:border-white/10 px-4 py-1.5 text-xs text-zinc-500 flex justify-end items-center gap-4 z-30 shrink-0">
                        <div className="flex items-center gap-1.5 min-w-[80px] justify-end">{saveStatus === 'Saved' ? <span className="text-zinc-400 flex items-center gap-1"><Icons.Check className="w-3 h-3"/> Saved</span> : saveStatus === 'Saving...' ? <span className="text-indigo-500 font-bold flex items-center gap-1"><Icons.Loader className="w-3 h-3"/> Saving...</span> : <span className="text-zinc-400 flex items-center gap-1"><Icons.Edit className="w-3 h-3"/> Typing...</span>}</div>
                        <div className="h-3 w-px bg-zinc-300 dark:bg-white/20"></div><div>{wordCount} words</div>
                    </div>
                </div>
            );
        };
        
        const AIChatInterface = ({ activeNote, initialQuery, onClose, user }) => {
            const [messages, setMessages] = useState([{role: 'ai', text: 'Hi! Ask me anything about your note.', type: 'text'}]);
            const [input, setInput] = useState(initialQuery || ''); const [loading, setLoading] = useState(false);
            const [model, setModel] = useState('gemini'); const messagesEndRef = useRef(null);
            
            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
            
            const handleSend = async () => {
                if(!input.trim()) return;
                await checkAndIncrementQuota(user, 'chat', model); // Silent check for now
                const userMsg = { role: 'user', text: input };
                setMessages(prev => [...prev, userMsg]); setInput(''); setLoading(true);
                try {
                    const ctx = `Active Note: ${activeNote.title}. Content: ${activeNote.content?.substring(0, 1000)}`;
                    const res = model === 'groq' ? await callGroq(userMsg.text, `Context: ${ctx}`) : await callAI(userMsg.text, `Context: ${ctx}`);
                    setMessages(prev => [...prev, { role: 'ai', text: res, type: 'text' }]);
                } catch (e) { setMessages(prev => [...prev, { role: 'ai', text: "Error.", type: 'text' }]); } finally { setLoading(false); }
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-onyx">
                    <div className="p-4 border-b border-zinc-200 dark:border-white/10 flex flex-col gap-3 bg-zinc-50 dark:bg-zinc-900">

                         <div className="flex bg-zinc-200 dark:bg-black/20 p-1 rounded-lg">
                            <button onClick={()=>setModel('gemini')} className={`flex-1 py-1.5 rounded-md text-[10px] font-bold ${model==='gemini' ? 'bg-white dark:bg-zinc-700 shadow-sm text-indigo-600 dark:text-white' : 'text-zinc-500'}`}>Gemini</button>
                            <button onClick={()=>setModel('groq')} className={`flex-1 py-1.5 rounded-md text-[10px] font-bold ${model==='groq' ? 'bg-white dark:bg-zinc-700 shadow-sm text-green-600 dark:text-white' : 'text-zinc-500'}`}>ChatGPT</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-zinc-100 dark:bg-zinc-800 rounded-bl-none'}`}>
                                    <MessageBubble text={m.text} isUser={m.role === 'user'} />
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-xs text-zinc-500 animate-pulse">Thinking...</div>}<div ref={messagesEndRef} />
                    </div>
                    <div className="p-4 border-t border-zinc-200 dark:border-white/10 bg-white dark:bg-zinc-900 flex gap-2">
                        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter' && handleSend()} placeholder="Ask AI..." className="flex-1 bg-zinc-100 dark:bg-zinc-800 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500"/>
                        <button onClick={handleSend} disabled={loading} className="bg-indigo-600 text-white rounded-full p-2"><Icons.Plus className="w-4 h-4 rotate-90"/></button>
                    </div>
                </div>
            )
        }
        
        const SidebarButton = ({ active, icon: Icon, onClick, children }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-r-full text-sm font-medium transition-colors ${active ? 'bg-brand/10 text-brand dark:text-indigo-400 font-bold border-l-4 border-brand' : 'text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-zinc-200'}`}>
                {Icon && <Icon className="w-5 h-5"/>} {children}
            </button>
        );

        // ==========================================
        // MAIN APP
        // ==========================================
        
        const App = () => {

            const [showStudentModal, setShowStudentModal] = useState(false); const [showSupportMenu, setShowSupportMenu] = useState(false);
            const [logSearchResults, setLogSearchResults] = useState([]);

                return () => { pSub(); sSub(); }; 
            }, [user]);

            useEffect(() => { document.documentElement.classList.toggle('dark', isDarkMode); }, [isDarkMode]);
            useEffect(() => { const c = (e) => { if (!e.target.closest('.context-menu')) setContextMenu(null); }; window.addEventListener('mousedown', c); return () => window.removeEventListener('mousedown', c); }, []);

            // NOTES FETCHING
            const fetchNotes = async (loadMore = false) => {
                if (!user) return; 
                try {
                    const db = window.firebase.db; const ref = window.firebase.collection(db, 'artifacts', "darnote-app", 'users', user.uid, 'notes');
                    let c = [];
                    if (filter === 'favorites') c.push(window.firebase.where('isFavorite', '==', true));
                    if (filter.startsWith('subject:')) c.push(window.firebase.where('subject', '==', filter.split(':')[1]));
                    c.push(window.firebase.orderBy('updatedAt', 'desc'));
                    c.push(window.firebase.limit(20));
                    const q = window.firebase.query(ref, ...c);
                    const s = await window.firebase.getDocs(q);
                    const f = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    setNotes(f);
                } catch(e) { console.error("Fetch Error", e); }
            };

            useEffect(() => { if(user) { fetchNotes(false); } }, [filter, user]);
            useEffect(() => { if(!user || !activeNoteId) return; const u = window.firebase.onSnapshot(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes', activeNoteId), (d) => { if(d.exists()) setNotes(p => p.map(n => n.id === activeNoteId ? { ...n, ...d.data() } : n)); }); return () => u(); }, [activeNoteId]);

            // OMNI-SEARCH
            useEffect(() => {
                if(!user || searchQuery.length < 3) { setLogSearchResults([]); return; }
                const delayDebounceFn = setTimeout(async () => {
                    try {
                        const logsRef = window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs');
                        const q = window.firebase.query(logsRef, window.firebase.where('title', '>=', searchQuery), window.firebase.where('title', '<=', searchQuery + '\uf8ff'), window.firebase.limit(5));
                        const snap = await window.firebase.getDocs(q);
                        setLogSearchResults(snap.docs.map(d => ({id: d.id, ...d.data(), type: 'log'})));
                    } catch(e) { console.warn("Log search failed:", e); }
                }, 500);
                return () => clearTimeout(delayDebounceFn);
            }, [searchQuery, user]);

            const filteredNotes = useMemo(() => { 
                let r = notes; 
                if (searchQuery.trim()) { 
                    const q = searchQuery.toLowerCase(); 
                    r = r.filter(n => n.title.toLowerCase().includes(q)); 
                } 
                return r; 
            }, [notes, searchQuery]);

            const createNote = async (type = 'text') => { if(!user) return; const n = { type, title: '', content: type === 'text' ? '' : null, nodes: type === 'mindmap' ? [{id: 'root', text: 'Central Idea', x: 400, y: 300, color: '#4f46e5'}] : null, connections: type==='mindmap'?[]:null, tasks: type==='tasklist'?[]:null, tags: [], subject: filter.startsWith('subject:') ? filter.split(':')[1] : 'General', updatedAt: new Date().toISOString(), isFavorite: false, isPinned: false, ownerId: user.uid }; const d = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes'), n); setActiveNoteId(d.id); if (!isSidebarOpen) setIsSidebarOpen(true); fetchNotes(false); };
            const updateNote = async (id, u) => { const n = notes.find(n => n.id === id); if(!n) return; await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes', id), { ...u, updatedAt: new Date().toISOString() }); };
            const deleteNote = async (id) => { await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes', id)); if (activeNoteId === id) setActiveNoteId(null); setNotes(p => p.filter(n => n.id !== id)); };
            const handleContextMenu = (e, t, d) => { e.preventDefault(); setContextMenu({ x: e.clientX, y: e.clientY, type: t, data: d }); };
            const handleMagicInsert = (content) => { if (activeNoteId) { const insertFn = window[`insert_note_${activeNoteId}`]; if (insertFn) insertFn(content); } };

            const addTopicToSubject = async (subjectName) => {
                const subjectDoc = subjects.find(s => s.name === subjectName);
                if (!subjectDoc) { alert("Cannot add topic to General."); return; }
                const newTopic = prompt(`Add topic for ${subjectName}:`);
                if (!newTopic) return;
                setSubjects(prev => prev.map(s => s.id === subjectDoc.id ? {...s, topics: [...s.topics, newTopic]} : s));
                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'subjects', subjectDoc.id);
                await window.firebase.updateDoc(docRef, { topics: window.firebase.arrayUnion(newTopic) });
            };

            if (isAuthLoading) return <div className="flex h-screen items-center justify-center bg-black"><div className="w-12 h-12 rounded-full border-4 border-white border-t-transparent animate-spin"></div></div>;
            if (!user) return <div className="flex h-screen w-full items-center justify-center bg-black text-white p-4 relative overflow-hidden"><div className="absolute top-[-50%] left-[-50%] w-[200%] h-[200%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-800/20 via-black to-black animate-spin-slow"></div><div className="z-10 text-center"><h1 className="text-4xl font-bold mb-4">darNote</h1><button onClick={()=>window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-white text-black px-6 py-3 rounded-full font-bold">Sign In with Google</button></div></div>;

            const activeNote = notes.find(n => n.id === activeNoteId);
            const isVerified = profile?.studentStatus === 'verified' || profile?.studentStatus === 'temp_verified';
            const currentSubject = activeNote ? subjects.find(s => s.name === activeNote.subject) : null;

            return (
                <div className={`flex flex-col h-screen w-full transition-colors duration-300 ${isDarkMode ? 'dark bg-onyx text-zinc-100' : 'bg-light-bg text-zinc-900'} overflow-hidden`}>
                    
                    {/* GLOBAL HEADER (Google Workspace Style) */}
                    <header className="bg-white dark:bg-surface border-b border-zinc-200 dark:border-white/5 h-16 flex items-center justify-between px-4 z-40 shrink-0">
                        <div className="flex items-center gap-3">
                             <button onClick={() => window.innerWidth < 1024 ? setIsMobileMenuOpen(!isMobileMenuOpen) : setIsSidebarOpen(!isSidebarOpen)} className="p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-white/10 text-zinc-500">
                                <Icons.Menu className="w-6 h-6"/>
                            </button>
                            <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-8 h-8 rounded-lg shadow-sm hidden md:block"/>
                            <span className="text-lg font-bold tracking-tight">darNote</span>

                                 <Icons.Search className="w-5 h-5 text-zinc-500 mr-3"/>

                             </div>
                        </div>

                        <div className="flex items-center gap-2">
                             <button onClick={() => setShowStudentModal(true)} className="hidden md:flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold text-indigo-600 bg-indigo-50 dark:bg-indigo-900/20 dark:text-indigo-400 hover:bg-indigo-100 transition-all">
                                <Icons.GraduationCap className="w-4 h-4"/> Education
                            </button>
                            <button onClick={()=>setIsDarkMode(!isDarkMode)} className="p-2 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-white/5 rounded-full transition-colors" title="Toggle Mode">
                                {isDarkMode ? <Icons.Sun className="w-5 h-5"/> : <Icons.Moon className="w-5 h-5"/>}

                                {showSupportMenu && (

                                        <a href="mailto:darnote@3-shot.com" className="block px-4 py-2 text-sm text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-white/5">Email Support</a>
                                        <a href="http://linkedin.com/company/darnote" target="_blank" className="block px-4 py-2 text-sm text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-white/5">LinkedIn</a>

                            <button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="p-2 text-zinc-500 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 rounded-full transition-colors"><Icons.Logout className="w-5 h-5"/></button>
                        </div>
                    </header>

                    <div className="flex-1 flex overflow-hidden relative">
                        {/* LEFT SIDEBAR (Collapsible on Mobile) */}
                        <AnimatePresence>

                                        </div>
                                    </div>
                                    {/* Mobile Close Button Overlay if needed, or rely on hamburger toggle */}
                                    <button onClick={() => setIsMobileMenuOpen(false)} className="lg:hidden absolute top-4 right-4 p-2"><Icons.X className="w-6 h-6"/></button>
                                </motion.div>
                            )}
                        </AnimatePresence>
                        
                        {/* NOTE LIST (Hidden on mobile when note active) */}
                        <div className={`flex-shrink-0 border-r border-zinc-200 dark:border-white/5 bg-light-surface dark:bg-surface flex flex-col z-10 w-full lg:w-[350px] ${activeNoteId ? 'hidden' : 'flex'} ${isSidebarOpen ? 'lg:flex' : 'lg:hidden'}`}>
                             <div className="p-4 border-b border-zinc-200 dark:border-white/5 space-y-4">
                                <div className="flex justify-between items-center">
                                    <div className="flex bg-zinc-100 dark:bg-black/20 rounded-lg p-0.5"><button onClick={() => setViewMode('list')} className={`p-1.5 rounded ${viewMode === 'list' ? 'bg-white dark:bg-white/10 shadow-sm' : 'text-zinc-400'}`}><Icons.List className="w-4 h-4"/></button><button onClick={() => setViewMode('grid')} className={`p-1.5 rounded ${viewMode === 'grid' ? 'bg-white dark:bg-white/10 shadow-sm' : 'text-zinc-400'}`}><Icons.Grid className="w-4 h-4"/></button></div>
                                    <div className="flex gap-2"><button onClick={() => createNote('mindmap')} className="p-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-white/10 text-zinc-400"><Icons.Network className="w-4 h-4" /></button><button onClick={() => createNote('tasklist')} className="p-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-white/10 text-zinc-400"><Icons.CheckSquare className="w-4 h-4" /></button><button onClick={() => createNote('text')} className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-brand text-white text-sm font-bold shadow hover:bg-indigo-500"><Icons.Plus className="w-4 h-4" /> New</button></div>
                                </div>
                            </div>
                            <div className={`flex-1 overflow-y-auto p-3 ${viewMode === 'grid' ? 'grid grid-cols-2 gap-2' : 'space-y-2'}`}>
                                {logSearchResults.length > 0 && (

                                        <div className="text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2 px-2">Recall (Errors)</div>
                                        {logSearchResults.map(log => (
                                            <div key={log.id} onClick={()=>setViewingLog(log)} className="px-3 py-2 bg-rose-50 dark:bg-rose-900/10 border border-rose-100 dark:border-rose-900/30 rounded-lg cursor-pointer hover:bg-rose-100 dark:hover:bg-rose-900/20 mb-2">
                                                <div className="text-xs font-bold text-rose-600 dark:text-rose-400 truncate">{log.title}</div>
                                                <div className="text-[10px] text-zinc-500">{log.subject}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {filteredNotes.map(n => (
                                    <div key={n.id} onClick={() => setActiveNoteId(n.id)} onContextMenu={(e) => handleContextMenu(e, 'note', n.id)} className={`rounded-xl cursor-pointer border transition-all relative overflow-hidden group ${activeNoteId === n.id ? 'bg-indigo-50 dark:bg-white/5 border-indigo-200 dark:border-white/10 shadow-sm' : 'bg-transparent border-transparent hover:bg-zinc-50 dark:hover:bg-white/5'} ${viewMode === 'grid' ? 'p-4 aspect-square flex flex-col' : 'p-4'}`}>
                                        <div className="absolute top-2 right-2 flex gap-1">{n.isPinned && <Icons.Pin className="w-3 h-3 text-indigo-500" />}{n.isFavorite && <Icons.Star className="w-3 h-3 text-yellow-500 fill-yellow-500" />}</div>
                                        <div className="font-semibold text-sm truncate mb-2 dark:text-zinc-200 pr-6">{n.title || 'Untitled'}</div>
                                        <p className="text-xs text-zinc-500 line-clamp-3 leading-relaxed">{n.type==='mindmap'?'Mind Map':n.type==='tasklist'?`${n.tasks?.filter(t=>t.completed).length||0}/${n.tasks?.length||0} Tasks`:(n.content ? n.content.replace(/<[^>]*>/g, '') : 'Empty')}</p>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* MAIN EDITOR */}
                        <main className={`flex-1 flex flex-col relative bg-light-bg dark:bg-onyx min-w-0 transition-transform duration-300 ${!activeNoteId ? 'hidden lg:flex' : 'flex'}`}>
                            {activeNote ? (
                                <>
                                    <header className="h-16 flex items-center justify-between px-4 lg:px-6 border-b border-zinc-200 dark:border-white/5 bg-white dark:bg-surface z-20 shrink-0 sticky top-0">
                                        <div className="flex items-center gap-3 w-full">
                                            {/* Mobile Back Button */}
                                            <button onClick={() => setActiveNoteId(null)} className="lg:hidden p-2 -ml-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white"><Icons.ChevronLeft className="w-5 h-5"/></button>
                                            <input value={activeNote.title} onChange={(e) => updateNote(activeNote.id, { title: e.target.value })} placeholder="Untitled Note" className="bg-transparent text-lg font-bold text-zinc-900 dark:text-white placeholder-zinc-300 dark:placeholder-zinc-700 focus:outline-none w-full max-w-md truncate" />
                                        </div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            {/* Subject & Topic Dropdowns (Hidden on small mobile, simplified) */}
                                            <div className="hidden md:flex items-center gap-2 mr-2">
                                                <select value={activeNote.subject || 'General'} onChange={(e)=>updateNote(activeNote.id, {subject: e.target.value, topic: ''})} className="bg-transparent text-xs font-bold text-zinc-500 uppercase cursor-pointer outline-none hover:text-indigo-500"><option value="General">General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select>
                                                {activeNote.subject && activeNote.subject !== 'General' && (
                                                    <div className="flex items-center gap-1">
                                                        <span className="text-zinc-300">/</span>
                                                        <select value={activeNote.topic || ''} onChange={(e)=>updateNote(activeNote.id, {topic: e.target.value})} className="bg-transparent text-xs text-zinc-500 cursor-pointer outline-none hover:text-indigo-500 max-w-[120px]">
                                                            <option value="">-- Topic --</option>
                                                            {currentSubject?.topics.map(t=><option key={t} value={t}>{t}</option>)}
                                                        </select>
                                                        <button onClick={() => addTopicToSubject(activeNote.subject)} className="w-5 h-5 flex items-center justify-center rounded hover:bg-zinc-100 dark:hover:bg-white/10 text-zinc-400"><Icons.Plus className="w-3 h-3"/></button>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="h-4 w-px bg-zinc-300 dark:bg-white/10 mx-1"></div>
                                            <button onClick={() => updateNote(activeNote.id, { isPinned: !activeNote.isPinned })} className={`p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-white/10 ${activeNote.isPinned ? 'text-indigo-500' : 'text-zinc-500'}`}><Icons.Pin className="w-5 h-5"/></button>
                                            <button onClick={() => setRightSidebarMode(rightSidebarMode === 'recall' ? 'closed' : 'recall')} className={`p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-white/10 ${rightSidebarMode === 'recall' ? 'text-rose-500 bg-rose-50 dark:bg-rose-500/10' : 'text-zinc-500'}`} title="Recall Protocol"><Icons.Brain className="w-5 h-5"/></button>
                                            <button onClick={() => setRightSidebarMode(rightSidebarMode === 'ai' ? 'closed' : 'ai')} className={`p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-white/10 ${rightSidebarMode === 'ai' ? 'text-indigo-500 bg-indigo-50 dark:bg-indigo-500/10' : 'text-zinc-500'}`} title="AI Assistant"><Icons.Bot className="w-5 h-5"/></button>
                                        </div>
                                    </header>
                                    <div className="flex-1 overflow-hidden relative bg-[#f0f2f5] dark:bg-[#0c0c0c] flex flex-col">
                                        <ErrorBoundary key={activeNote.id}>
                                            {activeNote.type === 'mindmap' ? <div className="h-full w-full"><MindMapEditor data={activeNote} onChange={(u) => updateNote(activeNote.id, u)} onSaveToDrive={saveToDrive} /></div> : activeNote.type === 'tasklist' ? <TaskEditor data={activeNote} onChange={(u) => updateNote(activeNote.id, u)} onSaveToDrive={saveToDrive} /> : <TinyMCEEditor initialContent={activeNote.content} noteId={activeNote.id} noteTitle={activeNote.title} onSave={(h) => updateNote(activeNote.id, { content: h })} onSaveToDrive={saveToDrive} isDarkMode={isDarkMode} onContextMenu={(e, t, c) => handleContextMenu(e, 'text', { text: t, callback: c })} saveToDriveFunction={saveToDrive} onMagicClick={()=>setShowMagicModal(true)}/>}
                                        </ErrorBoundary>
                                    </div>
                                </>
                            ) : <div className="flex-1 flex items-center justify-center text-zinc-400 flex-col"><div className="w-16 h-16 bg-zinc-200 dark:bg-white/5 rounded-2xl flex items-center justify-center mb-4"><Icons.Edit className="w-8 h-8 opacity-50"/></div><div className="text-xl font-bold mb-2 dark:text-white">No Note Selected</div></div>}
                            
                            {/* RIGHT SIDEBAR (AI & RECALL) */}
                            <AnimatePresence>
                                {rightSidebarMode !== 'closed' && (
                                    <motion.div initial={{ x: '100%' }} animate={{ x: 0 }} exit={{ x: '100%' }} transition={{type:'spring', damping: 25, stiffness: 300}} className="w-[350px] bg-white dark:bg-surface border-l border-zinc-200 dark:border-white/10 absolute right-0 top-0 bottom-0 z-30 shadow-2xl flex flex-col">
                                        <div className="flex-none flex justify-between p-2 border-b border-zinc-200 dark:border-white/5">
                                            <div className="flex gap-1">
                                                <button onClick={()=>setRightSidebarMode('ai')} className={`px-3 py-1.5 rounded text-xs font-bold ${rightSidebarMode==='ai'?'bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300':'text-zinc-500'}`}>AI Chat</button>
                                                <button onClick={()=>setRightSidebarMode('recall')} className={`px-3 py-1.5 rounded text-xs font-bold ${rightSidebarMode==='recall'?'bg-rose-100 text-rose-600 dark:bg-rose-900/50 dark:text-rose-300':'text-zinc-500'}`}>Recall</button>
                                            </div>
                                            <button onClick={()=>setRightSidebarMode('closed')}><Icons.X className="w-4 h-4 text-zinc-500"/></button>
                                        </div>
                                        <div className="flex-1 overflow-hidden relative">
                                            {rightSidebarMode === 'ai' ? (
                                                <AIChatInterface activeNote={activeNote || {}} initialQuery="" onClose={() => setRightSidebarMode('closed')} user={user} />
                                            ) : (
                                                <RecallWidget note={activeNote || {}} user={user} onOpenLog={setViewingLog} />
                                            )}
                                        </div>
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        </main>
                    </div>

                    {showMagicModal && <MagicNoteModal user={user} onClose={()=>setShowMagicModal(false)} onInsert={handleMagicInsert} />}
                    {showStudentModal && <StudentModal isOpen={showStudentModal} onClose={()=>setShowStudentModal(false)} user={user} saveToDrive={saveToDrive} getAccessToken={getAccessToken} callGroq={callGroq} />}
                    <AnimatePresence>{viewingLog && <LogLightbox log={viewingLog} onClose={()=>setViewingLog(null)} />}</AnimatePresence>
                    
                    {contextMenu && (
                        <div style={{ top: contextMenu.y, left: contextMenu.x }} className="fixed z-50 w-56 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-white/10 rounded-lg shadow-2xl py-1 context-menu">
                            {contextMenu.type === 'text' ? (
                                <>
                                    <div className="px-4 py-2 text-xs text-zinc-500 font-semibold bg-zinc-50 dark:bg-white/5 uppercase">Selection</div>
                                    <button onClick={() => {navigator.clipboard.writeText(contextMenu.data.text); setContextMenu(null);}} className="w-full text-left px-4 py-2.5 text-sm dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10">Copy</button>
                                    <button onClick={() => {setRightSidebarMode('ai'); setContextMenu(null);}} className="w-full text-left px-4 py-2.5 text-sm text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10">Ask AI</button>
                                </>
                            ) : (
                                <button onClick={() => {deleteNote(contextMenu.data); setContextMenu(null);}} className="w-full text-left px-4 py-2 text-sm text-red-500 hover:bg-red-50">Delete</button>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
