        Google:p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10 10-10 10z"/><path d="M12 11h9c.1 1.4.1 2.9-.4 4.3-1.1 3-4.1 5.3-7.6 5.6-5 .5-9.4-3.1-9.9-8.1C2.5 7.1 6 2.3 11 2c2.5-.1 4.9.9 6.7 2.6l-2.7 2.8c-1-.7-2.3-1.1-3.6-1-2.9.2-5.1 2.8-4.9 5.7.2 2.6 2.4 4.7 5 4.7 2 0 3.6-1.1 4.3-2.9H12v-3z" fill="currentColor"/></svg>,
        Upload:p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
        TrendingUp:p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
        Clock:p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        Plus:p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
        Filter:p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,

        ChevronRight:p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>
    };

    const COLORS = ['#4f46e5', '#06b6d4', '#f97316', '#ec4899', '#8b5cf6', '#10b981'];

    const getLimits = async (uid) => {
        const defaults = { analysis: 1, ocr: 20 };
        try {
            const profileRef = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', uid, 'settings', 'profile');
            const snap = await window.firebase.getDoc(profileRef);
            if(snap.exists() && (snap.data().studentStatus === 'verified' || snap.data().studentStatus === 'temp_verified')) {
                return { analysis: 2, ocr: 40 };
            }
        } catch(e) {}
        return defaults;
    };

    const checkQuota = async (user, type) => {
        const limits = await getLimits(user.uid);
        const today = new Date().toISOString().split('T')[0];
        const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today);
        const field = type === 'analysis' ? 'analysis_count' : 'ocr_count';
        try {
            const snap = await window.firebase.getDoc(ref);
            const current = snap.exists() ? (snap.data()[field] || 0) : 0;
            const limit = type === 'analysis' ? limits.analysis : limits.ocr;
            if (current >= limit) return false;
            await window.firebase.setDoc(ref, { [field]: window.firebase.increment(1) }, { merge: true });
            return { current: current + 1, limit };
        } catch(e) { return false; }
    };

    const callAI = async (prompt) => {
        const payload = { contents: [{ parts: [{ text: prompt }] }] };
        try {
            const response = await fetch(GEMINI_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "No advice generated.";
        } catch (e) { return "Error contacting AI counselor."; }
    };
    
    const callGroqVision = async (prompt, imageBase64) => {
        const userContent = [
            { type: "text", text: prompt },
            { type: "image_url", image_url: { url: imageBase64 } }
        ];
        const payload = {
            model: "llama-3.2-90b-vision-preview",
            messages: [{ role: "user", content: userContent }]
        };
        try {
            const response = await fetch(GROQ_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            return data.choices?.[0]?.message?.content || "";
        } catch (error) { return null; }
    };

    const Views = { ANALYSIS: 'analysis', CORRELATION: 'correlation', INPUT: 'input' };

    const Sidebar = ({ isDarkMode, setIsDarkMode, user, studentStatus, currentView, onChangeView }) => (

                    </div>
                </div>
                
                <div>
                     <div className="px-4 text-[11px] font-bold text-zinc-500 dark:text-zinc-400 mb-2 uppercase tracking-widest mt-6">Workspaces</div>
                     <div className="space-y-1">
                        {[
                            { id: Views.ANALYSIS, icon: Icons.Activity, label: "Insight Deck" },
                            { id: Views.CORRELATION, icon: Icons.TrendingUp, label: "Compare Data" },
                            { id: Views.INPUT, icon: Icons.Clock, label: "Time Logger" }
                        ].map(item => (
                            <button key={item.id} onClick={() => onChangeView(item.id)} 
                                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 
                                ${currentView === item.id 
                                    ? 'bg-brand/5 dark:bg-brand/10 text-brand dark:text-indigo-400 font-bold ring-1 ring-brand/10' 
                                    : 'text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-white'}`}>
                                <item.icon className={`w-5 h-5 transition-transform duration-200 ${currentView === item.id ? 'text-brand dark:text-indigo-400' : ''}`}/> 
                                <span>{item.label}</span>

                        ))}

                <div className="pt-4 border-t border-zinc-200 dark:border-white/5">

                    <div className="overflow-hidden">

                            {studentStatus === 'temp_verified' && <Icons.ShieldClock className="w-3 h-3 text-orange-500" title="Under Review"/>}

                        {isDarkMode ? <><Icons.Sun className="w-3 h-3"/> Light</> : <><Icons.Moon className="w-3 h-3"/> Dark</>}
                    </button>
                    <button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="px-3 btn-ghost py-2 rounded-lg text-red-500 border border-transparent hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors">

    );
    
    const MobileNav = ({ currentView, onChangeView }) => (
        <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-zinc-900 border-t border-zinc-200 dark:border-white/10 p-2 flex justify-around z-50 safe-area-pb">

            </button>

    );

    const StatCard = ({ label, value, sub, icon: Icon, color }) => (
        <div className={`${STYLES.card} flex items-center gap-4 relative overflow-hidden group hover:scale-[1.02] transition-transform duration-300`}>
            <div className={`p-3 rounded-xl ${color} text-white shadow-lg`}>
                <Icon className="w-6 h-6"/>
            </div>
            <div>
                <div className={STYLES.statLabel}>{label}</div>
                <div className={STYLES.statValue}>{value}</div>
                <div className="text-[10px] text-zinc-500 dark:text-zinc-400 mt-0.5">{sub}</div>
            </div>
            <div className={`absolute -right-4 -bottom-4 w-24 h-24 rounded-full opacity-10 ${color}`}></div>
        </div>
    );

    const AIAdvicePanel = ({ data, user, studentStatus }) => {
        const [advice, setAdvice] = useState(null);
        const [loading, setLoading] = useState(false);
        const [quota, setQuota] = useState(null);

        const generateAdvice = async () => {
            setLoading(true);
            const qCheck = await checkQuota(user, 'analysis');
            if (qCheck === false) {
                setAdvice("Daily Analysis Limit Reached. Come back tomorrow for fresh insights.");
                setLoading(false);
                return;
            }
            setQuota(qCheck);
            const topSubject = data.subjects[0];
            const topTopics = data.topics.slice(0,3).map(t => `${t.name} (${t.value})`).join(', ');
            const total = data.total;
            const prompt = `Act as an expert, optimistic academic counselor. Analyze this student's error log data:
            Total Errors: ${total}.
            Main Struggle: ${topSubject?.name} (${topSubject?.value} errors).
            Top 3 Problem Topics: ${topTopics}.
            Study Hours Stats: ${JSON.stringify(data.studySubjects)}.
            Provide a clear, structured, 3-point strategy plan. Do not roast the student. Be professional and encouraging. 
            Format nicely with Markdown. Keep it under 150 words.`;
            const res = await callAI(prompt);
            setAdvice(res);
            setLoading(false);
        };

        return (
            <div className={`${STYLES.card} col-span-1 lg:col-span-2 relative overflow-hidden`}>
                <div className="flex justify-between items-start mb-4">
                    <div className="flex items-center gap-2">
                        <div className="p-2 bg-indigo-500/10 rounded-lg text-indigo-500"><Icons.Brain className="w-5 h-5"/></div>
                        <div>
                            <h3 className="font-bold text-zinc-900 dark:text-white text-sm">AI Strategic Counselor</h3>
                            <p className="text-[10px] text-zinc-500 dark:text-zinc-400">Get a personalized attack plan based on your data.</p>
                        </div>
                    </div>
                    {!advice && (
                        <button onClick={generateAdvice} disabled={loading} className="px-4 py-2 bg-brand text-white text-xs font-bold rounded-lg hover:bg-indigo-600 transition-colors flex items-center gap-2 shadow-lg disabled:opacity-50">
                            {loading ? <div className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"/> : <Icons.Zap className="w-3 h-3"/>}
                            {loading ? "Analyzing..." : "Generate Strategy"}
                        </button>
                    )}
                </div>
                <div className="bg-zinc-50 dark:bg-black/20 rounded-xl p-4 min-h-[120px] text-sm text-zinc-600 dark:text-zinc-300 border border-zinc-100 dark:border-white/5">
                    {advice ? (
                        <div className="markdown-body space-y-2 animate-in fade-in slide-in-from-bottom-2 duration-500">
                            <div dangerouslySetInnerHTML={{ __html: marked.parse(advice) }} />
                            {quota && <div className="mt-4 pt-2 border-t border-zinc-200 dark:border-white/10 text-[10px] text-zinc-400 text-right">Daily Quota: {quota.current}/{quota.limit} used</div>}
                        </div>
                    ) : (
                        <div className="flex flex-col items-center justify-center h-full text-zinc-400 gap-2">
                            <Icons.Layout className="w-8 h-8 opacity-20"/>
                            <span className="text-xs">Click generate to analyze your recent {data.total} logged mistakes.</span>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const Heatmap = ({ logs, isDarkMode }) => {
        const days = useMemo(() => {
            const res = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date(); d.setDate(d.getDate() - i);
                const iso = d.toLocaleDateString('sv');
                const display = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const count = logs.filter(l => {
                    if(!l.createdAt) return false;

        const [isSubmitting, setIsSubmitting] = useState(false);
        const [ocrStatus, setOcrStatus] = useState('');
        const [ocrFiles, setOcrFiles] = useState([]);

        const handleManualSubmit = async () => {
            if(!manualDate || !manualHours || !manualSubject) return alert("Fill all fields");
            setIsSubmitting(true);
            try {
                // Upsert logic for manual entry too to keep consistent
                const logId = `${manualDate}_${manualSubject.replace(/\s+/g, '_')}`;
                await window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'study_logs', logId), {
                    date: manualDate,
                    hours: parseFloat(manualHours),
                    subject: manualSubject,
                    createdAt: new Date().toISOString()
                }, { merge: true });
                alert("Logged successfully!");
                setManualHours('');
            } catch(e) { alert("Error: " + e.message); }
            setIsSubmitting(false);
        };

        const handleImageUpload = async (e) => {
            const files = Array.from(e.target.files);
            if(!files.length) return;
            setOcrFiles(files);
            setOcrStatus("Checking Quota...");
            
            // Single Quota Check for the entire batch
            const qCheck = await checkQuota(user, 'ocr');
            if(qCheck === false) {
                setOcrStatus("OCR Limit Reached.");
                return;
            }

            let totalProcessed = 0;
            const batch = window.firebase.writeBatch(window.firebase.db);

            setOcrStatus(`Processing 0/${files.length} images...`);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const b64 = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(file);
                    });

                    // Updated Prompt specifically for YPT/Forest Grids & Upsert Logic
                    const prompt = `Analyze this study tracker screenshot (likely YPT/Forest).
                    GOAL: Extract DAILY study hours from the calendar grid or bar charts.
                    1. If it's a Calendar Grid (e.g. "Jan 2026"): Extract the date and time for EVERY day with data.
                       - Convert times like "1:19" (1hr 19m) to 1.32. 
                       - Convert "9:00" to 9.0.
                    2. If it's a Monthly Subject Breakdown: Extract totals per subject if possible, but prioritize DAILY grid data if visible.
                    3. If subject is not specified for a specific day in the grid, use "General" or "Total".
                    4. Detect the year (e.g., 2026). If not found, use ${new Date().getFullYear()}.
                    5. RETURN JSON ARRAY ONLY: [{"date": "YYYY-MM-DD", "hours": 1.25, "subject": "General"}]
                    6. Ignore 0 hour days.`;
                    
                    const res = await callGroqVision(prompt, b64);
                    
                    const jsonStr = res.substring(res.indexOf('['), res.lastIndexOf(']') + 1);
                    const data = JSON.parse(jsonStr);
                    
                    data.forEach(item => {
                        // Create a deterministic ID: DATE_SUBJECT to allow upserting/overwriting
                        // This fixes the duplicate issue: uploading the same date/subject again overwrites the old one.
                        const logId = `${item.date}_${item.subject.replace(/\s+/g, '_')}`;
                        const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'study_logs', logId);
                        batch.set(ref, { ...item, createdAt: new Date().toISOString() }, { merge: true });
                    });
                    totalProcessed += data.length;
                    setOcrStatus(`Processing ${i+1}/${files.length}...`);
                    
                    // Artificial delay to not explode rate limits
                    await new Promise(r => setTimeout(r, 1000));
                    
                } catch(err) {
                    console.error("Failed file:", file.name, err);
                }
            }

            try {
                await batch.commit();
                setOcrStatus(`Done! Successfully logged/updated ${totalProcessed} entries.`);
            } catch(e) {
                setOcrStatus("Error saving to database.");
            }
        };

        return (

                        </div>

                            <input type="number" step="0.5" value={manualHours} onChange={e=>setManualHours(e.target.value)} placeholder="2.5" className="w-full bg-zinc-50 dark:bg-black/20 border border-zinc-200 dark:border-white/10 rounded-lg p-3 text-sm dark:text-white mt-1"/>
                        </div>
                        <button onClick={handleManualSubmit} disabled={isSubmitting} className="w-full bg-brand text-white font-bold py-3 rounded-xl hover:bg-indigo-600 transition-colors">
                            {isSubmitting ? "Saving..." : "Log Time"}

                        <Icons.Upload className="w-10 h-10 mx-auto text-zinc-400 mb-4"/>
                        <h3 className="font-bold text-zinc-900 dark:text-white">Batch Import Study Logs</h3>
                        <p className="text-xs text-zinc-500 dark:text-zinc-400 mt-2 mb-6 max-w-xs mx-auto">

    const CorrelationView = ({ user, isDarkMode }) => {
        const [data, setData] = useState([]);
        const [loading, setLoading] = useState(true);
        const [range, setRange] = useState(30);
        const [offset, setOffset] = useState(0); // 0 = current period, 1 = previous period

        useEffect(() => {
            const load = async () => {
                setLoading(true);
                const endDate = new Date();
                endDate.setDate(endDate.getDate() - (offset * range));
                
                const startDate = new Date(endDate); 
                startDate.setDate(startDate.getDate() - range);
                
                // Fetch Errors
                const errQ = window.firebase.query(
                    window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), 
                    window.firebase.where('createdAt', '>=', startDate.toISOString()),
                    window.firebase.where('createdAt', '<=', endDate.toISOString())
                );
                const errSnap = await window.firebase.getDocs(errQ);
                
                // Fetch Study Logs
                const studyQ = window.firebase.query(
                    window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'study_logs'), 
                    window.firebase.where('date', '>=', startDate.toLocaleDateString('sv')),
                    window.firebase.where('date', '<=', endDate.toLocaleDateString('sv'))
                );
                const studySnap = await window.firebase.getDocs(studyQ);

                // Merge
                const map = {};
                for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    const iso = d.toLocaleDateString('sv');
                    map[iso] = { date: d.toLocaleDateString('en-US', {day:'numeric', month:'short'}), errors: 0, hours: 0, rawDate: iso };
                }

                errSnap.forEach(d => {
                    const localDate = new Date(d.data().createdAt).toLocaleDateString('sv');
                    if(map[localDate]) map[localDate].errors++; 
                });
                studySnap.forEach(d => {
                    const date = d.data().date;
                    if(map[date]) map[date].hours += d.data().hours;
                });

                setData(Object.values(map));
                setLoading(false);
            };
            load();
        }, [user, range, offset]);

        return (

                <h1 className="text-4xl font-bold mb-2 tracking-tight">darNote Analysis</h1>
                <p className="text-zinc-400 mb-8 text-center max-w-md">Visualize your learning gaps. Find your weakness. Crush your exams.</p>
                <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-white text-black px-8 py-3 rounded-full font-bold flex gap-2 items-center hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.3)] w-64 justify-center">
                    <Icons.Google className="w-5 h-5"/> Sign In to Dashboard
                </button>
            </div>
        </div>
    );

    const App = () => {
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [isDarkMode, setIsDarkMode] = useState(true);
        const [stats, setStats] = useState(null);
        const [studentStatus, setStudentStatus] = useState('none');
        const [currentView, setCurrentView] = useState(Views.ANALYSIS);

        useEffect(() => {
            const params = new URLSearchParams(window.location.search);
            const v = params.get('view');
            if (v && Object.values(Views).includes(v)) setCurrentView(v);

            const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, (u) => {
                setUser(u);
                if (u) {
                    loadData(u.uid);
                    window.firebase.getDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', u.uid, 'settings', 'profile')).then(s => {
                         if(s.exists()) setStudentStatus(s.data().studentStatus || 'none');
                    });
                } else {
                    setLoading(false);
                }
            });
            return () => unsub();
        }, []);

        useEffect(() => {
            if(isDarkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }, [isDarkMode]);

        const changeView = (v) => {
             setCurrentView(v);
             const url = new URL(window.location);
             url.searchParams.set('view', v);
             window.history.pushState({}, '', url);
        };

        const loadData = async (uid) => {
            try {
                // 1. Get Optimized Server Count (Cost: 1 read per 1000 items)
                const totalCountSnapshot = await window.firebase.getCountFromServer(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', uid, 'error_logs'));
                const serverTotal = totalCountSnapshot.data().count;

                // 2. Fetch Recent Error Logs (Cost: 500 reads)
                const q = window.firebase.query(
                    window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', uid, 'error_logs'),
                    window.firebase.orderBy('createdAt', 'desc'),
                    window.firebase.limit(500)
                );
                
                // 3. Fetch Recent Study Logs (Cost: 100 reads or fewer)
                const studyQ = window.firebase.query(
                    window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', uid, 'study_logs'),
                    window.firebase.orderBy('date', 'desc'),
                    window.firebase.limit(100)
                );

                const [snap, studySnap] = await Promise.all([
                    window.firebase.getDocs(q),
                    window.firebase.getDocs(studyQ)
                ]);

                const rawLogs = snap.docs.map(d => d.data());
                const studyLogs = studySnap.docs.map(d => d.data());
                
                // Process Errors
                const subjectCounts = {};
                const topicCounts = {};
                rawLogs.forEach(l => {
                    subjectCounts[l.subject] = (subjectCounts[l.subject] || 0) + 1;
                    if(l.topic) topicCounts[l.topic] = (topicCounts[l.topic] || 0) + 1;
                });
                const subjects = Object.entries(subjectCounts).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value);
                const topics = Object.entries(topicCounts).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value);

                // Process Study Logs
                const studySubjectsRaw = {};
                let totalStudyHours = 0;
                studyLogs.forEach(l => {
                    if (l.subject && l.hours) {
                        studySubjectsRaw[l.subject] = (studySubjectsRaw[l.subject] || 0) + l.hours;
                        totalStudyHours += l.hours;
                    }
                });
                const studySubjects = Object.entries(studySubjectsRaw).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value);

                setStats({
                    total: rawLogs.length,
                    serverTotal: serverTotal, // True count from server
                    subjects,
                    topics,
                    studySubjects,
                    totalStudyHours,
                    logs: rawLogs,
                    nemesis: topics.length > 0 ? topics[0] : { name: "N/A", value: 0 },
                    lastActive: rawLogs.length > 0 ? new Date(Math.max(...rawLogs.map(l => new Date(l.createdAt)))).toLocaleDateString() : "Never",
                    isLimited: rawLogs.length === 500
                });
            } catch(e) { console.error(e); }
            setLoading(false);
        };

        if (!user) return loading ? <div className="h-screen bg-zinc-950 flex items-center justify-center"><div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div> : <LandingPage />;

        return (
            <div className="flex h-screen w-full bg-[#f4f4f5] dark:bg-onyx transition-colors duration-300">
                <Sidebar isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} user={user} studentStatus={studentStatus} currentView={currentView} onChangeView={changeView} />
                
                <main className="flex-1 h-full overflow-y-auto p-4 md:p-8 relative">
                    {currentView === Views.ANALYSIS && <AnalysisView stats={stats} user={user} isDarkMode={isDarkMode} loadData={loadData} studentStatus={studentStatus} />}
                    {currentView === Views.CORRELATION && <CorrelationView user={user} isDarkMode={isDarkMode} />}
                    {currentView === Views.INPUT && <InputView user={user} />}
                </main>
                
                <MobileNav currentView={currentView} onChangeView={changeView} />
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
