ssName="text-2xl text-gray">/ {lqFeedback.maxScore}</span></div><div className="text-base text-gray max-w-2xl mx-auto">{lqFeedback.generalFeedback}</div></div>)}</div>) : (!loading && <div className="flex flex-col items-center justify-center text-gray h-40"><div className="w-16 h-16 bg-light-gray/50 dark:bg-dark rounded-full flex items-center justify-center mb-4"><Icons.Terminal className="w-8 h-8 opacity-50"/></div><p className="text-sm font-medium">Ready to compile assessment.</p></div>)}</div><div className="px-6 py-4 bg-white dark:bg-surface-dark border-t border-light-gray dark:border-white/5 flex justify-between items-center shrink-0"><div className={`text-xs px-3 py-1.5 font-semibold rounded-full flex items-center gap-1.5 ${quota >= limit ? 'bg-danger/10 text-danger' : 'bg-light-gray/50 dark:bg-dark text-gray'}`}><Icons.Zap className="w-3.5 h-3.5"/> Limit: {quota}/{limit}</div>{!marked && (questions.length > 0 || lqData) ? <button onClick={() => questions.length > 0 ? setMarked(true) : handleLqMark()} className="px-8 py-2.5 bg-primary text-white font-medium rounded-full hover:bg-primary-dark shadow-md transition-all">Submit Assignment</button> : <button onClick={onClose} className="px-8 py-2.5 bg-light-gray/50 dark:bg-white/5 text-dark dark:text-light font-medium rounded-full hover:bg-light-gray dark:hover:bg-white/10 transition-all">Close</button>}</div></div></div>);

        const handleUndo = () => {

        const handleImageUpdate = async (data, action, type) => { 
            if (!activeLogId) return;

            const targetField = isQ ? 'questionImages' : 'schemeImages';

                        return { ...l, [targetField]: newArr };

            if (action === 'add-url') {

                    return currentLogs.map(l => l.id === activeLogId ? { ...l, [targetField]: newArr } : l);

                return; 
            } 

            setSpinner(true); 
            try { 
                let blobToUpload = data;

                if (data instanceof File || data instanceof Blob) { 
                    try { 
                        preFetchedToken = await getAccessToken(); 
                    } catch(err) {

                setLogs(currentLogs => {

                    if (!targetLog) return currentLogs;

                                                            <div>
                                                                <label className="text-sm font-bold text-dark dark:text-light flex items-center gap-2 mb-3"><Icons.Check className="w-5 h-5 text-gray"/> Examples in Action</label>
                                                                <textarea value={activeLog.schemeText || ""} onChange={(e) => updateLog(activeLog.id, { schemeText: e.target.value })} className="w-full p-5 text-sm bg-[#f8fafc] dark:bg-dark border border-light-gray dark:border-border-dark rounded-2xl text-dark dark:text-light focus:outline-none focus:border-success transition-colors font-sans leading-relaxed mb-4 shadow-inner min-h-[100px] resize-y" placeholder="Type out an example..." />
                                                                <div className="bg-[#f8fafc] dark:bg-dark rounded-2xl p-4 border border-light-gray dark:border-white/5">
                                                                    <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label={<><Icons.Image className="w-4 h-4 text-gray"/> Example Images</>} isUploading={uploadingS} onImageClick={() => setCompareMode(true)} />
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                            <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                                <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-success"></div>
                                                                <label className="text-xs font-bold text-success uppercase tracking-wider block mb-3 pl-2">Mandatory Buzzwords</label>
                                                                <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-[#f8fafc] dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark rounded-xl px-4 py-3 font-mono text-sm font-bold text-success focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-success focus:outline-none transition-all" placeholder="e.g. Electromotive force"/>
                                                            </div>
                                                            <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                                <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-danger"></div>
                                                                <label className="text-xs font-bold text-danger uppercase tracking-wider block mb-3 pl-2">Misconceptions</label>
                                                                <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-[#f8fafc] dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark rounded-xl px-4 py-3 font-mono text-sm font-bold text-danger focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-danger focus:outline-none transition-all" placeholder="Forgetting the negative sign!"/>
                                                            </div>
                                                        </div>

                                                        {/* YouTube Block */}
                                                        <div className="bg-white dark:bg-surface-dark p-6 md:p-8 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                            <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-[#FF0000]"></div>
                                                            <label className="text-sm font-bold text-dark dark:text-light block mb-3 pl-2 flex items-center gap-2"><Icons.Youtube className="w-5 h-5 text-[#FF0000]"/> Video Link</label>
                                                            <input value={activeLog.youtubeUrl || ''} onChange={e=>updateLog(activeLog.id, {youtubeUrl:e.target.value})} className="w-full bg-[#f8fafc] dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-[#FF0000]/50 rounded-xl px-4 py-3 text-sm focus:outline-none transition-all shadow-inner" placeholder="Paste YouTube Link here (e.g., https://youtu.be/...)"/>
                                                            {activeLog.youtubeUrl && <YouTubeEmbed url={activeLog.youtubeUrl} initialTime={activeLog.youtubeTimestamp || 0} onSaveTime={(t) => updateLog(activeLog.id, {youtubeTimestamp: t})} />}
                                                        </div>
                                                        
                                                        <button onClick={() => setShowAdvancedEdit(false)} className="w-full py-3 text-gray font-semibold text-xs uppercase tracking-wider hover:bg-black/5 dark:hover:bg-white/5 rounded-full transition-colors">Hide Nerd Stuff</button>
                                                    </div>
                                                )}
                                                
                                                <div className="flex justify-center pt-8">
                                                    <button onClick={() => {setIsEditMode(false); handleDelete(activeLog.id)}} className="text-sm text-danger hover:bg-danger/10 px-6 py-3 rounded-full font-bold transition-all flex items-center gap-2"><Icons.Trash className="w-4 h-4"/> Delete this misery</button>
                                                </div>
                                            </div>
                                        )}
                                        
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <Dashboard logs={logs} setPracticeConfig={setPracticeConfig} />
                        )}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-full sm:w-[400px] z-40 sm:z-30 shadow-2xl"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>
                        {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                        
                        {/* BIG FLOATING ACTION BUTTON (Mobile Only) */}
                        {!activeLogId && mobileView === 'logs' && (
                            <button onClick={createLog} className="lg:hidden fixed bottom-20 right-6 w-14 h-14 bg-primary text-white rounded-full shadow-[0_8px_30px_rgb(26,115,232,0.5)] flex items-center justify-center hover:bg-primary-dark hover:scale-105 active:scale-95 transition-all z-40">
                                <Icons.Plus className="w-6 h-6"/>
                            </button>
                        )}
                    </main>
                </div>
                
                {/* Mobile Bottom Navigation */}
                <div className="lg:hidden fixed bottom-0 left-0 right-0 h-[68px] bg-white/90 dark:bg-surface-dark/90 backdrop-blur-lg border-t border-light-gray dark:border-border-dark flex justify-around items-center px-2 z-50 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.08)] dark:shadow-[0_-4px_20px_rgba(0,0,0,0.4)]">
                    <button onClick={() => { setMobileView('logs'); setActiveLogId(null); }} className={`flex flex-col items-center justify-center w-20 h-full gap-1 transition-colors ${mobileView === 'logs' && !activeLogId ? 'text-primary' : 'text-gray dark:text-zinc-400 hover:text-dark dark:hover:text-light'}`}>
                        <div className={`p-1.5 rounded-xl ${mobileView === 'logs' && !activeLogId ? 'bg-primary/10' : ''}`}><Icons.File className="w-5 h-5"/></div>
                        <span className="text-[10px] font-bold">Vault</span>
                    </button>
                    <button onClick={() => setPracticeConfig({ isOpen: true, mode: 'topic' })} className="flex flex-col items-center justify-center w-20 h-full gap-1 text-gray dark:text-zinc-400 hover:text-primary transition-colors">
                        <div className="p-1.5 rounded-xl"><Icons.Target className="w-5 h-5"/></div>
                        <span className="text-[10px] font-bold">Drill</span>
                    </button>
                    <button onClick={() => { setMobileView('dashboard'); setActiveLogId(null); }} className={`flex flex-col items-center justify-center w-20 h-full gap-1 transition-colors ${mobileView === 'dashboard' && !activeLogId ? 'text-primary' : 'text-gray dark:text-zinc-400 hover:text-dark dark:hover:text-light'}`}>
                        <div className={`p-1.5 rounded-xl ${mobileView === 'dashboard' && !activeLogId ? 'bg-primary/10' : ''}`}><Icons.ChartBar className="w-5 h-5"/></div>
                        <span className="text-[10px] font-bold">Stats</span>
                    </button>
                </div>

                <AnimatePresence>
                    {undoToast && (
                        <motion.div initial={{ y: 100, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 100, opacity: 0 }} className="fixed bottom-24 lg:bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-onyx dark:bg-white text-white dark:text-onyx px-5 py-3 rounded-full shadow-2xl flex items-center gap-4 text-sm font-medium border border-white/10 dark:border-black/10">
                            <span className="flex items-center gap-2 whitespace-nowrap"><Icons.Check className="w-4 h-4 text-success"/> Image removed</span>
                            <div className="w-px h-4 bg-white/20 dark:bg-black/20"></div>
                            <button onClick={handleUndo} className="text-primary-light dark:text-primary hover:opacity-80 transition-opacity uppercase font-bold tracking-wider text-xs whitespace-nowrap">Undo</button>
                            <button onClick={() => { setUndoToast(null); if(window.undoTimer) clearTimeout(window.undoTimer); }} className="text-gray-400 hover:text-white dark:hover:text-black transition-colors ml-1"><Icons.X className="w-4 h-4"/></button>
                        </motion.div>
                    )}
                </AnimatePresence>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
