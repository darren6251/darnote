e-dark rounded-xl shadow-sm border border-light-gray dark:border-border-dark text-dark dark:text-light text-sm leading-relaxed"><span className="font-bold text-primary uppercase tracking-wider text-[10px] block mb-2">Examination Context</span>{lqData.context}</div>{lqData.parts.map((part) => (<div key={part.id} className="bg-white dark:bg-surface-dark p-6 rounded-xl shadow-sm border border-light-gray dark:border-border-dark space-y-4"><div className="flex justify-between items-start text-sm"><span className="font-semibold text-dark dark:text-light flex gap-2"><span className="text-primary font-mono">({part.id})</span> <span>{part.text}</span></span><span className="text-xs text-gray font-bold bg-light-gray/50 dark:bg-dark px-2 py-1 rounded-md shrink-0">[{part.marks} marks]</span></div><textarea value={userAnswers[part.id] || ''} onChange={e => setUserAnswers({...userAnswers, [part.id]: e.target.value})} disabled={marked} className="w-full bg-[#f8fafc] dark:bg-dark border border-light-gray dark:border-border-dark rounded-lg p-4 text-sm focus:outline-none focus:border-primary dark:focus:border-primary transition-all shadow-inner" rows="4" placeholder="Draft your response..."/>{marked && lqFeedback?.partFeedback[part.id] && (<div className={`text-sm p-4 rounded-lg flex justify-between items-start gap-4 ${lqFeedback.partFeedback[part.id].score === part.marks ? 'bg-[#f0fdf4] dark:bg-[#12311e] text-success border border-success/20' : 'bg-[#fef2f2] dark:bg-[#3f1616] text-danger border border-danger/20'}`}><span className="mt-1">{lqFeedback.partFeedback[part.id].comment}</span><span className="font-bold text-xl shrink-0 bg-white/50 dark:bg-black/20 px-3 py-1 rounded-md font-mono">{lqFeedback.partFeedback[part.id].score}/{part.marks}</span></div>)}</div>))} {marked && (<div className="p-6 rounded-xl bg-white dark:bg-surface-dark border-t-2 border-primary shadow-sm text-center"><div className="text-[10px] font-bold text-gray uppercase tracking-wider mb-2">Final Evaluation Score</div><div className="text-4xl font-bold text-dark dark:text-light mb-4 font-mono">{lqFeedback.totalScore} <span className="text-xl text-gray">/ {lqFeedback.maxScore}</span></div><div className="text-sm text-gray max-w-2xl mx-auto">{lqFeedback.generalFeedback}</div></div>)}</div>) : (!loading && <div className="flex flex-col items-center justify-center text-gray h-40"><div className="w-12 h-12 bg-light-gray/50 dark:bg-dark rounded-xl flex items-center justify-center mb-3"><Icons.Terminal className="w-6 h-6 opacity-50"/></div><p className="text-xs font-semibold uppercase tracking-widest">System Ready</p></div>)}</div><div className="px-6 py-4 bg-white dark:bg-surface-dark border-t border-light-gray dark:border-white/5 flex justify-between items-center shrink-0"><div className={`text-[10px] px-3 py-1.5 font-bold uppercase tracking-wider rounded-md flex items-center gap-1.5 ${quota >= limit ? 'bg-danger/10 text-danger' : 'bg-light-gray/50 dark:bg-dark text-gray'}`}><Icons.Zap className="w-3 h-3"/> API Quota: {quota}/{limit}</div>{!marked && (questions.length > 0 || lqData) ? <button onClick={() => questions.length > 0 ? setMarked(true) : handleLqMark()} className="px-6 py-2 bg-primary text-white text-sm font-semibold rounded-lg hover:bg-primary-dark shadow-sm transition-all">Submit Evaluation</button> : <button onClick={onClose} className="px-6 py-2 bg-light-gray/50 dark:bg-white/5 text-dark dark:text-light text-sm font-semibold rounded-lg hover:bg-light-gray dark:hover:bg-white/10 transition-all">Terminate Process</button>}</div></div></div>);

        useEffect(() => { const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, async (u) => { if (u) { setUser(u); const db = window.firebase.db; window.firebase.getDocs(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', u.uid, 'subjects')).then(snap => { setSubjects(snap.docs.map(d => ({id: d.id, name: d.data().name, topics: d.data().topics || []})).sort((a,b)=>a.name.localeCompare(b.name))); }); window.firebase.onSnapshot(window.firebase.doc(db, 'artifacts', "darnote-app", 'users', u.uid, 'settings', 'profile'), (doc) => { if(doc.exists()) setStudentStatus(doc.data().studentStatus || 'none'); }); } else { setUser(null); setIsLoadingLogs(false); } }); return () => unsub(); }, []);

        const fetchLogs = async (isLoadMore = false, uid = user?.uid) => { if (!uid) return; setIsLoadingLogs(true); try { const db = window.firebase.db; const logsRef = window.firebase.collection(db, 'artifacts', "darnote-app", 'users', uid, 'definition_logs'); let constraints = []; if (filter === 'active') constraints.push(window.firebase.where('mastered', '==', false)); if (filter === 'mastered') constraints.push(window.firebase.where('mastered', '==', true)); if (filter.startsWith('subject:')) { const parts = filter.split(':'); constraints.push(window.firebase.where('subject', '==', parts[1])); if (parts[2]) constraints.push(window.firebase.where('topic', '==', parts[2])); } if (typeFilter !== 'ALL') constraints.push(window.firebase.where('questionType', '==', typeFilter)); constraints.push(window.firebase.orderBy('createdAt', sortBy === 'date-desc' ? 'desc' : 'asc')); if (isLoadMore && lastDoc) constraints.push(window.firebase.startAfter(lastDoc)); constraints.push(window.firebase.limit(10)); const q = window.firebase.query(logsRef, ...constraints); let snapshot = await window.firebase.getDocs(q); const newLogs = snapshot.docs.map(d => { const data = d.data(); return { id: d.id, ...data, questionImages: data.questionImages || (data.imageUrl ? [data.imageUrl] : []), schemeImages: data.schemeImages || (data.markingSchemeUrl ? [data.markingSchemeUrl] : []) }; }); if (isLoadMore) setLogs(prev => [...prev, ...newLogs]); else setLogs(newLogs); setLastDoc(snapshot.docs[snapshot.docs.length - 1]); setHasMore(snapshot.docs.length === 10); } catch(e) { console.error("Fetch Error", e); } setIsLoadingLogs(false); };

                        const newArr = [...(l[undoToast.targetField] || [])];
                        newArr.splice(undoToast.index, 0, undoToast.url);
                        updateLog(undoToast.logId, { [undoToast.targetField]: newArr });
                        return { ...l, [undoToast.targetField]: newArr };
                    }
                    return l;
                }));

            setUndoToast(null);
            if (window.undoTimer) clearTimeout(window.undoTimer);
        };

        const handleImageUpdate = async (data, action, type) => { 
            if (!activeLogId) return; 
            const isQ = type === 'question'; 
            const setSpinner = isQ ? setUploadingQ : setUploadingS; 
            const targetField = isQ ? 'questionImages' : 'schemeImages'; 
            
            if (action === 'remove') { 
                setLogs(currentLogs => currentLogs.map(l => { 
                    if (l.id === activeLogId) { 
                        const deletedUrl = (l[targetField] || [])[data];
                        const newArr = (l[targetField] || []).filter((_, i) => i !== data); 
                        updateLog(activeLogId, { [targetField]: newArr }); 
                        
                        setUndoToast({ type: 'image', logId: activeLogId, targetField, index: data, url: deletedUrl });
                        if (window.undoTimer) clearTimeout(window.undoTimer);
                        window.undoTimer = setTimeout(() => setUndoToast(null), 5000);
                        
                        return { ...l, [targetField]: newArr }; 
                    } 
                    return l; 
                })); 
                return; 
            } 
            
            if (action === 'add-url') { 
                setLogs(currentLogs => { 
                    const targetLog = currentLogs.find(l => l.id === activeLogId); 
                    if (!targetLog) return currentLogs; 
                    const newArr = [...(targetLog[targetField] || []), data]; 
                    updateLog(activeLogId, { [targetField]: newArr }); 
                    return currentLogs.map(l => l.id === activeLogId ? { ...l, [targetField]: newArr } : l); 
                }); 
                return; 
            } 

            setSpinner(true); 
            try { 
                let blobToUpload = data; 
                let preFetchedToken = null; 
                if (data instanceof File || data instanceof Blob) { 
                    try { 
                        preFetchedToken = await getAccessToken(); 
                    } catch(err) { 
                        if (err.error === 'popup_blocked_by_browser') alert("Authentication requires pop-up authorization."); 
                        throw err; 
                    } 
                    blobToUpload = (data.type === 'application/pdf') ? data : await compressImage(data); 
                } 
                if (isQ && blobToUpload.type !== 'application/pdf') { 
                    const reader = new FileReader(); 
                    reader.onloadend = () => pendingOcrBlobs.current.push(reader.result); 
                    reader.readAsDataURL(blobToUpload); 
                    if (ocrTimerRef.current) clearTimeout(ocrTimerRef.current); 
                    setOcrPendingToast(15); 
                    ocrTimerRef.current = setTimeout(async () => { 
                        const newQuota = await checkAndIncrementQuota(user, 'ocr'); 
                        if (newQuota === false) return; 
                        if (pendingOcrBlobs.current.length > 0) performSmartOCR([...pendingOcrBlobs.current]); 
                    }, 15000); 
                } 
                const finalUrl = await saveToDrive(blobToUpload, `DefLog_${type}_${Date.now()}.${blobToUpload.type==='application/pdf'?'pdf':'jpg'}`, preFetchedToken); 
                setLogs(currentLogs => { 
                    const targetLog = currentLogs.find(l => l.id === activeLogId); 
                    if (!targetLog) return currentLogs; 
                    const newArr = [...(targetLog[targetField] || []), finalUrl]; 
                    updateLog(activeLogId, { [targetField]: newArr }); 
                    return currentLogs.map(l => l.id === activeLogId ? { ...l, [targetField]: newArr } : l); 
                }); 
                setSpinner(false); 
            } catch(e) { 
                alert("Upload Failure: " + e.message); 
                setSpinner(false); 
            } 
        };

                            <div className="w-px h-4 bg-white/20 dark:bg-black/20"></div>
                            <button onClick={handleUndo} className="text-primary-light dark:text-primary hover:opacity-80 transition-opacity uppercase font-bold tracking-wider text-[10px] whitespace-nowrap">Undo Operation</button>
                            <button onClick={() => { setUndoToast(null); if(window.undoTimer) clearTimeout(window.undoTimer); }} className="text-gray-400 hover:text-white dark:hover:text-black transition-colors ml-1"><Icons.X className="w-4 h-4"/></button>
                        </motion.div>
                    )}
                </AnimatePresence>
            </div>
        );
    };
    
    // Add Database Icon definition as it was missing from Icons const but used in accordion
    Icons.Database = p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>;

    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
