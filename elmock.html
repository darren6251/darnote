    // --- AI & UTILS ---
    const compressImage = async (fileOrBlob) => new Promise((resolve) => { const img = new Image(); const reader = new FileReader(); reader.onload = (e) => { img.src = e.target.result; img.onload = () => { const canvas = document.createElement('canvas'); const MAX_WIDTH = 2500; let width = img.width; let height = img.height; if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 0.85); } }; reader.readAsDataURL(fileOrBlob); });
    
    // PDF Slicing Magic
    const convertPdfToImages = async (file) => {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        const blobs = [];
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 2.0 }); // High res
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
            blobs.push(blob);
        }
        return blobs;
    };

    const callAI = async (prompt, sys = "", images = [], apiUrl = GEMINI_PROXY_URL) => { const parts = [{ text: `${sys}\n\nUser: ${prompt}` }]; if (images?.length > 0) { images.forEach(img => { let mimeType = "image/png", data = img; if (img.includes(",")) { const s = img.split(","); mimeType = s[0].match(/:(.*?);/)[1]; data = s[1]; } parts.push({ inlineData: { mimeType, data } }); }); } try { const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) }); if (!response.ok) return `Error: ${response.status}`; const data = await response.json(); if (data.error) return `API Error: ${data.error.message}`; return data.candidates?.[0]?.content?.parts?.[0]?.text || "Empty response."; } catch (error) { return `Error: ${error.message}`; } };

    const useGoogleDrive = () => { const [tokenClient, setTokenClient] = useState(null); useEffect(() => { if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return; const load = async () => { if (window.gapi) { await new Promise(r => window.gapi.load('client', r)); await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] }); } if (window.google) setTokenClient(window.google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: () => {} })); }; load(); }, []); const getAccessToken = () => new Promise((resolve, reject) => { if (!tokenClient) return reject("Auth not initialized"); const existing = window.gapi.client.getToken(); if (existing && Date.now() < existing.expiry) return resolve(existing.access_token); tokenClient.callback = (resp) => { if (resp.error) reject(resp); resolve(resp.access_token); }; tokenClient.requestAccessToken({ prompt: '' }); }); const saveToDrive = async (blob, filename, preFetchedToken = null, folderName = 'darNote_MockExams') => { const token = preFetchedToken || await getAccessToken(); let folderId; const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`; const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` } }); const searchData = await search.json(); if (searchData.files?.length) folderId = searchData.files[0].id; else { const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) }); folderId = (await create.json()).id; } const metadata = { name: filename, mimeType: blob.type, parents: [folderId] }; const form = new FormData(); form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' })); form.append('file', blob); const upRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form }); if(!upRes.ok) throw new Error(upRes.statusText); const fileId = (await upRes.json()).id; await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) }); return `https://lh3.googleusercontent.com/d/${fileId}`; }; return { saveToDrive, getAccessToken }; };

    const CompareLightbox = ({ qImages, sImages, onClose }) => {

    const ImageUploader = ({ images = [], onUpdate, label, isUploading, onImageClick }) => {
        const fileInputRef = useRef(null);
        const imageList = Array.isArray(images) ? images : [];

        const handleFiles = async (files) => {
            for (let file of Array.from(files)) {
                if (file.type === 'application/pdf') {
                    onUpdate('START_PDF_PROCESSING', 'status');
                    try {
                        const blobs = await convertPdfToImages(file);
                        for (let blob of blobs) {
                            await onUpdate(blob, 'add');
                        }
                    } catch (e) { alert("Failed to slice PDF. File might be corrupted or too large."); }
                    onUpdate('END_PDF_PROCESSING', 'status');
                } else if (file.type.startsWith('image/')) {
                    onUpdate(file, 'add');
                }
            }
        };

            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    for (const type of item.types) {

                    <input type="file" multiple ref={fileInputRef} style={{display:'none'}} onChange={(e) => handleFiles(e.target.files)} accept="image/*,application/pdf" />
                </div>
                <div className={`w-full min-h-[140px] bg-[#f8fafc] dark:bg-surface-dark border border-dashed rounded-xl p-4 transition-all ${isUploading ? 'border-dark dark:border-light bg-light-gray/20 dark:bg-white/5' : 'border-gray/30'}`} onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}>
                    {imageList.length === 0 ? (
                        <div className="h-28 flex flex-col items-center justify-center pointer-events-none opacity-60">
                            {isUploading ? <div className="w-6 h-6 border-2 border-dark dark:border-light border-t-transparent rounded-full animate-spin mb-2"/> : <Icons.Upload className="w-6 h-6 mb-2"/>}
                            <span className="text-xs font-semibold uppercase tracking-widest">{isUploading ? "Processing..." : "Drop images or PDF here"}</span>
                        </div>
                    ) : (
                        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
                            {imageList.map((url, idx) => (
                                <div key={idx} onClick={(e) => {e.stopPropagation(); onImageClick()}} className="group relative aspect-square bg-white dark:bg-[#000000] rounded-xl overflow-hidden shadow-sm cursor-zoom-in border border-light-gray dark:border-border-dark">

                                        <button onClick={(e) => { e.stopPropagation(); onUpdate(idx, 'remove'); }} className="p-2 bg-white text-dark rounded-full shadow-lg hover:scale-110 transition-transform"><Icons.Trash className="w-4 h-4"/></button>
                                    </div>
                                </div>
                            ))}
                            {isUploading && (<div className="aspect-square rounded-xl bg-light-gray/20 dark:bg-white/5 flex items-center justify-center border border-dashed border-gray/50"><div className="w-5 h-5 border-2 border-dark dark:border-light border-t-transparent rounded-full animate-spin"></div></div>)}
                        </div>

            </div>
        );
    };

    // --- MAIN APP ---
    const App = () => {
        const [user, setUser] = useState(null);
        const [userProfile, setUserProfile] = useState({});
        const [subjects, setSubjects] = useState([]);
        const [mocks, setMocks] = useState([]);
        const [activeMockId, setActiveMockId] = useState(null);
        const [questions, setQuestions] = useState([]);
        const [activeQuestionId, setActiveQuestionId] = useState(null);
        
        const [filterSubject, setFilterSubject] = useState('All');
        const [isDarkMode, setIsDarkMode] = useState(true);
        const { saveToDrive, getAccessToken } = useGoogleDrive();
        const [loadingMsg, setLoadingMsg] = useState("");
        const [compareMode, setCompareMode] = useState(false);
        const [cooldownAlert, setCooldownAlert] = useState(null);

        // Upload Spinners
        const [uploadingQ, setUploadingQ] = useState(false);
        const [uploadingS, setUploadingS] = useState(false);
        const saveTimeoutRef = useRef({});

        // Auth & Init
        useEffect(() => { 
            const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, async (u) => { 
                if (u) { 
                    setUser(u); 
                    const db = window.firebase.db; 
                    // Fetch profile for cooldown logic
                    window.firebase.onSnapshot(window.firebase.doc(db, 'artifacts', "darnote-app", 'users', u.uid, 'settings', 'profile'), (doc) => { 
                        if(doc.exists()) setUserProfile(doc.data()); 
                    });
                    // Fetch Subjects
                    window.firebase.getDocs(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', u.uid, 'subjects')).then(snap => { 
                        setSubjects(snap.docs.map(d => ({id: d.id, name: d.data().name})).sort((a,b)=>a.name.localeCompare(b.name))); 
                    }); 
                    fetchMocks(u.uid);
                } else {
                    setUser(null); 
                    setMocks([]);
                }
            }); 
            return () => unsub(); 
        }, []);

        useEffect(() => { if(isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);

        const fetchMocks = async (uid) => {
            const db = window.firebase.db;
            const q = window.firebase.query(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', uid, 'mock_exams'), window.firebase.orderBy('createdAt', 'desc'));
            const snap = await window.firebase.getDocs(q);
            setMocks(snap.docs.map(d => ({id: d.id, ...d.data()})));
        };

        const fetchQuestions = async (mockId) => {
            const db = window.firebase.db;
            const q = window.firebase.query(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_questions'), window.firebase.where('mockId', '==', mockId));
            const snap = await window.firebase.getDocs(q);
            setQuestions(snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.order - b.order));
        };

        useEffect(() => {
            if (activeMockId) fetchQuestions(activeMockId);
        }, [activeMockId]);

        // Cooldown Logic
        const checkCooldown = () => {
            const lastUpload = userProfile.lastMockUploadDate || 0;
            const isVerified = userProfile.studentStatus === 'verified' || userProfile.studentStatus === 'temp_verified';
            const cooldownDays = isVerified ? 1 : 3;
            const cooldownMs = cooldownDays * 24 * 60 * 60 * 1000;
            const timePassed = Date.now() - lastUpload;
            
            if (timePassed < cooldownMs) {
                const remaining = cooldownMs - timePassed;
                const hours = Math.floor(remaining / (1000 * 60 * 60));
                setCooldownAlert(`Anti-Burnout Protocol: You must wait ${hours} more hours before adding a new full Mock Exam. Review your existing ones!`);
                setTimeout(() => setCooldownAlert(null), 5000);
                return false;
            }
            return true;
        };

        const createMock = async () => {
            if (!checkCooldown()) return;
            const newMock = { title: 'Untitled Mock Exam', subject: 'General', createdAt: Date.now(), lastModified: Date.now() };
            const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_exams'), newMock);
            
            // Update Cooldown
            await window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'settings', 'profile'), { lastMockUploadDate: Date.now() }, { merge: true });
            
            setMocks(prev => [{...newMock, id: docRef.id}, ...prev]);
            setActiveMockId(docRef.id);
        };

        const createQuestion = async () => {
            const newQ = { mockId: activeMockId, questionImages: [], schemeImages: [], whatWrong: '', whyWrong: '', whatThinking: '', aiReview: '', userNotes: '', order: questions.length, createdAt: Date.now() };
            const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_questions'), newQ);
            setQuestions(prev => [...prev, {...newQ, id: docRef.id}]);
            setActiveQuestionId(docRef.id);
        };

        const updateMock = async (id, updates) => {
            setMocks(prev => prev.map(m => m.id === id ? { ...m, ...updates } : m));
            await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_exams', id), updates);
        };

        const updateQuestion = (id, updates) => {
            setQuestions(prev => prev.map(q => q.id === id ? { ...q, ...updates } : q));
            if (saveTimeoutRef.current[id]) clearTimeout(saveTimeoutRef.current[id]);
            saveTimeoutRef.current[id] = setTimeout(async () => {
                await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_questions', id), updates);
            }, 1500);
        };

        // Image Update Handler (Handles PDF slicing state too)
        const handleImageUpdate = async (qId, data, action, type) => {
            const isQ = type === 'question';
            const setSpinner = isQ ? setUploadingQ : setUploadingS;
            const targetField = isQ ? 'questionImages' : 'schemeImages';
            
            if (action === 'status') {
                if (data === 'START_PDF_PROCESSING') setSpinner(true);
                if (data === 'END_PDF_PROCESSING') setSpinner(false);
                return;
            }

            if (action === 'remove') {
                setQuestions(prev => prev.map(q => {
                    if (q.id === qId) {
                        const newArr = q[targetField].filter((_, i) => i !== data);
                        updateQuestion(qId, { [targetField]: newArr });
                        return { ...q, [targetField]: newArr };
                    }
                    return q;
                }));
                return;
            }

            setSpinner(true);
            try {
                let token = await getAccessToken();
                let blobToUpload = data instanceof Blob ? await compressImage(data) : data;
                const finalUrl = await saveToDrive(blobToUpload, `MockImg_${Date.now()}.jpg`, token);
                
                setQuestions(prev => prev.map(q => {
                    if (q.id === qId) {
                        const newArr = [...(q[targetField] || []), finalUrl];
                        updateQuestion(qId, { [targetField]: newArr });
                        return { ...q, [targetField]: newArr };
                    }
                    return q;
                }));
            } catch(e) { alert("Upload Error: " + e.message); }
            setSpinner(false);
        };

        // AI Auto-Review (Triggers only if aiReview is empty and images exist)
        const autoRoast = async (qId) => {
            const q = questions.find(x => x.id === qId);
            if (!q || q.aiReview || !q.questionImages?.length) return;
            
            setLoadingMsg("Summoning the ghost of disappointed examiners...");
            
            try {
                // Fetch base64 of the first question image
                const res = await fetch(q.questionImages[0]);
                const blob = await res.blob();
                const b64 = await new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(blob); });
                
                const prompt = `Analyze this wrong exam question image. Be brutal, direct, and slightly hilarious (Noir tone). Tell the student: 1. What concept is tested. 2. Common traps here. Output plain text.`;
                const aiRes = await callAI(prompt, "Examiner Roast", [b64]);
                updateQuestion(qId, { aiReview: aiRes });
            } catch(e) { console.error(e); }
            setLoadingMsg("");
        };

        useEffect(() => {
            if (activeQuestionId) autoRoast(activeQuestionId);
        }, [activeQuestionId]);

        // Views
        const filteredMocks = filterSubject === 'All' ? mocks : mocks.filter(m => m.subject === filterSubject);
        const activeMock = mocks.find(m => m.id === activeMockId);
        const activeQuestion = questions.find(q => q.id === activeQuestionId);

        if (!user) return (
            <div className="h-screen w-full flex items-center justify-center bg-[#f4f4f5] dark:bg-[#000000] flex-col relative overflow-hidden">
                <div className="z-10 flex flex-col items-center text-center max-w-md p-8 bg-white dark:bg-surface-dark border border-light-gray dark:border-border-dark rounded-3xl shadow-ds">
                    <Icons.BookOpen className="w-16 h-16 mb-6 text-dark dark:text-light opacity-80"/>
                    <h1 className="text-3xl font-extrabold tracking-tighter mb-2 uppercase">Mock Autopsy</h1>
                    <p className="text-sm text-gray mb-8 font-medium">Document your failures. Dissect them. Prevent them.</p>
                    <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-dark dark:bg-light text-light dark:text-dark px-8 py-3.5 rounded-full font-bold uppercase tracking-widest text-xs flex gap-3 items-center hover:scale-105 transition-all shadow-md w-full justify-center"><Icons.Google className="w-4 h-4"/> Sign In</button>
                </div>
            </div>
        );

        return (
            <div className={`flex flex-col h-screen w-full transition-colors duration-300 ${isDarkMode ? 'dark' : ''}`}>
                <AnimatePresence>{compareMode && activeQuestion && <CompareLightbox qImages={activeQuestion.questionImages} sImages={activeQuestion.schemeImages} onClose={() => setCompareMode(false)} />}</AnimatePresence>
                <AnimatePresence>
                    {cooldownAlert && (
                        <motion.div initial={{ y: -50, opacity: 0 }} animate={{ y: 20, opacity: 1 }} exit={{ y: -50, opacity: 0 }} className="fixed top-0 left-1/2 -translate-x-1/2 z-[200] bg-danger text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 text-sm font-bold tracking-wide border border-white/20">
                            <Icons.Shield className="w-5 h-5"/> {cooldownAlert}
                        </motion.div>
                    )}
                </AnimatePresence>
                
                {/* Header */}
                <header className="bg-white dark:bg-[#000000] text-dark dark:text-light px-6 py-3 flex justify-between items-center z-30 shrink-0 border-b border-light-gray dark:border-border-dark h-16">
                    <div className="flex items-center gap-3 font-bold text-lg tracking-tighter cursor-pointer uppercase" onClick={() => { setActiveMockId(null); setActiveQuestionId(null); }}>
                        <Icons.BookOpen className="w-6 h-6"/> MOCK AUTOPSY
                    </div>
                    <div className="flex items-center gap-4">
                        <button onClick={()=>setIsDarkMode(!isDarkMode)} className="p-2 text-gray hover:text-dark dark:hover:text-light transition-colors"><Icons.Sun className="w-5 h-5"/></button>
                        <div className="w-8 h-8 rounded-full bg-dark dark:bg-light text-light dark:text-dark flex items-center justify-center font-bold text-xs shadow-md">{user.displayName?.charAt(0) || 'U'}</div>
                        <button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="text-gray hover:text-danger transition-colors"><Icons.Logout className="w-5 h-5"/></button>
                    </div>
                </header>

                <div className="flex-1 flex overflow-hidden">
                    {/* Sidebar (Only visible when no Mock is active, or on large screens) */}
                    <div className={`w-[260px] shrink-0 bg-[#fcfcfc] dark:bg-[#09090b] border-r border-light-gray dark:border-border-dark flex-col py-6 z-20 hidden lg:flex`}>
                        <div className="px-6 mb-8">
                            <button onClick={createMock} className="w-full flex items-center justify-center gap-2 bg-dark dark:bg-light text-light dark:text-dark px-4 py-3 rounded-xl shadow-md hover:scale-[1.02] transition-all font-bold text-xs uppercase tracking-widest"><Icons.Plus className="w-4 h-4"/> New Mock</button>
                        </div>
                        <div className="flex-1 overflow-y-auto px-4">
                            <div className="text-[10px] font-bold text-gray mb-3 uppercase tracking-widest px-2">Filters</div>
                            <button onClick={() => setFilterSubject('All')} className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors mb-1 ${filterSubject === 'All' ? 'bg-light-gray/50 dark:bg-surface-dark text-dark dark:text-light' : 'text-gray hover:text-dark dark:hover:text-light'}`}>All Subjects</button>
                            {subjects.map(s => (
                                <button key={s.id} onClick={() => setFilterSubject(s.name)} className={`w-full text-left px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors mb-1 ${filterSubject === s.name ? 'bg-light-gray/50 dark:bg-surface-dark text-dark dark:text-light' : 'text-gray hover:text-dark dark:hover:text-light'}`}>{s.name}</button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 flex-col min-w-0 bg-[#f4f4f5] dark:bg-[#000000] relative overflow-y-auto">
                        {!activeMockId ? (
                            // MOCK LIST VIEW
                            <div className="p-8 max-w-6xl mx-auto">
                                <h2 className="text-2xl font-bold tracking-tight mb-8 uppercase">Your Autopsies</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {filteredMocks.map(m => (
                                        <div key={m.id} onClick={() => setActiveMockId(m.id)} className="group bg-white dark:bg-surface-dark p-6 rounded-2xl shadow-sm hover:shadow-ds-hover border border-light-gray dark:border-border-dark cursor-pointer transition-all flex flex-col justify-between min-h-[160px]">
                                            <div>
                                                <div className="flex justify-between items-start mb-2">
                                                    <span className="text-[10px] font-bold text-gray uppercase tracking-widest bg-light-gray/30 dark:bg-black/30 px-2 py-1 rounded-md">{m.subject}</span>
                                                </div>
                                                <h3 className="font-bold text-lg leading-tight mb-2 group-hover:underline">{m.title}</h3>
                                            </div>
                                            <div className="text-xs text-gray font-medium flex items-center gap-1.5"><Icons.Clock className="w-3.5 h-3.5"/> {new Date(m.createdAt).toLocaleDateString()}</div>
                                        </div>
                                    ))}
                                    {filteredMocks.length === 0 && <div className="col-span-full py-20 text-center text-gray font-semibold uppercase tracking-widest text-sm">No Mocks Found. Time to face reality.</div>}
                                </div>
                            </div>
                        ) : !activeQuestionId ? (
                            // MOCK DETAIL VIEW (List of Pages/Questions)
                            <div className="p-8 max-w-5xl mx-auto">
                                <button onClick={() => setActiveMockId(null)} className="flex items-center gap-2 text-xs font-bold text-gray hover:text-dark dark:hover:text-light transition-colors mb-6 uppercase tracking-widest"><Icons.ChevronLeft className="w-4 h-4"/> Back to Mocks</button>
                                
                                <div className="bg-white dark:bg-surface-dark p-8 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark mb-8">
                                    <input value={activeMock.title} onChange={e=>updateMock(activeMock.id, {title: e.target.value})} className="bg-transparent text-3xl font-extrabold outline-none w-full mb-4 tracking-tighter" placeholder="Mock Title"/>
                                    <select value={activeMock.subject} onChange={e=>updateMock(activeMock.id, {subject: e.target.value})} className="bg-light-gray/30 dark:bg-black border border-transparent rounded-lg px-3 py-1.5 text-sm font-semibold outline-none text-gray">
                                        <option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                    </select>
                                </div>

                                <div className="flex justify-between items-end mb-6">
                                    <h3 className="text-lg font-bold tracking-tight uppercase">Mistake Pages ({questions.length})</h3>
                                    <button onClick={createQuestion} className="bg-dark dark:bg-light text-light dark:text-dark px-5 py-2 rounded-full font-bold text-xs uppercase tracking-widest flex gap-2 items-center hover:scale-105 transition-all shadow-sm"><Icons.Plus className="w-4 h-4"/> Add Page</button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {questions.map((q, i) => (
                                        <div key={q.id} onClick={() => setActiveQuestionId(q.id)} className="bg-white dark:bg-surface-dark p-4 rounded-2xl shadow-sm hover:shadow-ds-hover border border-light-gray dark:border-border-dark cursor-pointer flex gap-4 items-center">
                                            <div className="w-16 h-16 bg-light-gray/50 dark:bg-black rounded-xl overflow-hidden shrink-0 border border-light-gray dark:border-border-dark flex items-center justify-center">
                                                {q.questionImages?.length ? <img src={q.questionImages[0]} className="w-full h-full object-cover grayscale opacity-70" /> : <Icons.Image className="w-6 h-6 text-gray opacity-50"/>}
                                            </div>
                                            <div className="flex-1 overflow-hidden">
                                                <div className="font-bold text-sm mb-1 truncate">Page {i + 1}</div>
                                                <div className="text-xs text-gray truncate">{q.whatWrong || "No analysis written yet."}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            // QUESTION DEEP DIVE (The Interrogation Room)
                            <div className="flex flex-col h-full bg-[#f4f4f5] dark:bg-[#000000]">
                                <header className="bg-white dark:bg-surface-dark px-6 py-4 border-b border-light-gray dark:border-border-dark flex justify-between items-center shrink-0">
                                    <button onClick={() => setActiveQuestionId(null)} className="flex items-center gap-2 text-xs font-bold text-gray hover:text-dark dark:hover:text-light transition-colors uppercase tracking-widest"><Icons.ChevronLeft className="w-4 h-4"/> Back to Overview</button>
                                    <div className="text-sm font-bold uppercase tracking-widest opacity-50">Autopsy File</div>
                                </header>
                                
                                <div className="flex-1 overflow-y-auto p-6 md:p-8">
                                    <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        
                                        {/* Left Col: Evidence */}
                                        <div className="space-y-6">
                                            <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark">
                                                <ImageUploader images={activeQuestion.questionImages} onUpdate={(d, a, t) => handleImageUpdate(activeQuestion.id, d, a, 'question')} label="The Mistake (Your Ans)" isUploading={uploadingQ} onImageClick={() => setCompareMode(true)} />
                                            </div>
                                            <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark">
                                                <ImageUploader images={activeQuestion.schemeImages} onUpdate={(d, a, t) => handleImageUpdate(activeQuestion.id, d, a, 'scheme')} label="The Reality (Scheme)" isUploading={uploadingS} onImageClick={() => setCompareMode(true)} />
                                            </div>
                                        </div>

                                        {/* Right Col: Interrogation */}
                                        <div className="space-y-6">
                                            {/* AI Auto Review Block */}
                                            {(activeQuestion.aiReview || loadingMsg) && (
                                                <div className="bg-dark text-white dark:bg-[#18181b] p-6 rounded-3xl shadow-ds border border-dark dark:border-border-dark relative overflow-hidden">
                                                    <div className="absolute top-0 right-0 p-4 opacity-10"><Icons.Brain className="w-16 h-16"/></div>
                                                    <div className="text-[10px] font-bold uppercase tracking-widest text-gray mb-3 flex items-center gap-2"><Icons.Bot className="w-4 h-4 text-white"/> Examiner Roast AI</div>
                                                    {loadingMsg ? <div className="text-sm animate-pulse">{loadingMsg}</div> : <div className="text-sm leading-relaxed font-medium markdown-content" dangerouslySetInnerHTML={{ __html: marked.parse(activeQuestion.aiReview) }}></div>}
                                                </div>
                                            )}

                                            <div className="bg-white dark:bg-surface-dark p-6 md:p-8 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark space-y-6">
                                                <div>
                                                    <label className="text-[10px] font-bold text-gray uppercase tracking-widest block mb-2">1. What I did wrong</label>
                                                    <textarea value={activeQuestion.whatWrong} onChange={e=>updateQuestion(activeQuestion.id, {whatWrong: e.target.value})} className="form-control resize-none h-20" placeholder="Did you copy the number wrong? Miss a negative sign? Confess."/>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-gray uppercase tracking-widest block mb-2">2. Why I did wrong</label>
                                                    <textarea value={activeQuestion.whyWrong} onChange={e=>updateQuestion(activeQuestion.id, {whyWrong: e.target.value})} className="form-control resize-none h-20" placeholder="Conceptual failure? Time pressure? Be honest."/>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-gray uppercase tracking-widest block mb-2">3. What I was thinking</label>
                                                    <textarea value={activeQuestion.whatThinking} onChange={e=>updateQuestion(activeQuestion.id, {whatThinking: e.target.value})} className="form-control resize-none h-20" placeholder="Walk through your broken logic."/>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-gray uppercase tracking-widest block mb-2">4. Final Notes / Reminder</label>
                                                    <textarea value={activeQuestion.userNotes} onChange={e=>updateQuestion(activeQuestion.id, {userNotes: e.target.value})} className="form-control resize-none h-24" placeholder="Note to future self to not be stupid..."/>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
