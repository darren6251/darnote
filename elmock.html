                ctx.drawImage(img, 0, 0, width, height); 
                canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 1); 
            } 
        };

    const callAI = async (prompt, sys = "", images = [], apiUrl = GEMINI_PROXY_URL) => { 
        const parts = [{ text: `${sys}\n\nUser: ${prompt}` }]; 
        if (images?.length > 0) { 
            images.forEach(img => { 
                let mimeType = "image/png", data = img; 
                if (img.includes(",")) { 
                    const s = img.split(","); 
                    mimeType = s[0].match(/:(.*?);/)[1]; 
                    data = s[1]; 
                } 
                parts.push({ inlineData: { mimeType, data } }); 
            }); 
        } 
        try { 
            const response = await fetch(apiUrl, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ contents: [{ parts }] }) 
            }); 
            if (!response.ok) return `Error: ${response.status}`; 
            const data = await response.json(); 
            if (data.error) return `API Error: ${data.error.message}`; 
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "Empty response."; 
        } catch (error) { 
            return `Error: ${error.message}`; 
        } 
    };

    const callGroq = async (prompt, sys = "", images = []) => { 
        const userContent = [{ type: "text", text: prompt }]; 
        if (images?.length > 0) { 
            images.forEach(img => { userContent.push({ type: "image_url", image_url: { url: img } }); }); 
        } 
        const modelToUse = (images?.length > 0) ? "llama-3.2-90b-vision-preview" : "openai/gpt-oss-120b"; 
        const payload = { model: modelToUse, messages: [ { role: "system", content: sys }, { role: "user", content: userContent } ] }; 
        try { 
            const response = await fetch(GROQ_PROXY_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(payload) 
            }); 
            if (!response.ok) return `Error: ${response.status}`; 
            const data = await response.json(); 
            if (data.error) return `API Error: ${data.error.message}`; 
            return data.choices?.[0]?.message?.content || "Empty response."; 
        } catch (error) { 
            return `Error: ${error.message}`;

    const checkAndIncrementQuota = async (user, type, subtype = null) => { 
        if (!user) return false; 
        const limits = await getLimits(); 
        let field = '', limit = 0; 
        if (type === 'chat') { 
            if (subtype === 'groq') { field = 'chat_groq_count'; limit = limits.chat_groq; } 
            else { field = 'chat_count'; limit = limits.chat_gemini; } 
        } else if (type === 'practice') { 
            field = 'practice_count'; limit = limits.practice; 
        } else if (type === 'ocr') { 
            field = 'ocr_count'; limit = limits.ocr; 
        } 
        const today = new Date().toISOString().split('T')[0]; 
        const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today); 
        try { 
            const snap = await window.firebase.getDoc(ref); 
            let currentVal = null; 
            if (snap.exists() && typeof snap.data()[field] !== 'undefined') { 
                currentVal = snap.data()[field]; 
            } else { 
                const profileRef = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'settings', 'profile'); 
                const profileSnap = await window.firebase.getDoc(profileRef); 
                const status = profileSnap.exists() ? profileSnap.data().studentStatus : null; 
                const isStudent = status === 'verified' || status === 'temp_verified'; 
                currentVal = isStudent ? -20 : 0; 
            } 
            if (currentVal >= limit) return false; 
            if (!snap.exists() || typeof snap.data()[field] === 'undefined') { 
                const newVal = currentVal + 1; 
                await window.firebase.setDoc(ref, { [field]: newVal }, { merge: true }); 
                return newVal; 
            } else { 
                await window.firebase.setDoc(ref, { [field]: window.firebase.increment(1) }, { merge: true }); 
                return currentVal + 1; 
            } 
        } catch (e) { return false; } 
    };
    
    const useGoogleDrive = () => { 
        const [tokenClient, setTokenClient] = useState(null); 
        useEffect(() => { 
            if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return; 
            const load = async () => { 
                if (window.gapi) { 
                    await new Promise(r => window.gapi.load('client', r)); 
                    await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] }); 
                } 
                if (window.google) setTokenClient(window.google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly', callback: () => {} })); 
            }; 
            load(); 
        }, []); 
        
        const getAccessToken = () => new Promise((resolve, reject) => { 
            if (!tokenClient) return reject("Auth not initialized"); 
            const existing = window.gapi.client.getToken(); 
            if (existing && Date.now() < existing.expiry) return resolve(existing.access_token); 
            tokenClient.callback = (resp) => { 
                if (resp.error) reject(resp); 
                resolve(resp.access_token); 
            }; 
            tokenClient.requestAccessToken({ prompt: '' }); 
        }); 
        
        const saveToDrive = async (blob, filename, preFetchedToken = null, folderName = 'darNote_MockVault') => { 
            const token = preFetchedToken || await getAccessToken(); 
            let folderId; 
            const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`; 
            const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` } }); 
            const searchData = await search.json(); 
            if (searchData.files?.length) folderId = searchData.files[0].id; 
            else { 
                const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) }); 
                folderId = (await create.json()).id; 
            } 
            const metadata = { name: filename, mimeType: blob.type, parents: [folderId] }; 
            const form = new FormData(); 
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' })); 
            form.append('file', blob); 
            const upRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form }); 
            if(!upRes.ok) throw new Error(upRes.statusText); 
            const fileId = (await upRes.json()).id; 
            await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) }); 
            return blob.type === 'application/pdf' ? `https://drive.google.com/file/d/${fileId}/preview` : `https://lh3.googleusercontent.com/d/${fileId}`; 
        }; 
        return { saveToDrive, getAccessToken }; 
    };

    const processPDF = async (file) => {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const typedarray = new Uint8Array(arrayBuffer);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            const blobs = [];
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
                blobs.push(blob);
            }
            return blobs;
        } catch (err) {
            console.error("PDF Processing Error:", err);
            throw new Error("Failed to slice PDF. Make sure it's a valid PDF document.");
        }
    };

    const ImageViewer = ({ data, onClose }) => {
        const [currentIndex, setCurrentIndex] = useState(data.index || 0);
        const images = data.images || [];
        
        useEffect(() => {
            const h = (e) => {
                if (e.key === 'Escape') onClose();
                if (e.key === 'ArrowRight') setCurrentIndex(prev => Math.min(prev + 1, images.length - 1));
                if (e.key === 'ArrowLeft') setCurrentIndex(prev => Math.max(prev - 1, 0));
            };
            window.addEventListener('keydown', h);

        const handleFiles = (files) => {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/') || file.type === 'application/pdf') onUpdate(file, 'add');
            });
        };

        const handleCopyUrl = async (url) => {
            try {
                await navigator.clipboard.writeText(url);
                setCopiedUrl(url);
                setTimeout(() => setCopiedUrl(null), 2000);
            } catch (err) {
                console.error("Failed to copy URL", err);
            }
        };

        const handlePasteClick = async () => {
            try {
                const items = await navigator.clipboard.read();
                let foundBlob = false;
                for (const item of items) {
                    for (const type of item.types) {
                        if (type.startsWith("image/") || type === 'application/pdf') {
                            const blob = await item.getType(type);
                            onUpdate(blob, 'add');
                            foundBlob = true;
                        }
                    }
                }
                if (!foundBlob) {
                    const text = await navigator.clipboard.readText();
                    if (text && (text.startsWith('http') || text.startsWith('data:'))) {
                        onUpdate(text, 'add-url');
                    } else {
                        alert("No valid image or copied image link found in clipboard.");
                    }
                }
            } catch (err) {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text && (text.startsWith('http') || text.startsWith('data:'))) {
                        onUpdate(text, 'add-url');
                    } else {
                        alert("Clipboard permission denied or no valid link found.");
                    }
                } catch(e) {
                    alert("Clipboard permission denied.");
                }
            }
        };

                    <div className="flex gap-2">
                        <button onClick={handlePasteClick} className="text-xs font-medium flex items-center gap-1.5 text-primary hover:bg-primary/10 px-3 py-1.5 rounded-full transition-colors"><Icons.Clip className="w-3.5 h-3.5"/> Paste</button>
                        <button onClick={() => fileInputRef.current.click()} className="text-xs font-medium flex items-center gap-1.5 text-primary hover:bg-primary/10 px-3 py-1.5 rounded-full transition-colors"><Icons.Plus className="w-3.5 h-3.5"/> Add</button>
                    </div>
                    <input type="file" multiple ref={fileInputRef} style={{display:'none'}} onChange={(e) => handleFiles(e.target.files)} accept="image/*,application/pdf" />
                </div>
                <div className={`w-full min-h-[140px] bg-[#f8fafc] dark:bg-dark border-2 border-dashed rounded-xl p-4 transition-all cursor-pointer ${isDragging ? 'border-primary bg-primary/5' : 'border-gray/30 hover:border-primary/50'}`} onClick={() => imageList.length === 0 && fileInputRef.current.click()} onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={() => setIsDragging(false)} onDrop={(e) => { e.preventDefault(); setIsDragging(false); handleFiles(e.dataTransfer.files); }} onPaste={(e) => { const files = e.clipboardData.files; if (files && files.length > 0) { handleFiles(files); } else { const text = e.clipboardData.getData('text'); if (text && (text.startsWith('http') || text.startsWith('data:'))) onUpdate(text, 'add-url'); } }} tabIndex="0">
                    {imageList.length === 0 ? (
                        <div className="h-28 flex flex-col items-center justify-center pointer-events-none">
                            {isUploading ? <div className="w-8 h-8 border-4 border-primary/30 border-t-primary rounded-full animate-spin mb-3"/> : <div className="w-10 h-10 bg-white dark:bg-surface-dark rounded-full shadow-sm flex items-center justify-center mb-3"><Icons.Image className="w-5 h-5 text-gray"/></div>}
                            <span className="text-sm text-dark dark:text-light font-medium">{isUploading ? "Uploading to Drive..." : "Click or drag files here"}</span>
                            <span className="text-xs text-gray mt-1">Supports JPG, PNG, PDF</span>
                        </div>
                    ) : (
                        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
                            {imageList.map((url, idx) => (
                                <div key={idx} onClick={(e) => {e.stopPropagation(); onImageClick(idx)}} className="group relative aspect-square bg-white dark:bg-surface-dark rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all cursor-zoom-in border border-light-gray dark:border-border-dark">
                                    {url.includes('drive.google.com') ? <div className="w-full h-full flex flex-col items-center justify-center bg-[#fef2f2] dark:bg-[#3f1616] text-danger"><Icons.File className="w-8 h-8"/><span className="text-[10px] font-bold mt-2">PDF</span></div> : <img src={url} className="w-full h-full object-cover" />}

                                        <div className="p-2 bg-white/20 rounded-full text-white backdrop-blur-md hover:bg-white/40 transition-colors" title="View"><Icons.ZoomIn className="w-4 h-4"/></div>
                                        <button onClick={(e) => { e.stopPropagation(); handleCopyUrl(url); }} className="p-2 bg-primary rounded-full text-white shadow-lg hover:scale-110 transition-transform" title="Copy Image Link">{copiedUrl === url ? <Icons.Check className="w-4 h-4"/> : <Icons.Copy className="w-4 h-4"/>}</button>
                                        <button onClick={(e) => { e.stopPropagation(); onUpdate(idx, 'remove'); }} className="p-2 bg-danger rounded-full text-white shadow-lg hover:scale-110 transition-transform" title="Remove"><Icons.Trash className="w-4 h-4"/></button>
                                    </div>
                                </div>

                            {isUploading && (<div className="aspect-square rounded-xl bg-white dark:bg-surface-dark flex items-center justify-center border border-light-gray dark:border-border-dark shadow-sm"><div className="w-6 h-6 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>)}
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const cleanLatex = (t) => t.replace(/\$\$/g,'\n').replace(/\$/g,'').replace(/\\text\{([^}]+)\}/g,'$1').replace(/\\times/g,'×').replace(/\\approx/g,'≈').replace(/\\le/g,'≤').replace(/\\ge/g,'≥').replace(/\\rightarrow/g,'→').replace(/\\cdot/g,'·').replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'($1/$2)').replace(/\\/g,'');

    const AIChat = ({ activePage, onClose, user, messages, setMessages }) => {
        const [input, setInput] = useState(""); 
        const [loading, setLoading] = useState(false); 
        const [quota, setQuota] = useState(0); 
        const [limits, setLimits] = useState({ chat_gemini: 5, chat_groq: 20 }); 
        const [model, setModel] = useState('gemini'); 
        const messagesEndRef = useRef(null); 
        
        useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]); 
        
        useEffect(() => { 
            const f = async () => { 
                if (!user) return; 
                const l = await getLimits(); 
                setLimits(l); 
                const today = new Date().toISOString().split('T')[0]; 
                const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today); 
                const snap = await window.firebase.getDoc(ref); 
                if (snap.exists()) { 
                    const data = snap.data(); 
                    setQuota(model === 'groq' ? (data.chat_groq_count || 0) : (data.chat_count || 0)); 
                } else setQuota(0);

            f(); 
        }, [user, model]);
        
        const handleSend = async () => { 
            if(!input.trim()) return; 
            const limit = model === 'groq' ? limits.chat_groq : limits.chat_gemini; 
            const newQuota = await checkAndIncrementQuota(user, 'chat', model); 
            const userMsg = input; 
            setMessages(prev => [...prev, {role: 'user', text: userMsg}]); 
            setInput(""); 
            if (newQuota === false) { 
                setMessages(prev => [...prev, {role: 'ai', text: `🛑 **Daily Limit (${limit}/${limit}) Reached**\n\nCome back tomorrow!`}]); 
                return; 
            } 
            setQuota(newQuota); 
            setLoading(true); 
            
            let imgContexts = []; 
            if (model === 'gemini') { 
                const rawImages = activePage.questionImages?.length ? activePage.questionImages : []; 
                for (const rawUrl of rawImages) { 
                    if (rawUrl.startsWith('http') && !rawUrl.includes('drive.google.com')) { 
                        try { 
                            const res = await fetch(rawUrl); 
                            const blob = await res.blob(); 
                            const base64 = await new Promise((r) => { 
                                const reader = new FileReader(); 
                                reader.onloadend = () => r(reader.result); 
                                reader.readAsDataURL(blob); 
                            }); 
                            imgContexts.push(base64); 
                        } catch(e) {} 
                    } else if (rawUrl.startsWith('data:')) { 
                        imgContexts.push(rawUrl); 
                    } 
                } 
            } 
            const historyText = messages.slice(Math.max(messages.length - 6, 1)).map(m => `${m.role === 'user' ? 'Student' : 'Tutor'}: ${m.text}`).join('\n'); 
            const context = `Topic: ${activePage.topic}. What I did wrong: ${activePage.whatWrong}. Why: ${activePage.whyWrong}. Thought process: ${activePage.thoughtProcess}. Notes: ${activePage.markingNote}`; 
            const systemPrompt = `You are a tutor of a note app:darNote. Context: ${context}. \nPREVIOUS CHAT:\n${historyText}\n\nINSTRUCTIONS:\n1. Be CONCISE (TL;DR).\n2. Markdown yes, LaTeX NO. Use Unicode math.`; 
            let response = model === 'groq' ? await callGroq(userMsg, systemPrompt, imgContexts) : await callAI(userMsg, systemPrompt, imgContexts, GEMINI_PROXY_URL); 
            response = cleanLatex(response); 
            setMessages(prev => [...prev, {role: 'ai', text: response}]); 
            setLoading(false);

        return (
            <div className="flex flex-col h-full bg-[#f8fafc] dark:bg-onyx border-l border-light-gray dark:border-white/5 shadow-2xl">

                return;

            setReportAnalysisProgress("Warming up the interrogation room...");
            
            // Pre-emptively increment locally for instant UI update
            setMockPapers(prev => prev.map(m => m.id === activeMockId ? { ...m, reportAnalysisCount: currentCount + 1 } : m));
            
            // Use Firebase's atomic increment to prevent race conditions (and make it harder to accidentally overwrite)
            window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_papers', activeMockId), {
                reportAnalysisCount: window.firebase.increment(1)
            }).catch(e => console.error("Failed to increment count:", e));
            
            try {

                    if (imgUrl && imgUrl.includes('drive.google.com/file/d/')) {
                        const fileIdMatch = imgUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                        if (fileIdMatch && fileIdMatch[1]) {
                            try {
                                setReportAnalysisProgress(`Downloading PDF from Google's vault...`);
                                const token = await getAccessToken();
                                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileIdMatch[1]}?alt=media`, {
                                    headers: { Authorization: `Bearer ${token}` }
                                });
                                if (!res.ok) throw new Error("Failed to fetch PDF");

                                setReportAnalysisProgress(`Slicing PDF into bite-sized failures...`);

                                for (let j = 0; j < imageBlobs.length; j++) {
                                    setReportAnalysisProgress(`Converting page ${j+1} for AI consumption...`);
                                    const b64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(imageBlobs[j]);});
                                    imgB64s.push(b64);
                                }
                            } catch (err) {
                                console.error("PDF Extraction error:", err);
                                alert("Failed to slice the PDF. Ensure you allowed popups for Drive access.");
                            }
                        }
                    } else if (imgUrl && !imgUrl.includes('drive.google.com')) {
                        try {

                            const b64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(blob);});
                            imgB64s.push(b64);

                    } else if (imgUrl && imgUrl.startsWith('data:')) {
                        imgB64s.push(imgUrl);
                    }
                }
                
                if(imgB64s.length === 0) { 
                    alert("I couldn't read the files. Give me standard images (JPG/PNG) or let me access the Drive PDF!"); 
                    setIsAnalyzingReport(false); 
                    setReportAnalysisProgress("");
                    return;

                setReportAnalysisProgress("Scanning report for your academic crimes...");
                const extractPrompt = `Analyze this exam report/grading sheet. Which specific question numbers did the student lose marks on, fail, or get incorrect? \nReturn ONLY a valid JSON array of integers. Example: [1, 4, 12]. If none found, return []. Do not include any markdown or other text.`;

                setReportAnalysisProgress("Cross-referencing your failures with your page logs...");

- What I got wrong: ${p.whatWrong || 'No confession logged.'}
- Why I was wrong: ${p.whyWrong || 'No confession logged.'}
- My flawed logic: ${p.thoughtProcess || 'No confession logged.'}`).join('\n\n');
                    } else {
                        confessionContext = `The AI found mistakes on questions: ${failedQuestions.join(', ')}. However, the student hasn't logged any confessions for these specific pages yet. They are hiding their shame.`;
                    }
                } else {
                    confessionContext = "The AI couldn't pinpoint specific failed question numbers from the report format, but analyze their general performance anyway.";

                setReportAnalysisProgress("Drafting the final brutal analysis...");

${confessionContext}

Analyze my uploaded report card alongside my confessions.

{
  "overallSummary": "Summarize my miserable overall performance. Highlight strengths and glaring weaknesses.",

  "questionBreakdowns": [
    {
      "question": 1,
      "aiComment": "Roast my flawed logic and root causes for this specific question. Connect it to the report."
    }
  ]
}`;

                const aiRes = await callAI(finalPrompt, "Report Analyst", imgB64s, GEMINI_PROXY_URL);
                
                let cleanJson = aiRes;

                    if (jsonMatch) cleanJson = jsonMatch[0];

                    updateMock(activeMockId, { reportAnalysis: cleanJson });

                    console.error("AI returned invalid JSON, saving raw fallback", e);
                    updateMock(activeMockId, { reportAnalysis: aiRes });

        const generateSummaryFromPages = async () => {

        const handleImageUpdate = async (data, action, type) => {

                        return { ...p, [targetField]: newArr };

                }));

            if (action === 'add-url') {

                try { await getAccessToken(); } catch(e) {

                    setIsUploading(false); return; 
                }
                
                let initialStaging = [];
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.type === 'application/pdf') {
                        setUploadStatus("Slicing PDF...");
                        const blobs = await processPDF(file);
                        for (let j=0; j<blobs.length; j++) {
                            const url = URL.createObjectURL(blobs[j]);
                            initialStaging.push({ id: `temp_${Date.now()}_${i}_${j}`, files: [blobs[j]], previews: [url] });
                        }
                    } else if (file.type.startsWith('image/')) {

                setStagingPages(prev => [...prev, ...initialStaging]);

            setIsUploading(false);

        const handleMergeStaging = (index) => {
            const newPages = [...stagingPages];

            newPages.splice(index, 2, {
                id: current.id,
                files: [...current.files, ...next.files],
                previews: [...current.previews, ...next.previews]
            });
            setStagingPages(newPages);
        };

            const newPages = [...stagingPages];
            const targetPage = newPages[pageIndex];
            const fileToExtract = targetPage.files[fileIndex];
            const previewToExtract = targetPage.previews[fileIndex];

                id: `temp_${Date.now()}_split_${Math.random()}`,
                files: [fileToExtract],
                previews: [previewToExtract]
            });
            setStagingPages(newPages);

                        setUploadStatus(`Uploading Q${i+1} - Part ${j+1}/${page.files.length}...`);

                        const compressed = await compressImage(file);

                    const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_papers', activeMockId, 'pages'), newPage);

                    if (!firstNewPageId) firstNewPageId = docRef.id;

                await fetchMockPages(activeMockId);
                setStagingPages([]);
                if (firstNewPageId) setActivePageId(firstNewPageId);
            } catch(e) {
                alert("Failed to commit pages: " + e.message);
            }
            setIsUploading(false);
            setUploadStatus("");
        };

        // GEMINI POWERED AUTO ANALYSIS

            if (page.whatWrong || page.whyWrong || page.thoughtProcess || isAiLoading) return;
            const newQuota = await checkAndIncrementQuota(user, 'ocr'); 
            if (newQuota === false) { console.log("Lazy AI skipped: OCR quota reached."); return; }

            setIsAiLoading(true);
            try {
                let imgB64 = "";
                const imgUrl = page.questionImages?.[0];
                if (imgUrl && !imgUrl.includes('drive.google.com')) {
                    const res = await fetch(imgUrl);
                    const blob = await res.blob();
                    imgB64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(blob);});
                } else if (imgUrl) {
                    imgB64 = imgUrl; 
                }
                if(!imgB64) { setIsAiLoading(false); return; }

                // Retrieve active mock to get subjects and their available topics
                const activeMockInstance = mockPapers.find(m => m.id === activeMockId);
                const currentSubInstance = activeMockInstance ? subjects.find(s => s.name === activeMockInstance.subject) : null;
                const availableTopics = currentSubInstance?.topics || [];
                
                const topicsStr = availableTopics.length 
                    ? `Choose the most relevant topic from this exact list: [${availableTopics.join(', ')}]. If none match well, return an empty string.` 
                    : "Return an empty string for the topic.";

                const prompt = `You are a ruthlessly efficient, slightly sarcastic AI tutor analyzing an exam. Identify the mistakes the student made. Be highly accurate but concise. \nReturn strictly JSON format: { "whatWrong": "Short summary of the exact mistake", "whyWrong": "Underlying conceptual reason for the mistake", "thoughtProcess": "Probable flawed thought process the student had", "topic": "Matched topic string" }. ${topicsStr}`;
                
                // Using Gemini (callAI) instead of Groq
                const aiRes = await callAI(prompt, "JSON Generator", [imgB64], GEMINI_PROXY_URL);
                
                let jsonStr = aiRes;
                const match = jsonStr.match(/\{[\s\S]*\}/);
                if (match) jsonStr = match[0];
                const result = JSON.parse(jsonStr);
                
                updatePage(page.id, {
                    whatWrong: result.whatWrong || "Could not determine.",
                    whyWrong: result.whyWrong || "Could not determine.",
                    thoughtProcess: result.thoughtProcess || "Could not determine.",
                    topic: result.topic && availableTopics.includes(result.topic) ? result.topic : (page.topic || '')
                });
            } catch(e) { console.error("Gemini Auto-Analysis Error", e); }
            setIsAiLoading(false);
        };

            if (activePageId) {

        const activePage = mockPages.find(p => p.id === activePageId);

                                    <h2 className="text-3xl font-bold flex items-center gap-3"><Icons.Scan className="w-8 h-8 text-warning"/> PDF Purgatory</h2>

                                </div>
                                <div className="flex gap-3 shrink-0 w-full md:w-auto">

                                                    <div className="space-y-2 group">
                                                        <label className="text-xs font-bold text-gray uppercase tracking-wider flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-warning"></div> Why I was wrong</label>
                                                        <textarea value={activePage.whyWrong || ''} onChange={e=>updatePage(activePage.id, {whyWrong:e.target.value})} className="w-full bg-[#f8fafc] dark:bg-dark border border-transparent focus:border-primary/50 rounded-xl p-4 text-sm outline-none text-dark dark:text-light resize-none transition-all shadow-inner group-hover:bg-white dark:group-hover:bg-[#1a1a1c] group-hover:border-light-gray dark:group-hover:border-white/10" rows="3" placeholder="Underlying conceptual reason..."/>
                                                    </div>

                                                    <div className="space-y-2 group">
                                                        <label className="text-xs font-bold text-gray uppercase tracking-wider flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-primary-light"></div> What I was thinking</label>
                                                        <textarea value={activePage.thoughtProcess || ''} onChange={e=>updatePage(activePage.id, {thoughtProcess:e.target.value})} className="w-full bg-[#f8fafc] dark:bg-dark border border-transparent focus:border-primary/50 rounded-xl p-4 text-sm outline-none text-dark dark:text-light resize-none transition-all shadow-inner group-hover:bg-white dark:group-hover:bg-[#1a1a1c] group-hover:border-light-gray dark:group-hover:border-white/10" rows="3" placeholder="What mental gymnastics led to this answer..."/>
                                                    </div>

                                                    <div className="h-px w-full bg-light-gray dark:bg-border-dark"></div>

                                                    <div className="space-y-2 group">
                                                        <label className="text-xs font-bold text-gray uppercase tracking-wider flex items-center gap-2"><Icons.FileText className="w-4 h-4"/> Marking Scheme Notes</label>
                                                        <textarea value={activePage.markingNote || ''} onChange={e=>updatePage(activePage.id, {markingNote:e.target.value})} className="w-full bg-white dark:bg-surface-dark border border-light-gray dark:border-white/10 focus:border-primary dark:focus:border-primary-light rounded-xl p-4 text-sm outline-none text-dark dark:text-light resize-none transition-all shadow-sm" rows="4" placeholder="Extra notes or specific tricks from the marking scheme..."/>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="lg:col-span-1 space-y-6">
                                                <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-success"></div>
                                                    <label className="text-sm font-medium text-dark dark:text-light block mb-3 pl-2">Correct Answer</label>
                                                    <input value={activePage.correctAnswer || ''} onChange={e=>updatePage(activePage.id, {correctAnswer:e.target.value})} className="w-full bg-[#f8fafc] dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark rounded-xl px-4 py-3 font-mono text-lg font-bold text-success focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-success focus:outline-none transition-all" placeholder="e.g. A, 42"/>
                                                </div>
                                                <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-danger"></div>
                                                    <label className="text-sm font-medium text-dark dark:text-light block mb-3 pl-2">Marks Deducted</label>
                                                    <input value={activePage.marks || ''} onChange={e=>updatePage(activePage.id, {marks:e.target.value})} className="w-full bg-[#f8fafc] dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark rounded-xl px-4 py-3 font-mono text-lg font-bold text-danger focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-danger focus:outline-none transition-all" placeholder="-1"/>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </motion.div>
                        )}
                        <AnimatePresence>{isAiOpen && activePage && user && (<div className="absolute top-[72px] lg:top-0 right-0 bottom-0 w-full sm:w-[400px] z-40 shadow-2xl"><AIChat activePage={activePage} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>
                    </main>
                </div>

                {/* Mobile Bottom Navigation */}
                <div className="lg:hidden fixed bottom-0 left-0 right-0 h-16 bg-white dark:bg-surface-dark border-t border-light-gray dark:border-border-dark flex justify-around items-center px-2 z-50 pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.05)] dark:shadow-[0_-4px_10px_rgba(0,0,0,0.2)]">
                    <button onClick={() => { setMobileView('mocks'); setActiveMockId(null); setActivePageId(null); setMockTab('pages'); }} className={`flex flex-col items-center justify-center w-16 h-full gap-1 transition-colors ${mobileView === 'mocks' && !activeMockId ? 'text-primary dark:text-primary-light' : 'text-gray dark:text-zinc-400 hover:text-dark dark:hover:text-light'}`}>
                        <Icons.Folder className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Mocks</span>
                    </button>
                    <a href="el.html" className="flex flex-col items-center justify-center w-16 h-full gap-1 text-gray dark:text-zinc-400 hover:text-primary transition-colors">
                        <Icons.Book className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Logs</span>
                    </a>
                </div>
                
                <AnimatePresence>
                    {undoToast && (
                        <motion.div initial={{ y: 100, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 100, opacity: 0 }} className="fixed bottom-24 lg:bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-onyx dark:bg-white text-white dark:text-onyx px-5 py-3 rounded-full shadow-2xl flex items-center gap-4 text-sm font-medium border border-white/10 dark:border-black/10">
                            <span className="flex items-center gap-2 whitespace-nowrap"><Icons.Check className="w-4 h-4 text-success"/> Image removed</span>
                            <div className="w-px h-4 bg-white/20 dark:bg-black/20"></div>
                            <button onClick={handleUndo} className="text-primary-light dark:text-primary hover:opacity-80 transition-opacity uppercase font-bold tracking-wider text-xs whitespace-nowrap">Undo</button>
                            <button onClick={() => { setUndoToast(null); if(window.undoTimer) clearTimeout(window.undoTimer); }} className="text-gray-400 hover:text-white dark:hover:text-black transition-colors ml-1"><Icons.X className="w-4 h-4"/></button>
                        </motion.div>
                    )}
                </AnimatePresence>
                
                <AnimatePresence>
                    {compareMode && activePageId && (
                        <CompareLightbox mockPages={mockPages} activePageId={activePageId} setActivePageId={setActivePageId} onClose={() => setCompareMode(false)} />
                    )}
                </AnimatePresence>

                <AnimatePresence>
                    {viewerImages && <ImageViewer data={viewerImages} onClose={() => setViewerImages(null)} />}
                </AnimatePresence>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
