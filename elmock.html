            const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_papers'), newMock);
            
            // Update Cooldown
            await window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'settings', 'profile'), { lastMockCreated: Date.now() }, { merge: true });
            
            setMockPapers(prev => [{...newMock, id: docRef.id}, ...prev]);
            setActiveMockId(docRef.id);
        };

        const updateMock = async (id, updates) => {
            setMockPapers(prev => prev.map(m => m.id === id ? { ...m, ...updates } : m));
            await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_papers', id), updates);
        };

        const updatePage = (id, updates) => { 
            setMockPages(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p)); 
            if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current); 
            pendingUpdatesRef.current[id] = { ...(pendingUpdatesRef.current[id] || {}), ...updates }; 
            saveTimeoutRef.current = setTimeout(async () => { 
                const ids = Object.keys(pendingUpdatesRef.current); 
                for (const pid of ids) { 
                    const payload = pendingUpdatesRef.current[pid]; 
                    delete pendingUpdatesRef.current[pid]; 
                    await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'elmock', pid), payload); 
                } 
            }, 1000); 
        };

        const deleteMock = async (id) => {
            if(!confirm("Eradicate this entire mock paper and all its pages?")) return;
            setMockPapers(prev => prev.filter(m => m.id !== id));
            if (activeMockId === id) setActiveMockId(null);
            await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'mock_papers', id));
            // Should technically delete children pages too, but simplified for single file.
        };

        // File Upload (Images & PDF)
        const handleFileUpload = async (files) => {
            if (!files || files.length === 0 || !activeMockId) return;
            setIsUploading(true);
            try {
                let token;
                try { token = await getAccessToken(); } catch(e) { alert("Drive Auth required."); setIsUploading(false); return; }
                
                let currentMaxPage = mockPages.length;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.type === 'application/pdf') {
                        setUploadStatus("Slicing PDF...");
                        const blobs = await processPDF(file);
                        for (let j=0; j<blobs.length; j++) {
                            setUploadStatus(`Uploading PDF Page ${j+1}/${blobs.length}...`);
                            const compressed = await compressImage(blobs[j]);
                            const url = await saveToDrive(compressed, `Mock_${activeMockId}_Page_${currentMaxPage+1}.jpg`, token);
                            await createPageDoc(url, currentMaxPage+1);
                            currentMaxPage++;
                        }
                    } else if (file.type.startsWith('image/')) {
                        setUploadStatus(`Uploading Image ${i+1}/${files.length}...`);
                        const compressed = await compressImage(file);
                        const url = await saveToDrive(compressed, `Mock_${activeMockId}_Page_${currentMaxPage+1}.jpg`, token);
                        await createPageDoc(url, currentMaxPage+1);
                        currentMaxPage++;
                    }
                }
                await fetchMockPages(activeMockId);
            } catch(e) {
                alert("Upload failed: " + e.message);
            }
            setIsUploading(false);
            setUploadStatus("");
        };

        const createPageDoc = async (url, pageNum) => {
            const newPage = { mockId: activeMockId, pageNumber: pageNum, imageUrl: url, topic: '', whatWrong: '', whyWrong: '', thoughtProcess: '', markingNote: '', mastered: false, createdAt: new Date().toISOString() };
            await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'elmock'), newPage);
        };

        // Lazy AI Review
        const doLazyAI = async (page) => {
            if (page.whatWrong || page.whyWrong || page.thoughtProcess || isAiLoading) return;
            setIsAiLoading(true);
            try {
                let imgB64 = "";
                if (!page.imageUrl.includes('drive.google.com')) {
                    const res = await fetch(page.imageUrl);
                    const blob = await res.blob();
                    imgB64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(blob);});
                } else {
                    imgB64 = page.imageUrl; // Fallback, Groq won't read Drive URLs easily though
                }
                
                const prompt = `Analyze this specific page from an exam. Identify the mistakes the student made. \nReturn strictly JSON format: { "whatWrong": "Short summary of the exact mistake", "whyWrong": "Underlying conceptual reason for the mistake", "thoughtProcess": "Probable flawed thought process the student had" }`;
                const aiRes = await callGroq(prompt, "JSON Generator", [imgB64]);
                const jsonStr = aiRes.substring(aiRes.indexOf('{'), aiRes.lastIndexOf('}') + 1);
                const result = JSON.parse(jsonStr);
                
                updatePage(page.id, {
                    whatWrong: result.whatWrong || "Could not determine.",
                    whyWrong: result.whyWrong || "Could not determine.",
                    thoughtProcess: result.thoughtProcess || "Could not determine."
                });
            } catch(e) { console.error("Lazy AI Error", e); }
            setIsAiLoading(false);
        };

        useEffect(() => {
            if (activePageId) {
                const page = mockPages.find(p => p.id === activePageId);
                if (page) doLazyAI(page);
                setChatMessages([{role: 'ai', text: "How can I assist with this specific mock page?"}]);
            }
        }, [activePageId]);

        const activeMock = mockPapers.find(m => m.id === activeMockId);
        const activePage = mockPages.find(p => p.id === activePageId);
        const currentSub = activeMock ? subjects.find(s=>s.name===activeMock.subject) : null;

        if (!user) return (<div className="h-screen w-full flex items-center justify-center bg-white dark:bg-onyx flex-col gap-6 relative overflow-hidden"><div className="z-10 flex flex-col items-center"><img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-16 h-16 mb-6 rounded-2xl shadow-sm grayscale opacity-80"/><h1 className="text-4xl font-bold text-dark dark:text-light tracking-tight font-sans mb-3">darNote Mock Vault</h1><p className="text-base text-gray max-w-sm text-center mb-10">Sign in to securely stash and analyze your mock exams.</p><button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-primary text-white dark:bg-light dark:text-dark px-8 py-3.5 rounded-full font-medium flex gap-3 items-center hover:opacity-90 transition-all shadow-md w-64 justify-center text-sm"><Icons.Google className="w-4 h-4"/> Authenticate</button></div></div>);

        return (
            <div className={`flex flex-col h-screen w-full transition-colors duration-300 ${isDarkMode ? 'dark bg-onyx' : 'bg-[#f4f4f5]'}`}>
                <StudentModal isOpen={showStudentModal} onClose={() => setShowStudentModal(false)} user={user} saveToDrive={saveToDrive} getAccessToken={getAccessToken} callGroq={callGroq} />
                <AnimatePresence>{compareMode && activePage && <CompareLightbox activePage={activePage} onClose={() => setCompareMode(false)} />}</AnimatePresence>

                {/* Header */}
                <header className="bg-white dark:bg-surface-dark text-dark dark:text-light px-4 py-2 flex justify-between items-center z-30 shrink-0 border-b border-light-gray dark:border-border-dark h-16 shadow-sm">
                    <div className="flex items-center gap-3 font-medium text-lg tracking-tight cursor-pointer px-2" onClick={() => {setActiveMockId(null); setActivePageId(null);}}>
                        <div className="w-8 h-8 rounded-lg bg-black dark:bg-white flex items-center justify-center"><Icons.Folder className="w-4 h-4 text-white dark:text-black"/></div>
                        <span className="text-gray dark:text-gray/80 hidden lg:inline font-mono text-sm uppercase tracking-widest">Vault /</span> <span className="font-bold">Mocks</span>
                    </div>
                    
                    <div className="flex items-center gap-3">
                        <button onClick={() => setShowStudentModal(true)} className="hidden md:flex items-center gap-2 px-4 py-2 rounded-full text-xs font-semibold text-primary bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition-all border border-black/5 dark:border-white/5">
                            <Icons.GraduationCap className="w-4 h-4"/> Cooldown Pass
                        </button>
                        <button onClick={()=>setIsDarkMode(!isDarkMode)} className="p-2 text-gray hover:bg-black/5 dark:hover:bg-white/5 rounded-full transition-colors mx-1" title="Toggle Theme">
                            {isDarkMode ? <Icons.Sun className="w-5 h-5"/> : <Icons.Moon className="w-5 h-5"/>}
                        </button>
                        <div className="flex items-center gap-3 pl-2 border-l border-light-gray dark:border-white/10">
                            {user.photoURL ? <img src={user.photoURL} className="w-8 h-8 rounded-full border border-light-gray dark:border-white/10 grayscale opacity-90"/> : <div className="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs">U</div>}
                        </div>
                    </div>
                </header>

                <div className="flex-1 flex overflow-hidden">
                    {/* Left Sidebar - Mock Papers */}
                    <div className={`flex-shrink-0 bg-white dark:bg-surface-dark flex-col z-20 border-r border-light-gray dark:border-border-dark w-[280px] hidden lg:flex transition-colors duration-300`}>
                        <div className="p-4 border-b border-light-gray dark:border-border-dark">
                            <button onClick={createMockPaper} className="w-full flex items-center justify-center gap-2 bg-primary text-white dark:bg-light dark:text-dark py-3 rounded-xl font-medium shadow-sm hover:opacity-90 transition-all"><Icons.Plus className="w-5 h-5"/> New Mock Paper</button>
                        </div>
                        <div className="px-4 py-3 bg-[#f4f4f5] dark:bg-onyx border-b border-light-gray dark:border-border-dark flex justify-between items-center shrink-0">
                            <span className="text-xs font-bold text-gray uppercase tracking-wider">Archive ({mockPapers.length})</span>
                        </div>
                        <div className="flex-1 overflow-y-auto p-3 space-y-1">
                            {isLoadingMocks ? <div className="text-center text-gray py-4 text-xs">Loading...</div> : mockPapers.map(m => (
                                <button key={m.id} onClick={()=>{setActiveMockId(m.id); setActivePageId(null);}} className={`w-full text-left p-3 rounded-xl transition-all border ${activeMockId===m.id ? 'bg-black/5 dark:bg-white/10 border-transparent font-semibold shadow-sm text-dark dark:text-light' : 'bg-transparent border-transparent hover:bg-black/5 dark:hover:bg-white/5 text-gray hover:text-dark dark:hover:text-light'}`}>
                                    <div className="truncate text-sm mb-1">{m.title}</div>
                                    <div className="text-[10px] font-mono opacity-60 flex justify-between"><span>{m.subject}</span> <span>{new Date(m.createdAt).toLocaleDateString()}</span></div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 flex-col min-w-0 bg-[#f4f4f5] dark:bg-onyx relative transition-colors duration-300 flex w-full">
                        {!activeMockId ? (
                            <div className="h-full flex flex-col items-center justify-center text-gray space-y-4">
                                <div className="w-20 h-20 bg-black/5 dark:bg-white/5 rounded-full flex items-center justify-center mb-2"><Icons.Folder className="w-10 h-10 opacity-50"/></div>
                                <h2 className="text-xl font-bold text-dark dark:text-light tracking-tight">Vault is locked.</h2>
                                <p className="text-sm">Select a Mock Paper from the sidebar to begin.</p>
                            </div>
                        ) : !activePageId ? (
                            /* MOCK DETAIL VIEW (Grid of Pages) */
                            <div className="flex flex-col h-full">
                                <header className="p-6 md:p-10 bg-white dark:bg-surface-dark shrink-0 border-b border-light-gray dark:border-border-dark flex justify-between items-start">
                                    <div className="flex-1 max-w-2xl">
                                        <input value={activeMock.title} onChange={e=>updateMock(activeMock.id, {title:e.target.value})} className="bg-transparent text-3xl font-bold outline-none w-full text-dark dark:text-light tracking-tight mb-4" placeholder="Untitled Mock"/>
                                        <div className="flex items-center gap-4">
                                            <div className="bg-light-gray/50 dark:bg-dark rounded-xl p-1 inline-flex border border-light-gray dark:border-white/5">
                                                <select value={activeMock.subject} onChange={e=>updateMock(activeMock.id, {subject:e.target.value})} className="bg-transparent px-3 py-1.5 text-sm font-medium outline-none cursor-pointer text-dark dark:text-light"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select>
                                            </div>
                                            <span className="text-xs text-gray font-mono">{new Date(activeMock.createdAt).toLocaleDateString()}</span>
                                        </div>
                                    </div>
                                    <button onClick={() => deleteMock(activeMock.id)} className="p-2.5 rounded-full hover:bg-danger/10 text-gray hover:text-danger transition-colors"><Icons.Trash className="w-5 h-5"/></button>
                                </header>
                                <div className="flex-1 overflow-y-auto p-6 md:p-10">
                                    <div className="max-w-6xl mx-auto space-y-6">
                                        <div className="flex justify-between items-end mb-6">
                                            <h3 className="text-lg font-bold text-dark dark:text-light">Pages ({mockPages.length})</h3>
                                            <div className="relative">
                                                <input type="file" id="mockUpload" multiple accept="image/*,application/pdf" className="hidden" onChange={(e) => handleFileUpload(e.target.files)} />
                                                <label htmlFor="mockUpload" className={`cursor-pointer bg-primary text-white dark:bg-light dark:text-dark px-5 py-2.5 rounded-xl font-medium shadow-sm hover:opacity-90 transition-all flex items-center gap-2 text-sm ${isUploading?'opacity-50 pointer-events-none':''}`}>
                                                    {isUploading ? <div className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <Icons.CloudUpload className="w-4 h-4"/>}
                                                    {isUploading ? "Processing..." : "Upload PDF / Images"}
                                                </label>
                                            </div>
                                        </div>
                                        {isUploading && <div className="w-full bg-black/5 dark:bg-white/5 rounded-xl p-4 text-center text-sm font-medium animate-pulse border border-black/10 dark:border-white/10">{uploadStatus}</div>}
                                        
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                            {mockPages.map((page, idx) => (
                                                <motion.div initial={{opacity:0, y:10}} animate={{opacity:1, y:0}} key={page.id} onClick={() => setActivePageId(page.id)} className="bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-sm border border-light-gray dark:border-white/5 cursor-pointer hover:shadow-md hover:border-gray/30 transition-all group relative aspect-[3/4] flex flex-col">
                                                    <div className="flex-1 bg-light-gray/30 dark:bg-black/20 p-2 overflow-hidden flex items-center justify-center">
                                                        <img src={page.imageUrl} className="max-w-full max-h-full object-contain mix-blend-multiply dark:mix-blend-normal rounded-lg shadow-sm" />
                                                    </div>
                                                    <div className="p-3 bg-white dark:bg-surface-dark border-t border-light-gray dark:border-white/5 flex justify-between items-center">
                                                        <span className="text-xs font-bold">Page {page.pageNumber}</span>
                                                        {page.mastered && <Icons.Check className="w-3.5 h-3.5 text-success"/>}
                                                    </div>
                                                    <div className="absolute inset-0 bg-primary/0 group-hover:bg-primary/5 transition-colors"></div>
                                                </motion.div>
                                            ))}
                                        </div>
                                        {mockPages.length === 0 && !isUploading && (
                                            <div className="text-center py-20 border-2 border-dashed border-gray/20 rounded-3xl">
                                                <Icons.FileText className="w-12 h-12 mx-auto text-gray/30 mb-4"/>
                                                <p className="text-gray font-medium">Drag and drop a Mock PDF here, or click Upload.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* PAGE EDITOR VIEW */
                            <motion.div initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} className="flex flex-col h-full bg-white dark:bg-surface-dark">
                                <header className="h-[64px] flex items-center justify-between px-4 border-b border-light-gray dark:border-border-dark shrink-0">
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => setActivePageId(null)} className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-gray transition-colors"><Icons.ArrowLeft className="w-5 h-5"/></button>
                                        <div className="font-bold text-dark dark:text-light">Page {activePage.pageNumber}</div>
                                        <div className="w-px h-5 bg-light-gray dark:bg-white/10"></div>
                                        <select value={activePage.topic || ''} onChange={e=>updatePage(activePage.id, {topic:e.target.value})} className="bg-transparent text-sm font-medium text-gray outline-none cursor-pointer"><option value="">-- Assign Topic --</option>{currentSub?.topics.map(t => <option key={t} value={t}>{t}</option>)}</select>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {isAiLoading && <div className="text-[10px] font-bold uppercase tracking-wider text-gray animate-pulse flex items-center gap-1"><Icons.Sparkles className="w-3 h-3"/> AI Analyzing...</div>}
                                        <button onClick={()=>updatePage(activePage.id, {mastered: !activePage.mastered})} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all uppercase tracking-wider border ${activePage.mastered ? 'bg-primary text-white dark:bg-light dark:text-dark border-transparent' : 'bg-transparent border-gray/30 text-gray hover:text-dark dark:hover:text-light'}`}>{activePage.mastered ? 'Mastered' : 'Mark Mastered'}</button>
                                        <div className="w-px h-5 bg-light-gray dark:bg-white/10 mx-1"></div>
                                        <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-2 rounded-full transition-colors ${isAiOpen ? 'bg-black/5 dark:bg-white/10 text-primary dark:text-light' : 'text-gray hover:bg-black/5 dark:hover:bg-white/5'}`}><Icons.Bot className="w-5 h-5"/></button>
                                    </div>
                                </header>
                                <div className="flex-1 flex overflow-hidden">
                                    {/* Left: The Image */}
                                    <div className="w-1/2 border-r border-light-gray dark:border-border-dark bg-[#f4f4f5] dark:bg-onyx p-6 flex flex-col items-center justify-center relative group">
                                        <img src={activePage.imageUrl} className="max-w-full max-h-full object-contain rounded-xl shadow-sm border border-black/5 dark:border-white/5 cursor-zoom-in" onClick={() => setCompareMode(true)}/>
                                        <button onClick={() => setCompareMode(true)} className="absolute bottom-6 right-6 p-3 bg-white dark:bg-surface-dark rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity text-dark dark:text-light border border-light-gray dark:border-white/10"><Icons.ZoomIn className="w-5 h-5"/></button>
                                    </div>
                                    {/* Right: The Editor Fields */}
                                    <div className="w-1/2 overflow-y-auto p-8 space-y-8 bg-white dark:bg-surface-dark relative">
                                        <div className="absolute top-0 left-0 right-0 h-1 bg-black/5 dark:bg-white/5"></div>
                                        
                                        <div className="space-y-2 group">
                                            <label className="text-xs font-bold text-gray uppercase tracking-wider flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-danger"></div> What I got wrong</label>
                                            <textarea value={activePage.whatWrong} onChange={e=>updatePage(activePage.id, {whatWrong:e.target.value})} className="w-full bg-[#f4f4f5] dark:bg-dark border border-transparent focus:border-gray/30 rounded-xl p-4 text-sm outline-none text-dark dark:text-light resize-none transition-all shadow-inner group-hover:bg-white dark:group-hover:bg-[#111113] group-hover:border-light-gray dark:group-hover:border-white/10" rows="3" placeholder="AI analysis or manual input..."/>
                                        </div>

                                        <div className="space-y-2 group">
                                            <label className="text-xs font-bold text-gray uppercase tracking-wider flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-warning"></div> Why I was wrong</label>
                                            <textarea value={activePage.whyWrong} onChange={e=>updatePage(activePage.id, {whyWrong:e.target.value})} className="w-full bg-[#f4f4f5] dark:bg-dark border border-transparent focus:border-gray/30 rounded-xl p-4 text-sm outline-none text-dark dark:text-light resize-none transition-all shadow-inner group-hover:bg-white dark:group-hover:bg-[#111113] group-hover:border-light-gray dark:group-hover:border-white/10" rows="3" placeholder="AI analysis or manual input..."/>
                                        </div>

                                        <div className="space-y-2 group">
                                            <label className="text-xs font-bold text-gray uppercase tracking-wider flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-primary-light"></div> What I was thinking</label>
                                            <textarea value={activePage.thoughtProcess} onChange={e=>updatePage(activePage.id, {thoughtProcess:e.target.value})} className="w-full bg-[#f4f4f5] dark:bg-dark border border-transparent focus:border-gray/30 rounded-xl p-4 text-sm outline-none text-dark dark:text-light resize-none transition-all shadow-inner group-hover:bg-white dark:group-hover:bg-[#111113] group-hover:border-light-gray dark:group-hover:border-white/10" rows="3" placeholder="AI analysis or manual input..."/>
                                        </div>

                                        <div className="h-px w-full bg-light-gray dark:bg-white/5"></div>

                                        <div className="space-y-2 group">
                                            <label className="text-xs font-bold text-gray uppercase tracking-wider flex items-center gap-2"><Icons.FileText className="w-3.5 h-3.5"/> Manual Marking Notes</label>
                                            <textarea value={activePage.markingNote} onChange={e=>updatePage(activePage.id, {markingNote:e.target.value})} className="w-full bg-white dark:bg-surface-dark border border-light-gray dark:border-white/10 focus:border-primary dark:focus:border-light rounded-xl p-4 text-sm outline-none text-dark dark:text-light resize-none transition-all shadow-sm" rows="4" placeholder="Extra notes from the marking scheme..."/>
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        )}
                        <AnimatePresence>{isAiOpen && activePage && user && (<div className="absolute top-[64px] right-0 bottom-0 w-[400px] z-40 shadow-2xl"><AIChat activePage={activePage} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>
                    </main>
                </div>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
