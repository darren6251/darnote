        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("Uncaught error:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex flex-col items-center justify-center h-full text-zinc-500 p-8 text-center">
                            <div className="text-4xl mb-4">😵</div>
                            <h2 className="text-xl font-bold mb-2">Something went wrong.</h2>
                            <p className="text-sm mb-4">The editor crashed. It happens to the best of us.</p>
                            <button onClick={() => window.location.reload()} className="bg-indigo-600 text-white px-4 py-2 rounded-lg">Reload Page</button>
                        </div>
                    );
                }
                return this.props.children;
            }

            Brain: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>,
        };

        const callGemini = async (prompt, systemInstruction = "", imageBase64 = null) => {
            const proxyUrl = "https://gemini-proxy-157237873670.us-central1.run.app/proxy";
            let finalPrompt = prompt;
            if (systemInstruction) finalPrompt = `${systemInstruction}\n\nUser: ${prompt}`;
            let parts = [{ text: finalPrompt }];
            if (imageBase64) {
                const mimeType = imageBase64.match(/data:([^;]+);base64,/)?.[1] || "image/jpeg";
                const base64Data = imageBase64.split(',')[1] || imageBase64;
                parts.push({ inlineData: { mimeType: mimeType, data: base64Data } });
            }
            const payload = { contents: [{ parts: parts }] };
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);
                const response = await fetch(proxyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) { const errText = await response.text(); throw new Error(`AI API Error (${response.status}): ${errText.slice(0, 100)}`); }
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
            } catch (error) { if (error.name === 'AbortError') return "Error: Request timed out after 30 seconds."; return `Error: ${error.message}`; }
        };

        const useGoogleDrive = () => {
            const [tokenClient, setTokenClient] = useState(null);
            const [isApiLoaded, setIsApiLoaded] = useState(false);
            
            useEffect(() => {
                if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) { console.log("Google Drive Keys Missing"); return; }
                const checkGis = setInterval(() => {
                   if(window.google && window.google.accounts) {
                       clearInterval(checkGis);
                       const client = window.google.accounts.oauth2.initTokenClient({ 
                           client_id: GDRIVE_CLIENT_ID, 
                           scope: GDRIVE_SCOPES, 
                           callback: '', 
                       });
                       setTokenClient(client);
                   }
                }, 500);
                const checkGapi = setInterval(() => {
                    if(window.gapi) {
                        clearInterval(checkGapi);
                        window.gapi.load('client', async () => {
                            await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'], });
                            setIsApiLoaded(true);
                        });
                    }
                }, 500);
                return () => { clearInterval(checkGis); clearInterval(checkGapi); }
            }, []);

            // === HELPER: Find or Create Folder ===
            const getOrCreateFolder = async (folderName, accessToken) => {
                try {
                    // 1. Search for existing folder
                    const query = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`;
                    const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const searchData = await searchRes.json();
                    
                    if (searchData.files && searchData.files.length > 0) {
                        return searchData.files[0].id;
                    }

                    // 2. Create if not found
                    const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                        method: 'POST',
                        headers: { 
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: folderName,
                            mimeType: 'application/vnd.google-apps.folder'
                        })
                    });
                    const createData = await createRes.json();
                    return createData.id;
                } catch (e) {
                    console.error("Folder creation failed:", e);
                    return null; // Fallback to root if folder fails
                }
            };
            
            // === OPTIMIZED SAVE (Handles Folders & Conversions) ===
            const saveToDrive = useCallback((content, filename, mimeType, folderName = null, convertToDocs = false) => {
                return new Promise((resolve, reject) => {
                    if(!tokenClient) return reject("Google Drive API not initialized.");
                    tokenClient.callback = async (resp) => {
                        if (resp.error) return reject(resp);

                        // === CRITICAL BUG FIX: SET GAPI TOKEN ===
                        // This prevents the popup from appearing on every single request
                        // because gapi now knows it has a token.
                        if (window.gapi && window.gapi.client) {
                            window.gapi.client.setToken(resp);
                        }
                        
                        let parentId = null;
                        if (folderName) {
                            parentId = await getOrCreateFolder(folderName, resp.access_token);
                        }

                        try {
                            const metadata = { 
                                name: filename, 
                                mimeType: convertToDocs ? 'application/vnd.google-apps.document' : mimeType 
                            };
                            
                            if (parentId) {
                                metadata.parents = [parentId];
                            }

                            const form = new FormData();
                            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                            const fileContent = content instanceof Blob ? content : new Blob([content], { type: mimeType });
                            form.append('file', fileContent);
                            
                            const upload = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,thumbnailLink,webViewLink', { 
                                method: 'POST', 
                                headers: new Headers({ 'Authorization': 'Bearer ' + resp.access_token }), 
                                body: form, 
                            });
                            const result = await upload.json();
                            resolve(result);
                        } catch(e) { reject(e); }
                    };

                    // === BUG FIX: Check if we already have a valid token ===
                    const existingToken = window.gapi && window.gapi.client ? window.gapi.client.getToken() : null;
                    
                    if (existingToken === null) {
                        // No token, must prompt
                        tokenClient.requestAccessToken({prompt: 'consent'});
                    } else {
                        // Have token, try silent refresh first
                        tokenClient.requestAccessToken({prompt: ''});
                    }
                });
            }, [tokenClient]);
            return { saveToDrive, isReady: !!tokenClient && isApiLoaded };
        };

        const MessageBubble = ({ text, isUser }) => {

            // Logic to parse <thinking> blocks
            const parseThinking = (rawText) => {
                const regex = /<thinking>([\s\S]*?)<\/thinking>/;
                const match = rawText.match(regex);
                if (match) {
                    const thought = match[1].trim();
                    const mainText = rawText.replace(regex, '').trim();
                    return { thought, mainText };
                }
                return { thought: null, mainText: rawText };
            };

            const { thought, mainText } = parseThinking(text);

            useEffect(() => {
                if (bubbleRef.current && !isUser) {

        const TaskEditor = ({ data, onChange, onSaveToDrive }) => {

            const toggleTask = (taskId) => { const updated = tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t); onChange({ ...data, tasks: updated }); };
            const deleteTask = (taskId) => { const updated = tasks.filter(t => t.id !== taskId); onChange({ ...data, tasks: updated }); };
            const addSubtask = (taskId, text) => { const updated = tasks.map(t => { if(t.id === taskId) return { ...t, subtasks: [...(t.subtasks || []), { id: Date.now().toString(), text, completed: false }] }; return t; }); onChange({ ...data, tasks: updated }); };
            const toggleSubtask = (taskId, subtaskId) => { const updated = tasks.map(t => { if(t.id === taskId) { const newSubs = t.subtasks.map(s => s.id === subtaskId ? { ...s, completed: !s.completed } : s); return { ...t, subtasks: newSubs }; } return t; }); onChange({ ...data, tasks: updated }); }
            const deleteSubtask = (taskId, subtaskId) => { const updated = tasks.map(t => { if(t.id === taskId) return { ...t, subtasks: t.subtasks.filter(s => s.id !== subtaskId) }; return t; }); onChange({ ...data, tasks: updated }); }
            const filteredTasks = tasks.filter(t => {
                if(filter === 'all') return true; if(filter === 'completed') return t.completed; if(filter === 'active') return !t.completed;
                if(filter === 'today') { if(!t.dueDate) return false; const today = new Date().toISOString().split('T')[0]; return t.dueDate === today && !t.completed; }
                if(filter === 'overdue') { if(!t.dueDate) return false; const today = new Date().toISOString().split('T')[0]; return t.dueDate < today && !t.completed; }
                return true;
            });
            const formatForDrive = () => {
                const lines = tasks.map(t => `[${t.completed ? 'x' : ' '}] ${t.text} ${t.dueDate ? `(Due: ${t.dueDate})` : ''}\n${t.subtasks ? t.subtasks.map(s => `    - [${s.completed ? 'x' : ' '}] ${s.text}`).join('\n') : ''}`);
                return lines.join('\n\n');

            return (
                <div className="p-8 h-full overflow-y-auto bg-[#f0f2f5] dark:bg-[#0c0c0c] flex flex-col gap-6 relative">

                    <div className="flex gap-2 flex-wrap">

                    </div>
                    <div className="bg-white dark:bg-zinc-900 p-4 rounded-xl shadow-sm border border-zinc-200 dark:border-zinc-800 flex gap-2 flex-col sm:flex-row">
                        <input value={newTaskText} onChange={(e) => setNewTaskText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addTask()} placeholder="Add a new task..." className="flex-1 bg-transparent border-none outline-none dark:text-white" />
                        <input type="date" value={newTaskDate} onChange={(e) => setNewTaskDate(e.target.value)} className="bg-zinc-100 dark:bg-zinc-800 rounded px-2 py-1 text-xs text-zinc-500 dark:text-zinc-400 outline-none w-auto" />
                        <button onClick={addTask} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-500">Add Task</button>
                    </div>
                    <div className="space-y-3">
                        {filteredTasks.map(task => (
                            <div key={task.id} className="bg-white dark:bg-zinc-900 p-4 rounded-xl shadow-sm border border-zinc-200 dark:border-zinc-800 group">
                                <div className="flex items-start gap-3">
                                    <input type="checkbox" checked={task.completed} onChange={() => toggleTask(task.id)} className="mt-1 task-checkbox" />
                                    <div className="flex-1">
                                        <div className={`text-sm font-medium ${task.completed ? 'line-through text-zinc-400' : 'text-zinc-900 dark:text-white'}`}>{task.text}</div>
                                        {task.dueDate && (<div className={`text-[10px] mt-1 flex items-center gap-1 ${task.dueDate < new Date().toISOString().split('T')[0] && !task.completed ? 'text-red-500 font-bold' : 'text-zinc-400'}`}><Icons.Calendar className="w-3 h-3"/> {task.dueDate} {task.dueDate < new Date().toISOString().split('T')[0] && !task.completed ? '(Overdue)' : ''}</div>)}
                                        <div className="mt-3 space-y-2 pl-2 border-l-2 border-zinc-100 dark:border-zinc-800">
                                            {task.subtasks && task.subtasks.map(sub => (
                                                <div key={sub.id} className="flex items-center gap-2 group/sub">
                                                    <div onClick={() => toggleSubtask(task.id, sub.id)} className={`w-3 h-3 rounded-full border cursor-pointer ${sub.completed ? 'bg-indigo-500 border-indigo-500' : 'border-zinc-400'}`}></div>
                                                    <span className={`text-xs ${sub.completed ? 'line-through text-zinc-400' : 'text-zinc-700 dark:text-zinc-300'}`}>{sub.text}</span>
                                                    <button onClick={() => deleteSubtask(task.id, sub.id)} className="opacity-0 group-hover/sub:opacity-100 text-red-500"><Icons.X className="w-3 h-3"/></button>
                                                </div>
                                            ))}
                                            <div className="flex items-center gap-2 mt-2">
                                                <Icons.Plus className="w-3 h-3 text-zinc-400"/>
                                                <input placeholder="Add subtask..." className="bg-transparent text-xs outline-none w-full dark:text-zinc-300" onKeyDown={(e) => { if(e.key === 'Enter' && e.target.value.trim()) { addSubtask(task.id, e.target.value); e.target.value = ''; }}} />
                                            </div>

                                    </div>
                                    <button onClick={() => deleteTask(task.id)} className="opacity-0 group-hover:opacity-100 text-red-500 p-1 hover:bg-red-50 dark:hover:bg-red-900/20 rounded"><Icons.Trash className="w-4 h-4"/></button>
                                </div>
                            </div>
                        ))}
                        {filteredTasks.length === 0 && (<div className="text-center text-zinc-400 mt-10"><div className="text-4xl mb-2">📝</div><div>No tasks found in this view.</div></div>)}
                    </div>
                </div>
            )
        };

        // ==========================================
        // TINYMCE EDITOR INTEGRATION (The Toyota)

        const TinyMCEEditor = ({ initialContent, noteId, noteTitle, onSave, onSaveToDrive, isDarkMode, onContextMenu, saveToDriveFunction }) => {
            const editorRef = useRef(null);
            const [wordCount, setWordCount] = useState(0);
            const [showAiMenu, setShowAiMenu] = useState(false);

            // === AUTO-SAVE LOGIC ===
            const [saveStatus, setSaveStatus] = useState('Saved'); // 'Saved', 'Typing...', 'Saving...', 'Error'
            const debounceTimer = useRef(null);
            const onSaveRef = useRef(onSave); // Keep latest onSave function without re-triggering effects

            useEffect(() => { onSaveRef.current = onSave; }, [onSave]);

            useEffect(() => {
                // Initialize TinyMCE - RUNS ONCE PER COMPONENT MOUNT (Due to key={noteId})
                const initEditor = () => {
                    if (window.tinymce) {
                        // Prevent zombie instances
                        if (editorRef.current) {
                            window.tinymce.remove(editorRef.current);
                        }

                        window.tinymce.init({
                            selector: '#tinymce-editor', // Target by ID
                            height: '100%', // FORCE FULL HEIGHT
                            menubar: 'file edit view insert format tools table help',
                            plugins: 'preview importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars emoticons',
                            toolbar: 'undo redo | blocks | bold italic underline strikethrough | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | removeformat | help',
                            skin: isDarkMode ? 'oxide-dark' : 'oxide',
                            content_css: isDarkMode ? 'dark' : 'default',
                            placeholder: "Start typing...",
                            resize: false, // Fix layout weirdness
                            
                            // === IMAGE UPLOAD LOGIC CHANGE ===
                            paste_data_images: false, // DISABLE Base64 pasting
                            
                            // Custom Handler to Upload to Drive
                            images_upload_handler: (blobInfo, progress) => new Promise((resolve, reject) => {
                                if (!saveToDriveFunction) {
                                    reject('Google Drive not ready. Please check connection.');
                                    return;
                                }

                                const filename = blobInfo.filename();
                                const blob = blobInfo.blob();

                                // Upload to Drive (WITH FOLDER 'darNote_Images')
                                saveToDriveFunction(blob, filename, blob.type, 'darNote_Images')
                                    .then((result) => {
                                        // Use the thumbnailLink if available
                                        if (result.thumbnailLink) {
                                            // Hack: Replace size parameter (e.g. s220) with s1600 for high-res
                                            const bigImage = result.thumbnailLink.replace(/=s\d+/, '=s1600'); 
                                            resolve(bigImage);
                                        } else {
                                            reject('Upload successful, but no link returned.');
                                        }
                                    })
                                    .catch((err) => {
                                        console.error("Drive Upload Error:", err);
                                        reject('Upload failed: ' + (err.message || 'Unknown error'));
                                    });
                            }),
                            
                            contextmenu: false, // DISABLE NATIVE CONTEXT MENU TO USE CUSTOM ONE
                            setup: (editor) => {
                                editorRef.current = editor;
                                editor.on('init', () => {
                                    if (initialContent) editor.setContent(initialContent);
                                    updateStats();
                                });
                                
                                // === SMART AUTO-SAVE ===
                                editor.on('input change keyup', () => {
                                    setSaveStatus('Typing...'); // Immediate visual feedback
                                    
                                    // Clear pending save
                                    if (debounceTimer.current) clearTimeout(debounceTimer.current);
                                    
                                    // Set new timeout for 2 seconds
                                    debounceTimer.current = setTimeout(async () => {
                                        setSaveStatus('Saving...');
                                        try {
                                            await onSaveRef.current(editor.getContent());
                                            setSaveStatus('Saved');
                                        } catch (e) {
                                            console.error("Save failed:", e);
                                            setSaveStatus('Error saving');
                                        }
                                    }, 2000); 

                                    updateStats(); // Update word count immediately
                                });

                                // === CUSTOM CONTEXT MENU HOOK ===
                                editor.on('contextmenu', (e) => {
                                    e.preventDefault();
                                    const rect = editor.getContainer().getBoundingClientRect();
                                    const x = rect.left + e.clientX;
                                    const y = rect.top + e.clientY;
                                    
                                    // Use getSelection().toString() as fallback if editor.selection is empty
                                    let selection = editor.selection.getContent({ format: 'text' });
                                    if (!selection) selection = editor.getWindow().getSelection().toString();

                                    // Only trigger if we actually have text selected or the user clicked on something useful
                                    if(selection && selection.trim().length > 0) {
                                        // Pass the callback to replace text
                                        onContextMenu({ clientX: x, clientY: y }, selection, (newText) => {
                                            editor.selection.setContent(newText);
                                            // Force a save immediately for context menu actions
                                            onSaveRef.current(editor.getContent());
                                        });
                                    }
                                });
                            }
                        });
                    }
                };
                
                // Small delay to ensure DOM is ready and old instances cleared

                // Cleanup on unmount (switching notes or view)

            const updateStats = () => {

        const AIChatInterface = ({ activeNote, initialQuery, onClose }) => {
            const [messages, setMessages] = useState([{role: 'ai', text: 'Hi! Drop an image here or ask a question about your notes.', type: 'text'}]);
            const [input, setInput] = useState(initialQuery || '');
            const [loading, setLoading] = useState(false);
            const [droppedImage, setDroppedImage] = useState(null);
            const messagesEndRef = useRef(null);
            useEffect(() => { if (initialQuery) setInput(initialQuery); }, [initialQuery]);
            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
            
            const handleSend = async () => {
                if(!input.trim() && !droppedImage) return;
                const userMsg = { role: 'user', text: input, image: droppedImage, type: droppedImage ? 'mixed' : 'text' };
                setMessages(prev => [...prev, userMsg]); setInput(''); setDroppedImage(null); setLoading(true);
                try {
                    const context = `Current note: ${activeNote.title || 'Untitled'}. Content: ${activeNote.content || ''}`;
                    // MODIFIED PROMPT: Ask for explicit reasoning
                    const systemPrompt = `You are a helpful assistant of darNote. Context: ${context}. \nCRITICAL: Always think about your answer first. Enclose your step-by-step reasoning process inside <thinking>...</thinking> tags, then provide your final answer. The user wants to see how you think.`;
                    
                    const response = await callGemini(userMsg.text || "Analyze this image", systemPrompt, userMsg.image);
                    setMessages(prev => [...prev, { role: 'ai', text: response, type: 'text' }]);
                } catch (e) { setMessages(prev => [...prev, { role: 'ai', text: "Error: Something went wrong in the UI.", type: 'text' }]); } finally { setLoading(false); }
            };
            
            const handleDrop = (e) => { e.preventDefault(); const file = e.dataTransfer.files[0]; if (file && file.type.startsWith('image/')) { const reader = new FileReader(); reader.onload = (ev) => setDroppedImage(ev.target.result); reader.readAsDataURL(file); } };
            const handleDragOver = (e) => e.preventDefault();
            return (
                <div className="flex flex-col h-full bg-white dark:bg-onyx" onDrop={handleDrop} onDragOver={handleDragOver}>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 relative">
                        {messages.length === 1 && !droppedImage && (<div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10"><Icons.ImageFile className="w-32 h-32"/></div>)}
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-zinc-100 dark:bg-zinc-800 rounded-bl-none'}`}>

                        {loading && <div className="text-xs text-zinc-500 animate-pulse">Thinking...</div>}<div ref={messagesEndRef} />
                    </div>
                    <div className="p-4 border-t border-zinc-200 dark:border-white/10 bg-white dark:bg-zinc-900">
                        {droppedImage && (<div className="mb-2 relative inline-block"><img src={droppedImage} className="h-16 w-auto rounded border border-indigo-500 shadow-sm"/><button onClick={()=>setDroppedImage(null)} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5"><Icons.X className="w-3 h-3"/></button></div>)}
                        <div className="flex gap-2"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter' && handleSend()} placeholder="Ask AI (or drop image here)..." className="w-full bg-zinc-100 dark:bg-zinc-800 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500"/><button onClick={handleSend} className="bg-indigo-600 text-white rounded-full p-2 hover:bg-indigo-500"><Icons.Plus className="w-4 h-4 rotate-90"/></button></div>
                    </div>
                </div>

        }

        const Button = ({ children, onClick, variant = 'ghost', className = '', icon: Icon, active, ...props }) => {
            const variants = { primary: 'bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg shadow-indigo-500/20', ghost: 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-200 dark:hover:bg-white/5', danger: 'text-red-500 hover:bg-red-50 hover:text-red-600 dark:text-red-400 dark:hover:bg-red-500/10', active: 'bg-zinc-200 dark:bg-white/20 text-black dark:text-white', google: 'bg-white text-black hover:bg-gray-100 shadow-md w-full justify-center py-3' };
            return (<motion.button whileHover={{ scale: 1.02 }} whileTap={{ scale: 0.98 }} onClick={onClick} className={`flex items-center justify-center gap-2 px-2 py-1.5 rounded-lg text-sm font-medium transition-colors ${active ? variants.active : variants[variant]} ${className}`} {...props}>{Icon && <Icon className="w-4 h-4" />}{children}</motion.button>);
        };

        const ShareModal = ({ note, onClose, onAddEmail, onRemoveEmail }) => {
            const [email, setEmail] = useState('');
            const handleSubmit = () => { if(email.trim()) { onAddEmail(email.trim()); setEmail(''); } };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className="bg-white dark:bg-surface w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-zinc-200 dark:border-white/10">
                        <div className="p-6">
                            <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-bold dark:text-white">Share Note</h2><button onClick={onClose}><Icons.X className="w-5 h-5 text-zinc-500" /></button></div>
                            <div className="space-y-4">
                                <div className="flex gap-2">
                                    <input value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSubmit()} placeholder="Enter email to share..." className="flex-1 bg-zinc-100 dark:bg-black/50 border border-zinc-200 dark:border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none dark:text-zinc-200" />
                                    <Button variant="primary" onClick={handleSubmit}>Share</Button>
                                </div>
                                <div className="mt-4">
                                    <div className="text-xs font-semibold text-zinc-500 uppercase mb-2">Shared With</div>
                                    <div className="space-y-2 max-h-40 overflow-y-auto">
                                        {note.sharedWith && note.sharedWith.length > 0 ? note.sharedWith.map(e => (
                                            <div key={e} className="flex items-center justify-between p-2 bg-zinc-50 dark:bg-white/5 rounded-lg">
                                                <span className="text-sm dark:text-zinc-300">{e}</span>
                                                <button onClick={() => onRemoveEmail(e)} className="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 p-1 rounded"><Icons.Trash className="w-3 h-3"/></button>
                                            </div>
                                        )) : <div className="text-sm text-zinc-400 italic">No one yet.</div>}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </motion.div>
                </div>
            );
        };

        const ProfileModal = ({ user, profile, onClose, onSave }) => {
            const [data, setData] = useState({ displayName: profile?.displayName || user.displayName || '', role: profile?.role || 'Student', gender: profile?.gender || 'Prefer not to say', bio: profile?.bio || '', note: profile?.note || '', iconUrl: profile?.iconUrl || user.photoURL || '' });
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className="bg-white dark:bg-surface w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-zinc-200 dark:border-white/10">
                        <div className="p-6">
                            <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-bold dark:text-white">Edit Profile</h2><button onClick={onClose}><Icons.X className="w-5 h-5 text-zinc-500" /></button></div>
                            <div className="space-y-4">
                                <div className="flex justify-center mb-4"><div className="w-20 h-20 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden border-2 border-indigo-500">{data.iconUrl ? <img src={data.iconUrl} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-2xl">?</div>}</div></div>
                                <div><label className="text-xs font-semibold text-zinc-500 uppercase">Icon URL</label><input value={data.iconUrl} onChange={e => setData({...data, iconUrl: e.target.value})} className="w-full mt-1 bg-zinc-100 dark:bg-black/50 border border-zinc-200 dark:border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none dark:text-zinc-200" /></div>
                                <div><label className="text-xs font-semibold text-zinc-500 uppercase">Display Name</label><input value={data.displayName} onChange={e => setData({...data, displayName: e.target.value})} className="w-full mt-1 bg-zinc-100 dark:bg-black/50 border border-zinc-200 dark:border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none dark:text-zinc-200" /></div>
                                <div className="mt-6 flex justify-end gap-2"><Button onClick={onClose}>Cancel</Button><Button variant="primary" onClick={() => onSave(data)}>Save Profile</Button></div>
                            </div>
                        </div>
                    </motion.div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null); const [profile, setProfile] = useState(null); const [notes, setNotes] = useState([]); const [subjects, setSubjects] = useState([]);
            const [activeNoteId, setActiveNoteId] = useState(() => { const params = new URLSearchParams(window.location.search); return params.get('note'); });
            const [searchQuery, setSearchQuery] = useState(''); const [filter, setFilter] = useState('all'); const [viewMode, setViewMode] = useState('list');
            const [isAiSidebarOpen, setIsAiSidebarOpen] = useState(false); const [isNoteListOpen, setIsNoteListOpen] = useState(true); const [contextMenu, setContextMenu] = useState(null);
            const [aiQuery, setAiQuery] = useState(''); const [sortOrder, setSortOrder] = useState('date-desc'); const [isDarkMode, setIsDarkMode] = useState(true);
            const [isAuthLoading, setIsAuthLoading] = useState(true); const [showProfileModal, setShowProfileModal] = useState(false);
            const [showShareModal, setShowShareModal] = useState(false); const [sharedNotes, setSharedNotes] = useState([]);
            const [sharedError, setSharedError] = useState(null);
            
            const { saveToDrive, isReady } = useGoogleDrive();

            useEffect(() => { const handlePopState = () => { const params = new URLSearchParams(window.location.search); const noteId = params.get('note'); setActiveNoteId(noteId); }; window.addEventListener('popstate', handlePopState); return () => window.removeEventListener('popstate', handlePopState); }, []);
            useEffect(() => { const url = new URL(window.location); const currentUrlId = url.searchParams.get('note'); if (activeNoteId && currentUrlId !== activeNoteId) { url.searchParams.set('note', activeNoteId); window.history.pushState({}, '', url); } else if (!activeNoteId && currentUrlId) { url.searchParams.delete('note'); window.history.pushState({}, '', url); } }, [activeNoteId]);
            useEffect(() => { const unsubscribe = window.firebase.onAuthStateChanged(window.firebase.auth, (u) => { setUser(u); setIsAuthLoading(false); }); return () => unsubscribe(); }, []);
            useEffect(() => { 
                if (!user) { setNotes([]); setSubjects([]); setProfile(null); setSharedNotes([]); return; } 
                const appId = "darnote-app"; const db = window.firebase.db; 
                const profileUnsub = window.firebase.onSnapshot(window.firebase.doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), (doc) => { if (doc.exists()) setProfile(doc.data()); }); 
                const notesUnsub = window.firebase.onSnapshot(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), (snapshot) => { const fetchedNotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); setNotes(fetchedNotes); }); 
                const subjectsUnsub = window.firebase.onSnapshot(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'subjects'), (snapshot) => { const fetchedSubjects = snapshot.docs.map(doc => doc.data().name).sort(); if (fetchedSubjects.length === 0) ['Personal', 'Work', 'Ideas'].forEach(s => window.firebase.addDoc(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'subjects'), { name: s })); else setSubjects(fetchedSubjects); }); 
                
                let sharedUnsub = () => {};
                if(user.email) {
                    setSharedError(null);
                    try {
                        const myEmail = user.email.toLowerCase();
                        const q = window.firebase.query(window.firebase.collectionGroup(db, 'notes'), window.firebase.where('sharedWith', 'array-contains', myEmail));
                        sharedUnsub = window.firebase.onSnapshot(q, (snapshot) => {
                             const fetchedShared = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data(), isShared: true }));
                             setSharedNotes(fetchedShared);
                        }, (error) => {
                            if (error.code === 'failed-precondition') setSharedError('INDEX_MISSING');
                            else if (error.code === 'permission-denied') setSharedError('PERMISSION_DENIED');
                        });
                    } catch(e) { console.error("Error setting up shared listener", e); }
                }

                return () => { notesUnsub(); subjectsUnsub(); profileUnsub(); sharedUnsub(); }; 
            }, [user]);
            useEffect(() => { if (isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);
            useEffect(() => { const closeMenu = (e) => { if (!e.target.closest('.context-menu')) setContextMenu(null); }; window.addEventListener('mousedown', closeMenu); return () => window.removeEventListener('mousedown', closeMenu); }, []);

            const allVisibleNotes = useMemo(() => {
                return filter === 'shared' ? sharedNotes : notes;
            }, [notes, sharedNotes, filter]);

            const activeNote = useMemo(() => {
                const myNote = notes.find(n => n.id === activeNoteId);
                if (myNote) return myNote;
                return sharedNotes.find(n => n.id === activeNoteId);
            }, [notes, sharedNotes, activeNoteId]);

            const filteredNotes = useMemo(() => { 
                let result = allVisibleNotes.filter(n => !n.isDeleted); 
                if (searchQuery.trim()) { 
                    const q = searchQuery.toLowerCase(); 
                    result = result.filter(n => n.title.toLowerCase().includes(q) || (n.content && n.content.toLowerCase().includes(q))); 
                } else { 
                    if (filter === 'favorites') result = result.filter(n => n.isFavorite); 
                    else if (filter.startsWith('subject:')) result = result.filter(n => n.subject === filter.split(':')[1]); 
                } 
                result.sort((a, b) => { if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1; switch (sortOrder) { case 'date-desc': return new Date(b.updatedAt) - new Date(a.updatedAt); case 'date-asc': return new Date(a.updatedAt) - new Date(b.updatedAt); case 'name-asc': return (a.title || '').localeCompare(b.title || ''); case 'name-desc': return (b.title || '').localeCompare(a.title || ''); default: return 0; } }); 
                return result; 
            }, [allVisibleNotes, filter, searchQuery, sortOrder]);

            const handleLogin = async () => { try { await window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider()); } catch (error) { alert("Login failed"); } };
            const handleGuestLogin = async () => { try { await window.firebase.signInAnonymously(window.firebase.auth); } catch (error) { alert("Guest login failed"); } }
            const handleLogout = async () => { await window.firebase.signOut(window.firebase.auth); setNotes([]); setActiveNoteId(null); };
            const saveProfile = async (data) => { const appId = "darnote-app"; await window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), data); setShowProfileModal(false); };
            const createNote = async (type = 'text') => { if(!user) return; const currentSubject = filter.startsWith('subject:') ? filter.split(':')[1] : 'Personal'; const newNote = { type, title: '', content: type === 'text' ? '' : null, floatingImages: [], nodes: type === 'mindmap' ? [{id: 'root', text: 'Central Idea', x: 400, y: 300}] : null, connections: type === 'mindmap' ? [] : null, tasks: type === 'tasklist' ? [] : null, tags: [], subject: currentSubject, updatedAt: new Date().toISOString(), isFavorite: false, isPinned: false, ownerId: user.uid, ownerEmail: user.email ? user.email.toLowerCase() : '', sharedWith: [] }; try { const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes'), newNote); setActiveNoteId(docRef.id); if (!isNoteListOpen) setIsNoteListOpen(true); if(filter === 'shared') setFilter('all'); } catch(e) { console.error(e); } };
            const updateNote = async (id, updates) => { if(!id || !user) return; 
                 const targetNote = allVisibleNotes.find(n => n.id === id);
                 if(!targetNote) return;
                 const db = window.firebase.db;
                 const ownerId = targetNote.ownerId || user.uid; 
                 try {
                     await window.firebase.updateDoc(window.firebase.doc(db, 'artifacts', "darnote-app", 'users', ownerId, 'notes', id), { ...updates, updatedAt: new Date().toISOString() });
                 } catch(e) { console.error("Update failed", e); }
            };

            const renameSubject = async (oldName, newName) => { if (!newName || !user || newName === oldName || subjects.includes(newName)) return; const db = window.firebase.db; const appId = "darnote-app"; const notesToUpdate = notes.filter(n => n.subject === oldName); await Promise.all(notesToUpdate.map(note => window.firebase.updateDoc(window.firebase.doc(db, 'artifacts', appId, 'users', user.uid, 'notes', note.id), { subject: newName }))); await window.firebase.addDoc(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'subjects'), { name: newName }); const q = window.firebase.query(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'subjects'), window.firebase.where("name", "==", oldName)); (await window.firebase.getDocs(q)).forEach(async (doc) => await window.firebase.deleteDoc(doc.ref)); if (filter === `subject:${oldName}`) setFilter(`subject:${newName}`); };

                                <>
                                    <button onClick={() => handleContextAction('pin')} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 flex items-center gap-2"><Icons.Pin className="w-3 h-3"/> Pin Note</button>
                                    <button onClick={() => handleContextAction('star')} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 flex items-center gap-2"><Icons.Star className="w-3 h-3"/> Favorite</button>
                                    <button onClick={() => handleContextAction('tag')} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 flex items-center gap-2"><Icons.Tag className="w-3 h-3"/> Edit Tags</button>
                                    <div className="border-t border-zinc-200 dark:border-white/10 my-1"></div>
                                    <div className="px-4 py-1 text-[10px] text-zinc-500 font-semibold mt-1 uppercase tracking-wider">Move to...</div>
                                    <div className="max-h-32 overflow-y-auto">{subjects.map(s => (<button key={s} onClick={() => handleContextAction('move', s)} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 pl-6 border-l-2 border-transparent hover:border-indigo-500">{s}</button>))}</div>
                                    <div className="border-t border-zinc-200 dark:border-white/10 my-1"></div>
                                    <button onClick={() => handleContextAction('delete')} className="w-full text-left px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 flex items-center gap-2"><Icons.Trash className="w-3 h-3"/> Delete</button>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
