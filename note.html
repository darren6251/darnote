        // ==========================================
        // AI & QUOTA HELPERS (Shared with Error Log)

        const getLimits = async () => {
            const defaults = { chat_gemini: 5, chat_groq: 20 };
            try {
                // Fetch central config
                const cfgRef = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'public', 'data', 'config', 'main');
                const snap = await window.firebase.getDoc(cfgRef);
                if (snap.exists()) return { ...defaults, ...snap.data() };
            } catch(e) { console.warn("Using default limits (Config not found)"); }
            return defaults;
        };

        const checkAndIncrementQuota = async (user, type, subtype = null) => {
            if (!user) return false;
            const limits = await getLimits();
            let field = '', limit = 0;
            
            // Logic matching el.html
            if (type === 'chat') {
                if (subtype === 'groq') { field = 'chat_groq_count'; limit = limits.chat_groq; } 
                else { field = 'chat_count'; limit = limits.chat_gemini; }
            }
            
            const today = new Date().toISOString().split('T')[0];
            const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today);
            
            try {
                const snap = await window.firebase.getDoc(ref);
                let count = snap.exists() ? (snap.data()[field] || 0) : 0;
                if (count >= limit) return false;
                await window.firebase.setDoc(ref, { [field]: window.firebase.increment(1) }, { merge: true });
                return count + 1;
            } catch (e) { console.error("Quota check failed:", e); return false; }
        };

        const callAI = async (prompt, systemInstruction = "", imageBase64 = null, apiUrl = GEMINI_PROXY_URL) => {
            let finalPrompt = prompt;
            if (systemInstruction) finalPrompt = `${systemInstruction}\n\nUser: ${prompt}`;
            let parts = [{ text: finalPrompt }];
            if (imageBase64) {
                let mimeType = "image/png"; let data = imageBase64;
                if (imageBase64.includes(",")) { const s = imageBase64.split(","); mimeType = s[0].match(/:(.*?);/)[1]; data = s[1]; }
                parts.push({ inlineData: { mimeType, data } });
            }
            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) });
                if (!response.ok) return `Error: API Request Failed (${response.status})`;
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
            } catch (error) { return `Error: ${error.message}`; }
        };

        const callGroq = async (prompt, systemInstruction = "", imageBase64 = null) => {
            const userContent = [{ type: "text", text: prompt }];
            if (imageBase64) { userContent.push({ type: "image_url", image_url: { url: imageBase64 } }); }
            const payload = { model: "llama-3.2-90b-vision-preview", messages: [ { role: "system", content: systemInstruction }, { role: "user", content: userContent } ] };
            try {
                const response = await fetch(GROQ_PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) return `Error: API Request Failed (${response.status})`;
                const data = await response.json();
                return data.choices?.[0]?.message?.content || "Error: Empty response.";
            } catch (error) { return `Error: ${error.message}`; }
        };

        const useGoogleDrive = () => {
            const [tokenClient, setTokenClient] = useState(null);
            const [isApiLoaded, setIsApiLoaded] = useState(false);
            
            useEffect(() => {
                if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return;
                const loadGapi = async () => {
                    if (window.gapi) {
                         await new Promise(r => window.gapi.load('client', r));
                         await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
                         setIsApiLoaded(true);
                    }
                };
                loadGapi();
                if (window.google && window.google.accounts) {
                    const client = window.google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: () => {} });
                    setTokenClient(client);
                }
            }, []);

            // SMART TOKEN STORAGE
            const getAccessToken = () => new Promise((resolve, reject) => {
                // 1. Try Local Storage
                const stored = localStorage.getItem('darnote_gdrive_token');
                if (stored) {
                    const { token, expiry } = JSON.parse(stored);
                    if (Date.now() < expiry) return resolve(token);
                }

                // 2. Request New Token
                if (!tokenClient) return reject("Auth not initialized");
                tokenClient.callback = (resp) => { 
                    if (resp.error) reject(resp); 
                    // Store for 50 mins (safe buffer)
                    localStorage.setItem('darnote_gdrive_token', JSON.stringify({ token: resp.access_token, expiry: Date.now() + 3000000 }));
                    resolve(resp.access_token); 
                };
                tokenClient.requestAccessToken({ prompt: '' });
            });

            const saveToDrive = async (content, filename, mimeType, folderName = null, convertToDocs = false) => {
                const token = await getAccessToken();
                let parentId = null;
                if(folderName) {
                    const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`;
                    const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` }});
                    const data = await search.json();
                    if (data.files?.length > 0) parentId = data.files[0].id;
                    else {
                        const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) });
                        parentId = (await create.json()).id;
                    }
                }
                const metadata = { name: filename, mimeType: convertToDocs ? 'application/vnd.google-apps.document' : mimeType };
                if (parentId) metadata.parents = [parentId];
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', content instanceof Blob ? content : new Blob([content], { type: mimeType }));
                const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,thumbnailLink,webViewLink', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
                if (!uploadRes.ok) throw new Error(`Upload Failed: ${uploadRes.statusText}`);
                const fileData = await uploadRes.json();
                const fileId = fileData.id;
                if (mimeType.startsWith('image/')) {
                    await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) });
                    const url = fileData.thumbnailLink ? fileData.thumbnailLink.replace('=s220', '=s16383') : `https://lh3.googleusercontent.com/d/${fileId}`;
                    return { id: fileId, webContentLink: url, webViewLink: `https://lh3.googleusercontent.com/d/${fileId}/view` };
                }
                return { id: fileId, webViewLink: `https://lh3.googleusercontent.com/d/${fileId}/view` };
            };
            return { saveToDrive, isReady: isApiLoaded, getAccessToken };
        };

        const MessageBubble = ({ text, isUser }) => {
            const bubbleRef = useRef(null);
            const [showThinking, setShowThinking] = useState(false);
            const parts = useMemo(() => {
                if (isUser) return { thought: null, response: text };
                const thinkMatch = text.match(/<thinking>([\s\S]*?)<\/thinking>/);
                if (thinkMatch) return { thought: thinkMatch[1].trim(), response: text.replace(thinkMatch[0], '').trim() };
                return { thought: null, response: text };
            }, [text, isUser]);
            useEffect(() => {
                if (bubbleRef.current && !isUser) {
                    const cleanText = parts.response;
                    if (window.marked) bubbleRef.current.innerHTML = window.marked.parse(cleanText); else bubbleRef.current.textContent = cleanText;
                    // UPDATED DELIMITERS FOR PHYSICS MODE: ( ... )
                    if (window.renderMathInElement) window.renderMathInElement(bubbleRef.current, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '(', right: ')', display: false}, {left: '\\[', right: '\\]', display: true}], throwOnError: false });
                } else if (bubbleRef.current) bubbleRef.current.textContent = parts.response;
            }, [parts.response, isUser]);
            return (
                <div className={`message-content ${isUser ? 'whitespace-pre-wrap' : ''} ${isUser ? 'text-white' : 'text-zinc-800 dark:text-zinc-200'}`}>
                    {parts.thought && (
                        <div className="mb-3 rounded-lg border border-indigo-200 dark:border-indigo-900 bg-indigo-50 dark:bg-indigo-950/30 overflow-hidden">
                            <button onClick={() => setShowThinking(!showThinking)} className="w-full flex items-center justify-between px-3 py-2 text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wide hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition-colors"><span className="flex items-center gap-2"><Icons.Brain className="w-3 h-3"/> Thinking Process</span><Icons.ChevronDown className={`w-3 h-3 transition-transform ${showThinking ? 'rotate-180' : ''}`}/></button>
                            {showThinking && <div className="px-3 py-2 text-xs text-zinc-600 dark:text-zinc-400 border-t border-indigo-200 dark:border-indigo-900 bg-white/50 dark:bg-black/20 font-mono whitespace-pre-wrap leading-relaxed">{parts.thought}</div>}
                        </div>
                    )}
                    <div ref={bubbleRef} />
                </div>
            );
        };

        const useDebouncedSave = (initialData, onSave, delay = 2000) => {
            const [localData, setLocalData] = useState(initialData);
            const debounceTimer = useRef(null);
            useEffect(() => { setLocalData(initialData); }, [initialData]);
            const updateData = useCallback((newData) => {
                setLocalData(newData);
                if (debounceTimer.current) clearTimeout(debounceTimer.current);
                debounceTimer.current = setTimeout(() => { onSave(newData); }, delay);
            }, [onSave, delay]);
            return [localData, updateData];
        };

        const TaskEditor = ({ data, onChange, onSaveToDrive }) => {
            const { tasks: initialTasks = [] } = data;
            const [tasks, updateTasks] = useDebouncedSave(initialTasks, (newTasks) => onChange({...data, tasks: newTasks}), 2000);
            const [filter, setFilter] = useState('all'); 
            const [newTaskText, setNewTaskText] = useState('');
            const [newTaskDate, setNewTaskDate] = useState('');
            
            const addTask = () => { if(!newTaskText.trim()) return; const newTask = { id: Date.now().toString(), text: newTaskText, completed: false, dueDate: newTaskDate || null, subtasks: [] }; updateTasks([...tasks, newTask]); setNewTaskText(''); setNewTaskDate(''); };
            const toggleTask = (taskId) => { const updated = tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t); updateTasks(updated); };
            const deleteTask = (taskId) => { const updated = tasks.filter(t => t.id !== taskId); updateTasks(updated); };
            const addSubtask = (taskId, text) => { const updated = tasks.map(t => { if(t.id === taskId) return { ...t, subtasks: [...(t.subtasks || []), { id: Date.now().toString(), text, completed: false }] }; return t; }); updateTasks(updated); };
            const toggleSubtask = (taskId, subtaskId) => { const updated = tasks.map(t => { if(t.id === taskId) { const newSubs = t.subtasks.map(s => s.id === subtaskId ? { ...s, completed: !s.completed } : s); return { ...t, subtasks: newSubs }; } return t; }); updateTasks(updated); }
            const deleteSubtask = (taskId, subtaskId) => { const updated = tasks.map(t => { if(t.id === taskId) return { ...t, subtasks: t.subtasks.filter(s => s.id !== subtaskId) }; return t; }); updateTasks(updated); }
            
            const filteredTasks = tasks.filter(t => {
                if(filter === 'all') return true; if(filter === 'completed') return t.completed; if(filter === 'active') return !t.completed;
                if(filter === 'today') { if(!t.dueDate) return false; const today = new Date().toISOString().split('T')[0]; return t.dueDate === today && !t.completed; }
                if(filter === 'overdue') { if(!t.dueDate) return false; const today = new Date().toISOString().split('T')[0]; return t.dueDate < today && !t.completed; }
                return true;
            });
            const formatForDrive = () => {
                const lines = tasks.map(t => `[${t.completed ? 'x' : ' '}] ${t.text} ${t.dueDate ? `(Due: ${t.dueDate})` : ''}\n${t.subtasks ? t.subtasks.map(s => `    - [${s.completed ? 'x' : ' '}] ${s.text}`).join('\n') : ''}`);
                return lines.join('\n\n');
            };
            return (
                <div className="p-8 h-full overflow-y-auto bg-[#f0f2f5] dark:bg-[#0c0c0c] flex flex-col gap-6 relative">
                    {onSaveToDrive && <button onClick={() => onSaveToDrive(formatForDrive(), `${data.title || 'Tasks'}.txt`, 'text/plain')} className="absolute top-4 right-8 bg-zinc-200 dark:bg-zinc-800 p-2 rounded-full hover:bg-zinc-300 dark:hover:bg-zinc-700 text-zinc-600 dark:text-zinc-300" title="Save to Google Drive"><Icons.Drive className="w-5 h-5" /></button>}
                    <div className="flex gap-2 flex-wrap">
                        {['All', 'Active', 'Today', 'Overdue', 'Completed'].map(f => (<button key={f} onClick={() => setFilter(f.toLowerCase())} className={`px-4 py-2 rounded-lg text-sm font-bold transition-colors ${filter === f.toLowerCase() ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white dark:bg-zinc-800 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-700'}`}>{f}</button>))}
                    </div>
                    <div className="bg-white dark:bg-zinc-900 p-4 rounded-xl shadow-sm border border-zinc-200 dark:border-zinc-800 flex gap-2 flex-col sm:flex-row">
                        <input value={newTaskText} onChange={(e) => setNewTaskText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addTask()} placeholder="Add a new task..." className="flex-1 bg-transparent border-none outline-none dark:text-white" />
                        <input type="date" value={newTaskDate} onChange={(e) => setNewTaskDate(e.target.value)} className="bg-zinc-100 dark:bg-zinc-800 rounded px-2 py-1 text-xs text-zinc-500 dark:text-zinc-400 outline-none w-auto" />
                        <button onClick={addTask} className="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-500">Add Task</button>
                    </div>
                    <div className="space-y-3">
                        {filteredTasks.map(task => (
                            <div key={task.id} className="bg-white dark:bg-zinc-900 p-4 rounded-xl shadow-sm border border-zinc-200 dark:border-zinc-800 group">
                                <div className="flex items-start gap-3">
                                    <input type="checkbox" checked={task.completed} onChange={() => toggleTask(task.id)} className="mt-1 task-checkbox" />
                                    <div className="flex-1">
                                        <div className={`text-sm font-medium ${task.completed ? 'line-through text-zinc-400' : 'text-zinc-900 dark:text-white'}`}>{task.text}</div>
                                        {task.dueDate && (<div className={`text-[10px] mt-1 flex items-center gap-1 ${task.dueDate < new Date().toISOString().split('T')[0] && !task.completed ? 'text-red-500 font-bold' : 'text-zinc-400'}`}><Icons.Calendar className="w-3 h-3"/> {task.dueDate} {task.dueDate < new Date().toISOString().split('T')[0] && !task.completed ? '(Overdue)' : ''}</div>)}
                                        <div className="mt-3 space-y-2 pl-2 border-l-2 border-zinc-100 dark:border-zinc-800">
                                            {task.subtasks && task.subtasks.map(sub => (
                                                <div key={sub.id} className="flex items-center gap-2 group/sub">
                                                    <div onClick={() => toggleSubtask(task.id, sub.id)} className={`w-3 h-3 rounded-full border cursor-pointer ${sub.completed ? 'bg-indigo-500 border-indigo-500' : 'border-zinc-400'}`}></div>
                                                    <span className={`text-xs ${sub.completed ? 'line-through text-zinc-400' : 'text-zinc-700 dark:text-zinc-300'}`}>{sub.text}</span>
                                                    <button onClick={() => deleteSubtask(task.id, sub.id)} className="opacity-0 group-hover/sub:opacity-100 text-red-500"><Icons.X className="w-3 h-3"/></button>
                                                </div>
                                            ))}
                                            <div className="flex items-center gap-2 mt-2">
                                                <Icons.Plus className="w-3 h-3 text-zinc-400"/>
                                                <input placeholder="Add subtask..." className="bg-transparent text-xs outline-none w-full dark:text-zinc-300" onKeyDown={(e) => { if(e.key === 'Enter' && e.target.value.trim()) { addSubtask(task.id, e.target.value); e.target.value = ''; }}} />
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => deleteTask(task.id)} className="opacity-0 group-hover:opacity-100 text-red-500 p-1 hover:bg-red-50 dark:hover:bg-red-900/20 rounded"><Icons.Trash className="w-4 h-4"/></button>
                                </div>
                            </div>
                        ))}
                        {filteredTasks.length === 0 && (<div className="text-center text-zinc-400 mt-10"><div className="text-4xl mb-2">📝</div><div>No tasks found in this view.</div></div>)}
                    </div>
                </div>
            )
        };

        const TinyMCEEditor = ({ initialContent, noteId, noteTitle, onSave, onSaveToDrive, isDarkMode, onContextMenu, saveToDriveFunction }) => {

            const debounceTimer = useRef(null);
            const onSaveRef = useRef(onSave);
            const saveToDriveRef = useRef(saveToDriveFunction);
            useEffect(() => { saveToDriveRef.current = saveToDriveFunction; }, [saveToDriveFunction]);
            const uploadCache = useRef(new Map());

            useEffect(() => { onSaveRef.current = onSave; }, [onSave]);

            useEffect(() => {
                const initEditor = () => {

                        window.tinymce.init({
                            selector: '#tinymce-editor', height: '100%', menubar: 'file edit view insert format tools table help',
                            plugins: 'preview importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars emoticons',
                            toolbar: 'undo redo | blocks | bold italic underline strikethrough | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | removeformat | help',
                            skin: isDarkMode ? 'oxide-dark' : 'oxide', content_css: isDarkMode ? 'dark' : 'default',
                            placeholder: "Start typing...", resize: false, paste_data_images: true, smart_paste: false, 
                            images_upload_handler: (blobInfo, progress) => new Promise((resolve, reject) => {
                                const uploader = saveToDriveRef.current;
                                if (!uploader) return reject('Google Drive API not ready yet. Wait a sec.');
                                const blob = blobInfo.blob();
                                const fileKey = `${blob.size}_${blob.type}`;
                                const now = Date.now();
                                const cached = uploadCache.current.get(fileKey);
                                if (cached && (now - cached.timestamp < 5000)) return cached.promise.then(resolve).catch(reject);
                                const uploadPromise = uploader(blob, blobInfo.filename(), blob.type, 'darNote_Images')
                                    .then((result) => { resolve(result.webContentLink || result.url); return result.webContentLink || result.url; })
                                    .catch((err) => { reject("Upload failed: " + err.message); throw err; });
                                uploadCache.current.set(fileKey, { timestamp: now, promise: uploadPromise });
                            }),

                                editorRef.current = editor;
                                editor.on('init', () => { if (initialContent) editor.setContent(initialContent); updateStats(); });

                                });
                            }
                        });

            const [sharedError, setSharedError] = useState(null);
            const [isLoadingNotes, setIsLoadingNotes] = useState(false);
            const [lastDoc, setLastDoc] = useState(null);
            const [hasMore, setHasMore] = useState(true);
            
            const { saveToDrive, isReady, getAccessToken } = useGoogleDrive();

            useEffect(() => { const handlePopState = () => { const params = new URLSearchParams(window.location.search); const noteId = params.get('note'); setActiveNoteId(noteId); }; window.addEventListener('popstate', handlePopState); return () => window.removeEventListener('popstate', handlePopState); }, []);
            useEffect(() => { const url = new URL(window.location); const currentUrlId = url.searchParams.get('note'); if (activeNoteId && currentUrlId !== activeNoteId) { url.searchParams.set('note', activeNoteId); window.history.pushState({}, '', url); } else if (!activeNoteId && currentUrlId) { url.searchParams.delete('note'); window.history.pushState({}, '', url); } }, [activeNoteId]);
            useEffect(() => { const unsubscribe = window.firebase.onAuthStateChanged(window.firebase.auth, (u) => { setUser(u); setIsAuthLoading(false); }); return () => unsubscribe(); }, []);
            
            useEffect(() => { 
                if (!user) { setNotes([]); setSubjects([]); setProfile(null); setSharedNotes([]); return; } 
                const appId = "darnote-app"; const db = window.firebase.db; 
                
                // Profile & Subjects (Keep as listeners)
                const profileUnsub = window.firebase.onSnapshot(window.firebase.doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), (doc) => { if (doc.exists()) setProfile(doc.data()); }); 
                const subjectsUnsub = window.firebase.onSnapshot(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'subjects'), (snapshot) => { const fetchedSubjects = snapshot.docs.map(doc => doc.data().name).sort(); if (fetchedSubjects.length === 0) ['Personal', 'Work', 'Ideas'].forEach(s => window.firebase.addDoc(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'subjects'), { name: s })); else setSubjects(fetchedSubjects); }); 
                
                return () => { profileUnsub(); subjectsUnsub(); }; 
            }, [user]);

            useEffect(() => { if (isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);
            useEffect(() => { const closeMenu = (e) => { if (!e.target.closest('.context-menu')) setContextMenu(null); }; window.addEventListener('mousedown', closeMenu); return () => window.removeEventListener('mousedown', closeMenu); }, []);

            // --- SERVER SIDE FETCHING & SORTING LOGIC ---
            const fetchNotes = async (isLoadMore = false) => {
                if (!user) return;
                setIsLoadingNotes(true);
                try {
                    const db = window.firebase.db;
                    const notesRef = window.firebase.collection(db, 'artifacts', "darnote-app", 'users', user.uid, 'notes');
                    let constraints = [];

                    // Apply Filters
                    if (filter === 'favorites') constraints.push(window.firebase.where('isFavorite', '==', true));
                    if (filter.startsWith('subject:')) constraints.push(window.firebase.where('subject', '==', filter.split(':')[1]));

                    // Apply Sort (Note: Complex sorts like Filter + Sort need Index)
                    if (sortOrder === 'date-desc') constraints.push(window.firebase.orderBy('updatedAt', 'desc'));
                    else if (sortOrder === 'date-asc') constraints.push(window.firebase.orderBy('updatedAt', 'asc'));
                    else if (sortOrder === 'name-asc') constraints.push(window.firebase.orderBy('title', 'asc'));
                    else if (sortOrder === 'name-desc') constraints.push(window.firebase.orderBy('title', 'desc'));

                    // Pagination
                    if (isLoadMore && lastDoc) constraints.push(window.firebase.startAfter(lastDoc));
                    constraints.push(window.firebase.limit(20)); // Limit to save reads

                    const q = window.firebase.query(notesRef, ...constraints);
                    const snapshot = await window.firebase.getDocs(q);
                    
                    const fetchedNotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    if (isLoadMore) setNotes(prev => [...prev, ...fetchedNotes]);
                    else setNotes(fetchedNotes);

                    setLastDoc(snapshot.docs[snapshot.docs.length - 1]);
                    setHasMore(snapshot.docs.length === 20);

                } catch(e) { 
                    console.error("Fetch Error - Likely Missing Index", e);
                    if(e.code === 'failed-precondition') {
                        // Very rough error handling for the user console link
                        const link = e.message.match(/https:\/\/console\.firebase\.google\.com[^\s]*/);
                        if(link) console.log("%c🔥 CREATE INDEX HERE: " + link[0], "color: orange; font-weight: bold; font-size: 14px;");
                        alert("Missing Firestore Index. Check Console (F12) for the creation link.");
                    }
                }
                setIsLoadingNotes(false);
            };

            // SHARED NOTES FETCHING (LAZY LOAD + STINGY READS)
            useEffect(() => {
                if (!user || filter !== 'shared' || !user.email) return;
                
                const fetchShared = async () => {
                    setIsLoadingNotes(true);
                    setSharedNotes([]); 
                    setSharedError(null);
                    try {
                         const db = window.firebase.db;
                         // Stingy Query: Collection Group + Array Contains + Limit (25)
                         // Note: We try with sort first, but it requires a composite index.
                         const q = window.firebase.query(
                             window.firebase.collectionGroup(db, 'notes'), 
                             window.firebase.where('sharedWith', 'array-contains', user.email.toLowerCase()),
                             window.firebase.orderBy('updatedAt', 'desc'),
                             window.firebase.limit(25)
                         );
                         
                         const snap = await window.firebase.getDocs(q);
                         const fetched = snap.docs.map(d => ({id: d.id, ...d.data(), isShared: true}));
                         setSharedNotes(fetched);
                    } catch (e) {
                         console.error("Shared Fetch Error:", e);
                         if(e.code === 'failed-precondition') {
                             setSharedError('INDEX_MISSING'); 
                             const link = e.message.match(/https:\/\/console\.firebase\.google\.com[^\s]*/);
                             if(link) console.log("%c🔥 CREATE SHARED INDEX HERE: " + link[0], "color: orange; font-weight: bold; font-size: 16px; background: #333; padding: 10px;");
                             
                             // FALLBACK: Try without sort so the user sees SOMETHING
                             try {
                                 const qFallback = window.firebase.query(
                                     window.firebase.collectionGroup(db, 'notes'), 
                                     window.firebase.where('sharedWith', 'array-contains', user.email.toLowerCase()),
                                     window.firebase.limit(25)
                                 );
                                 const snap = await window.firebase.getDocs(qFallback);
                                 setSharedNotes(snap.docs.map(d => ({id: d.id, ...d.data(), isShared: true})));
                             } catch (e2) { setSharedError('PERMISSION_OR_OTHER'); }
                         } else {
                             setSharedError('PERMISSION_OR_OTHER');
                         }
                    }
                    setIsLoadingNotes(false);
                };
                fetchShared();
            }, [user, filter]);

            // Trigger fetch on filter/sort change
            useEffect(() => { 
                if(user && filter !== 'shared') { // Shared handled separately
                    setLastDoc(null); setNotes([]); fetchNotes(false); 
                }
            }, [filter, sortOrder, user]);

            // Handling Realtime for Active Note (To ensure edits are sync'd)
            useEffect(() => {
                if(!user || !activeNoteId) return;
                // If it's a shared note, we might need a different path, but assuming owner for now unless handled in shared logic
                const note = notes.find(n => n.id === activeNoteId);
                if(note && note.isShared) return; // Shared handled by other hook
                
                const unsub = window.firebase.onSnapshot(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes', activeNoteId), (doc) => {
                    if(doc.exists()) {
                        setNotes(prev => prev.map(n => n.id === activeNoteId ? { ...n, ...doc.data() } : n));
                    }
                });
                return () => unsub();
            }, [activeNoteId]);


            const filteredNotes = useMemo(() => { 
                // Client-side search on fetched buffer
                // LOGIC UPDATE: Switch buffer based on filter
                let result = filter === 'shared' ? sharedNotes : notes; 
                
                if (searchQuery.trim()) { 
                    const q = searchQuery.toLowerCase(); 
                    result = result.filter(n => n.title.toLowerCase().includes(q) || (n.content && n.content.toLowerCase().includes(q))); 
                } 
                return result; 
            }, [notes, sharedNotes, searchQuery, filter]);


            const handleGlobalLogin = async () => {
                try {
                    // 1. Firebase Login
                    const userCred = await window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider());
                    
                    // 2. IMMEDIATE Drive Token Request (Chain it to the click)
                    // We check if we already have a valid token first to avoid double-popup if possible
                    if (localStorage.getItem('darnote_gdrive_token')) {
                        const { expiry } = JSON.parse(localStorage.getItem('darnote_gdrive_token'));
                        if (Date.now() < expiry) return; // Valid token exists, we are good
                    }
                    
                    // Force a token refresh to ensure we have permissions right away (Safari Bypass)
                    await getAccessToken().catch(e => console.log("Silent token fetch failed, will ask on demand"));
                    
                } catch (error) { alert("Login/Auth failed: " + error.message); }
            };

            const handleGuestLogin = async () => { try { await window.firebase.signInAnonymously(window.firebase.auth); } catch (error) { alert("Guest login failed"); } }
            const handleLogout = async () => { await window.firebase.signOut(window.firebase.auth); setNotes([]); setActiveNoteId(null); localStorage.removeItem('darnote_gdrive_token'); };
            const saveProfile = async (data) => { const appId = "darnote-app"; await window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), data); setShowProfileModal(false); };
            const createNote = async (type = 'text') => { if(!user) return; const currentSubject = filter.startsWith('subject:') ? filter.split(':')[1] : 'Personal'; const newNote = { type, title: '', content: type === 'text' ? '' : null, floatingImages: [], nodes: type === 'mindmap' ? [{id: 'root', text: 'Central Idea', x: 400, y: 300}] : null, connections: type === 'mindmap' ? [] : null, tasks: type === 'tasklist' ? [] : null, tags: [], subject: currentSubject, updatedAt: new Date().toISOString(), isFavorite: false, isPinned: false, ownerId: user.uid, ownerEmail: user.email ? user.email.toLowerCase() : '', sharedWith: [] }; try { const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes'), newNote); setActiveNoteId(docRef.id); if (!isNoteListOpen) setIsNoteListOpen(true); if(filter === 'shared') setFilter('all'); fetchNotes(false); /* Refresh List */ } catch(e) { console.error(e); } };
            const updateNote = async (id, updates) => { if(!id || !user) return; 
                 const targetNote = notes.find(n => n.id === id) || sharedNotes.find(n => n.id === id);
                 if(!targetNote) return;
                 const db = window.firebase.db;
                 const ownerId = targetNote.ownerId || user.uid; 
                 try {
                     await window.firebase.updateDoc(window.firebase.doc(db, 'artifacts', "darnote-app", 'users', ownerId, 'notes', id), { ...updates, updatedAt: new Date().toISOString() });
                 } catch(e) { console.error("Update failed", e); }
            };
            const deleteNote = async (id) => { if(!id || !user) return; await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes', id)); if (activeNoteId === id) setActiveNoteId(null); setNotes(prev => prev.filter(n => n.id !== id)); };
            const createSubject = async (name) => { if(!name || !user || subjects.includes(name)) return; await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'subjects'), { name }); };
            
            // ... (Keeping rest of logic similar but ensuring updates refresh list if needed)
            const handleNoteDragStart = (e, noteId) => { e.dataTransfer.setData('noteId', noteId); e.dataTransfer.effectAllowed = 'move'; };
            const handleSubjectDrop = (e, subject) => { e.preventDefault(); const noteId = e.dataTransfer.getData('noteId'); if (noteId) { updateNote(noteId, { subject }); setFilter(`subject:${subject}`); } };
            const handleContextMenu = (e, type, data) => { e.preventDefault(); e.stopPropagation(); setContextMenu({ x: e.clientX, y: e.clientY, type, data }); };
            const handleContextAction = async (action, payload) => {
                if (!contextMenu) return;
                if (contextMenu.type === 'note') { const note = notes.find(n => n.id === contextMenu.data); if (action === 'delete') deleteNote(note.id); if (action === 'pin') updateNote(note.id, { isPinned: !note.isPinned }); if (action === 'star') updateNote(note.id, { isFavorite: !note.isFavorite }); if (action === 'move') updateNote(note.id, { subject: payload }); if (action === 'tag') { const t = prompt("Tags (comma separated):", note.tags ? note.tags.join(', ') : ""); if(t !== null) updateNote(note.id, { tags: t.split(',').map(s=>s.trim()).filter(Boolean) }); } }
                if (contextMenu.type === 'text' && action === 'ask-ai') { setIsAiSidebarOpen(true); setAiQuery(contextMenu.data.text); } setContextMenu(null);
            };

            const addEmailShare = async (email) => { if(activeNoteId) { await updateNote(activeNoteId, { sharedWith: window.firebase.arrayUnion(email.toLowerCase()) }); } };
            const removeEmailShare = async (email) => { if(activeNoteId) { await updateNote(activeNoteId, { sharedWith: window.firebase.arrayRemove(email.toLowerCase()) }); } };
            
            const handleSaveToDriveAction = async (content, filename, mimeType, folderName, convertToDocs) => {
                if(!isReady) { alert("Google Drive API is not configured or ready. Please check the code configuration."); return; }
                const toast = document.createElement('div');
                toast.className = "fixed bottom-4 right-4 bg-indigo-600 text-white px-4 py-2 rounded shadow-lg z-50 text-sm";
                toast.innerText = convertToDocs ? "Exporting to Google Docs..." : "Saving backup to Drive...";
                document.body.appendChild(toast);
                try {
                    await saveToDrive(content, filename, mimeType, folderName, convertToDocs);
                    toast.innerText = convertToDocs ? "Exported to G-Docs! 📝" : "Backup Saved! 💾";
                    toast.className = "fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg z-50 text-sm";
                } catch(e) {
                    console.error(e);
                    toast.innerText = "Failed to save. Check console.";
                    toast.className = "fixed bottom-4 right-4 bg-red-600 text-white px-4 py-2 rounded shadow-lg z-50 text-sm";
                }
                setTimeout(() => toast.remove(), 3000);
            }

            const activeNote = useMemo(() => {
                const myNote = notes.find(n => n.id === activeNoteId);
                if (myNote) return myNote;
                return sharedNotes.find(n => n.id === activeNoteId);
            }, [notes, sharedNotes, activeNoteId]);

            // PROFILE ICON LOGIC: FIXED
            const renderProfileIcon = () => {
                if (profile?.iconUrl) return <img src={profile.iconUrl} className="w-10 h-10 rounded-full object-cover border border-white/10" />;
                if (user?.photoURL) return <img src={user.photoURL} className="w-10 h-10 rounded-full object-cover border border-white/10" />;
                return <div className="w-10 h-10 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-lg">{user.displayName ? user.displayName[0].toUpperCase() : 'D'}</div>;
            };

            if (isAuthLoading) return <div className="flex h-screen w-full items-center justify-center bg-black text-white flex-col gap-6"><div className="w-12 h-12 rounded-full border-4 border-white border-t-transparent animate-spin"></div></div>;
            if (!user) {
                return (
                    <div className="flex h-screen w-full items-center justify-center bg-black text-white p-4 relative overflow-hidden">
                        <div className="absolute top-[-50%] left-[-50%] w-[200%] h-[200%] bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-zinc-800/20 via-black to-black animate-spin-slow"></div>
                        <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="max-w-md w-full bg-zinc-900/80 backdrop-blur-2xl border border-white/5 p-12 rounded-3xl shadow-2xl relative z-10 text-center ring-1 ring-white/10">
                            <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" alt="darNote" className="w-24 h-24 object-contain mx-auto mb-8 drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] hover:scale-105 transition-transform duration-300" />
                            <h1 className="text-4xl font-bold mb-3 tracking-tighter">darNote</h1>
                            <p className="text-zinc-500 mb-10 font-medium">The workspace for the dark mode soul.</p>
                            <div className="space-y-4"><Button variant="google" onClick={handleGlobalLogin} icon={Icons.Google} className="hover:scale-105 transition-transform duration-200">Sign in with Google</Button><button onClick={handleGuestLogin} className="text-xs text-zinc-600 hover:text-white transition-colors">Continue as Guest</button></div>
                        </motion.div>
                    </div>
                );
            }
            const currentSubjectTitle = filter === 'all' ? 'All Notes' : filter === 'favorites' ? 'Favorites' : filter === 'shared' ? 'Shared with Me' : filter.replace('subject:', '');
            return (
                <div className={`flex h-screen w-full transition-colors duration-300 ${isDarkMode ? 'dark bg-onyx text-zinc-100' : 'bg-light-bg text-zinc-900'} overflow-hidden selection:bg-white/20 selection:text-white`}>
                    <div className="w-[80px] lg:w-[260px] flex-shrink-0 glass-panel flex flex-col justify-between p-4 z-20">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-2 cursor-pointer hover:bg-white/5 p-2 rounded-xl transition-all" onClick={() => setShowProfileModal(true)}>
                                {renderProfileIcon()}
                                <div className="hidden lg:block text-left"><div className="font-bold text-sm tracking-tight truncate w-32">{profile?.displayName || user.displayName || 'darNote User'}</div><div className="text-[10px] text-zinc-500 truncate">{profile?.role || 'Guest'}</div></div>
                            </div>
                            <nav className="space-y-1">
                                <Button variant={filter === 'all' ? 'active' : 'ghost'} className="w-full justify-start py-2.5" icon={Icons.Archive} onClick={() => setFilter('all')}><span className="hidden lg:inline">All Notes</span></Button>
                                <Button variant={filter === 'favorites' ? 'active' : 'ghost'} className="w-full justify-start py-2.5" icon={Icons.Star} onClick={() => setFilter('favorites')}><span className="hidden lg:inline">Favorites</span></Button>
                                <Button variant={filter === 'shared' ? 'active' : 'ghost'} onClick={() => { if(user.isAnonymous) { alert("Guests cannot share. Sign in with Google."); return; } setFilter('shared'); }} className="w-full justify-start py-2.5" icon={Icons.Users}><span className="hidden lg:inline">Shared with Me</span></Button>
                                <a href="el.html" className="w-full flex items-center gap-2 px-2 py-2.5 rounded-lg text-sm font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors"><Icons.Bug className="w-4 h-4"/><span className="hidden lg:inline">Error Log</span></a>
                            </nav>
                            <div className="space-y-1 pt-4 border-t border-zinc-200 dark:border-white/5">
                                <div className="px-3 py-2 text-[10px] font-bold text-zinc-500 flex items-center justify-between uppercase tracking-widest"><span className="hidden lg:block">Subjects</span><button onClick={() => { const n = prompt("Name:"); if(n) createSubject(n); }} className="hover:text-zinc-900 dark:hover:text-white"><Icons.Plus className="w-3 h-3" /></button></div>
                                <nav className="space-y-0.5 overflow-y-auto max-h-[300px]">
                                    {subjects.map((s) => (
                                        <div key={s} onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleSubjectDrop(e, s)} className="group relative" onTouchStart={(e) => { if (e.touches.length === 2) { e.preventDefault(); e.stopPropagation(); handleContextMenu({ clientX: (e.touches[0].clientX + e.touches[1].clientX)/2, clientY: (e.touches[0].clientY + e.touches[1].clientY)/2 }, 'subject', s); } }}>
                                            <Button variant={filter === `subject:${s}` ? 'active' : 'ghost'} className="w-full justify-start text-xs py-2" icon={Icons.Folder} onClick={() => setFilter(`subject:${s}`)} onContextMenu={(e) => handleContextMenu(e, 'subject', s)}><span className="hidden lg:inline truncate">{s}</span></Button>
                                        </div>
                                    ))}
                                </nav>
                            </div>
                        </div>
                        <div className="space-y-2 pt-4 border-t border-zinc-200 dark:border-white/5"><Button onClick={() => setIsDarkMode(!isDarkMode)} icon={isDarkMode ? Icons.Sun : Icons.Moon} className="w-full justify-start"><span className="hidden lg:inline">{isDarkMode ? 'Light Mode' : 'Dark Mode'}</span></Button><Button onClick={handleLogout} icon={Icons.Logout} className="w-full justify-start text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10"><span className="hidden lg:inline">Sign Out</span></Button></div>
                    </div>
                    <AnimatePresence>
                        {isNoteListOpen && (
                            <motion.div initial={{ width: 0, opacity: 0 }} animate={{ width: viewMode === 'grid' ? 400 : 350, opacity: 1 }} exit={{ width: 0, opacity: 0 }} className="flex-shrink-0 border-r border-zinc-200 dark:border-white/5 bg-light-surface dark:bg-surface flex flex-col z-10 overflow-hidden shadow-xl">
                                <div className="p-4 border-b border-zinc-200 dark:border-white/5 space-y-4 min-w-[320px]">
                                    <h2 className="text-xl font-bold px-1 truncate">{currentSubjectTitle}</h2>
                                    {sharedError && filter === 'shared' && (<div className="bg-red-500/10 border border-red-500 text-red-500 p-2 rounded text-xs font-bold mb-2 flex items-center gap-2"><Icons.Alert className="w-4 h-4"/>{sharedError === 'INDEX_MISSING' ? "Missing DB Index! Check Console (F12)." : "Permission Denied. Check Rules."}</div>)}
                                    <div className="flex gap-2">
                                        <div className="relative flex-1"><Icons.Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" /><input type="text" placeholder="Search..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-zinc-100 dark:bg-black/20 border border-zinc-200 dark:border-white/5 rounded-lg pl-9 pr-4 py-2.5 text-sm text-zinc-800 dark:text-zinc-200 focus:outline-none focus:ring-1 focus:ring-white/20 transition-all" /></div>
                                        <div className="relative group">
                                            <button className="h-full px-3 bg-zinc-100 dark:bg-black/20 border border-zinc-200 dark:border-white/5 rounded-lg hover:bg-zinc-200 dark:hover:bg-white/5"><Icons.List className="w-4 h-4" /></button>
                                            <div className="absolute right-0 top-full mt-2 w-40 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-white/10 rounded-lg shadow-xl hidden group-hover:block z-50 py-1">
                                                <div className="px-3 py-2 text-[10px] text-zinc-500 uppercase font-bold">Sort By</div>
                                                <button onClick={() => setSortOrder('date-desc')} className={`w-full text-left px-4 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/10 ${sortOrder==='date-desc'?'text-indigo-500':''}`}>Date (Newest)</button>
                                                <button onClick={() => setSortOrder('date-asc')} className={`w-full text-left px-4 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/10 ${sortOrder==='date-asc'?'text-indigo-500':''}`}>Date (Oldest)</button>
                                                <button onClick={() => setSortOrder('name-asc')} className={`w-full text-left px-4 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/10 ${sortOrder==='name-asc'?'text-indigo-500':''}`}>Name (A-Z)</button>
                                                <button onClick={() => setSortOrder('name-desc')} className={`w-full text-left px-4 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/10 ${sortOrder==='name-desc'?'text-indigo-500':''}`}>Name (Z-A)</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <div className="flex bg-zinc-100 dark:bg-black/20 rounded-lg p-0.5 border border-zinc-200 dark:border-white/5"><button onClick={() => setViewMode('list')} className={`p-1.5 rounded ${viewMode === 'list' ? 'bg-white dark:bg-white/10 shadow-sm text-black dark:text-white' : 'text-zinc-400'}`}><Icons.List className="w-4 h-4"/></button><button onClick={() => setViewMode('grid')} className={`p-1.5 rounded ${viewMode === 'grid' ? 'bg-white dark:bg-white/10 shadow-sm text-black dark:text-white' : 'text-zinc-400'}`}><Icons.Grid className="w-4 h-4"/></button></div>
                                        <div className="flex gap-2"><button onClick={() => createNote('mindmap')} className="p-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-white/10 text-zinc-400 border border-transparent hover:border-white/5" title="New Mind Map"><Icons.Network className="w-4 h-4" /></button><button onClick={() => createNote('tasklist')} className="p-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-white/10 text-zinc-400 border border-transparent hover:border-white/5" title="New Task List"><Icons.CheckSquare className="w-4 h-4" /></button><button onClick={() => createNote('text')} className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white text-black text-sm font-bold hover:bg-zinc-200 transition-colors shadow"><Icons.Plus className="w-4 h-4" /> New Page</button></div>
                                    </div>
                                </div>
                                <div className={`flex-1 overflow-y-auto p-3 min-w-[320px] ${viewMode === 'grid' ? 'grid grid-cols-2 gap-2' : 'space-y-2'}`}>
                                    {filteredNotes.map(note => (
                                        <div key={note.id} draggable onDragStart={(e) => handleNoteDragStart(e, note.id)} onClick={() => setActiveNoteId(note.id)} onContextMenu={(e) => handleContextMenu(e, 'note', note.id)} onTouchStart={(e) => { if (e.touches.length === 2) { e.preventDefault(); e.stopPropagation(); handleContextMenu({ clientX: (e.touches[0].clientX + e.touches[1].clientX)/2, clientY: (e.touches[0].clientY + e.touches[1].clientY)/2 }, 'note', note.id); } }} className={`rounded-xl cursor-pointer border transition-all relative overflow-hidden group ${activeNoteId === note.id ? 'bg-white dark:bg-white/5 border-zinc-300 dark:border-white/10 shadow-lg' : 'bg-transparent border-transparent hover:bg-zinc-50 dark:hover:bg-white/5'} ${viewMode === 'grid' ? 'p-4 aspect-square flex flex-col' : 'p-4'}`}>
                                            <div className="absolute top-2 right-2 flex gap-1">{note.isPinned && <Icons.Pin className="w-3 h-3 text-indigo-500" />}{note.isFavorite && <Icons.Star className="w-3 h-3 text-yellow-500 fill-yellow-500" />}</div>
                                            <div className="font-semibold text-sm truncate mb-2 text-zinc-800 dark:text-zinc-200 pr-6">{note.title || 'Untitled'}</div>
                                            <p className="text-xs text-zinc-500 line-clamp-3 leading-relaxed">{note.type === 'mindmap' ? 'Mind Map Node Graph' : note.type === 'tasklist' ? `${note.tasks?.filter(t=>t.completed).length || 0}/${note.tasks?.length || 0} Tasks Completed` : (note.content ? note.content.replace(/<[^>]*>/g, '') : 'No content')}</p>
                                            {note.isShared && (<div className="flex items-center gap-1 mt-2 text-[9px] text-zinc-400"><Icons.Users className="w-3 h-3"/> From {note.ownerEmail || 'Unknown'}</div>)}
                                            {note.tags && note.tags.length > 0 && (<div className="flex gap-1 mt-2 flex-wrap">{note.tags.map(t => <span key={t} className="text-[9px] bg-indigo-500/10 text-indigo-500 px-1.5 py-0.5 rounded">{t}</span>)}</div>)}
                                            <div className="mt-auto pt-3 text-[10px] text-zinc-600 dark:text-zinc-500 opacity-0 group-hover:opacity-100 transition-opacity">{new Date(note.updatedAt).toLocaleDateString()}</div>
                                        </div>
                                    ))}
                                    {isLoadingNotes && <div className="text-center p-2 text-xs text-zinc-500 animate-pulse">Loading Notes...</div>}
                                    {hasMore && !isLoadingNotes && (<button onClick={() => fetchNotes(true)} className="w-full py-2 text-xs text-indigo-500 hover:text-indigo-400 font-bold mt-2 border border-dashed border-zinc-300 dark:border-zinc-700 rounded-lg hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors">Load More (+20)</button>)}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                    <main className="flex-1 flex flex-col relative bg-light-bg dark:bg-onyx min-w-0 transition-colors duration-300">
                        {activeNote ? (
                            <>
                                <header className="h-16 flex items-center justify-between px-6 border-b border-zinc-200 dark:border-white/5 bg-light-bg dark:bg-onyx z-20 shrink-0 sticky top-0">
                                    <div className="flex items-center gap-3"><button onClick={() => setIsNoteListOpen(!isNoteListOpen)} className="text-zinc-500 hover:text-zinc-900 dark:hover:text-white">{isNoteListOpen ? <Icons.SidebarClose className="w-5 h-5" /> : <Icons.SidebarOpen className="w-5 h-5" />}</button><div className="h-4 w-px bg-zinc-300 dark:bg-white/10 mx-2"></div><input type="text" value={activeNote.title} onChange={(e) => updateNote(activeNote.id, { title: e.target.value })} placeholder="Untitled Note" className="bg-transparent text-lg font-bold text-zinc-900 dark:text-white placeholder-zinc-300 dark:placeholder-zinc-700 focus:outline-none w-full max-w-md" /></div>
                                    <div className="flex items-center gap-2">
                                        {!activeNote.isShared && (<Button variant="ghost" onClick={() => { if(user.isAnonymous) { alert("Guests cannot share notes. Please sign in with Google."); return; } setShowShareModal(true); }} icon={Icons.Share} className={activeNote.sharedWith && activeNote.sharedWith.length > 0 ? 'text-indigo-500' : ''} />)}
                                        <Button variant="ghost" onClick={() => updateNote(activeNote.id, { isPinned: !activeNote.isPinned })} icon={Icons.Pin} className={activeNote.isPinned ? 'text-indigo-500' : ''} />
                                        <Button variant="ghost" onClick={() => setIsAiSidebarOpen(!isAiSidebarOpen)} icon={Icons.Bot} className={isAiSidebarOpen ? 'text-indigo-500' : ''} />
                                    </div>
                                </header>
                                <div className="flex-1 overflow-hidden relative bg-[#f0f2f5] dark:bg-[#0c0c0c] flex flex-col">
                                    <ErrorBoundary key={activeNote.id}>
                                        {activeNote.type === 'mindmap' ? ( <div className="p-8 h-full"><MindMapEditor key={activeNote.id} data={activeNote} onChange={(updates) => updateNote(activeNote.id, updates)} onSaveToDrive={handleSaveToDriveAction} /></div> ) : activeNote.type === 'tasklist' ? ( <TaskEditor key={activeNote.id} data={activeNote} onChange={(updates) => updateNote(activeNote.id, updates)} onSaveToDrive={handleSaveToDriveAction} /> ) : ( <TinyMCEEditor key={activeNote.id} initialContent={activeNote.content} noteId={activeNote.id} noteTitle={activeNote.title} onSave={(html) => updateNote(activeNote.id, { content: html })} onSaveToDrive={handleSaveToDriveAction} isDarkMode={isDarkMode} onContextMenu={(e, text, callback) => handleContextMenu(e, 'text', { text, callback })} saveToDriveFunction={saveToDrive}/> )}
                                    </ErrorBoundary>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex items-center justify-center text-zinc-400 flex-col"><div className="w-16 h-16 bg-zinc-200 dark:bg-white/5 rounded-2xl flex items-center justify-center mb-4"><Icons.Edit className="w-8 h-8 opacity-50"/></div><div className="text-xl font-bold mb-2 text-zinc-900 dark:text-white">No Note Selected</div><div className="text-sm mb-4">Select a note from the sidebar or create a new one.</div><Button variant="primary" onClick={() => createNote('text')}>Create New Page</Button></div>
                        )}
                        <AnimatePresence>
                            {isAiSidebarOpen && (<motion.div initial={{ x: '100%' }} animate={{ x: 0 }} exit={{ x: '100%' }} className="w-[400px] bg-white dark:bg-surface border-l border-zinc-200 dark:border-white/10 absolute right-0 top-0 bottom-0 z-30 shadow-2xl"><AIChatInterface activeNote={activeNote || {}} initialQuery={aiQuery} onClose={() => setIsAiSidebarOpen(false)} user={user} /></motion.div>)}
                        </AnimatePresence>
                    </main>
                    {showShareModal && activeNote && <ShareModal note={activeNote} onClose={() => setShowShareModal(false)} onAddEmail={addEmailShare} onRemoveEmail={removeEmailShare} />}
                    {showProfileModal && <ProfileModal user={user} profile={profile} onClose={() => setShowProfileModal(false)} onSave={saveProfile} />}
                    {contextMenu && (
                        <div style={{ top: contextMenu.y, left: contextMenu.x }} className="fixed z-50 w-56 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-white/10 rounded-lg shadow-2xl py-1 context-menu ring-1 ring-black/5">
                            {contextMenu.type === 'text' ? (
                                <>
                                    <div className="px-4 py-2 text-xs text-zinc-500 font-semibold bg-zinc-50 dark:bg-white/5 uppercase tracking-wider">Selected Text</div>
                                    <button onClick={() => {navigator.clipboard.writeText(contextMenu.data.text); setContextMenu(null);}} className="w-full text-left px-4 py-2.5 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 flex items-center gap-2"><Icons.Archive className="w-3 h-3"/> Copy</button>
                                    <button onClick={() => handleContextAction('ask-ai')} className="w-full text-left px-4 py-2.5 text-sm text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-500/10 flex items-center gap-2"><Icons.Bot className="w-3 h-3"/> Ask AI</button>
                                </>
                            ) : contextMenu.type === 'subject' ? ( <><button onClick={() => handleContextAction('rename')} className="w-full text-left px-4 py-2.5 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10">Rename Subject</button><button onClick={() => handleContextAction('delete')} className="w-full text-left px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 flex items-center gap-2"><Icons.Trash className="w-3 h-3"/> Delete Subject</button></>
                            ) : (
                                <>
                                    <button onClick={() => handleContextAction('pin')} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 flex items-center gap-2"><Icons.Pin className="w-3 h-3"/> Pin Note</button>
                                    <button onClick={() => handleContextAction('star')} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 flex items-center gap-2"><Icons.Star className="w-3 h-3"/> Favorite</button>
                                    <button onClick={() => handleContextAction('tag')} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 flex items-center gap-2"><Icons.Tag className="w-3 h-3"/> Edit Tags</button>
                                    <div className="border-t border-zinc-200 dark:border-white/10 my-1"></div>
                                    <div className="px-4 py-1 text-[10px] text-zinc-500 font-semibold mt-1 uppercase tracking-wider">Move to...</div>
                                    <div className="max-h-32 overflow-y-auto">{subjects.map(s => (<button key={s} onClick={() => handleContextAction('move', s)} className="w-full text-left px-4 py-2 text-sm text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-white/10 pl-6 border-l-2 border-transparent hover:border-indigo-500">{s}</button>))}</div>
                                    <div className="border-t border-zinc-200 dark:border-white/10 my-1"></div>
                                    <button onClick={() => handleContextAction('delete')} className="w-full text-left px-4 py-2.5 text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 flex items-center gap-2"><Icons.Trash className="w-3 h-3"/> Delete</button>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
