    <script type="text/babel">
        // --- CONSTANTS & CONFIG ---
        const GDRIVE_API_KEY = "AIzaSyCScFR_D0snZ6hrHob5fUQM7Y2NhK-kTIA"; 
        const GDRIVE_CLIENT_ID = "256215327792-oglegui0q8qj507oao2c2733thcl9lrc.apps.googleusercontent.com"; 

        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICONS (Feather Style) ---
        const Icons = {
            Home: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
            Book: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>,
            Bug: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="1" width="22" height="22" rx="5" ry="5"></rect><path d="M12 1v22"></path><path d="M1 12h22"></path></svg>, 
            Plus: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            User: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            ChevronLeft: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>,
            Check: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            X: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Camera: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
            Bot: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>,
            Google: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/><path d="M12 11h9c.1 1.4.1 2.9-.4 4.3-1.1 3-4.1 5.3-7.6 5.6-5 .5-9.4-3.1-9.9-8.1C2.5 7.1 6 2.3 11 2c2.5-.1 4.9.9 6.7 2.6l-2.7 2.8c-1-.7-2.3-1.1-3.6-1-2.9.2-5.1 2.8-4.9 5.7.2 2.6 2.4 4.7 5 4.7 2 0 3.6-1.1 4.3-2.9H12v-3z" fill="currentColor"/></svg>,
            Lock: (p) => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
        };

        // --- GEMINI PROXY ---
        const callGemini = async (prompt, systemInstruction = "") => {
            const proxyUrl = "https://gemini-proxy-157237873670.us-central1.run.app/proxy";
            const payload = { contents: [{ parts: [{ text: `${systemInstruction}\n\nUser: ${prompt}` }] }] };
            try {
                const res = await fetch(proxyUrl, { method: 'POST', body: JSON.stringify(payload), headers: {'Content-Type': 'application/json'} });
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
            } catch(e) { return "Error: " + e.message; }
        };

        // --- HOOKS ---
        const useGoogleDrive = () => {
            const [tokenClient, setTokenClient] = useState(null);
            
            useEffect(() => {
                const loadGapi = async () => {
                    if (window.gapi) {
                        await new Promise(r => window.gapi.load('client', r));
                        await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
                    }
                };
                loadGapi();
                if (window.google && window.google.accounts) {
                    const client = window.google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: () => {} });
                    setTokenClient(client);
                }
            }, []);

            const getAccessToken = () => new Promise((resolve, reject) => {
                if (!tokenClient) return reject("Auth not initialized");
                const existing = window.gapi.client.getToken();
                if (existing && Date.now() < existing.expiry) return resolve(existing.access_token);
                tokenClient.callback = (resp) => { if (resp.error) reject(resp); resolve(resp.access_token); };
                tokenClient.requestAccessToken({ prompt: '' });
            });

            const getOrCreateFolder = async (folderName, accessToken) => {
                const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`;
                const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${accessToken}` }});
                const data = await search.json();
                if (data.files?.length > 0) return data.files[0].id;
                const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) });
                const createdData = await create.json();
                return createdData.id;
            };

            const calculateMD5 = (blob) => new Promise((resolve, reject) => {
                if (!window.SparkMD5) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => { const spark = new SparkMD5.ArrayBuffer(); spark.append(e.target.result); resolve(spark.end()); };
                reader.onerror = reject;
                reader.readAsArrayBuffer(blob);
            });

            const saveToDrive = async (blob, filename) => {
                const token = await getAccessToken();
                const parentId = await getOrCreateFolder('darNote_Images', token);
                
                // Deduplication
                const md5Hash = await calculateMD5(blob);
                if (md5Hash) {
                    const listQuery = `'${parentId}' in parents and trashed = false and mimeType contains 'image/'`;
                    const listReq = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(listQuery)}&orderBy=createdTime desc&pageSize=50&fields=files(id,md5Checksum,webContentLink,webViewLink)`, { headers: { Authorization: `Bearer ${token}` } });
                    const listData = await listReq.json();
                    const contentMatch = listData.files?.find(f => f.md5Checksum === md5Hash);
                    if (contentMatch) return `https://lh3.googleusercontent.com/d/${contentMatch.id}`;
                }

                const metadata = { name: filename, mimeType: blob.type, parents: [parentId] };
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', blob);
                
                const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
                const fileData = await uploadRes.json();
                await fetch(`https://www.googleapis.com/drive/v3/files/${fileData.id}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) });
                
                return `https://lh3.googleusercontent.com/d/${fileData.id}`;
            };
            return { saveToDrive };
        };

        const useData = (user, type) => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            useEffect(() => {
                if(!user) return;
                const colName = type === 'notes' ? 'notes' : 'error_logs';
                const q = window.firebase.collection(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, colName);
                const unsub = window.firebase.onSnapshot(q, (snap) => {
                    const items = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => new Date(b.createdAt || b.updatedAt || 0) - new Date(a.createdAt || a.updatedAt || 0));
                    setData(items);
                    setLoading(false);
                });
                return () => unsub();
            }, [user, type]);
            return { data, loading };
        };

        // --- COMPONENTS ---

        const Splash = ({ onLogin }) => (
            <div className="h-screen w-full flex flex-col items-center justify-center bg-onyx relative overflow-hidden px-6">
                <div className="absolute top-[-20%] right-[-20%] w-[80%] h-[80%] bg-brand/20 rounded-full blur-[100px] animate-pulse"></div>
                <motion.div initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} transition={{ duration: 0.8 }} className="z-10 text-center">
                    <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-24 h-24 mx-auto mb-8 drop-shadow-glow" />
                    <h1 className="text-4xl font-bold mb-2 tracking-tight text-white">darNote <span className="text-brand">Ultimate</span></h1>
                    <p className="text-zinc-400 mb-10 text-lg">Your Second Brain.<br/>Now with fewer excuses.</p>
                    <motion.button whileTap={{ scale: 0.95 }} onClick={onLogin} className="w-full bg-white text-black py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 shadow-xl">
                        <Icons.Google className="w-6 h-6"/> Sign In
                    </motion.button>
                </motion.div>
            </div>
        );

        // --- AI CHAT COMPONENT (The "Like EL" Version) ---
        const AIChat = ({ activeLog, onClose, user }) => {
            const [messages, setMessages] = useState([{role: 'ai', text: "I see your failure. How can I help you understand it?"}]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [dailyCount, setDailyCount] = useState(0);
            const messagesEndRef = useRef(null);
            const QUOTA_LIMIT = 10;
            const todayDate = new Date().toISOString().split('T')[0];

            useEffect(() => {
                if(!user) return;
                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'ai_usage', todayDate);
                const unsub = window.firebase.onSnapshot(docRef, (doc) => {
                    if (doc.exists()) { setDailyCount(doc.data().count || 0); } else { setDailyCount(0); }
                });
                return () => unsub();
            }, [user, todayDate]);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            const handleSend = async () => {
                if(!input.trim()) return;
                if (dailyCount >= QUOTA_LIMIT) {
                    setMessages(prev => [...prev, {role: 'ai', text: "<span class='text-red-500 font-bold'>DAILY LIMIT REACHED.</span> Come back tomorrow!"}]);
                    return;
                }
                const userMsg = input;
                setMessages(prev => [...prev, {role: 'user', text: userMsg}]);
                setInput("");
                setLoading(true);

                // Increment Quota
                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'ai_usage', todayDate);
                await window.firebase.setDoc(docRef, { count: window.firebase.increment(1), date: todayDate }, { merge: true });

                // Construct Context
                const context = activeLog ? `
                    Subject: ${activeLog.subject || 'N/A'}
                    Question Type: ${activeLog.questionType || 'N/A'}
                    Student's Explanation: ${activeLog.explanation || 'None'}
                    Image Url: ${activeLog.imageUrl || "No image provided"}
                ` : 'General Chat';
                
                const systemPrompt = `You are a witty, slightly roast-heavy tutor. The student is looking at their mistake. Context: ${context}. Keep it short. Use markdown.`;
                const response = await callGemini(userMsg, systemPrompt);
                setMessages(prev => [...prev, {role: 'ai', text: response}]);
                setLoading(false);
            };

            const remaining = Math.max(0, QUOTA_LIMIT - dailyCount);

            return (
                <div className="flex flex-col h-full bg-surface">
                    <div className="p-4 border-b border-white/10 flex justify-between items-center bg-black/20">
                        <div className="flex flex-col">
                            <span className="font-bold text-sm text-white flex items-center gap-2"><Icons.Bot className="w-4 h-4 text-brand"/> AI Tutor</span>
                            <span className={`text-[10px] font-mono ${remaining === 0 ? 'text-red-500 font-bold' : 'text-zinc-500'}`}>{remaining}/{QUOTA_LIMIT} left today</span>
                        </div>
                        <button onClick={onClose}><Icons.ChevronLeft className="w-6 h-6 rotate-[-90deg] text-zinc-400"/></button>
                    </div>
                    
                    <div className="h-0.5 w-full bg-zinc-800">
                        <div className={`h-full transition-all duration-500 ${remaining === 0 ? 'bg-red-500' : 'bg-brand'}`} style={{ width: `${(dailyCount / QUOTA_LIMIT) * 100}%` }}></div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map((m, i) => (
                            <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role === 'user' ? 'bg-brand text-white rounded-br-none' : 'bg-zinc-800 text-zinc-200 rounded-bl-none'}`}>
                                    <div dangerouslySetInnerHTML={{ __html: window.marked ? window.marked.parse(m.text) : m.text }} />
                                </div>
                            </motion.div>
                        ))}
                        {loading && <div className="text-xs text-zinc-500 animate-pulse pl-2">Thinking...</div>}
                        <div ref={messagesEndRef} />
                    </div>
                    
                    <div className="p-4 border-t border-white/10 bg-black flex gap-2 relative">
                         {remaining === 0 && (
                             <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-10 flex items-center justify-center">
                                 <div className="border border-red-500 text-red-500 px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2">
                                     <Icons.Lock className="w-4 h-4"/> Limit Reached
                                 </div>
                             </div>
                        )}
                        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter' && handleSend()} placeholder="Ask..." className="flex-1 bg-zinc-900 border border-white/10 rounded-full px-4 py-3 text-sm focus:outline-none focus:border-brand text-white"/>
                        <button onClick={handleSend} disabled={remaining===0} className="bg-brand text-white rounded-full p-3 disabled:opacity-50"><Icons.Plus className="w-5 h-5 rotate-90"/></button>
                    </div>
                </div>
            );
        };

        const BottomNav = ({ activeTab, onChange }) => (
            <div className="fixed bottom-0 left-0 right-0 h-[80px] glass z-50 px-6 pb-2 flex items-center justify-between">
                {[
                    { id: 'home', icon: Icons.Home, label: 'Home' },
                    { id: 'errors', icon: Icons.Bug, label: 'Mistakes' },
                    { id: 'add', icon: Icons.Plus, label: '', special: true },
                    { id: 'notes', icon: Icons.Book, label: 'Notes' },
                    { id: 'profile', icon: Icons.User, label: 'Profile' }
                ].map((tab) => (
                    tab.special ? (
                        <motion.button key={tab.id} whileTap={{ scale: 0.9 }} onClick={() => onChange(tab.id)} className="w-14 h-14 bg-brand rounded-full flex items-center justify-center text-white shadow-glow mb-6">
                            <tab.icon className="w-8 h-8"/>
                        </motion.button>
                    ) : (
                        <button key={tab.id} onClick={() => onChange(tab.id)} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === tab.id ? 'text-brand' : 'text-zinc-500'}`}>
                            <tab.icon className="w-6 h-6"/>
                            <span className="text-[10px] font-medium">{tab.label}</span>
                        </button>
                    )
                ))}
            </div>
        );

        const Dashboard = ({ user, errors, notes, setTab }) => {
            const recentErrors = errors.slice(0, 3);
            return (
                <div className="p-6 pb-24 space-y-8">
                    <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="flex justify-between items-center">
                        <div>
                            <div className="text-zinc-400 text-sm">Welcome Back,</div>
                            <div className="text-2xl font-bold text-white">{user.displayName?.split(' ')[0] || 'Scholar'}</div>
                        </div>
                        <img src={user.photoURL} className="w-10 h-10 rounded-full border border-zinc-700"/>
                    </motion.div>

                    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ delay: 0.1 }} className="bg-gradient-to-br from-brand to-brand-dark p-6 rounded-3xl text-white shadow-glow relative overflow-hidden">
                        <div className="relative z-10">
                            <div className="text-sm font-medium opacity-80 mb-1">Total Failures</div>
                            <div className="text-4xl font-bold mb-4">{errors.length}</div>
                            <div className="flex gap-4">
                                <div className="bg-white/20 px-3 py-1 rounded-lg text-xs backdrop-blur-sm"><span className="font-bold">{errors.filter(e => e.mastered).length}</span> Mastered</div>
                                <div className="bg-white/20 px-3 py-1 rounded-lg text-xs backdrop-blur-sm"><span className="font-bold">{notes.length}</span> Notes</div>
                            </div>
                        </div>
                    </motion.div>

                    <div className="grid grid-cols-2 gap-4">
                        <button onClick={() => setTab('add_error')} className="bg-surface p-4 rounded-2xl border border-zinc-800 flex flex-col items-center gap-2 active:scale-95 transition-transform"><div className="w-10 h-10 bg-red-500/10 rounded-full flex items-center justify-center text-red-500"><Icons.Bug className="w-5 h-5"/></div><span className="text-sm font-bold text-zinc-300">Log Error</span></button>
                        <button onClick={() => setTab('add_note')} className="bg-surface p-4 rounded-2xl border border-zinc-800 flex flex-col items-center gap-2 active:scale-95 transition-transform"><div className="w-10 h-10 bg-blue-500/10 rounded-full flex items-center justify-center text-blue-500"><Icons.Book className="w-5 h-5"/></div><span className="text-sm font-bold text-zinc-300">New Note</span></button>
                    </div>

                    <div>
                        <div className="flex justify-between items-end mb-4"><h3 className="font-bold text-lg text-white">Recent Failures</h3><button onClick={()=>setTab('errors')} className="text-xs text-brand">View All</button></div>
                        <div className="space-y-3">{recentErrors.map(e => (
                            <div key={e.id} onClick={() => setTab('edit_error', e)} className="bg-surface p-4 rounded-2xl border border-zinc-800 flex items-center gap-4 active:bg-zinc-800">
                                <div className={`w-2 h-10 rounded-full ${e.mastered ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                <div className="flex-1 overflow-hidden"><div className="font-bold text-zinc-200 truncate">{e.title}</div><div className="text-xs text-zinc-500">{e.subject} • {new Date(e.createdAt).toLocaleDateString()}</div></div>
                            </div>
                        ))}</div>
                    </div>
                </div>
            );
        };

        const ErrorEditor = ({ item, onSave, onBack, onDelete, user }) => {
            const [data, setData] = useState(item || { title: '', subject: 'General', mastered: false, explanation: '', imageUrl: '', questionType: 'MC' });
            const [isAiOpen, setIsAiOpen] = useState(false);
            const { saveToDrive } = useGoogleDrive();
            const [uploading, setUploading] = useState(false);

            const handleImage = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setUploading(true);
                try {
                    const url = await saveToDrive(file, `Error_${Date.now()}.png`);
                    setData({...data, imageUrl: url});
                } catch(err) { alert('Upload failed: ' + err); }
                setUploading(false);
            };

            return (
                <motion.div initial={{ x: '100%' }} animate={{ x: 0 }} exit={{ x: '100%' }} className="fixed inset-0 bg-onyx z-[60] overflow-y-auto flex flex-col">
                    <div className="sticky top-0 bg-onyx/90 backdrop-blur-md p-4 border-b border-zinc-800 flex justify-between items-center z-10 shrink-0">
                        <button onClick={onBack} className="p-2 rounded-full bg-zinc-800"><Icons.ChevronLeft className="w-6 h-6"/></button>
                        <span className="font-bold text-white">Failure Log</span>
                        <div className="flex gap-2">
                             {item && <button onClick={() => setIsAiOpen(true)} className="p-2 bg-brand/10 text-brand rounded-full"><Icons.Bot className="w-5 h-5"/></button>}
                             <button onClick={() => { onSave(data); onBack(); }} className="px-4 py-2 bg-brand rounded-full text-sm font-bold text-white">Save</button>
                        </div>
                    </div>

                    <div className="p-6 space-y-6 flex-1 overflow-y-auto pb-20">
                        <div className="flex gap-2 p-1 bg-zinc-900 rounded-xl">
                            <button onClick={()=>setData({...data, mastered: false})} className={`flex-1 py-3 rounded-lg text-sm font-bold transition-all ${!data.mastered ? 'bg-red-500/20 text-red-500' : 'text-zinc-500'}`}>Review</button>
                            <button onClick={()=>setData({...data, mastered: true})} className={`flex-1 py-3 rounded-lg text-sm font-bold transition-all ${data.mastered ? 'bg-green-500/20 text-green-500' : 'text-zinc-500'}`}>Mastered</button>
                        </div>

                        <input placeholder="What went wrong?" className="w-full bg-transparent text-2xl font-bold placeholder-zinc-600 focus:outline-none text-white" value={data.title} onChange={(e) => setData({...data, title: e.target.value})} />

                        <div className="relative w-full aspect-video bg-zinc-900 rounded-2xl border border-dashed border-zinc-700 flex flex-col items-center justify-center overflow-hidden">
                            {uploading ? <span className="loader"></span> : data.imageUrl ? <img src={data.imageUrl} className="w-full h-full object-contain"/> : (
                                <>
                                    <Icons.Camera className="w-8 h-8 text-zinc-600 mb-2"/>
                                    <span className="text-xs text-zinc-500">Upload Evidence</span>
                                    <input type="file" accept="image/*" onChange={handleImage} className="absolute inset-0 opacity-0 cursor-pointer"/>
                                </>
                            )}
                        </div>

                        <div className="bg-surface rounded-2xl p-4 min-h-[150px] border border-zinc-800">
                            <textarea className="w-full h-full bg-transparent resize-none focus:outline-none text-zinc-300 leading-relaxed min-h-[150px]" placeholder="Explain why you failed..." value={data.explanation} onChange={(e) => setData({...data, explanation: e.target.value})}/>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-[10px] text-zinc-500 uppercase font-bold">Subject</label><input value={data.subject} onChange={e=>setData({...data, subject: e.target.value})} className="w-full bg-zinc-900 p-3 rounded-xl mt-1 focus:outline-none text-white text-sm"/></div>
                            <div><label className="text-[10px] text-zinc-500 uppercase font-bold">Type</label><select value={data.questionType} onChange={e=>setData({...data, questionType: e.target.value})} className="w-full bg-zinc-900 p-3 rounded-xl mt-1 focus:outline-none text-white text-sm"><option value="MC">MC</option><option value="LQ">Long Question</option></select></div>
                        </div>

                        {item && <button onClick={() => { if(confirm('Delete?')) { onDelete(item.id); onBack(); }}} className="w-full py-4 text-red-500 font-bold text-sm bg-zinc-900 rounded-xl">Delete Log</button>}
                    </div>

                    {/* AI Chat Overlay */}
                    <AnimatePresence>
                        {isAiOpen && (
                            <motion.div initial={{ y: "100%" }} animate={{ y: "20%" }} exit={{ y: "100%" }} className="fixed inset-0 z-[70] bg-surface rounded-t-3xl shadow-2xl border-t border-white/10 overflow-hidden">
                                <AIChat activeLog={data} onClose={() => setIsAiOpen(false)} user={user} />
                            </motion.div>
                        )}
                    </AnimatePresence>
                </motion.div>
            );
        };

        const NoteEditor = ({ item, onSave, onBack, onDelete }) => {
            const [title, setTitle] = useState(item?.title || '');
            const editorRef = useRef(null);
            useEffect(() => {
                if (!window.tinymce) return;
                window.tinymce.init({
                    selector: '#mobile-editor', height: '100%', menubar: false, toolbar: 'bold italic bullist | h1 h2', skin: 'oxide-dark', content_css: 'dark',
                    setup: (editor) => { editorRef.current = editor; editor.on('init', () => { if (item?.content) editor.setContent(item.content); }); }
                });
                return () => window.tinymce.remove();
            }, []);
            return (
                <motion.div initial={{ y: '100%' }} animate={{ y: 0 }} exit={{ y: '100%' }} className="fixed inset-0 bg-onyx z-[60] flex flex-col">
                    <div className="p-4 flex items-center justify-between border-b border-zinc-800 bg-onyx shrink-0">
                        <button onClick={onBack}><Icons.X className="w-6 h-6 text-zinc-400"/></button>
                        <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Untitled Note" className="bg-transparent font-bold text-center focus:outline-none text-white w-full mx-4"/>
                        <button onClick={() => { onSave({ ...item, title, content: editorRef.current ? editorRef.current.getContent() : '' }); onBack(); }} className="text-brand font-bold">Done</button>
                    </div>
                    <div className="flex-1 relative"><textarea id="mobile-editor"></textarea></div>
                    {item && <div className="p-4 border-t border-zinc-800 bg-onyx"><button onClick={()=>{onDelete(item.id); onBack();}} className="text-red-500 w-full text-center text-sm font-bold">Delete Note</button></div>}
                </motion.div>
            );
        }

        const ActionSheet = ({ onClose, onSelect }) => (
            <div className="fixed inset-0 bg-black/80 z-[70] flex items-end justify-center" onClick={onClose}>
                <motion.div initial={{ y: 100 }} animate={{ y: 0 }} className="bg-surface w-full max-w-md rounded-t-3xl p-6 space-y-4" onClick={e => e.stopPropagation()}>
                    <div className="w-12 h-1 bg-zinc-700 rounded-full mx-auto mb-4"></div>
                    <button onClick={() => onSelect('error')} className="w-full p-4 bg-zinc-800 rounded-2xl flex items-center gap-4 hover:bg-zinc-700"><div className="p-2 bg-red-500/20 rounded-full text-red-500"><Icons.Bug className="w-6 h-6"/></div><div className="text-left"><div className="font-bold text-white">Log Failure</div><div className="text-xs text-zinc-500">Admit it.</div></div></button>
                    <button onClick={() => onSelect('note')} className="w-full p-4 bg-zinc-800 rounded-2xl flex items-center gap-4 hover:bg-zinc-700"><div className="p-2 bg-blue-500/20 rounded-full text-blue-500"><Icons.Book className="w-6 h-6"/></div><div className="text-left"><div className="font-bold text-white">New Note</div><div className="text-xs text-zinc-500">Write stuff.</div></div></button>
                </motion.div>
            </div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [tab, setTab] = useState('home');
            const [selectedItem, setSelectedItem] = useState(null);
            const [isActionSheetOpen, setIsActionSheetOpen] = useState(false);

            useEffect(() => { window.firebase.onAuthStateChanged(window.firebase.auth, setUser); }, []);
            const { data: errorLogs } = useData(user, 'error_logs');
            const { data: notes } = useData(user, 'notes');

            const handleLogin = () => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider());
            const handleTabChange = (t) => { if (t === 'add') setIsActionSheetOpen(true); else setTab(t); };
            const handleCreate = (type) => { setIsActionSheetOpen(false); setSelectedItem(null); setTab(type === 'error' ? 'add_error' : 'add_note'); };
            
            const handleEdit = (mode, item) => { setSelectedItem(item); setTab(mode); }

            const saveError = async (data) => {
                const col = window.firebase.collection(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'error_logs');
                if (data.id) await window.firebase.updateDoc(window.firebase.doc(col, data.id), data);
                else await window.firebase.addDoc(col, { ...data, createdAt: new Date().toISOString() });
                setTab('errors');
            };

            const saveNote = async (data) => {
                const col = window.firebase.collection(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'notes');
                if (data.id) await window.firebase.updateDoc(window.firebase.doc(col, data.id), data);
                else await window.firebase.addDoc(col, { ...data, type: 'text', createdAt: new Date().toISOString() });
                setTab('notes');
            };

            const deleteItem = async (id, collection) => { await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, collection, id)); };

            if (!user) return <Splash onLogin={handleLogin} />;

            return (
                <div className="h-screen w-full bg-onyx text-zinc-100 flex flex-col overflow-hidden">
                    <div className="flex-1 overflow-y-auto">
                        <AnimatePresence mode="wait">
                            {tab === 'home' && <Dashboard key="home" user={user} errors={errorLogs} notes={notes} setTab={handleEdit} />}
                            {tab === 'errors' && (
                                <div className="p-6 pb-24 min-h-screen">
                                    <h2 className="text-3xl font-bold text-white mb-6">Error Logs</h2>
                                    <div className="space-y-3">
                                        {errorLogs.map((item, i) => (
                                            <motion.div key={item.id} initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i*0.05 }} onClick={() => handleEdit('edit_error', item)} className="bg-surface p-4 rounded-2xl border border-zinc-800 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold text-zinc-200 mb-1">{item.title || 'Untitled'}</div>
                                                    <span className={`text-xs font-bold ${item.mastered ? "text-green-500" : "text-red-500"}`}>{item.mastered ? 'SOLVED' : 'REVIEW'}</span>
                                                </div>
                                                <Icons.ChevronLeft className="w-5 h-5 text-zinc-600 rotate-180"/>
                                            </motion.div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {tab === 'notes' && (
                                <div className="p-6 pb-24 min-h-screen">
                                    <h2 className="text-3xl font-bold text-white mb-6">Notes</h2>
                                    <div className="space-y-3">
                                        {notes.map((item, i) => (
                                            <motion.div key={item.id} initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: i*0.05 }} onClick={() => handleEdit('edit_note', item)} className="bg-surface p-4 rounded-2xl border border-zinc-800 flex justify-between items-center">
                                                <div><div className="font-bold text-zinc-200">{item.title || 'Untitled'}</div><div className="text-xs text-zinc-500">{new Date(item.createdAt).toLocaleDateString()}</div></div>
                                                <Icons.ChevronLeft className="w-5 h-5 text-zinc-600 rotate-180"/>
                                            </motion.div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {tab === 'profile' && (
                                <div className="p-6 flex flex-col items-center justify-center h-full space-y-6">
                                    <img src={user.photoURL} className="w-24 h-24 rounded-full border-4 border-brand"/>
                                    <h2 className="text-2xl font-bold">{user.displayName}</h2>
                                    <button onClick={() => window.firebase.signOut(window.firebase.auth)} className="px-8 py-3 bg-zinc-800 rounded-xl font-bold text-red-500">Sign Out</button>
                                </div>
                            )}
                        </AnimatePresence>
                    </div>

                    <BottomNav activeTab={tab} onChange={handleTabChange} />

                    <AnimatePresence>
                        {isActionSheetOpen && <ActionSheet onClose={() => setIsActionSheetOpen(false)} onSelect={handleCreate} />}
                        {(tab === 'add_error' || tab === 'edit_error') && <ErrorEditor item={selectedItem} onSave={saveError} onBack={() => setTab('errors')} onDelete={(id) => deleteItem(id, 'error_logs')} user={user} />}
                        {(tab === 'add_note' || tab === 'edit_note') && <NoteEditor item={selectedItem} onSave={saveNote} onBack={() => setTab('notes')} onDelete={(id) => deleteItem(id, 'notes')} />}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
