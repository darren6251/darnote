                    </AnimatePresence>
                </div>
                <div className="fixed bottom-0 w-full h-[80px] glass z-50 px-6 pb-2 flex items-center justify-between">{[{id:'home',I:Icons.Home,l:'Home'},{id:'errors',I:Icons.Bug,l:'Mistakes'},{id:'add',I:Icons.Plus,l:'',s:1},{id:'notes',I:Icons.Book,l:'Notes'},{id:'profile',I:Icons.User,l:'Settings'}].map(t=>t.s?<motion.button key={t.id} whileTap={{scale:0.9}} onClick={()=>sSht(true)} className="w-14 h-14 bg-brand rounded-full flex items-center justify-center text-white shadow-glow mb-6"><t.I className="w-8 h-8"/></motion.button>:<button key={t.id} onClick={()=>nav(t.id)} className={`flex flex-col items-center gap-1 ${tab===t.id?'text-brand':'text-zinc-500'}`}><t.I className="w-6 h-6"/><span className="text-[10px] font-medium">{t.l}</span></button>)}</div>
                {sht&&<div className="fixed inset-0 bg-black/80 z-[70] flex items-end justify-center" onClick={()=>sSht(false)}><motion.div initial={{y:100}} animate={{y:0}} className="bg-white dark:bg-surface w-full max-w-md rounded-t-3xl p-6 space-y-4" onClick={e=>e.stopPropagation()}><div className="w-12 h-1 bg-zinc-300 rounded-full mx-auto mb-4"/><button onClick={()=>{sSht(false);sSel(null);nav('add_error')}} className="w-full p-4 bg-zinc-100 dark:bg-zinc-800 rounded-2xl flex items-center gap-4"><div className="p-2 bg-red-500/20 rounded-full text-red-500"><Icons.Bug className="w-6 h-6"/></div><span className="font-bold">Log Failure</span></button><button onClick={()=>{sSht(false);sSel(null);nav('add_note')}} className="w-full p-4 bg-zinc-100 dark:bg-zinc-800 rounded-2xl flex items-center gap-4"><div className="p-2 bg-blue-500/20 rounded-full text-blue-500"><Icons.Book className="w-6 h-6"/></div><span className="font-bold">New Note</span></button></motion.div></div>}
                <AnimatePresence>
                    {(tab==='add_error'||tab==='edit_error')&&<ErrEd item={sel||(tab==='edit_error'?recentErrors.find(e=>e.id===getP().id):null)} save={d=>sv('error_logs',d)} back={goBack} del={id=>dl(id,'error_logs')} user={u} subs={subs}/>}
                    {(tab==='add_note'||tab==='edit_note')&&<NoteEd item={sel} save={d=>sv('notes',d)} back={goBack} del={id=>dl(id,'notes')}/>}
                </AnimatePresence>
            </div>;
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
