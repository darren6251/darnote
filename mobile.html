    <style>
        body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
        
        /* SCROLLBAR HIDING */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* EDITOR STYLES */
        .rich-editor-content { line-height: 1.7; font-size: 11pt; color: #e4e4e7; padding-bottom: 200px; }
        .rich-editor-content p { margin-bottom: 0.8rem; }
        .rich-editor-content h1 { font-size: 24pt; font-weight: 800; margin-bottom: 0.5rem; margin-top: 1.5rem; color: #fff; letter-spacing: -0.05em; }
        .rich-editor-content h2 { font-size: 18pt; font-weight: 700; margin-bottom: 0.5rem; margin-top: 1.5rem; color: #f4f4f5; letter-spacing: -0.03em; }
        .rich-editor-content h3 { font-size: 14pt; font-weight: 700; margin-bottom: 0.5rem; margin-top: 1rem; }
        .rich-editor-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; marker: #52525b; }
        .rich-editor-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #52525b; }
        .rich-editor-content blockquote { border-left: 2px solid #3f3f46; padding-left: 1rem; margin: 1.5rem 0; font-style: italic; color: #a1a1aa; }
        .rich-editor-content a { color: #fff; text-decoration: underline; text-decoration-color: #52525b; text-underline-offset: 4px; font-weight: 500; transition: all 0.2s; }
        .rich-editor-content a:hover { text-decoration-color: #fff; }
        .rich-editor-content code { background: #18181b; padding: 0.2em 0.4em; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; border: 1px solid #27272a; color: #e4e4e7; }
        
        /* Glass Effects */
        .glass-panel { background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-dock { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8); }
        
        .page-simulation {

        /* Message Bubbles for AI */
        .message-content p { margin-bottom: 0.5em; }
        .message-content pre { background: rgba(0,0,0,0.5); padding: 0.8em; border-radius: 8px; overflow-x: auto; margin-top: 0.5em; border: 1px solid #27272a; }
        
        /* Gradient Text */
        .gradient-text { background: linear-gradient(to right, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICONS (Refined) ---
        const Icons = {
            Plus: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            ChevronLeft: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            Home: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Search: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Settings: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Star: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Folder: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>,
            Trash: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Bot: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>,
            Sparkles: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M3 5h4"/><path d="M3 9h4"/></svg>,
            Send: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            X: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Edit: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>,
            Check: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Save: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            Users: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Share: (props) => <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>,
        };

        // --- AI API (Kept Same) ---
        const callGemini = async (prompt, systemInstruction = "") => {
            const proxyUrl = "https://gemini-proxy-157237873670.us-central1.run.app/proxy";
            const payload = { contents: [{ parts: [{ text: `${systemInstruction}\n\n${prompt}` }] }] };
            try {
                const res = await fetch(proxyUrl, { method: 'POST', body: JSON.stringify(payload), headers: {'Content-Type': 'application/json'} });
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "I'm drawing a blank here.";
            } catch(e) { return "Sorry, I can't reach the cloud right now."; }
        };

        // --- COMPONENTS ---

        const TypingDemo = () => {
            const [displayText, setDisplayText] = useState("");
            const [phase, setPhase] = useState("typing_bad"); // typing_bad, struck, ai_badge, typing_good
            
            const badText = "NO2 acid";
            const goodText = "Nitrogen dioxide (NO₂) is an acidic gas that contributes significantly to acid rain formation.";

            useEffect(() => {
                let timeout;
                
                if (phase === "typing_bad") {
                    if (displayText.length < badText.length) {
                        timeout = setTimeout(() => {
                            setDisplayText(badText.slice(0, displayText.length + 1));
                        }, 100);
                    } else {
                        timeout = setTimeout(() => setPhase("struck"), 800);
                    }
                } else if (phase === "struck") {
                    timeout = setTimeout(() => setPhase("ai_badge"), 1000);
                } else if (phase === "ai_badge") {
                    timeout = setTimeout(() => {
                        setDisplayText("");
                        setPhase("typing_good");
                    }, 1500);
                } else if (phase === "typing_good") {
                    if (displayText.length < goodText.length) {
                        timeout = setTimeout(() => {
                            setDisplayText(goodText.slice(0, displayText.length + 1));
                        }, 40);
                    } else {
                        // Loop back after long pause
                        timeout = setTimeout(() => {
                             setDisplayText("");
                             setPhase("typing_bad");
                        }, 5000);
                    }
                }

                return () => clearTimeout(timeout);
            }, [displayText, phase]);

            return (
                <div className="w-full max-w-sm bg-surfaceHighlight border border-white/10 rounded-2xl p-6 mb-8 relative overflow-hidden min-h-[140px] flex flex-col justify-center shadow-2xl">
                    
                    {/* Phase 1 & 2: Bad Text & Strike */}
                    {(phase === "typing_bad" || phase === "struck" || phase === "ai_badge") && (
                        <div className="relative self-start">
                            <span className="text-xl text-zinc-300 font-serif relative z-10">{displayText || badText}</span>
                            {/* Strikethrough Line */}
                            {phase !== "typing_bad" && (
                                <motion.div 
                                    initial={{ width: 0 }} 
                                    animate={{ width: "100%" }} 
                                    transition={{ duration: 0.4, ease: "easeInOut" }}
                                    className="absolute top-1/2 left-0 h-[2px] bg-red-500 z-20"
                                />
                            )}
                        </div>
                    )}

                    {/* Phase 3: AI Badge */}
                    <AnimatePresence>
                        {phase === "ai_badge" && (
                            <motion.div 
                                initial={{ opacity: 0, scale: 0.8, y: 10 }}
                                animate={{ opacity: 1, scale: 1, y: 0 }}
                                exit={{ opacity: 0, scale: 0.8 }}
                                className="absolute inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-30"
                            >
                                <div className="flex items-center gap-2 bg-white text-black px-4 py-2 rounded-full font-bold shadow-glow">
                                    <Icons.Sparkles className="w-4 h-4 animate-spin-slow"/>
                                    <span>AI Polish</span>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* Phase 4: Good Text */}
                    {phase === "typing_good" && (
                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }}>
                            <span className="text-sm leading-relaxed text-white font-medium font-sans">
                                {displayText}
                                <span className="inline-block w-1.5 h-4 bg-white ml-1 animate-pulse align-middle"/>
                            </span>
                        </motion.div>
                    )}
                </div>
            );
        };

        const MessageBubble = ({ text, isUser }) => {
            const bubbleRef = useRef(null);
            useEffect(() => {
                if (bubbleRef.current && !isUser) {
                    if (window.marked) bubbleRef.current.innerHTML = window.marked.parse(text); else bubbleRef.current.textContent = text;
                } else if (bubbleRef.current) bubbleRef.current.textContent = text;
            }, [text, isUser]);
            return (
                <motion.div 
                    initial={{ scale: 0.9, opacity: 0 }} 
                    animate={{ scale: 1, opacity: 1 }} 
                    className={`message-content text-sm p-3 rounded-2xl border ${isUser ? 'bg-white text-black border-white rounded-br-sm' : 'bg-surfaceHighlight border-white/10 text-zinc-200 rounded-bl-sm'}`}
                >
                    <div ref={bubbleRef} className={isUser ? "whitespace-pre-wrap font-medium" : "prose prose-invert prose-sm"} />
                </motion.div>
            );
        };

        const AIChatOverlay = ({ isOpen, onClose, contextNote }) => {
             const [messages, setMessages] = useState([{role: 'ai', text: 'Ask me anything about your notes.'}]);
             const [input, setInput] = useState('');
             const [isTyping, setIsTyping] = useState(false);
             const messagesEndRef = useRef(null);
             const textareaRef = useRef(null);

             useEffect(() => { if(isOpen) scrollToBottom(); }, [messages, isOpen]);

             const scrollToBottom = () => {
                 messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
             }

             // Auto-resize textarea
             useEffect(() => {
                 const el = textareaRef.current;
                 if (el) {
                     el.style.height = 'auto'; // Reset height
                     el.style.height = Math.min(el.scrollHeight, 120) + 'px'; // Set new height, max 120px
                 }
             }, [input]);

             const handleSend = async () => {
                 if(!input.trim()) return;
                 const userText = input;
                 setMessages(prev => [...prev, { role: 'user', text: userText }]);
                 setInput('');
                 setIsTyping(true);
                 
                 // Reset height after send
                 if(textareaRef.current) textareaRef.current.style.height = 'auto';

                 const systemPrompt = `You are a helpful assistant in a dark-mode note app. Context: "${contextNote?.title || 'None'}", Content: "${contextNote?.content?.replace(/<[^>]*>/g, '').slice(0, 500) || 'None'}". Keep answers concise for mobile and as short but precise as possible (can also be one word). Use markdown.`;
                 const response = await callGemini(userText, systemPrompt);
                 setMessages(prev => [...prev, { role: 'ai', text: response }]);
                 setIsTyping(false);
             };

             const handleFocus = () => {
                 // Slight delay to allow keyboard to pop up on mobile
                 setTimeout(scrollToBottom, 300);
             };

             return (
                 <AnimatePresence>
                    {isOpen && (
                        <motion.div 
                            initial={{ y: "100%" }} 
                            animate={{ y: 0 }} 
                            exit={{ y: "100%" }} 
                            transition={{ type: "spring", damping: 25, stiffness: 200 }} 
                            className="fixed inset-0 z-[60] bg-black/95 backdrop-blur-xl flex flex-col h-[100dvh]" /* using dvh for mobile viewports */
                        >
                            <div className="h-16 flex items-center justify-between px-6 shrink-0 border-b border-white/5">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center">
                                        <Icons.Sparkles className="text-white w-4 h-4"/>
                                    </div>
                                    <span className="font-bold text-lg tracking-tight">AI Assistant</span>
                                </div>
                                <button onClick={onClose} className="p-2 bg-white/5 rounded-full hover:bg-white/10 transition-colors"><Icons.ChevronLeft className="rotate-[-90deg]"/></button>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className="max-w-[85%]">
                                            <MessageBubble text={m.text} isUser={m.role === 'user'} />
                                        </div>
                                    </div>
                                ))}
                                {isTyping && <div className="text-xs text-zinc-500 animate-pulse ml-4 font-mono">Thinking...</div>}
                                <div ref={messagesEndRef} className="h-4"/> 
                            </div>
                            
                            <div className="p-4 border-t border-white/5 bg-black pb-[max(20px,env(safe-area-inset-bottom))]">
                                <div className="flex gap-2 items-end relative">
                                    <textarea 
                                        ref={textareaRef}
                                        value={input} 
                                        onChange={e => setInput(e.target.value)} 
                                        onFocus={handleFocus}
                                        rows={1}
                                        placeholder="Ask AI..." 
                                        className="flex-1 bg-surfaceHighlight border border-white/10 rounded-[20px] px-5 py-3.5 text-sm focus:outline-none focus:border-white/30 transition-colors text-white placeholder-zinc-600 resize-none overflow-hidden min-h-[48px] max-h-[120px]"
                                        style={{ lineHeight: '1.4' }}
                                    />
                                    <button onClick={handleSend} className="bg-white text-black w-12 h-12 rounded-full flex items-center justify-center hover:scale-105 transition-transform shrink-0 mb-[1px]"><Icons.Send className="w-5 h-5 ml-0.5"/></button>
                                </div>
                            </div>

        const NoteCard = ({ note, onClick, index }) => (

                <div className="flex justify-between items-center mt-4">
                    <div className="flex gap-2">

        // --- EDITOR COMPONENT ---
        const NoteEditor = ({ note, onSave, onBack, onDelete, onAiToggle, onShare }) => {
            const editorRef = useRef(null);
            const isComposing = useRef(false);
            const saveTimeout = useRef(null);
            const [saveStatus, setSaveStatus] = useState('saved');

            useEffect(() => {
                if (editorRef.current && note) {
                    editorRef.current.innerHTML = note.content || '';
                }
            }, [note.id]); 

            useEffect(() => {
                const interval = setInterval(() => {
                    if (editorRef.current && saveStatus === 'unsaved') {
                        triggerSave(editorRef.current.innerHTML);
                    }
                }, 5 * 60 * 1000);
                return () => clearInterval(interval);
            }, [saveStatus]);

            const triggerSave = (content) => {
                setSaveStatus('saving');
                onSave(content);
                setTimeout(() => setSaveStatus('saved'), 800);
            };

            const handleInput = () => {
                if (isComposing.current) return;
                setSaveStatus('unsaved');
                if (saveTimeout.current) clearTimeout(saveTimeout.current);
                saveTimeout.current = setTimeout(() => {
                    if (editorRef.current) triggerSave(editorRef.current.innerHTML);
                }, 2000);
            };

            const handleCompositionStart = () => { isComposing.current = true; };
            const handleCompositionEnd = (e) => { isComposing.current = false; handleInput(); };

            return (
                <motion.div 
                    initial={{ y: "100%", borderRadius: "24px 24px 0 0" }} 
                    animate={{ y: 0, borderRadius: "0px" }} 
                    exit={{ y: "100%", borderRadius: "24px 24px 0 0" }} 
                    transition={{ type: "spring", damping: 25, stiffness: 200 }} 
                    className="fixed inset-0 z-50 bg-black flex flex-col"
                >
                    <div className="h-16 flex items-center justify-between px-2 shrink-0 glass-dock backdrop-blur-xl border-b border-white/5 z-50">
                        <button onClick={onBack} className="p-3 text-zinc-400 hover:text-white transition-colors"><Icons.ChevronLeft /></button>
                        <div className="flex-1 flex flex-col items-center justify-center overflow-hidden px-4">
                             <input value={note.title} onChange={(e) => onSave(null, e.target.value)} placeholder="Untitled Note" className="bg-transparent font-bold text-lg w-full outline-none text-center text-white placeholder-zinc-700"/>
                             <motion.div 
                                key={saveStatus}
                                initial={{ opacity: 0, y: 5 }} 
                                animate={{ opacity: 1, y: 0 }}
                                className={`text-[10px] font-mono flex items-center gap-1 ${saveStatus === 'unsaved' ? 'text-yellow-500' : 'text-zinc-600'}`}
                             >
                                {saveStatus === 'saving' ? 'Syncing...' : saveStatus === 'unsaved' ? 'Unsaved' : 'Synced'}
                             </motion.div>
                        </div>
                         <div className="flex gap-1">
                            <button onClick={onShare} className="p-2.5 text-zinc-400 hover:text-white rounded-full hover:bg-white/5"><Icons.Users /></button>
                            <button onClick={onAiToggle} className="p-2.5 text-zinc-400 hover:text-white rounded-full hover:bg-white/5"><Icons.Sparkles /></button>
                            <button onClick={onDelete} className="p-2.5 text-zinc-400 hover:text-red-500 rounded-full hover:bg-white/5"><Icons.Trash /></button>
                         </div>
                    </div>
                    <div className="flex-1 overflow-y-auto bg-black relative">
                         <div className="p-6 min-h-full flex justify-center">
                            <div className="w-full max-w-lg pb-32">
                                 <div 
                                    ref={editorRef} 
                                    contentEditable 
                                    className="rich-editor-content outline-none" 
                                    onInput={handleInput} 
                                    onCompositionStart={handleCompositionStart}
                                    onCompositionEnd={handleCompositionEnd}
                                    placeholder="Start writing..."
                                />
                            </div>
                         </div>
                    </div>
                </motion.div>
            );
        };

        const ShareModal = ({ note, onClose, onShare, onUnshare }) => {

            return (

                        <div className="space-y-6">

                                <div className="flex gap-2">
                                    <input value={email} onChange={e => setEmail(e.target.value)} placeholder="friend@gmail.com" className="flex-1 bg-black border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-white/50 text-sm transition-colors"/>
                                    <button onClick={() => {if(email) {onShare(email); setEmail('');}}} className="bg-white text-black px-4 rounded-xl font-bold text-sm hover:scale-105 transition-transform"><Icons.Plus/></button>
                                </div>

                            <div>

                 <button onClick={() => onChange('settings')} className={`relative p-3 rounded-2xl transition-all duration-300 ${activeTab === 'settings' ? 'bg-white/10 text-white' : 'text-zinc-500 hover:text-zinc-300'}`}>

                            <div><label className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest ml-1">Bio</label><textarea value={data.bio} onChange={e => setData({...data, bio: e.target.value})} className="w-full mt-1 bg-black border border-white/10 rounded-xl px-4 py-3 text-white outline-none focus:border-white/40 h-24 transition-colors resize-none"/></div>

                        <div className="flex justify-end gap-3 mt-8">

                            <button onClick={() => onSave(data)} className="px-6 py-3 bg-white text-black rounded-xl font-bold shadow-lg hover:scale-105 transition-transform">Save Changes</button>

        const App = () => {
            const [tab, setTab] = useState('home'); 
            const [user, setUser] = useState(null);

            const [notes, setNotes] = useState([]);
            const [subjects, setSubjects] = useState([]);
            const [activeNoteId, setActiveNoteId] = useState(null);
            const [loading, setLoading] = useState(true);

            const [isProfileOpen, setIsProfileOpen] = useState(false);
            const [isShareOpen, setIsShareOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [subjectFilter, setSubjectFilter] = useState('All');

            useEffect(() => {
                const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, (u) => { setUser(u); setLoading(false); });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                const db = window.firebase.db;
                const appId = "darnote-app";
                
                if (subjectFilter === 'Shared') {
                    const q = window.firebase.query(
                        window.firebase.collectionGroup(db, 'notes'), 
                        window.firebase.where('sharedWith', 'array-contains', user.email)
                    );
                    const unsubShared = window.firebase.onSnapshot(q, (snap) => {
                        const sharedNotes = snap.docs.map(d => ({id: d.id, path: d.ref.path, ...d.data(), isShared: true, subject: 'Shared'}));
                        setNotes(sharedNotes);
                    }, (error) => console.error("Index Error Check Console", error));
                    return () => unsubShared();
                } else {
                    const unsubNotes = window.firebase.onSnapshot(
                        window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'notes'), 
                        (snap) => {
                            const myNotes = snap.docs.map(d => ({id: d.id, path: d.ref.path, ...d.data(), isShared: false}));
                            setNotes(myNotes.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)));
                        }
                    );
                    return () => unsubNotes();
                }
            }, [user, subjectFilter]);

            useEffect(() => {
                if(!user) return;
                const unsubSubjects = window.firebase.onSnapshot(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'subjects'), (snap) => {
                    const s = snap.docs.map(d => d.data().name).sort();
                    setSubjects(s.length > 0 ? s : ['Personal', 'Work', 'Ideas']);
                });
                const unsubProfile = window.firebase.onSnapshot(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'profile', 'data'), (doc) => { if (doc.exists()) setProfile(doc.data()); });
                return () => { unsubSubjects(); unsubProfile(); };
            }, [user]);

            const createNote = async () => {
                if(!user) return;
                const newNote = { type: 'text', title: '', content: '', subject: subjectFilter === 'All' || subjectFilter === 'Shared' ? 'Personal' : subjectFilter, updatedAt: new Date().toISOString(), ownerId: user.uid, ownerEmail: user.email, sharedWith: [] };
                const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'notes'), newNote);
                setActiveNoteId(docRef.id);
            };
            
            const createSubject = async () => {
                const name = prompt("New Subject Name:");
                if (!name || subjects.includes(name)) return;
                await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'subjects'), { name });
            };

            const updateNote = async (id, content, title) => {
                const updates = { updatedAt: new Date().toISOString() };
                if(content !== null) updates.content = content;
                if(title !== undefined) updates.title = title;
                const note = notes.find(n => n.id === id);
                if (!note) return;
                const docRef = window.firebase.doc(window.firebase.db, note.path); 
                await window.firebase.updateDoc(docRef, updates);
            };
            
            const shareNote = async (email) => {
                if(!activeNoteId) return;
                const note = notes.find(n => n.id === activeNoteId);
                if(note.isShared) { alert("Only the owner can manage sharing permissions."); return; }
                const docRef = window.firebase.doc(window.firebase.db, note.path);
                await window.firebase.updateDoc(docRef, { sharedWith: window.firebase.arrayUnion(email.trim()) });
            };

            const unshareNote = async (email) => {
                if(!activeNoteId) return;
                const note = notes.find(n => n.id === activeNoteId);
                const docRef = window.firebase.doc(window.firebase.db, note.path);
                await window.firebase.updateDoc(docRef, { sharedWith: window.firebase.arrayRemove(email) });
            }

            const deleteNote = async (id) => {
                if(confirm("Delete this note?")) {
                    const note = notes.find(n => n.id === id);
                    if(note.isShared) { alert("Can't delete shared notes."); return; }
                    const docRef = window.firebase.doc(window.firebase.db, note.path);
                    await window.firebase.deleteDoc(docRef);
                    setActiveNoteId(null);
                }
            };
            
            const saveProfile = async (data) => {
                const appId = "darnote-app";
                await window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', appId, 'users', user.uid, 'profile', 'data'), data);
                setIsProfileOpen(false);
            };

            const activeNote = activeNoteId ? notes.find(n => n.id === activeNoteId) : null;
            const displayedNotes = notes.filter(n => {
                if(tab === 'search') return n.title?.toLowerCase().includes(searchQuery.toLowerCase()) || n.content?.toLowerCase().includes(searchQuery.toLowerCase());
                if(subjectFilter === 'All') return !n.isShared; 
                if(subjectFilter === 'Shared') return n.isShared;
                return n.subject === subjectFilter;
            });

            if (loading) return <div className="h-screen w-full bg-black flex items-center justify-center"><div className="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin"></div></div>;

                        <div className="w-24 h-24 bg-white rounded-[32px] flex items-center justify-center text-5xl font-black mb-6 shadow-[0_0_60px_rgba(255,255,255,0.2)] text-black z-10">d</div>
                        <h1 className="text-5xl font-black text-white mb-2 tracking-tighter z-10">darNote</h1>
                        <p className="text-zinc-500 mb-8 font-medium tracking-wide text-sm uppercase z-10">Liquid Obsidian Edition</p>
                        
                        {/* TYPING DEMO */}
                        <div className="z-10 w-full flex justify-center">
                            <TypingDemo />
                        </div>

                        <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="w-full bg-white text-black font-bold py-5 rounded-2xl mb-4 shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-2 z-10"><Icons.Plus className="rotate-45"/> Sign in with Google</button>
                    </div>
                );

            return (
                <div className="bg-black min-h-screen text-white pb-[100px] relative overflow-x-hidden">

                    {/* --- HOME TAB --- */}
                    {tab === 'home' && (
                        <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="relative z-10">
                            <div className="h-20 flex items-end justify-between px-6 pb-2 mb-4">
                                <h1 className="text-3xl font-bold tracking-tight">darNotes</h1>
                                <button onClick={() => setIsProfileOpen(true)} className="w-10 h-10 rounded-full bg-surfaceHighlight border border-white/10 flex items-center justify-center font-bold text-sm text-zinc-300">
                                    {profile?.displayName?.[0] || user.displayName?.[0] || 'U'}

                            </div>
                            
                            <div className="mb-6 overflow-x-auto hide-scrollbar px-6 flex gap-3 items-center">
                                {['All', 'Shared', ...subjects].map(s => (
                                    <button 
                                        key={s} 
                                        onClick={() => setSubjectFilter(s)} 
                                        className={`px-5 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap transition-all duration-300 ${subjectFilter === s ? 'bg-white text-black shadow-glow scale-105' : 'bg-surfaceHighlight text-zinc-500 border border-white/5 hover:border-white/20'}`}
                                    >

                            </div>

                            <div className="px-5 pb-20">
                                {displayedNotes.length === 0 ? (
                                    <div className="flex flex-col items-center justify-center h-64 text-zinc-600 gap-4">
                                        <div className="w-20 h-20 bg-surfaceHighlight rounded-full flex items-center justify-center opacity-50"><Icons.Folder className="w-8 h-8"/></div>
                                        <p className="text-sm font-medium">No notes in {subjectFilter}</p>
                                    </div>
                                ) : (
                                    displayedNotes.map((n, i) => <NoteCard key={n.id} note={n} index={i} onClick={() => setActiveNoteId(n.id)} />)
                                )}
                            </div>
                        </motion.div>
                    )}

                    {/* --- SEARCH TAB --- */}
                    {tab === 'search' && (
                        <motion.div initial={{opacity:0, y: 10}} animate={{opacity:1, y: 0}} className="relative z-10 px-6 pt-12">
                            <h1 className="text-3xl font-bold mb-6">Search</h1>
                            <div className="bg-surfaceHighlight border border-white/10 rounded-2xl flex items-center px-5 py-4 mb-6 focus-within:border-white/30 transition-colors">
                                <Icons.Search className="text-zinc-500 w-5 h-5 mr-3"/>
                                <input autoFocus value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Type to search..." className="bg-transparent w-full outline-none text-white placeholder-zinc-600 font-medium"/>
                            </div>
                            <div className="pb-20">{searchQuery && displayedNotes.map((n, i) => <NoteCard key={n.id} note={n} index={i} onClick={() => setActiveNoteId(n.id)} />)}</div>
                        </motion.div>
                    )}

                    {/* --- AI TAB --- */}
                    {tab === 'ai' && (

                        </motion.div>
                    )}
                    
                     {/* --- SETTINGS TAB --- */}
                     {tab === 'settings' && (
                        <div className="p-6 pt-16 relative z-10">

                                     <div className="w-16 h-16 bg-black border border-white/10 rounded-full flex items-center justify-center font-bold text-2xl">{profile?.displayName?.[0] || user.displayName?.[0] || 'U'}</div>
                                     <div>
                                         <div className="font-bold text-lg text-white">{profile?.displayName || user.displayName || 'Guest User'}</div>
                                         <div className="text-xs text-zinc-500 mt-1 uppercase tracking-widest">{profile?.role || 'Creator'}</div>
                                     </div>
                                 </div>
                                 <button onClick={() => setIsProfileOpen(true)} className="w-full p-5 text-left text-zinc-300 font-medium hover:bg-white/5 transition-colors flex items-center justify-between border-b border-white/5">Edit Profile <Icons.Edit className="w-4 h-4 text-zinc-500"/></button>
                                 <button onClick={() => window.firebase.signOut(window.firebase.auth)} className="w-full p-5 text-left text-red-400 font-medium hover:bg-white/5 transition-colors">Log Out</button>
                             </div>
                             <div className="mt-12 text-center">
                                <div className="text-zinc-700 text-[10px] font-mono tracking-widest uppercase mb-2">darNote - Mobile.</div>
                                <div className="text-zinc-800 text-[10px]">Designed by Darren Ng, 3-shot Limited</div>
                             </div>
                        </div>
                    )}

                    <AnimatePresence>
                        {activeNoteId && activeNote && (
                            <NoteEditor 
                                note={activeNote} 
                                onBack={() => setActiveNoteId(null)} 
                                onSave={(content, title) => updateNote(activeNoteId, content, title)} 
                                onDelete={() => deleteNote(activeNoteId)} 
                                onAiToggle={() => setIsAiOpen(true)}
                                onShare={() => setIsShareOpen(true)}
                            />
                        )}
                    </AnimatePresence>

                    <AIChatOverlay isOpen={isAiOpen} onClose={() => { setIsAiOpen(false); if(tab === 'ai') setTab('home'); }} contextNote={activeNote} />
                    {isProfileOpen && <ProfileModal user={user} profile={profile} onClose={() => setIsProfileOpen(false)} onSave={saveProfile} />}
                    {isShareOpen && activeNote && <ShareModal note={activeNote} onClose={() => setIsShareOpen(false)} onShare={shareNote} onUnshare={unshareNote} />}
                    
                    {!activeNoteId && <BottomNav activeTab={tab} onChange={setTab} onFab={createNote} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
