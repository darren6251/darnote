<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>darNote - Home</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png">
    
    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel & Tailwind -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Framer Motion & Utils -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        onyx: '#000000', /* Apple Pure Black */
                        surface: '#0a0a0a', /* Slightly elevated */
                        border: '#27272a',
                        brand: '#007AFF', /* iOS Blue */
                        'brand-light': '#5AC8FA',
                        'light-bg': '#F2F2F7', /* iOS Gray bg */
                        'light-surface': '#ffffff',
                        'light-border': '#E5E5EA'
                    },
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'sans-serif'] },
                }
            }
        };
    </script>
    <style>
        body { font-family: '-apple-system', 'Inter', sans-serif; overflow-y: hidden; -webkit-font-smoothing: antialiased; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .feed-scroll::-webkit-scrollbar { width: 4px; }
        .feed-scroll::-webkit-scrollbar-track { background: transparent; }
        .feed-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark .feed-scroll::-webkit-scrollbar-thumb { background: #3f3f46; }

        .glass-nav { 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px); 
            background: rgba(255,255,255,0.7);
        }
        .dark .glass-nav {
            background: rgba(0,0,0,0.6);
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Subtle image shadows */
        .img-shadow { box-shadow: 0 4px 24px -6px rgba(0,0,0,0.1); }
        .dark .img-shadow { box-shadow: 0 4px 24px -6px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="bg-light-bg dark:bg-onyx text-zinc-900 dark:text-zinc-100 transition-colors duration-300 selection:bg-brand selection:text-white">
    <div id="root"></div>

    <!-- Firebase v11 Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAvPEac-03kE4oazvaq8K3T2gxLPsnZO20", projectId: "darnote625" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = "darnote-app";

        window.firebaseEnv = { auth, db, provider, signInWithPopup, signOut, onAuthStateChanged, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, addDoc, appId };
        window.dispatchEvent(new Event('firebaseReady'));
    </script>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICONS ---
        const Icons = {
            Home: (p) => <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" {...p}><path d="M12 3L2 12h3v8h5v-6h4v6h5v-8h3L12 3z"/></svg>,
            HomeOutline: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Plus: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Activity: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Timer: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Check: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="20 6 9 17 4 12"/></svg>,
            Trash: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Calendar: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            ChevronDown: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="6 9 12 15 18 9"/></svg>,
            Heart: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            HeartFilled: (p) => <svg viewBox="0 0 24 24" fill="#FF2D55" stroke="#FF2D55" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            MessageCircle: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>,
            Repeat: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>,
            Share: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
            LogOut: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Moon: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
            Sun: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
            MoreHorizontal: (p) => <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" {...p}><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="12" r="2"/></svg>,
            TrendingUp: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        };

        // --- SHARED UTILS ---
        const getInitials = (name) => name ? name.substring(0, 2).toUpperCase() : 'U';
        const getBotAvatar = (seed) => `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}&backgroundColor=transparent`;
        const timeAgo = (dateStr) => {
            if(!dateStr) return '';
            const seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m";
            return "Just now";
        };

        const THEME_KEY = 'darnote_theme';
        const applyTheme = (isDark) => {
            if(isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        };

        // --- SYSTEM DROPS (MOCK RESERVOIR FOR SOCIAL FEEL) ---
        const SYSTEM_DROPS = [
            { id: 'sd1', type: 'public', author: 'Study Memes', curriculum: 'Global', content: 'When you read the same paragraph 5 times and still don\'t know what it says...', imageUrl: 'https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=800&q=80', likes: 1204, createdAt: Date.now() - 10000000 },
            { id: 'sd2', type: 'public', author: 'darNote Academy', curriculum: 'Productivity', content: 'Active Recall is scientifically proven to be 200% more effective than passive reading. Stop highlighting. Start drilling.', likes: 890, createdAt: Date.now() - 25000000 },
            { id: 'sd3', type: 'public', author: 'Aesthetic Hub', curriculum: 'Vibes', content: 'Current study setup. ☕️🌧️ Getting ready for finals season.', imageUrl: 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=800&q=80', likes: 3402, createdAt: Date.now() - 40000000 },
            { id: 'sd4', type: 'public', author: 'Math Daily', curriculum: 'STEM', content: 'Did you know? Euler\'s Identity (e^(iπ) + 1 = 0) is considered the most beautiful equation in mathematics because it links 5 fundamental constants.', likes: 450, createdAt: Date.now() - 50000000 },
            { id: 'sd5', type: 'public', author: 'Late Night Crew', curriculum: 'Global', content: 'The library at 2 AM hits different.', imageUrl: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80', likes: 2100, createdAt: Date.now() - 70000000 },
            { id: 'sd6', type: 'public', author: 'darNote System', curriculum: 'Lore', content: 'Feynman Technique: Explain a concept in simple terms. If you stumble, you\'ve found a gap in your knowledge. Go back to the source material.', likes: 130, createdAt: Date.now() - 85000000 },
            { id: 'sd7', type: 'public', author: 'Med School Docs', curriculum: 'Medical', content: 'Spaced repetition saved my life during anatomy block. Trust the algorithm.', imageUrl: 'https://images.unsplash.com/photo-1558021212-51b6ecfa0db9?auto=format&fit=crop&w=800&q=80', likes: 980, createdAt: Date.now() - 95000000 },
            { id: 'sd8', type: 'public', author: 'Code Tips', curriculum: 'Computer Science', content: 'If your code works, don\'t touch it. Just quietly back away and pray.', likes: 4500, createdAt: Date.now() - 110000000 }
        ];

        // --- COMPONENTS ---
        
        const ActivityRing = ({ progress, color, size = 56, strokeWidth = 5, label, sublabel }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (progress / 100) * circumference;
            return (
                <div className="flex flex-col items-center justify-center relative" style={{width: size, height: size}}>
                    <svg className="transform -rotate-90 drop-shadow-sm" width={size} height={size}>
                        <circle stroke="currentColor" fill="transparent" strokeWidth={strokeWidth} r={radius} cx={size/2} cy={size/2} className="text-black/5 dark:text-white/10" />
                        <circle stroke={color} fill="transparent" strokeWidth={strokeWidth} strokeLinecap="round" r={radius} cx={size/2} cy={size/2}
                            style={{ strokeDasharray: circumference, strokeDashoffset: offset, transition: 'stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1)' }} />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-[11px] font-bold leading-none">{label}</span>
                        {sublabel && <span className="text-[8px] text-zinc-500 font-medium uppercase tracking-wider mt-0.5">{sublabel}</span>}
                    </div>
                </div>
            );
        };

        const InsightRings = ({ userLogs }) => {
            const total = userLogs.length;
            const mastered = userLogs.filter(l => l.mastered).length;
            const masteryRate = total > 0 ? Math.round((mastered / total) * 100) : 0;
            
            const topics = userLogs.map(l => l.topic).filter(Boolean);
            const topicCounts = topics.reduce((acc, val) => { acc[val] = (acc[val] || 0) + 1; return acc; }, {});
            const nemesis = Object.keys(topicCounts).sort((a,b) => topicCounts[b] - topicCounts[a])[0] || 'None';d
            
            const subjects = userLogs.map(l => l.subject).filter(Boolean);
            const subjCounts = subjects.reduce((acc, val) => { acc[val] = (acc[val] || 0) + 1; return acc; }, {});
            const mainSubj = Object.keys(subjCounts).sort((a,b) => subjCounts[b] - subjCounts[a])[0] || 'N/A';
            const subjRate = total > 0 ? Math.round(((subjCounts[mainSubj] || 0) / total) * 100) : 0;

            return (
                <div className="bg-white/50 dark:bg-zinc-900/50 backdrop-blur-md border border-light-border dark:border-white/5 rounded-[20px] p-5 my-3 relative overflow-hidden group img-shadow">
                    <div className="absolute -top-10 -right-10 p-4 opacity-[0.03] dark:opacity-[0.02] pointer-events-none">
                        <Icons.TrendingUp className="w-48 h-48" />
                    </div>
                    <div className="flex justify-between items-start mb-5 relative z-10">
                        <div>
                            <h4 className="font-bold text-zinc-900 dark:text-white flex items-center gap-2">
                                <span className="text-[13px] tracking-tight">Your Weekly Insight</span>
                            </h4>
                            <p className="text-[13px] text-zinc-500 mt-0.5">Computed from {total} logged errors.</p>
                        </div>
                        <motion.button whileHover={{scale: 1.1}} whileTap={{scale: 0.9}} className="p-2.5 text-zinc-600 dark:text-zinc-300 bg-black/5 dark:bg-white/10 rounded-full transition-colors" title="Export as Story">
                            <Icons.Share className="w-4 h-4" />
                        </motion.button>
                    </div>
                    
                    <div className="flex justify-between items-center relative z-10 px-2">
                        <ActivityRing progress={masteryRate} color="#34C759" label={`${masteryRate}%`} sublabel="Mastery" />
                        <ActivityRing progress={subjRate} color="#007AFF" label={`${subjRate}%`} sublabel={mainSubj.substring(0,6)} />
                        <div className="text-center bg-black/5 dark:bg-white/5 rounded-2xl py-2 px-3">
                            <div className="text-[9px] text-zinc-500 uppercase tracking-widest mb-1 font-bold">Nemesis</div>
                            <div className="font-semibold text-xs text-[#FF3B30]">{nemesis.length > 10 ? nemesis.substring(0,10)+'...' : nemesis}</div>
                        </div>
                    </div>
                </div>
            );
        };

        const PostActionRow = ({ stats, isMastered, onMastered, onDrill, onShare }) => (
            <div className="flex items-center gap-5 mt-3 text-zinc-500 dark:text-zinc-400">
                <motion.button whileTap={{ scale: 0.8 }} onClick={onMastered} className="flex items-center gap-1.5 hover:text-[#FF2D55] transition-colors group">
                    <div className="p-2 -m-2 rounded-full group-hover:bg-[#FF2D55]/10 transition-colors">
                        {isMastered ? <Icons.HeartFilled className="w-[22px] h-[22px]" /> : <Icons.Heart className="w-[22px] h-[22px]" />}
                    </div>
                    {stats?.likes > 0 && <span className={`text-[13px] font-medium ${isMastered ? 'text-[#FF2D55]' : ''}`}>{stats.likes + (isMastered ? 1 : 0)}</span>}
                </motion.button>
                
                <motion.button whileTap={{ scale: 0.8 }} onClick={onDrill} className="flex items-center gap-1.5 hover:text-brand transition-colors group">
                    <div className="p-2 -m-2 rounded-full group-hover:bg-brand/10 transition-colors">
                        <Icons.MessageCircle className="w-[22px] h-[22px]" />
                    </div>
                </motion.button>

                <motion.button whileTap={{ scale: 0.8 }} onClick={onShare} className="flex items-center gap-1.5 hover:text-emerald-500 transition-colors group">
                    <div className="p-2 -m-2 rounded-full group-hover:bg-emerald-500/10 transition-colors">
                        <Icons.Repeat className="w-[22px] h-[22px]" />
                    </div>
                </motion.button>

                <motion.button whileTap={{ scale: 0.8 }} className="flex items-center gap-1.5 hover:text-zinc-800 dark:hover:text-zinc-200 transition-colors group ml-auto">
                    <div className="p-2 -m-2 rounded-full group-hover:bg-zinc-200 dark:group-hover:bg-white/10 transition-colors">
                        <Icons.Share className="w-[22px] h-[22px]" />
                    </div>
                </motion.button>
            </div>
        );

        const FeedPost = ({ post, isLast, onInteraction }) => {
            const isPersonal = post.type === 'personal';
            const isInsight = post.type === 'insight';
            
            const authorName = isPersonal ? (post.author || 'You') : isInsight ? 'darNote AI' : (post.author || 'System Lore');
            const avatarSrc = isPersonal ? post.avatar : getBotAvatar(authorName);
            const badgeColor = isPersonal ? 'text-brand bg-brand/10' : isInsight ? 'text-amber-500 bg-amber-500/10' : 'text-zinc-500 bg-black/5 dark:bg-white/10';

            return (
                <motion.div 
                    initial={{ opacity: 0, y: 15 }}
                    whileInView={{ opacity: 1, y: 0 }}
                    viewport={{ once: true, margin: "-50px" }}
                    transition={{ duration: 0.4, ease: [0.16, 1, 0.3, 1] }}
                    className="flex gap-3.5 px-4 py-4 relative group"
                >
                    {/* Left Column: Avatar & Thread Line */}
                    <div className="flex flex-col items-center">
                        <motion.div whileHover={{ scale: 1.05 }} className="w-10 h-10 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden flex-shrink-0 z-10 border border-black/5 dark:border-white/10 relative">
                            {isPersonal && !avatarSrc ? (
                                <div className="w-full h-full flex items-center justify-center bg-gradient-to-br from-brand to-brand-light text-white font-bold text-sm">{getInitials(authorName)}</div>
                            ) : (
                                <img src={avatarSrc} className="w-full h-full object-cover" alt="avatar" />
                            )}
                        </motion.div>
                        {!isLast && <div className="w-[2px] h-full bg-light-border dark:bg-[#27272a] mt-2 mb-[-16px] rounded-full"></div>}
                    </div>

                    {/* Right Column: Content */}
                    <div className="flex-1 pb-1">
                        <div className="flex justify-between items-center mb-0.5">
                            <div className="flex items-center gap-2">
                                <span className="font-semibold text-[15px] hover:underline cursor-pointer">{authorName}</span>
                                {post.subject && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}`}>{post.subject}</span>}
                                {post.curriculum && !post.subject && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}`}>{post.curriculum}</span>}
                            </div>
                            <div className="flex items-center gap-2 text-zinc-500">
                                <span className="text-[13px]">{timeAgo(post.createdAt)}</span>
                                <button className="p-1 -mr-1 hover:text-zinc-900 dark:hover:text-white rounded-full"><Icons.MoreHorizontal className="w-5 h-5"/></button>
                            </div>
                        </div>

                        {/* Content Body */}
                        <div className="text-[15px] leading-[1.45] mt-1 text-zinc-800 dark:text-zinc-200 break-words pr-2">
                            {isInsight ? (
                                <InsightRings userLogs={post.rawLogs} />
                            ) : (
                                <div>
                                    {post.title && <h4 className="font-bold mb-1">{post.title}</h4>}
                                    <p className="whitespace-pre-wrap">{post.content}</p>
                                    
                                    {post.formula && (
                                        <div className="mt-3 p-3 bg-zinc-50 dark:bg-[#121212] rounded-xl font-mono text-[13px] border border-light-border dark:border-white/5 text-brand dark:text-brand-light overflow-x-auto">
                                            {post.formula}
                                        </div>
                                    )}

                                    {post.imageUrl && (
                                        <div className="mt-3 relative rounded-[18px] overflow-hidden border border-black/5 dark:border-white/10 img-shadow">
                                            <img src={post.imageUrl} className="w-full object-cover max-h-[400px] hover:scale-105 transition-transform duration-700" alt="post attachment" />
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Interaction Row */}
                        {!isInsight && (
                            <PostActionRow 
                                stats={{likes: post.likes || 0}} 
                                isMastered={post.mastered} 
                                onMastered={() => onInteraction(post, 'master')} 
                                onDrill={() => onInteraction(post, 'drill')} 
                                onShare={() => onInteraction(post, 'share')}
                            />
                        )}
                    </div>
                </motion.div>
            );
        };

        // --- SIDEBAR WIDGETS ---
        const SidebarAccordion = ({ title, icon: Icon, defaultOpen = false, children }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            return (
                <div className="mb-4 bg-white/50 dark:bg-[#121212]/50 backdrop-blur-md rounded-2xl border border-light-border dark:border-white/5 overflow-hidden">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-3.5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                        <div className="flex items-center gap-2.5 text-[14px] font-semibold text-zinc-900 dark:text-zinc-100">
                            <Icon className="w-[18px] h-[18px] text-brand" /> {title}
                        </div>
                        <Icons.ChevronDown className={`w-[18px] h-[18px] text-zinc-500 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    <AnimatePresence>
                        {isOpen && (
                            <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                                <div className="p-3.5 pt-0 border-t border-black/5 dark:border-white/5">
                                    {children}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); 
            const [loadingState, setLoadingState] = useState('init'); 
            const [isDark, setIsDark] = useState(localStorage.getItem(THEME_KEY) !== 'light');
            
            const [feedItems, setFeedItems] = useState([]);
            
            useEffect(() => {
                const handleFb = () => setFb(window.firebaseEnv);
                if (window.firebaseEnv) handleFb();
                else window.addEventListener('firebaseReady', handleFb);
                return () => window.removeEventListener('firebaseReady', handleFb);
            }, []);

            useEffect(() => {
                if (!fb) return;
                const unsub = fb.onAuthStateChanged(fb.auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const profSnap = await fb.getDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', u.uid, 'settings', 'profile'));
                        if (profSnap.exists() && profSnap.data().role) {
                            setProfile(profSnap.data());
                            setLoadingState('ready');
                        } else setLoadingState('onboarding');
                    } else {
                        setUser(null);
                        setProfile(null);
                        setLoadingState('ready'); 
                    }
                });
                return () => unsub();
            }, [fb]);

            useEffect(() => {
                if (!fb || loadingState !== 'ready') return;

                const loadFeedData = async () => {
                    let pLogs = [];
                    let pDrops = [...SYSTEM_DROPS]; // Start with vibrant system mock data to guarantee a populated feed
                    
                    if (user) {
                        try {
                            const logsSnap = await fb.getDocs(fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'error_logs'));
                            logsSnap.forEach(doc => pLogs.push({id: doc.id, type: 'personal', ...doc.data()}));
                            pLogs.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                        } catch(e) { console.error(e); }
                    }

                    // Shuffle drops slightly for variety
                    pDrops = pDrops.sort(() => Math.random() - 0.5);

                    // INTERLEAVE ALGORITHM (Ratio ~ 60% Public, 30% Personal, 10% Insight)
                    const finalFeed = [];
                    let pIdx = 0, pubIdx = 0;
                    
                    // We will build a feed of exactly 50 items if possible
                    for(let i=0; i<50; i++) {
                        // Inject Insight every 10 items (if user has logs)
                        if (i > 0 && i % 10 === 0 && pLogs.length > 0) {
                            finalFeed.push({ id: `insight_${i}`, type: 'insight', rawLogs: pLogs });
                        } 
                        // 30% chance for Personal Log
                        else if (i % 3 === 0 && pIdx < pLogs.length) {
                            finalFeed.push(pLogs[pIdx++]);
                        } 
                        // Default to Public Drop
                        else if (pubIdx < pDrops.length) {
                            finalFeed.push(pDrops[pubIdx++]);
                            // If we run out of public drops, loop them for infinite feel
                            if(pubIdx === pDrops.length) pubIdx = 0;
                        } 
                        // Fallback to personal if no public
                        else if (pIdx < pLogs.length) {
                            finalFeed.push(pLogs[pIdx++]);
                        } else break;
                    }

                    // Welcome Prompt if completely empty
                    if (finalFeed.length === 0) {
                        finalFeed.push({
                            id: 'welcome', type: 'public', author: 'System', 
                            content: "Welcome to darNote Hub! Click the '+' button below to log your first academic mistake.", createdAt: Date.now()
                        });
                    }

                    setFeedItems(finalFeed);
                };

                loadFeedData();
            }, [fb, user, profile, loadingState]);

            const handleInteraction = (post, action) => {
                if(!user && action !== 'share') return alert("Please sign in to interact.");
                if(action === 'master' && post.type === 'personal') {
                    setFeedItems(prev => prev.map(p => p.id === post.id ? {...p, mastered: !p.mastered} : p));
                    fb.updateDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'error_logs', post.id), { mastered: !post.mastered });
                } else if(action === 'drill' && post.type === 'personal') {
                    window.location.href = `el.html?log=${post.id}`;
                } else if(action === 'master' && post.type === 'public') {
                     // Optimistic fake like for public mock drops
                    setFeedItems(prev => prev.map(p => p.id === post.id ? {...p, mastered: !p.mastered} : p));
                }
            };

            const toggleTheme = () => { const n = !isDark; setIsDark(n); applyTheme(n); };
            useEffect(() => { applyTheme(isDark); }, []);

            // --- RENDER ---
            if (!fb || loadingState === 'init') return (
                <div className="h-screen w-full flex items-center justify-center bg-light-bg dark:bg-onyx">
                    <div className="w-8 h-8 border-[3px] border-zinc-300 dark:border-zinc-800 border-t-brand rounded-full animate-spin"></div>
                </div>
            );

            if (loadingState === 'onboarding') return (
                <div className="h-screen w-full flex items-center justify-center bg-black text-white p-6">
                    <motion.div initial={{scale:0.9, opacity:0}} animate={{scale:1, opacity:1}} className="max-w-sm w-full">
                        <h2 className="text-3xl font-bold mb-2 tracking-tight">Welcome to darNote</h2>
                        <p className="text-zinc-400 mb-8 text-[15px]">Personalize your experience. What's your current stage?</p>
                        <div className="space-y-3">
                            {['high_school', 'university', 'professional'].map(r => (
                                <motion.button whileTap={{scale:0.96}} key={r} onClick={async () => {
                                    const data = { role: r, curriculum: '_all', onboardedAt: Date.now() };
                                    await fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'settings', 'profile'), data, {merge:true});
                                    setProfile(data); setLoadingState('ready');
                                }} className="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 hover:border-zinc-600 transition-colors text-left font-semibold capitalize flex justify-between items-center">
                                    {r.replace('_', ' ')} <Icons.ChevronDown className="w-5 h-5 -rotate-90 text-zinc-500"/>
                                </motion.button>
                            ))}
                        </div>
                    </motion.div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen w-full overflow-hidden">
                    {/* iOS-Style Glass Header */}
                    <header className="h-[60px] flex items-center justify-between px-5 border-b border-black/5 dark:border-white/5 glass-nav z-40 relative flex-shrink-0">
                        <div className="font-bold text-[22px] tracking-tight select-none flex items-center gap-2">
                            dar<span className="text-brand">Note</span>
                            {profile && <span className="hidden md:inline-flex px-2 py-0.5 rounded-md bg-black/5 dark:bg-white/10 text-[11px] uppercase tracking-wider font-bold text-zinc-500 ml-2">{profile.role.replace('_',' ')}</span>}
                        </div>
                        <div className="flex items-center gap-4">
                            <motion.button whileTap={{scale:0.9}} onClick={toggleTheme} className="text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-colors">
                                {isDark ? <Icons.Sun className="w-[22px] h-[22px]"/> : <Icons.Moon className="w-[22px] h-[22px]"/>}
                            </motion.button>
                            {user ? (
                                <motion.div whileTap={{scale:0.9}} onClick={()=>fb.signOut(fb.auth)} className="w-8 h-8 rounded-full overflow-hidden border border-black/10 dark:border-white/10 cursor-pointer">
                                    <img src={user.photoURL} alt="User" />
                                </motion.div>
                            ) : (
                                <motion.button whileTap={{scale:0.95}} onClick={()=>fb.signInWithPopup(fb.auth, fb.provider)} className="px-4 py-1.5 bg-brand text-white rounded-full text-[14px] font-bold shadow-md hover:bg-[#0062CC] transition-colors">
                                    Sign In
                                </motion.button>
                            )}
                        </div>
                    </header>

                    {/* Main Layout */}
                    <div className="flex-1 flex overflow-hidden max-w-6xl mx-auto w-full">
                        
                        {/* LEFT: THE FEED (Threads Style) */}
                        <main className="flex-1 overflow-y-auto feed-scroll relative pb-24 md:pb-8">
                            <div className="max-w-[600px] mx-auto w-full pt-2">
                                {feedItems.length === 0 ? (
                                    <div className="flex justify-center mt-20"><div className="w-6 h-6 border-[3px] border-zinc-300 dark:border-zinc-800 border-t-brand rounded-full animate-spin"></div></div>
                                ) : (
                                    feedItems.map((item, idx) => (
                                        <FeedPost key={item.id} post={item} isLast={idx === feedItems.length - 1} onInteraction={handleInteraction} />
                                    ))
                                )}
                            </div>
                        </main>

                        {/* RIGHT: DESKTOP SIDEBAR */}
                        <aside className="hidden lg:flex flex-col w-[350px] border-l border-black/5 dark:border-white/5 p-5 overflow-y-auto feed-scroll">
                            <div className="grid grid-cols-2 gap-3 mb-6">
                                <motion.button whileHover={{scale:1.02}} whileTap={{scale:0.95}} onClick={()=>window.location.href='el.html'} className="p-4 bg-brand/10 text-brand rounded-[20px] flex flex-col items-center justify-center gap-2 text-[13px] font-bold">
                                    <Icons.Activity className="w-6 h-6"/> Error Log
                                </motion.button>
                                <motion.button whileHover={{scale:1.02}} whileTap={{scale:0.95}} onClick={()=>window.location.href='note.html'} className="p-4 bg-zinc-100 dark:bg-[#121212] text-zinc-600 dark:text-zinc-300 rounded-[20px] flex flex-col items-center justify-center gap-2 text-[13px] font-bold">
                                    <Icons.Check className="w-6 h-6"/> Notes
                                </motion.button>
                            </div>
                            
                            {user && (
                                <SidebarAccordion title="Focus Session" icon={Icons.Timer} defaultOpen={true}>
                                    <div className="text-center py-2 text-zinc-500 text-[13px]">Open original app to use advanced timers.</div>
                                </SidebarAccordion>
                            )}

                            <div className="mt-auto pt-6 text-center text-[12px] text-zinc-500 font-medium">
                                darNote System &copy; 2026<br/>The smartest way to build your reservoir.
                            </div>
                        </aside>
                    </div>

                    {/* MOBILE BOTTOM NAV (iOS Dock Style) */}
                    <div className="flex lg:hidden fixed bottom-0 left-0 w-full glass-nav border-t border-black/5 dark:border-white/5 pb-safe z-50">
                        <div className="flex justify-around items-center w-full px-2 h-[60px]">
                            <motion.button whileTap={{scale:0.8}} className="p-3 text-zinc-900 dark:text-white flex flex-col items-center gap-1">
                                <Icons.Home className="w-7 h-7"/>
                            </motion.button>
                            <motion.button whileTap={{scale:0.9}} onClick={()=>window.location.href='el.html'} className="bg-brand text-white p-3 rounded-full shadow-[0_8px_16px_rgba(0,122,255,0.3)] -mt-6">
                                <Icons.Plus className="w-7 h-7"/>
                            </motion.button>
                            <motion.button whileTap={{scale:0.8}} onClick={()=>window.location.href='report.html'} className="p-3 text-zinc-400 hover:text-zinc-900 dark:hover:text-white flex flex-col items-center gap-1">
                                <Icons.TrendingUp className="w-7 h-7"/>
                            </motion.button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
