<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>darNote - Feed</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png">
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        onyx: '#09090b',
                        surface: '#18181b',
                        border: '#27272a',
                        brand: '#4f46e5'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { @apply bg-onyx text-zinc-100; font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { @apply bg-zinc-700; border-radius: 4px; }
        .thread-line { width: 2px; background-color: #27272a; flex-grow: 1; margin-top: 8px; margin-bottom: 4px; border-radius: 2px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <!-- Platform Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, addDoc, serverTimestamp, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        
        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", projectId: "demo" };
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'darnote-app';
            
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            
            window.firebaseEnv = { app, auth, db, appId, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, addDoc, serverTimestamp, writeBatch, onSnapshot };
            window.dispatchEvent(new Event('firebaseLoaded'));
        } catch (e) { console.error("Firebase init failed:", e); }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;
        const GEMINI_PROXY_URL = "https://gemini-proxy-513372702506.us-central1.run.app/proxy";

        // Education Mapping
        const EDUCATION_LEVELS = ["High School", "University", "Professional / Other"];
        const SYLLABUS_MAP = {
            "High School": ["HKDSE", "IB (International Baccalaureate)", "A-Level (ALE)", "AP (Advanced Placement)", "IGCSE", "General High School"],
            "University": ["Pre-Med", "Engineering", "Computer Science", "Business & Finance", "Law", "General University"],
            "Professional / Other": ["Language Learning", "IT Certifications", "Accounting (CPA/ACCA)", "General Studies"]
        };

        // Icons
        const Icons = {
            Home: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Plus: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Heart: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            MessageCircle: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>,
            Repeat: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>,
            Bot: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>,
            Activity: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Timer: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            CheckSquare: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            ChevronDown: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>,
            User: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            FileText: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>,
            Bug: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M17.47 9c1.93-.2 3.53-1.9 3.53-3.9"/><path d="M6.53 15H3"/><path d="M21 15h-3.53"/><path d="M6.53 21C4.6 21.2 3 22.9 3 25"/><path d="M17.47 21c1.93.2 3.53 1.9 3.53 3.9"/></svg>,
            Compass: p => <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        };

        // --- COMPONENTS ---

        // 1. Apple Fitness Rings
        const InsightRings = ({ stats }) => {
            const p1 = Math.min(100, (stats?.mastered / (stats?.total || 1)) * 100 || 65);
            const p2 = Math.min(100, (stats?.studyHours / 10) * 100 || 80);
            const p3 = Math.min(100, (stats?.consistency / 7) * 100 || 40);
            const r1 = 40, r2 = 30, r3 = 20;
            const c1 = 2 * Math.PI * r1, c2 = 2 * Math.PI * r2, c3 = 2 * Math.PI * r3;
            
            return (
                <div className="flex items-center gap-6 bg-surface border border-white/5 rounded-2xl p-5 mb-2">
                    <div className="relative w-24 h-24 shrink-0">
                        <svg className="w-full h-full" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r={r1} fill="transparent" stroke="#3f1616" strokeWidth="8"/>
                            <circle cx="50" cy="50" r={r2} fill="transparent" stroke="#12311e" strokeWidth="8"/>
                            <circle cx="50" cy="50" r={r3} fill="transparent" stroke="#1e293b" strokeWidth="8"/>
                            <circle cx="50" cy="50" r={r1} fill="transparent" stroke="#ef4444" strokeWidth="8" strokeDasharray={`${(p1/100)*c1} ${c1}`} strokeLinecap="round" transform="rotate(-90 50 50)" className="transition-all duration-1000"/>
                            <circle cx="50" cy="50" r={r2} fill="transparent" stroke="#22c55e" strokeWidth="8" strokeDasharray={`${(p2/100)*c2} ${c2}`} strokeLinecap="round" transform="rotate(-90 50 50)" className="transition-all duration-1000 delay-100"/>
                            <circle cx="50" cy="50" r={r3} fill="transparent" stroke="#3b82f6" strokeWidth="8" strokeDasharray={`${(p3/100)*c3} ${c3}`} strokeLinecap="round" transform="rotate(-90 50 50)" className="transition-all duration-1000 delay-200"/>
                        </svg>
                    </div>
                    <div>
                        <h4 className="font-bold text-white mb-2">Weekly Insight Drop</h4>
                        <div className="space-y-1 text-xs font-medium">
                            <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-red-500"></div> <span className="text-zinc-400">Mastery:</span> <span className="text-white">{Math.round(p1)}%</span></div>
                            <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-green-500"></div> <span className="text-zinc-400">Study Goal:</span> <span className="text-white">{Math.round(p2)}%</span></div>
                            <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-blue-500"></div> <span className="text-zinc-400">Consistency:</span> <span className="text-white">{Math.round(p3)}%</span></div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Thread Post Wrapper
        const ThreadPost = ({ post, onMarkMastered }) => {
            const isLore = post.type === 'lore';
            const isInsight = post.type === 'insight';
            const isError = post.type === 'error';
            
            let AvatarIcon = Icons.User;
            let avatarBg = "bg-zinc-800";
            let authorName = post.author || "Student";
            
            if (isLore) { AvatarIcon = Icons.Bot; avatarBg = "bg-brand/20 text-brand"; authorName = "System Lore"; }
            if (isInsight) { AvatarIcon = Icons.Activity; avatarBg = "bg-emerald-500/20 text-emerald-500"; authorName = "darNote Analytics"; }

            return (
                <div className="flex px-4 pt-4 hover:bg-white/[0.02] transition-colors group border-b border-border/50">
                    <div className="flex flex-col items-center mr-3 shrink-0">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center shadow-md ${avatarBg}`}>
                            {post.avatarUrl ? <img src={post.avatarUrl} className="w-full h-full rounded-full object-cover"/> : <AvatarIcon className="w-5 h-5"/>}
                        </div>
                        <div className="thread-line"></div>
                    </div>
                    
                    <div className="flex-1 pb-4">
                        <div className="flex justify-between items-start mb-1">
                            <span className="font-bold text-sm text-zinc-100">{authorName} <span className="font-normal text-zinc-500 text-xs ml-1">{post.timeAgo || 'Recently'}</span></span>
                            {isError && <span className="text-[10px] uppercase font-bold text-red-400 bg-red-400/10 px-2 py-0.5 rounded border border-red-400/20">Active Error</span>}
                        </div>

                        {/* Content Area */}
                        {isInsight ? (
                            <InsightRings stats={post.stats} />
                        ) : (
                            <div className="text-sm text-zinc-300 leading-relaxed mb-3">
                                {isError ? (
                                    <div className="space-y-2 bg-white/5 border border-white/10 rounded-xl p-3 mt-1">
                                        <div className="font-bold text-white text-[13px] uppercase tracking-wider text-zinc-500">{post.subject} • {post.topic}</div>
                                        <div><span className="font-bold text-red-400">Mistake: </span>{post.questionText || "No question text provided."}</div>
                                        {post.correctAnswer && <div><span className="font-bold text-emerald-400">Correction: </span>{post.correctAnswer}</div>}
                                        {post.explanation && <div className="text-zinc-400 italic">"{post.explanation}"</div>}
                                    </div>
                                ) : (
                                    <>
                                        {post.title && <div className="font-bold text-white mb-1">{post.title}</div>}
                                        <div className="markdown-body" dangerouslySetInnerHTML={{ __html: marked.parse(post.content || '') }}></div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* Social Interaction Row */}
                        <div className="flex items-center gap-6 text-zinc-500 mt-2">
                            <button onClick={() => isError && onMarkMastered && onMarkMastered(post.id)} className={`flex items-center gap-2 group/btn ${post.mastered ? 'text-red-500' : 'hover:text-red-500'} transition-colors`}>
                                <div className={`p-1.5 rounded-full ${post.mastered ? 'bg-red-500/10' : 'group-hover/btn:bg-red-500/10'} transition-colors`}><Icons.Heart className={`w-4 h-4 ${post.mastered ? 'fill-current' : ''}`}/></div>
                                <span className="text-xs">{isError ? (post.mastered ? 'Mastered' : 'Master') : (post.likes || 0)}</span>
                            </button>
                            <button className="flex items-center gap-2 group/btn hover:text-brand transition-colors">
                                <div className="p-1.5 rounded-full group-hover/btn:bg-brand/10 transition-colors"><Icons.MessageCircle className="w-4 h-4"/></div>
                                <span className="text-xs text-zinc-500">{isLore ? 'Discuss' : 'Drill'}</span>
                            </button>
                            <button className="flex items-center gap-2 group/btn hover:text-green-500 transition-colors ml-auto">
                                <div className="p-1.5 rounded-full group-hover/btn:bg-green-500/10 transition-colors"><Icons.Repeat className="w-4 h-4"/></div>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. Sidebar Accordion Wrapper
        const SidebarAccordion = ({ title, icon: Icon, defaultOpen = false, children }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            return (
                <div className="border border-white/5 rounded-2xl bg-surface overflow-hidden mb-4 shadow-sm">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-4 bg-white/[0.02] hover:bg-white/[0.04] transition-colors">
                        <div className="flex items-center gap-3 font-bold text-sm text-zinc-200"><Icon className="w-4 h-4 text-brand"/> {title}</div>
                        <Icons.ChevronDown className={`w-4 h-4 text-zinc-500 transition-transform ${isOpen ? 'rotate-180' : ''}`}/>
                    </button>
                    <AnimatePresence>
                        {isOpen && (
                            <motion.div initial={{ height: 0 }} animate={{ height: 'auto' }} exit={{ height: 0 }} className="overflow-hidden">
                                <div className="p-4 border-t border-white/5">{children}</div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        // 4. Focus Timer Widget
        const FocusTimer = () => {
            const [time, setTime] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);
            
            useEffect(() => {
                let interval = null;
                if (isActive && time > 0) interval = setInterval(() => setTime(t => t - 1), 1000);
                else if (time === 0) setIsActive(false);
                return () => clearInterval(interval);
            }, [isActive, time]);

            const mins = Math.floor(time / 60).toString().padStart(2, '0');
            const secs = (time % 60).toString().padStart(2, '0');

            return (
                <div className="flex flex-col items-center">
                    <div className="text-4xl font-bold font-mono text-white mb-4 tracking-wider">{mins}:{secs}</div>
                    <div className="flex gap-2 w-full">
                        <button onClick={() => setIsActive(!isActive)} className={`flex-1 py-2 rounded-xl font-bold text-sm transition-colors ${isActive ? 'bg-zinc-800 text-white hover:bg-zinc-700' : 'bg-brand text-white hover:bg-brand/90'}`}>{isActive ? 'Pause' : 'Start Focus'}</button>
                        <button onClick={() => { setIsActive(false); setTime(25 * 60); }} className="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-400 hover:text-white transition-colors"><Icons.Repeat className="w-4 h-4"/></button>
                    </div>
                </div>
            );
        };

        // 5. Todo List Widget
        const TodoList = ({ fbEnv, user }) => {
            const [todos, setTodos] = useState([]);
            const [input, setInput] = useState('');

            useEffect(() => {
                if (!user || user.isAnonymous || !fbEnv) return;
                const unsub = fbEnv.onSnapshot(fbEnv.collection(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'dashboard_todos'), (snap) => {
                    setTodos(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.createdAt - a.createdAt));
                });
                return () => unsub();
            }, [user, fbEnv]);

            const addTodo = async () => {
                if (!input.trim() || !user || user.isAnonymous) return;
                try {
                    await fbEnv.addDoc(fbEnv.collection(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'dashboard_todos'), { text: input, completed: false, createdAt: Date.now() });
                    setInput('');
                } catch(e) {}
            };
            const toggle = async (id, current) => { if (user) await fbEnv.updateDoc(fbEnv.doc(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'dashboard_todos', id), { completed: !current }); };
            const deleteTodo = async (id) => { if (user) await fbEnv.deleteDoc(fbEnv.doc(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'dashboard_todos', id)); };

            if (!user || user.isAnonymous) return <div className="text-xs text-zinc-500 text-center">Sign in to save tasks.</div>;

            return (
                <div>
                    <div className="flex gap-2 mb-3">
                        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTodo()} placeholder="Quick task..." className="flex-1 bg-zinc-900 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-brand"/>
                        <button onClick={addTodo} className="bg-zinc-800 text-white px-3 rounded-lg hover:bg-zinc-700"><Icons.Plus className="w-4 h-4"/></button>
                    </div>
                    <div className="space-y-2 max-h-48 overflow-y-auto hide-scrollbar">
                        {todos.map(t => (
                            <div key={t.id} className="flex items-start gap-2 group">
                                <button onClick={() => toggle(t.id, t.completed)} className={`mt-0.5 w-4 h-4 rounded border flex items-center justify-center shrink-0 transition-colors ${t.completed ? 'bg-brand border-brand' : 'border-zinc-500'}`}>
                                    {t.completed && <Icons.CheckSquare className="w-3 h-3 text-white"/>}
                                </button>
                                <span className={`text-sm flex-1 ${t.completed ? 'text-zinc-600 line-through' : 'text-zinc-300'}`}>{t.text}</span>
                                <button onClick={() => deleteTodo(t.id)} className="opacity-0 group-hover:opacity-100 text-red-500 hover:text-red-400"><Icons.Trash className="w-3 h-3"/></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 6. Previews Widget
        const PreviewsWidget = ({ fbEnv, user }) => {
            const [notes, setNotes] = useState([]);
            const [errors, setErrors] = useState([]);

            useEffect(() => {
                if (!user || user.isAnonymous || !fbEnv) return;
                const fetchPreviews = async () => {
                    try {
                        const nSnap = await fbEnv.getDocs(fbEnv.collection(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'notes'));
                        const nList = nSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0)).slice(0, 2);
                        setNotes(nList);

                        const eSnap = await fbEnv.getDocs(fbEnv.collection(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'error_logs'));
                        const eList = eSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(e => !e.mastered).sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0)).slice(0, 2);
                        setErrors(eList);
                    } catch(err) { console.error("Error fetching previews", err); }
                };
                fetchPreviews();
            }, [user, fbEnv]);

            if (!user || user.isAnonymous) return <div className="text-xs text-zinc-500 text-center">Sign in to view your personal content.</div>;

            return (
                <div className="space-y-4">
                    <div>
                        <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 flex justify-between">Recent Notes <a href="note.html" className="text-brand hover:underline">View All</a></div>
                        {notes.length === 0 ? <div className="text-xs text-zinc-600">No notes yet.</div> : notes.map(n => (
                            <a key={n.id} href={`note.html?note=${n.id}`} className="block bg-zinc-900 border border-white/5 rounded-xl p-3 mb-2 hover:border-brand transition-colors">
                                <div className="flex items-center gap-2 font-bold text-sm text-zinc-200 mb-1"><Icons.FileText className="w-3.5 h-3.5 text-blue-400"/> {n.title || 'Untitled Note'}</div>
                                <div className="text-xs text-zinc-500 truncate">{n.subject || 'General'}</div>
                            </a>
                        ))}
                    </div>
                    <div className="border-t border-white/5 pt-2">
                        <div className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 flex justify-between">Active Errors <a href="el.html" className="text-brand hover:underline">View All</a></div>
                        {errors.length === 0 ? <div className="text-xs text-zinc-600">No active errors!</div> : errors.map(e => (
                            <a key={e.id} href={`el.html?log=${e.id}`} className="block bg-zinc-900 border border-white/5 rounded-xl p-3 mb-2 hover:border-red-500 transition-colors">
                                <div className="flex items-center gap-2 font-bold text-sm text-zinc-200 mb-1"><Icons.Bug className="w-3.5 h-3.5 text-red-400"/> {e.questionText?.substring(0, 30) || 'Error Log'}...</div>
                                <div className="text-xs text-zinc-500 truncate">{e.subject} • {e.topic}</div>
                            </a>
                        ))}
                    </div>
                </div>
            );
        };

        // 7. Onboarding Modal (Multi-Step)
        const OnboardingModal = ({ fbEnv, user, onComplete }) => {
            const [level, setLevel] = useState('');
            const [curr, setCurr] = useState('');
            const [saving, setSaving] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSave = async () => {
                if (!level || !curr) {
                    setErrorMsg("Please select both your level and syllabus.");
                    return;
                }
                setSaving(true);
                setErrorMsg('');
                try {
                    await fbEnv.setDoc(fbEnv.doc(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'settings', 'profile'), { role: level, curriculum: curr }, { merge: true });
                    onComplete({ role: level, curriculum: curr });
                } catch(e) { 
                    setErrorMsg("Failed to save profile. Please try again.");
                }
                setSaving(false);
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-surface w-full max-w-md rounded-3xl border border-white/10 p-8 shadow-2xl">
                        <div className="w-16 h-16 bg-brand/10 rounded-full flex items-center justify-center mb-6 mx-auto"><Icons.User className="w-8 h-8 text-brand"/></div>
                        <h2 className="text-2xl font-bold text-white text-center mb-2">Welcome to your Hub</h2>
                        <p className="text-sm text-zinc-400 text-center mb-6">Select your curriculum to join the right public feed.</p>
                        
                        {errorMsg && <div className="bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-lg mb-4 text-center">{errorMsg}</div>}

                        <div className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2">1. Education Level</label>
                                <select value={level} onChange={e => { setLevel(e.target.value); setCurr(''); }} className="w-full bg-zinc-900 border border-white/10 rounded-xl p-3 text-white focus:border-brand focus:outline-none appearance-none cursor-pointer">
                                    <option value="" disabled>Select your level...</option>
                                    {EDUCATION_LEVELS.map(l => <option key={l} value={l}>{l}</option>)}
                                </select>
                            </div>
                            
                            <AnimatePresence>
                                {level && (
                                    <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} className="overflow-hidden">
                                        <label className="block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2 mt-4">2. Syllabus / Focus</label>
                                        <select value={curr} onChange={e=>setCurr(e.target.value)} className="w-full bg-zinc-900 border border-white/10 rounded-xl p-3 text-white focus:border-brand focus:outline-none appearance-none cursor-pointer">
                                            <option value="" disabled>Choose your path...</option>
                                            {SYLLABUS_MAP[level].map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </motion.div>
                                )}
                            </AnimatePresence>

                            <button onClick={handleSave} disabled={saving || !level || !curr} className="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-zinc-200 transition-colors mt-6 disabled:opacity-50">
                                {saving ? 'Saving...' : 'Curate My Feed'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [fbEnv, setFbEnv] = useState(null);
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [feed, setFeed] = useState([]);
            const [feedLoading, setFeedLoading] = useState(true);

            // 1. Setup Firebase & Auth
            useEffect(() => {
                const initFb = async () => {
                    const env = window.firebaseEnv;
                    if (!env) return;
                    setFbEnv(env);
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await env.signInWithCustomToken(env.auth, __initial_auth_token);
                        } else {
                            await env.signInAnonymously(env.auth);
                        }
                    } catch(e) { console.error("Auth init failed", e); }
                    
                    env.onAuthStateChanged(env.auth, async (u) => {
                        setUser(u);
                        if (u) {
                            if (!u.isAnonymous) {
                                const pRef = env.doc(env.db, 'artifacts', env.appId, 'users', u.uid, 'settings', 'profile');
                                const snap = await env.getDoc(pRef);
                                if (snap.exists() && snap.data().curriculum) {
                                    setProfile(snap.data());
                                    setShowOnboarding(false);
                                } else {
                                    setShowOnboarding(true);
                                }
                            } else {
                                // Anonymous Guest User
                                setProfile(null);
                                setShowOnboarding(false);
                            }
                        }
                        setAuthLoading(false);
                    });
                };
                
                if (window.firebaseEnv) initFb();
                else window.addEventListener('firebaseLoaded', initFb);
                return () => window.removeEventListener('firebaseLoaded', initFb);
            }, []);

            // 2. The Mixer / Reservoir Logic
            useEffect(() => {
                if (authLoading || !fbEnv) return;
                if (user && !user.isAnonymous && !profile && showOnboarding) return;

                const buildFeed = async () => {
                    setFeedLoading(true);
                    let mixedFeed = [];
                    let fetchCurrName = '';
                    
                    if (user && !user.isAnonymous && profile) {
                        fetchCurrName = profile.curriculum;
                    } else {
                        // GUEST LOGIC: Randomly select a popular syllabus to preview
                        const popular = ["HKDSE", "IB (International Baccalaureate)", "A-Level (ALE)", "General University"];
                        fetchCurrName = popular[Math.floor(Math.random() * popular.length)];
                    }

                    const safeCurr = fetchCurrName.replace(/[^a-zA-Z0-9]/g, '_');
                    const colName = `curriculum_${safeCurr}`;

                    try {
                        // A. Fetch Error Logs (if logged in)
                        let errorLogs = [];
                        if (user && !user.isAnonymous) {
                            const errRef = fbEnv.collection(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'error_logs');
                            const errSnap = await fbEnv.getDocs(errRef); 
                            errorLogs = errSnap.docs.map(d => ({ 
                                id: d.id, type: 'error', author: 'Your Error Log', ...d.data(), timeAgo: 'Active'
                            })).filter(l => !l.mastered).slice(0, 10);
                        }

                        // B. Fetch Public Drops (The Reservoir)
                        const pubRef = fbEnv.collection(fbEnv.db, 'artifacts', fbEnv.appId, 'public', 'data', colName);
                        const pubSnap = await fbEnv.getDocs(pubRef);
                        let publicDrops = pubSnap.docs.map(d => ({ id: d.id, ...d.data(), timeAgo: 'Lore' }));

                        // THE LOW WATERMARK TRIGGER & WAIT FOR RESULT
                        if (publicDrops.length < 15) {
                            const generatedDrops = await generateAndRefillReservoir(pubRef, fetchCurrName);
                            if (generatedDrops.length > 0) {
                                publicDrops = [...publicDrops, ...generatedDrops];
                            } else if (publicDrops.length === 0) {
                                // Ultimate Fallback if generation fails and DB is empty
                                publicDrops = [
                                    { id: 'g1', type: 'lore', content: `**Welcome to ${fetchCurrName} Feed!** Study hard and remember to log your errors.`, likes: 42, timeAgo: 'System' }
                                ];
                            }
                        }

                        // C. Generate 1 Insight Drop
                        const insightDrop = { id: 'ins1', type: 'insight', stats: { mastered: 12, total: 20, studyHours: 8, consistency: 5 }, timeAgo: 'Weekly' };

                        // D. Mix them randomly but evenly
                        mixedFeed.push(insightDrop);
                        let errIdx = 0, pubIdx = 0;
                        while (errIdx < errorLogs.length || pubIdx < publicDrops.length) {
                            if (pubIdx < publicDrops.length) mixedFeed.push(publicDrops[pubIdx++]);
                            if (pubIdx < publicDrops.length) mixedFeed.push(publicDrops[pubIdx++]);
                            if (errIdx < errorLogs.length) mixedFeed.push(errorLogs[errIdx++]);
                        }

                        // Attach the currently previewed syllabus to state for UI display
                        setFeed({ posts: mixedFeed, activeSyllabus: fetchCurrName });
                    } catch(e) { console.error("Feed error:", e); }
                    setFeedLoading(false);
                };

                buildFeed();
            }, [user, profile, authLoading, showOnboarding, fbEnv]);

            const generateAndRefillReservoir = async (colRef, curriculum) => {
                try {
                    const prompt = `Generate a JSON array of 5 highly engaging, short academic trivia, study hacks, or motivational facts for a student studying ${curriculum}.
                    Format strictly as: [{"type": "lore", "title": "Did you know?", "content": "markdown text", "likes": random_number_under_100}]`;
                    
                    const res = await fetch(GEMINI_PROXY_URL, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) return [];
                    
                    const jsonStr = text.substring(text.indexOf('['), text.lastIndexOf(']') + 1);
                    const newPosts = JSON.parse(jsonStr);
                    
                    const batch = window.firebaseEnv.writeBatch(window.firebaseEnv.db);
                    const savedDrops = [];
                    newPosts.forEach(post => {
                        const newDocRef = window.firebaseEnv.doc(colRef);
                        const postData = { ...post, createdAt: Date.now() };
                        batch.set(newDocRef, postData);
                        savedDrops.push({ id: newDocRef.id, ...postData, timeAgo: 'Just now' });
                    });
                    await batch.commit();
                    return savedDrops; 
                } catch(e) { console.warn("Background AI generation failed:", e); return []; }
            };

            const markMastered = async (logId) => {
                if (!user || user.isAnonymous || !fbEnv) return;
                try {
                    await fbEnv.updateDoc(fbEnv.doc(fbEnv.db, 'artifacts', fbEnv.appId, 'users', user.uid, 'error_logs', logId), { mastered: true });
                    setFeed(prev => ({...prev, posts: prev.posts.filter(p => p.id !== logId)}));
                } catch(e) {}
            };

            if (authLoading) return <div className="h-screen flex items-center justify-center"><div className="w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="flex h-screen w-full bg-onyx">
                    {showOnboarding && <OnboardingModal fbEnv={fbEnv} user={user} onComplete={(p) => { setProfile(p); setShowOnboarding(false); }} />}
                    
                    {/* LEFT COLUMN: THE THREADS FEED (65%) */}
                    <main className="flex-1 flex flex-col h-full border-r border-border max-w-4xl mx-auto lg:mx-0 lg:w-[65%] shrink-0">
                        {/* Feed Header */}
                        <header className="h-16 px-6 flex items-center justify-between border-b border-border/50 shrink-0 bg-onyx/80 backdrop-blur-md z-10 sticky top-0">
                            <div className="flex items-center gap-3">
                                <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-8 h-8 rounded-lg"/>
                                <span className="font-bold text-lg text-white">Curriculum Feed</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <button className="text-xs font-bold text-brand bg-brand/10 px-3 py-1.5 rounded-full border border-brand/20 truncate max-w-[150px]">
                                    {feed.activeSyllabus || 'Loading...'}
                                </button>
                            </div>
                        </header>
                        
                        {/* Guest Banner */}
                        {user && user.isAnonymous && (
                            <div className="bg-gradient-to-r from-brand/20 to-purple-500/20 border-b border-brand/20 px-6 py-2.5 flex items-center justify-between z-10">
                                <div className="flex items-center gap-2">
                                    <Icons.Compass className="w-4 h-4 text-brand"/>
                                    <span className="text-xs font-medium text-zinc-300">Viewing global preview feed. Sign in to track your personal errors.</span>
                                </div>
                            </div>
                        )}

                        {/* Scrolling Timeline */}
                        <div className="flex-1 overflow-y-auto hide-scrollbar pb-24 md:pb-0 relative">
                            {feedLoading ? (
                                <div className="flex flex-col items-center justify-center h-48 text-zinc-500 space-y-4">
                                    <div className="w-6 h-6 border-2 border-brand border-t-transparent rounded-full animate-spin"></div>
                                    <div className="text-xs font-bold uppercase tracking-widest text-brand">Compiling Reservoir...</div>
                                </div>
                            ) : (
                                <div className="pb-8">
                                    {feed.posts?.map((post, idx) => (
                                        <motion.div key={post.id + idx} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ delay: Math.min(idx * 0.05, 0.5) }}>
                                            <ThreadPost post={post} onMarkMastered={markMastered} />
                                        </motion.div>
                                    ))}
                                    <div className="p-8 text-center text-zinc-500 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2">
                                        <div className="w-2 h-2 bg-zinc-700 rounded-full animate-bounce"></div> End of Feed
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* RIGHT COLUMN: REDDIT SIDEBAR (35% - Hidden on Mobile) */}
                    <aside className="hidden lg:flex w-[35%] flex-col h-full bg-surface p-6 overflow-y-auto hide-scrollbar">
                        <div className="mb-6 flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-lg text-white mb-1">Productivity Hub</h3>
                                <p className="text-xs text-zinc-400">Tools to survive the doom scroll.</p>
                            </div>
                            {user && !user.isAnonymous && <button onClick={()=>fbEnv.signOut(fbEnv.auth)} className="text-zinc-500 hover:text-white transition-colors" title="Log out"><Icons.User className="w-5 h-5"/></button>}
                        </div>

                        <SidebarAccordion title="Focus Session" icon={Icons.Timer} defaultOpen={true}>
                            <FocusTimer />
                        </SidebarAccordion>

                        <SidebarAccordion title="Your Previews" icon={Icons.Activity} defaultOpen={true}>
                            <PreviewsWidget fbEnv={fbEnv} user={user} />
                        </SidebarAccordion>

                        <SidebarAccordion title="Action Items" icon={Icons.CheckSquare}>
                            <TodoList fbEnv={fbEnv} user={user} />
                        </SidebarAccordion>
                    </aside>

                    {/* MOBILE BOTTOM NAV */}
                    <div className="flex lg:hidden fixed bottom-0 left-0 w-full bg-onyx/90 backdrop-blur-xl border-t border-border p-2 justify-around items-center pb-safe z-50">
                        <button className="p-3 text-brand"><Icons.Home className="w-6 h-6"/></button>
                        <button onClick={()=>window.location.href='el.html'} className="bg-white text-black p-3.5 rounded-xl shadow-[0_4px_20px_rgba(255,255,255,0.2)] -mt-6"><Icons.Plus className="w-6 h-6"/></button>
                        <button onClick={()=>window.location.href='report.html'} className="p-3 text-zinc-500"><Icons.Activity className="w-6 h-6"/></button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
