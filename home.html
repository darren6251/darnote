<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>darNote - Home</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png">
    
    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel & Tailwind -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Framer Motion & Utils -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        onyx: '#09090b', surface: '#18181b', border: '#27272a',
                        brand: '#4f46e5', 'brand-light': '#818cf8',
                        'light-bg': '#f4f4f5', 'light-surface': '#ffffff', 'light-border': '#e4e4e7'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; overflow-y: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom scrollbar for desktop feed */
        .feed-scroll::-webkit-scrollbar { width: 6px; }
        .feed-scroll::-webkit-scrollbar-track { background: transparent; }
        .feed-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .dark .feed-scroll::-webkit-scrollbar-thumb { background: #52525b; }

        .glass-nav { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-light-bg dark:bg-onyx text-zinc-900 dark:text-zinc-100 transition-colors duration-300 antialiased selection:bg-brand selection:text-white">
    <div id="root"></div>

    <!-- Firebase v11 Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Hardcoded Real Config
        const firebaseConfig = {
            apiKey: "AIzaSyAvPEac-03kE4oazvaq8K3T2gxLPsnZO20",
            projectId: "darnote625"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = "darnote-app";

        window.firebaseEnv = { auth, db, provider, signInWithPopup, signOut, onAuthStateChanged, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, addDoc, appId };
        window.dispatchEvent(new Event('firebaseReady'));
    </script>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICONS (Lucide styled SVGs) ---
        const Icons = {
            Home: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Plus: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Activity: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
            Timer: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Check: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="20 6 9 17 4 12"/></svg>,
            Trash: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Calendar: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            ChevronDown: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="6 9 12 15 18 9"/></svg>,
            Heart: (p) => <svg viewBox="0 0 24 24" fill={p.filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>,
            MessageCircle: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>,
            Share: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>,
            LogOut: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Moon: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
            Sun: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
            MoreHorizontal: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>,
            X: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            TrendingUp: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        };

        // --- SHARED UTILS ---
        const getInitials = (name) => name ? name.substring(0, 2).toUpperCase() : 'U';
        const getBotAvatar = (seed) => `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}&backgroundColor=transparent`;
        const timeAgo = (dateStr) => {
            if(!dateStr) return '';
            const seconds = Math.floor((new Date() - new Date(dateStr)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "m";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m";
            return "now";
        };

        const THEME_KEY = 'darnote_theme';
        const applyTheme = (isDark) => {
            if(isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        };

        // --- COMPONENTS ---
        
        const ActivityRing = ({ progress, color, size = 60, strokeWidth = 6, label, sublabel }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (progress / 100) * circumference;
            return (
                <div className="flex flex-col items-center justify-center relative" style={{width: size, height: size}}>
                    <svg className="transform -rotate-90" width={size} height={size}>
                        <circle stroke="currentColor" fill="transparent" strokeWidth={strokeWidth} r={radius} cx={size/2} cy={size/2} className="text-zinc-200 dark:text-white/10" />
                        <circle stroke={color} fill="transparent" strokeWidth={strokeWidth} strokeLinecap="round" r={radius} cx={size/2} cy={size/2}
                            style={{ strokeDasharray: circumference, strokeDashoffset: offset, transition: 'stroke-dashoffset 1s ease-out' }} />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-xs font-bold leading-none">{label}</span>
                        {sublabel && <span className="text-[9px] text-zinc-500">{sublabel}</span>}
                    </div>
                </div>
            );
        };

        const InsightRings = ({ userLogs }) => {
            const total = userLogs.length;
            const mastered = userLogs.filter(l => l.mastered).length;
            const masteryRate = total > 0 ? Math.round((mastered / total) * 100) : 0;
            
            // Calculate nemesis
            const topics = userLogs.map(l => l.topic).filter(Boolean);
            const topicCounts = topics.reduce((acc, val) => { acc[val] = (acc[val] || 0) + 1; return acc; }, {});
            const nemesis = Object.keys(topicCounts).sort((a,b) => topicCounts[b] - topicCounts[a])[0] || 'None';
            
            // Calculate main subject
            const subjects = userLogs.map(l => l.subject).filter(Boolean);
            const subjCounts = subjects.reduce((acc, val) => { acc[val] = (acc[val] || 0) + 1; return acc; }, {});
            const mainSubj = Object.keys(subjCounts).sort((a,b) => subjCounts[b] - subjCounts[a])[0] || 'N/A';
            const subjRate = total > 0 ? Math.round(((subjCounts[mainSubj] || 0) / total) * 100) : 0;

            const handleExport = async (e) => {
                const node = e.currentTarget.parentNode;
                const canvas = await html2canvas(node, { backgroundColor: document.documentElement.classList.contains('dark') ? '#09090b' : '#f4f4f5' });
                const link = document.createElement('a');
                link.download = 'darnote-insight.png';
                link.href = canvas.toDataURL();
                link.click();
            };

            return (
                <div className="bg-white dark:bg-surface border border-light-border dark:border-border rounded-2xl p-4 my-2 relative overflow-hidden group">
                    <div className="absolute top-0 right-0 p-4 opacity-10">
                        <Icons.TrendingUp className="w-24 h-24" />
                    </div>
                    <div className="flex justify-between items-start mb-4 relative z-10">
                        <div>
                            <h4 className="font-bold text-zinc-900 dark:text-white flex items-center gap-2">
                                <span className="bg-brand text-white text-xs px-2 py-0.5 rounded-full">Weekly Insight</span>
                            </h4>
                            <p className="text-sm text-zinc-500 mt-1">Based on your {total} logged errors.</p>
                        </div>
                        <button onClick={handleExport} className="p-2 text-zinc-400 hover:text-brand bg-zinc-100 dark:bg-white/5 rounded-full transition-colors opacity-0 group-hover:opacity-100" title="Export as Story">
                            <Icons.Share className="w-4 h-4" />
                        </button>
                    </div>
                    
                    <div className="flex justify-around items-center relative z-10">
                        <ActivityRing progress={masteryRate} color="#22c55e" label={`${masteryRate}%`} sublabel="Mastery" />
                        <ActivityRing progress={subjRate} color="#4f46e5" label={`${subjRate}%`} sublabel={mainSubj.substring(0,6)} />
                        <div className="text-center">
                            <div className="text-xs text-zinc-500 uppercase tracking-wider mb-1">Nemesis</div>
                            <div className="font-bold text-sm bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 px-2 py-1 rounded-md">{nemesis.length > 12 ? nemesis.substring(0,12)+'...' : nemesis}</div>
                        </div>
                    </div>
                </div>
            );
        };

        const PostActionRow = ({ stats, onMastered, onDrill, onShare }) => (
            <div className="flex items-center gap-6 mt-3 text-zinc-500">
                <button onClick={onMastered} className={`flex items-center gap-1.5 text-xs font-medium hover:text-red-500 transition-colors ${stats?.mastered ? 'text-red-500' : ''}`}>
                    <Icons.Heart className="w-4 h-4" filled={stats?.mastered} /> {stats?.likes || ''}
                </button>
                <button onClick={onDrill} className="flex items-center gap-1.5 text-xs font-medium hover:text-brand transition-colors">
                    <Icons.MessageCircle className="w-4 h-4" /> Drill
                </button>
                <button onClick={onShare} className="flex items-center gap-1.5 text-xs font-medium hover:text-green-500 transition-colors">
                    <Icons.Share className="w-4 h-4" />
                </button>
            </div>
        );

        // Threads-style unified post layout
        const FeedPost = ({ post, isLast, onInteraction }) => {
            const isPersonal = post.type === 'personal';
            const isInsight = post.type === 'insight';
            const isPublic = post.type === 'public';
            
            const authorName = isPersonal ? (post.author || 'You') : isInsight ? 'darNote AI' : `${post.curriculum || 'System'} Lore`;
            const avatarSrc = isPersonal ? post.avatar : getBotAvatar(authorName);
            const badgeColor = isPersonal ? 'bg-indigo-500/10 text-indigo-500' : isInsight ? 'bg-amber-500/10 text-amber-500' : 'bg-emerald-500/10 text-emerald-500';

            return (
                <div className="flex gap-3 px-4 py-3 relative group hover:bg-zinc-50 dark:hover:bg-white/[0.02] transition-colors">
                    {/* Left Column: Avatar & Thread Line */}
                    <div className="flex flex-col items-center">
                        <div className="w-10 h-10 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden flex-shrink-0 z-10">
                            {isPersonal && !avatarSrc ? (
                                <div className="w-full h-full flex items-center justify-center bg-brand text-white font-bold text-sm">{getInitials(authorName)}</div>
                            ) : (
                                <img src={avatarSrc} className="w-full h-full object-cover" alt="avatar" onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }} />
                            )}
                            <div className="hidden w-full h-full items-center justify-center bg-brand text-white font-bold text-sm">{getInitials(authorName)}</div>
                        </div>
                        {!isLast && <div className="w-px h-full bg-light-border dark:bg-border mt-2 mb-[-12px]"></div>}
                    </div>

                    {/* Right Column: Content */}
                    <div className="flex-1 pb-2">
                        <div className="flex justify-between items-center mb-1">
                            <div className="flex items-center gap-2">
                                <span className="font-semibold text-sm">{authorName}</span>
                                {post.subject && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}`}>{post.subject}</span>}
                            </div>
                            <div className="flex items-center gap-2 text-zinc-500">
                                <span className="text-xs">{timeAgo(post.createdAt)}</span>
                                <button className="hover:text-zinc-900 dark:hover:text-white"><Icons.MoreHorizontal className="w-4 h-4"/></button>
                            </div>
                        </div>

                        {/* Content Body */}
                        <div className="text-sm mt-1 text-zinc-800 dark:text-zinc-200">
                            {isInsight ? (
                                <InsightRings userLogs={post.rawLogs} />
                            ) : (
                                <div>
                                    {post.title && <h4 className="font-bold mb-1">{post.title}</h4>}
                                    <p className="whitespace-pre-wrap">{post.content}</p>
                                    {post.formula && (
                                        <div className="mt-2 p-2 bg-zinc-100 dark:bg-black/50 rounded font-mono text-xs border border-light-border dark:border-border text-brand-light">
                                            {post.formula}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Actions */}
                        {!isInsight && (
                            <PostActionRow 
                                stats={{mastered: post.mastered}} 
                                onMastered={() => onInteraction(post, 'master')} 
                                onDrill={() => onInteraction(post, 'drill')} 
                                onShare={() => onInteraction(post, 'share')}
                            />
                        )}
                    </div>
                </div>
            );
        };

        // --- SIDEBAR WIDGETS ---
        const SidebarAccordion = ({ title, icon: Icon, defaultOpen = false, children }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            return (
                <div className="mb-4 bg-white dark:bg-surface rounded-xl border border-light-border dark:border-border overflow-hidden shadow-sm">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full flex items-center justify-between p-3 hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors">
                        <div className="flex items-center gap-2 text-sm font-semibold">
                            <Icon className="w-4 h-4 text-brand" /> {title}
                        </div>
                        <Icons.ChevronDown className={`w-4 h-4 text-zinc-500 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    <AnimatePresence>
                        {isOpen && (
                            <motion.div initial={{ height: 0 }} animate={{ height: 'auto' }} exit={{ height: 0 }} className="overflow-hidden">
                                <div className="p-3 pt-0 border-t border-light-border dark:border-border">
                                    {children}
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const FocusTimer = () => {
            const [time, setTime] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);
            const [overlayOpen, setOverlayOpen] = useState(false);
            const timerRef = useRef(null);

            const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;

            const toggleTimer = () => setIsActive(!isActive);
            const resetTimer = () => { setIsActive(false); setTime(25 * 60); };

            useEffect(() => {
                if (isActive && time > 0) {
                    timerRef.current = setInterval(() => setTime(t => t - 1), 1000);
                } else if (time === 0) {
                    setIsActive(false);
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isActive, time]);

            return (
                <div>
                    <div className="text-3xl font-mono font-bold text-center my-4 tracking-wider text-brand">{formatTime(time)}</div>
                    <div className="grid grid-cols-4 gap-2 mb-4">
                        {[15, 25, 45, 60].map(m => (
                            <button key={m} onClick={() => {setTime(m*60); setIsActive(false);}} className="text-xs py-1.5 rounded-md bg-zinc-100 dark:bg-white/5 hover:bg-zinc-200 dark:hover:bg-white/10">{m}m</button>
                        ))}
                    </div>
                    <div className="flex gap-2">
                        <button onClick={toggleTimer} className={`flex-1 py-2 rounded-lg font-bold text-sm ${isActive ? 'bg-amber-500/20 text-amber-500' : 'bg-brand text-white'}`}>{isActive ? 'Pause' : 'Start'}</button>
                        <button onClick={resetTimer} className="px-3 py-2 rounded-lg bg-zinc-100 dark:bg-white/10 text-zinc-500"><Icons.X className="w-4 h-4"/></button>
                        <button onClick={() => setOverlayOpen(true)} className="px-3 py-2 rounded-lg bg-zinc-100 dark:bg-white/10 text-zinc-500" title="Full Screen"><Icons.Activity className="w-4 h-4"/></button>
                    </div>

                    {overlayOpen && (
                        <div className="fixed inset-0 z-[100] bg-black text-white flex flex-col items-center justify-center">
                            <button onClick={() => setOverlayOpen(false)} className="absolute top-8 right-8 text-white/50 hover:text-white"><Icons.X className="w-8 h-8"/></button>
                            <div className="text-[15vw] font-mono font-bold leading-none select-none tracking-tighter">{formatTime(time)}</div>
                            <button onClick={toggleTimer} className="mt-12 text-2xl uppercase tracking-widest text-white/50 hover:text-white transition-colors">{isActive ? 'Pause' : 'Start Focus'}</button>
                        </div>
                    )}
                </div>
            );
        };

        const TodoList = ({ fb, user }) => {
            const [todos, setTodos] = useState([]);
            const [input, setInput] = useState('');

            useEffect(() => {
                if (!user || !fb) return;
                const fetchTodos = async () => {
                    const snap = await fb.getDocs(fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'dashboard_todos'));
                    const list = [];
                    snap.forEach(d => list.push({ id: d.id, ...d.data() }));
                    setTodos(list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)));
                };
                fetchTodos();
            }, [user, fb]);

            const addTodo = async (e) => {
                if(e.key !== 'Enter' || !input.trim() || !user) return;
                const newTodo = { text: input.trim(), completed: false, createdAt: Date.now() };
                const docRef = await fb.addDoc(fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'dashboard_todos'), newTodo);
                setTodos([{id: docRef.id, ...newTodo}, ...todos]);
                setInput('');
            };

            const toggle = async (id, status) => {
                setTodos(todos.map(t => t.id === id ? {...t, completed: status} : t));
                await fb.updateDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'dashboard_todos', id), { completed: status });
            };

            const remove = async (id) => {
                setTodos(todos.filter(t => t.id !== id));
                await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'dashboard_todos', id));
            };

            return (
                <div>
                    <input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={addTodo} placeholder="Add a quick task..." className="w-full bg-zinc-100 dark:bg-black/50 border border-light-border dark:border-white/10 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:border-brand" />
                    <div className="space-y-1 max-h-48 overflow-y-auto hide-scrollbar">
                        {todos.map(t => (
                            <div key={t.id} className="flex items-center gap-2 group p-1.5 rounded-md hover:bg-zinc-50 dark:hover:bg-white/5">
                                <button onClick={() => toggle(t.id, !t.completed)} className={`w-4 h-4 rounded-full border flex flex-shrink-0 items-center justify-center ${t.completed ? 'bg-brand border-brand text-white' : 'border-zinc-400'}`}>
                                    {t.completed && <Icons.Check className="w-3 h-3" />}
                                </button>
                                <span className={`text-sm flex-1 truncate ${t.completed ? 'line-through text-zinc-500' : ''}`}>{t.text}</span>
                                <button onClick={() => remove(t.id)} className="opacity-0 group-hover:opacity-100 text-red-500 p-1"><Icons.Trash className="w-3 h-3"/></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const CalendarWidget = () => {
            const today = new Date();
            const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1).getDay();
            const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
            const blanks = Array.from({length: firstDay}, (_, i) => i);
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            return (
                <div className="text-sm">
                    <div className="font-bold mb-2 text-center text-brand">{monthNames[today.getMonth()]} {today.getFullYear()}</div>
                    <div className="grid grid-cols-7 gap-1 text-center text-xs mb-1 text-zinc-500">
                        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                    </div>
                    <div className="grid grid-cols-7 gap-1 text-center">
                        {blanks.map(b => <div key={`b-${b}`}></div>)}
                        {days.map(d => (
                            <div key={d} className={`py-1 rounded-md ${d === today.getDate() ? 'bg-brand text-white font-bold' : 'hover:bg-zinc-100 dark:hover:bg-white/10'}`}>
                                {d}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SimpleListWidget = ({ title, icon: Icon, items, emptyText, onClick }) => (
            <SidebarAccordion title={title} icon={Icon} defaultOpen={true}>
                <div className="space-y-1">
                    {items.length === 0 && <p className="text-xs text-zinc-500 italic p-2">{emptyText}</p>}
                    {items.map((item, i) => (
                        <div key={i} onClick={() => onClick(item.id)} className="p-2 rounded-lg hover:bg-zinc-50 dark:hover:bg-white/5 cursor-pointer text-sm flex justify-between items-center group transition-colors">
                            <span className="truncate flex-1">{item.title || item.text || 'Untitled'}</span>
                            <Icons.ChevronDown className="w-3 h-3 text-zinc-400 opacity-0 group-hover:opacity-100 -rotate-90 transform" />
                        </div>
                    ))}
                </div>
            </SidebarAccordion>
        );

        // --- MAIN APP ---
        const App = () => {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null); // { role, curriculum }
            const [loadingState, setLoadingState] = useState('init'); // init, onboarding, ready
            const [isDark, setIsDark] = useState(localStorage.getItem(THEME_KEY) !== 'light');
            
            // Feed Data
            const [feedItems, setFeedItems] = useState([]);
            const [rawLogs, setRawLogs] = useState([]);
            const [sidebarLogs, setSidebarLogs] = useState([]);
            const [sidebarNotes, setSidebarNotes] = useState([]);
            
            const [adminClicks, setAdminClicks] = useState(0);

            // 1. Initialize Firebase connection
            useEffect(() => {
                const handleFb = () => setFb(window.firebaseEnv);
                if (window.firebaseEnv) handleFb();
                else window.addEventListener('firebaseReady', handleFb);
                return () => window.removeEventListener('firebaseReady', handleFb);
            }, []);

            // 2. Auth State & Profile Route
            useEffect(() => {
                if (!fb) return;
                const unsub = fb.onAuthStateChanged(fb.auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const profRef = fb.doc(fb.db, 'artifacts', fb.appId, 'users', u.uid, 'settings', 'profile');
                        const profSnap = await fb.getDoc(profRef);
                        if (profSnap.exists() && profSnap.data().role) {
                            setProfile(profSnap.data());
                            setLoadingState('ready');
                        } else {
                            setLoadingState('onboarding');
                        }
                    } else {
                        setUser(null);
                        setProfile(null);
                        setLoadingState('ready'); // Guests go straight to ready state (State A)
                    }
                });
                return () => unsub();
            }, [fb]);

            // 3. Load Data based on Rule 2 (No Complex Queries)
            useEffect(() => {
                if (!fb || loadingState !== 'ready') return;

                const loadFeedData = async () => {
                    let pLogs = [];
                    let pDrops = [];
                    
                    // Fetch Personal Logs (If logged in)
                    if (user) {
                        try {
                            const logsSnap = await fb.getDocs(fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'error_logs'));
                            logsSnap.forEach(doc => pLogs.push({id: doc.id, type: 'personal', ...doc.data()}));
                            pLogs.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                            setRawLogs(pLogs);
                            setSidebarLogs(pLogs.slice(0, 5));
                            
                            // Load sidebar notes while we're at it
                            const notesSnap = await fb.getDocs(fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes'));
                            const nList = [];
                            notesSnap.forEach(d => nList.push({id: d.id, ...d.data()}));
                            nList.sort((a,b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
                            setSidebarNotes(nList.slice(0, 5));
                        } catch(e) { console.error("Private read failed", e); }
                    }

                    // Fetch Public Drops (Session Cache logic)
                    const role = profile?.role || 'high_school';
                    const curriculum = profile?.curriculum || '_all';
                    const cacheKey = `darnote_drops_${role}_${curriculum}`;
                    const cached = sessionStorage.getItem(cacheKey);

                    if (cached) {
                        pDrops = JSON.parse(cached);
                    } else {
                        try {
                            // strictly following RULE 1 & 2 path structure:
                            const dropsCollName = `drops_${role}_${curriculum}`;
                            const dropsSnap = await fb.getDocs(fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', dropsCollName));
                            dropsSnap.forEach(doc => pDrops.push({id: doc.id, type: 'public', ...doc.data()}));
                            
                            // Fallback dummy data if completely empty
                            if(pDrops.length === 0) {
                                pDrops = [
                                    { id: 'd1', type: 'public', curriculum: curriculum.toUpperCase(), content: "Exam Tip: Active recall is scientifically proven to be 200% more effective than passive reading. Start drilling those flashcards!", createdAt: Date.now() },
                                    { id: 'd2', type: 'public', curriculum: curriculum.toUpperCase(), content: "Did you know? The Feynman Technique involves explaining a concept in simple terms. If you stumble, you've found a gap in your knowledge.", createdAt: Date.now() - 86400000 }
                                ];
                            }
                            
                            sessionStorage.setItem(cacheKey, JSON.stringify(pDrops));
                            
                            // Simulate Reservoir Low Watermark check
                            if(pDrops.length < 10) {
                                console.log("Reservoir low. Triggering AI Generation (simulated)...");
                                // In production, call: fetch('https://gemini-proxy-513372702506.us-central1.run.app/proxy', { method: 'POST', body: JSON.stringify({prompt: `Generate 50 educational posts for ${curriculum}`}) })
                            }

                        } catch(e) { console.error("Public read failed", e); }
                    }

                    // INTERLEAVE ALGORITHM (Threads feed feeling)
                    // Pattern: 5 Personal, 1 Insight, 4 Public
                    const finalFeed = [];
                    let pIdx = 0, pubIdx = 0;
                    
                    // Guest feed (only public drops)
                    if (!user) {
                        setFeedItems(pDrops.sort(() => Math.random() - 0.5).slice(0, 30));
                        return;
                    }

                    while (pIdx < pLogs.length || pubIdx < pDrops.length) {
                        // 1. Add up to 5 personal logs
                        for(let i=0; i<5 && pIdx < pLogs.length; i++) finalFeed.push(pLogs[pIdx++]);
                        
                        // 2. Add an insight drop (computed from raw logs up to this point)
                        if (pLogs.length > 0 && finalFeed.length % 6 === 5) {
                            finalFeed.push({ id: `insight_${finalFeed.length}`, type: 'insight', rawLogs: pLogs });
                        }

                        // 3. Add up to 4 public drops
                        for(let i=0; i<4 && pubIdx < pDrops.length; i++) finalFeed.push(pDrops[pubIdx++]);
                        
                        // Failsafe break to avoid huge memory loops
                        if(finalFeed.length > 100) break; 
                    }

                    // If they have literally no personal logs, prompt them
                    if (pLogs.length === 0) {
                        finalFeed.unshift({
                            id: 'welcome_prompt', type: 'public', curriculum: 'System', 
                            content: "Welcome to darNote Hub! Your feed is looking a bit empty. Click the '+' button below or in the sidebar to log your first academic mistake and start building your reservoir.",
                            createdAt: Date.now()
                        });
                    }

                    setFeedItems(finalFeed);
                };

                loadFeedData();
            }, [fb, user, profile, loadingState]);

            const handleSignIn = () => { if(fb) fb.signInWithPopup(fb.auth, fb.provider); };
            const handleSignOut = () => { if(fb) { fb.signOut(fb.auth); sessionStorage.clear(); } };
            
            const handleInteraction = (post, action) => {
                if(!user) return alert("Please sign in to interact.");
                if(action === 'master' && post.type === 'personal') {
                    // Update locally for instant UI response
                    setFeedItems(prev => prev.map(p => p.id === post.id ? {...p, mastered: !p.mastered} : p));
                    // Fire-and-forget to DB
                    fb.updateDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'error_logs', post.id), { mastered: !post.mastered });
                } else if(action === 'drill') {
                    window.open(`el.html?log=${post.id}`, '_blank');
                } else if(action === 'share') {
                    // Export to public pool
                    const dropsCollName = `drops_${profile?.role || 'all'}_${profile?.curriculum || 'all'}`;
                    fb.addDoc(fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', dropsCollName), {
                        type: 'public', content: post.content, subject: post.subject, curriculum: profile?.curriculum, createdAt: Date.now()
                    });
                    alert("Shared to public reservoir!");
                }
            };

            const saveOnboarding = async (role, cur) => {
                const data = { role, curriculum: cur, onboardedAt: Date.now() };
                await fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'settings', 'profile'), data, {merge:true});
                setProfile(data);
                setLoadingState('ready');
            };

            // Toggle Theme
            const toggleTheme = () => { const n = !isDark; setIsDark(n); applyTheme(n); };
            useEffect(() => { applyTheme(isDark); }, []);

            // --- RENDER STATES ---

            if (!fb || loadingState === 'init') return (
                <div className="h-screen w-full flex items-center justify-center bg-light-bg dark:bg-onyx">
                    <div className="w-8 h-8 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
                </div>
            );

            if (loadingState === 'onboarding') return (
                <div className="h-screen w-full flex items-center justify-center bg-zinc-900 text-white p-6">
                    <div className="max-w-md w-full bg-zinc-800 p-8 rounded-2xl shadow-2xl border border-zinc-700">
                        <h2 className="text-2xl font-bold mb-2">Welcome to darNote Hub</h2>
                        <p className="text-zinc-400 mb-6 text-sm">Personalize your feed. What's your current stage?</p>
                        
                        <div className="space-y-3 mb-6">
                            {['high_school', 'university', 'professional'].map(r => (
                                <button key={r} onClick={() => saveOnboarding(r, r === 'high_school' ? 'ib' : '_all')} className="w-full p-4 rounded-xl border border-zinc-600 hover:border-brand hover:bg-brand/10 transition-colors text-left capitalize">
                                    {r.replace('_', ' ')}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col h-screen w-full overflow-hidden">
                    {/* Header */}
                    <header className="h-14 md:h-16 flex items-center justify-between px-4 md:px-8 border-b border-light-border dark:border-border bg-white/80 dark:bg-onyx/80 glass-nav z-40 relative flex-shrink-0">
                        <div className="flex items-center gap-3">
                            <div className="font-bold text-xl tracking-tight select-none cursor-pointer" onClick={() => { setAdminClicks(c=>c+1); if(adminClicks>4) alert('Admin Compose Unlocked (Mock)'); }}>
                                dar<span className="text-brand">Note</span>
                            </div>
                            {profile && (
                                <div className="hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-zinc-100 dark:bg-white/5 text-xs font-medium text-zinc-500 capitalize">
                                    📚 {profile.curriculum === '_all' ? 'General' : profile.curriculum} · {profile.role.replace('_',' ')}
                                </div>
                            )}
                        </div>

                        <div className="flex items-center gap-3 md:gap-4">
                            <button onClick={toggleTheme} className="p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white rounded-full transition-colors">
                                {isDark ? <Icons.Sun className="w-5 h-5"/> : <Icons.Moon className="w-5 h-5"/>}
                            </button>
                            {user ? (
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-full overflow-hidden border border-light-border dark:border-border">
                                        <img src={user.photoURL} alt="User" onError={(e)=>{e.target.style.display='none';}}/>
                                    </div>
                                    <button onClick={handleSignOut} className="hidden md:flex p-2 text-zinc-500 hover:text-red-500"><Icons.LogOut className="w-5 h-5"/></button>
                                </div>
                            ) : (
                                <button onClick={handleSignIn} className="px-4 py-1.5 bg-brand text-white rounded-full text-sm font-semibold hover:bg-brand-light transition-colors">
                                    Sign In
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Guest Banner */}
                    {!user && (
                        <div className="bg-brand text-white text-center text-xs py-2 px-4 font-medium flex-shrink-0">
                            You are viewing the public reservoir. Sign in to track your errors and generate personalized insights.
                        </div>
                    )}

                    {/* Main Layout */}
                    <div className="flex-1 flex overflow-hidden">
                        
                        {/* LEFT: THE FEED */}
                        <main className="flex-1 overflow-y-auto feed-scroll relative">
                            {/* Mobile Horizontal Strip (Logs/Notes) */}
                            {user && (
                                <div className="md:hidden flex gap-2 overflow-x-auto p-4 border-b border-light-border dark:border-border hide-scrollbar bg-white dark:bg-surface/30">
                                    <button onClick={()=>window.location.href='el.html'} className="flex-shrink-0 w-16 h-16 rounded-xl bg-brand text-white flex flex-col items-center justify-center gap-1 shadow-sm">
                                        <Icons.Plus className="w-5 h-5"/>
                                        <span className="text-[10px] font-bold">New Log</span>
                                    </button>
                                    {sidebarLogs.map(l => (
                                        <button key={l.id} onClick={()=>window.location.href=`el.html?log=${l.id}`} className="flex-shrink-0 w-32 h-16 rounded-xl bg-zinc-100 dark:bg-white/5 border border-light-border dark:border-white/10 p-2 text-left flex flex-col justify-between">
                                            <span className="text-xs font-bold truncate block w-full">{l.title || l.topic || 'Log'}</span>
                                            <span className="text-[10px] text-zinc-500 truncate block w-full">{l.subject || 'Misc'}</span>
                                        </button>
                                    ))}
                                </div>
                            )}

                            <div className="max-w-2xl mx-auto w-full pb-24 md:pb-8 pt-4">
                                {feedItems.length === 0 ? (
                                    <div className="text-center text-zinc-500 mt-20 text-sm">Loading feed reservoir...</div>
                                ) : (
                                    feedItems.map((item, idx) => (
                                        <FeedPost key={item.id} post={item} isLast={idx === feedItems.length - 1} onInteraction={handleInteraction} />
                                    ))
                                )}
                            </div>
                        </main>

                        {/* RIGHT: DESKTOP SIDEBAR */}
                        <aside className="hidden lg:flex flex-col w-[340px] border-l border-light-border dark:border-border bg-white/50 dark:bg-surface/20 p-4 overflow-y-auto feed-scroll">
                            
                            {/* Quick Action Hub */}
                            <div className="grid grid-cols-2 gap-2 mb-6">
                                <button onClick={()=>window.location.href='el.html'} className="p-3 bg-indigo-50 dark:bg-brand/10 text-brand rounded-xl border border-indigo-100 dark:border-brand/20 hover:bg-indigo-100 dark:hover:bg-brand/20 transition-colors flex flex-col items-center justify-center gap-1 text-xs font-bold">
                                    <Icons.Activity className="w-5 h-5"/> Error Log
                                </button>
                                <button onClick={()=>window.location.href='note.html'} className="p-3 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-xl border border-emerald-100 dark:border-emerald-500/20 hover:bg-emerald-100 dark:hover:bg-emerald-500/20 transition-colors flex flex-col items-center justify-center gap-1 text-xs font-bold">
                                    <Icons.Check className="w-5 h-5"/> Notes
                                </button>
                            </div>

                            {user ? (
                                <>
                                    <SimpleListWidget title="Recent Errors" icon={Icons.Activity} items={sidebarLogs} emptyText="No errors logged yet." onClick={(id)=>window.location.href=`el.html?log=${id}`} />
                                    <SimpleListWidget title="Recent Notes" icon={Icons.Check} items={sidebarNotes} emptyText="No notes yet." onClick={(id)=>window.location.href=`note.html?note=${id}`} />
                                    <SidebarAccordion title="Focus Session" icon={Icons.Timer}>
                                        <FocusTimer />
                                    </SidebarAccordion>
                                    <SidebarAccordion title="Action Items" icon={Icons.Check}>
                                        <TodoList fb={fb} user={user} />
                                    </SidebarAccordion>
                                    <SidebarAccordion title="Calendar" icon={Icons.Calendar}>
                                        <CalendarWidget />
                                    </SidebarAccordion>
                                </>
                            ) : (
                                <div className="p-6 bg-zinc-100 dark:bg-white/5 rounded-xl text-center border border-dashed border-zinc-300 dark:border-zinc-700">
                                    <Icons.Activity className="w-8 h-8 mx-auto text-zinc-400 mb-2"/>
                                    <p className="text-sm text-zinc-500 font-medium mb-4">Sidebar tools are available when you sign in.</p>
                                    <button onClick={handleSignIn} className="w-full py-2 bg-zinc-900 dark:bg-white text-white dark:text-black rounded-lg text-sm font-bold">Sign In with Google</button>
                                </div>
                            )}
                        </aside>
                    </div>

                    {/* MOBILE BOTTOM NAV */}
                    <div className="flex lg:hidden fixed bottom-0 left-0 w-full bg-white/90 dark:bg-onyx/90 backdrop-blur-xl border-t border-light-border dark:border-border p-2 justify-around items-center pb-safe z-50">
                        <button className="p-3 text-brand"><Icons.Home className="w-6 h-6"/></button>
                        <button onClick={()=>window.location.href='el.html'} className="bg-brand text-white p-3.5 rounded-xl shadow-[0_4px_20px_rgba(79,70,229,0.4)] -mt-6"><Icons.Plus className="w-6 h-6"/></button>
                        <button onClick={()=>window.location.href='report.html'} className="p-3 text-zinc-400 hover:text-zinc-900 dark:hover:text-white"><Icons.TrendingUp className="w-6 h-6"/></button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
