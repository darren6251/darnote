            Coffee: p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>,

            Google: p=><svg {...p} viewBox="0 0 24 24" fill="currentColor"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zM12 11h9c.1 1.4.1 2.9-.4 4.3-1.1 3-4.1 5.3-7.6 5.6-5 .5-9.4-3.1-9.9-8.1C2.5 7.1 6 2.3 11 2c2.5-.1 4.9.9 6.7 2.6l-2.7 2.8c-1-.7-2.3-1.1-3.6-1-2.9.2-5.1 2.8-4.9 5.7.2 2.6 2.4 4.7 5 4.7 2 0 3.6-1.1 4.3-2.9H12v-3z"/></svg>,
            HelpCircle: p=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,

        // --- RIGOROUS ERROR BOUNDARY ---
        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            clearCacheAndReload() {
                sessionStorage.clear();
                localStorage.clear();
                window.location.reload();
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-appleLight dark:bg-appleDark p-4">
                            <div className="glass-bento p-8 rounded-3xl max-w-md w-full text-center space-y-4 shadow-xl">
                                <div className="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4"><Icons.Bug className="w-8 h-8 text-red-500"/></div>
                                <h2 className="text-2xl font-bold">System Overload</h2>
                                <p className="text-sm text-gray-500 dark:text-gray-400">The cognitive buffer overflowed. A deep cache clear is recommended.</p>
                                <div className="p-4 bg-red-50 dark:bg-black/40 rounded-xl text-left text-xs font-mono text-red-600 dark:text-red-400 overflow-auto h-24">{this.state.error?.toString()}</div>
                                <button onClick={this.clearCacheAndReload} className="w-full bg-black text-white dark:bg-white dark:text-black py-3 rounded-xl font-bold shadow-md hover:scale-105 transition-transform">Clear Cache & Reboot</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- CUSTOM HOOKS & UTILS ---
        const useSessionCache = (key, fetcher, ttlMinutes = 5) => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadData = async () => {
                    const cached = sessionStorage.getItem(key);
                    if (cached) {
                        const { val, expiry } = JSON.parse(cached);
                        if (Date.now() < expiry) { setData(val); setLoading(false); return; }
                    }
                    try {
                        const fetched = await fetcher();
                        sessionStorage.setItem(key, JSON.stringify({ val: fetched, expiry: Date.now() + (ttlMinutes * 60 * 1000) }));
                        setData(fetched);
                    } catch (e) { console.error("Cache fetch error", e); }
                    setLoading(false);
                };
                loadData();
            }, [key]);
            return { data, loading };
        };

        const generateAIPlan = async (promptText, context, isInsomnia) => {
            const proxyUrl = "https://gemini-proxy-513372702506.us-central1.run.app/proxy";
            
            const systemPrompt = `You are an empathetic, highly intelligent AI productivity coach for someone who struggles with procrastination.
            Energy Level: ${context.energy}.
            Current System Time: ${context.currentTime} (Use this EXACT time as the starting point for your schedule).
            
            CRITICAL RULES:
            1. Output STRICTLY VALID JSON. No markdown wrappers.
            2. For every block, provide an EXACT "startTime" and "endTime" in 24-hour "HH:MM" format (e.g., "14:30").
            3. Start the first block exactly at the Current System Time provided above.
            4. Ensure all blocks are sequential and DO NOT overlap. 
            5. ${isInsomnia ? "It is late at night. Provide a short wind-down schedule for tonight, and push heavy requested tasks to tomorrow afternoon." : "Schedule tasks flowing logically from the Current Time."}

            JSON SCHEMA:
            {
                "greeting": "Your empathetic, 2-sentence coaching message based on their input.",
                "plans": {
                    "intense": [ { "id": "1", "title": "Task", "type": "heavy|light|break", "startTime": "14:00", "endTime": "14:45", "actionUrl": "url_or_null" } ],
                    "balanced": [ ... ],
                    "gentle": [ ... ]
                }
            }
            
            If they mention Biology/Math/Error logs, set actionUrl to "el.html?subject=SubjectName". If writing/notes, set to "note.html".
            `;

            try {
                const response = await fetch(proxyUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${systemPrompt}\n\nUser Input: ${promptText}\nTags: ${context.tags.join(', ')}` }] }]
                    })
                });
                const data = await response.json();
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if(!text) throw new Error("Empty AI response");
                
                text = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                return JSON.parse(text);
            } catch (error) {
                console.error("AI Gen Error:", error);
                // Fallback safe JSON calculating from now
                const now = new Date();
                const m1 = new Date(now.getTime() + 45*60000);
                const m2 = new Date(m1.getTime() + 15*60000);
                const m3 = new Date(m2.getTime() + 30*60000);
                const toHHMM = (d) => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

                return {
                    greeting: "I couldn't connect to the mainframe. Here is a generic local schedule.",
                    plans: {
                        balanced: [
                            { id: "f1", title: "Focus Block", type: "heavy", startTime: toHHMM(now), endTime: toHHMM(m1), actionUrl: null },
                            { id: "f2", title: "Break", type: "break", startTime: toHHMM(m1), endTime: toHHMM(m2), actionUrl: null },
                            { id: "f3", title: "Wrap Up", type: "light", startTime: toHHMM(m2), endTime: toHHMM(m3), actionUrl: null }
                        ],
                        intense: [], gentle: [] // Omitted for brevity in fallback
                    }
                };
            }
        };

        // --- COMPONENTS ---

        const OnboardingTutorial = ({ onComplete }) => {
            const [page, setPage] = useState(0);
            
            const slides = [
                {
                    icon: <Icons.Target className="w-16 h-16 text-brand drop-shadow-md" />,
                    title: "Welcome to Command Center",
                    desc: "Your distraction-free Bento Box. We designed this to work with your brain, not against it."
                },
                {
                    icon: <Icons.Bot className="w-16 h-16 text-indigo-500 drop-shadow-md" />,
                    title: "AI Autopilot Planner",
                    desc: "Type what's on your plate. The AI reads your energy and builds a flexible, guilt-free timeline for the day."
                },
                {
                    icon: <Icons.Timer className="w-16 h-16 text-orange-500 drop-shadow-md" />,
                    title: "The Ghost Timer",
                    desc: "Paralyzed? Click 'Just 5 Mins'. When it ends, it silently counts up as bonus time to keep your momentum going."
                },
                {
                    icon: <Icons.Inbox className="w-16 h-16 text-green-500 drop-shadow-md" />,
                    title: "Park It Inbox",
                    desc: "Random distraction popping up? Dump it in 'Park It'. We'll save it for tomorrow so you stay focused now."
                },
                {
                    icon: <Icons.Moon className="w-16 h-16 text-blue-400 drop-shadow-md" />,
                    title: "Insomnia Protocol",
                    desc: "Working past 11 PM? The app shifts to dark mode and prioritizes light tasks to protect your sleep schedule."
                }
            ];

            const next = () => { if (page < slides.length - 1) setPage(p => p + 1); else onComplete(); };
            const prev = () => { if (page > 0) setPage(p => p - 1); };

            return (
                <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 dark:bg-black/80 backdrop-blur-md p-4">
                    <motion.div initial={{scale:0.95, y:20}} animate={{scale:1, y:0}} exit={{scale:0.95, opacity:0}} className="glass-bento bg-appleLightSurface dark:bg-appleDarkSurface w-full max-w-md rounded-[2.5rem] overflow-hidden shadow-2xl relative flex flex-col h-[500px]">
                        <motion.div 
                            drag="x" dragConstraints={{ left: 0, right: 0 }} dragElastic={0.2}
                            onDragEnd={(e, { offset }) => { if (offset.x < -50) next(); else if (offset.x > 50) prev(); }}
                            className="flex-1 flex flex-col items-center justify-center p-10 text-center cursor-grab active:cursor-grabbing"
                            key={page} initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} transition={{ duration: 0.3 }}
                        >
                            <div className="w-32 h-32 rounded-full bg-appleLight dark:bg-black/20 flex items-center justify-center mb-8 shadow-inner">
                                {slides[page].icon}
                            </div>
                            <h2 className="text-2xl font-bold tracking-tight mb-4 text-black dark:text-white">{slides[page].title}</h2>
                            <p className="text-gray-600 dark:text-gray-300 leading-relaxed text-sm">{slides[page].desc}</p>
                        </motion.div>
                        <div className="p-8 pt-0 flex flex-col items-center gap-6">
                            <div className="flex gap-2">
                                {slides.map((_, i) => (
                                    <div key={i} className={`h-2 rounded-full transition-all duration-300 ${i === page ? 'w-6 bg-brand' : 'w-2 bg-gray-300 dark:bg-white/20'}`} />
                                ))}
                            </div>
                            <button onClick={next} className="w-full bg-black text-white dark:bg-white dark:text-black py-4 rounded-2xl font-bold shadow-md hover:scale-[1.02] active:scale-95 transition-transform">
                                {page === slides.length - 1 ? "Let's Flow" : "Continue"}
                            </button>
                        </div>
                    </motion.div>
                </motion.div>
            );
        };

        const FocusTimer = () => {
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);
            const [isGhost, setIsGhost] = useState(false); 
            const timerRef = useRef(null);

            useEffect(() => {
                if (isActive) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev > 0) return prev - 1;
                            if (!isGhost) {
                                new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play().catch(()=>{});
                                setIsGhost(true);
                                return 1; 
                            }
                            return prev + 1; 
                        });
                    }, 1000);
                } else { clearInterval(timerRef.current); }
                return () => clearInterval(timerRef.current);
            }, [isActive, isGhost]);

            const toggle = () => setIsActive(!isActive);
            const reset = (mins) => { setIsActive(false); setIsGhost(false); setTimeLeft(mins * 60); };

            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            return (
                <div className="glass-bento p-6 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden group">
                    {isGhost && <div className="absolute inset-0 bg-brand/5 animate-pulse-slow pointer-events-none"></div>}
                    <div className="flex w-full justify-between items-center mb-4 relative z-10">
                        <span className="text-xs font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2"><Icons.Timer className="w-4 h-4"/> {isGhost ? 'Bonus Time' : 'Focus'}</span>
                        <div className="flex gap-1">
                            <button onClick={()=>reset(5)} className="px-2 py-1 rounded bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-[10px] font-bold transition-colors">5m</button>
                            <button onClick={()=>reset(25)} className="px-2 py-1 rounded bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-[10px] font-bold transition-colors">25m</button>
                        </div>
                    </div>
                    
                    <div className={`text-5xl font-mono font-bold tracking-tighter mb-6 transition-colors ${isGhost ? 'text-brand' : ''}`}>{isGhost && '+'}{timeStr}</div>
                    
                    <div className="flex gap-4 w-full relative z-10">
                        <button onClick={toggle} className={`flex-1 py-3 rounded-2xl flex items-center justify-center gap-2 font-bold shadow-sm transition-all active:scale-95 ${isActive ? 'bg-black/5 dark:bg-white/10 text-black dark:text-white' : 'bg-black text-white dark:bg-white dark:text-black'}`}>
                            {isActive ? <><Icons.Pause className="w-5 h-5"/> Pause</> : <><Icons.Play className="w-5 h-5 ml-1"/> Start</>}
                        </button>
                        <button onClick={()=>reset(25)} className="p-3 rounded-2xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition-all text-black dark:text-white"><Icons.RefreshCw className="w-5 h-5"/></button>
                    </div>
                </div>
            );
        };

        const ParkItInbox = ({ user }) => {
            const [items, setItems] = useState([]);
            const [input, setInput] = useState('');

            useEffect(() => {
                if(!user) return;
                const cached = localStorage.getItem(`darNote_parked_${user.uid}`);
                if(cached) setItems(JSON.parse(cached));
            }, [user]);

            const handleAdd = (e) => {
                if(e.key === 'Enter' && input.trim()) {
                    const newItems = [{id: Date.now(), text: input.trim()}, ...items];
                    setItems(newItems);
                    if(user) localStorage.setItem(`darNote_parked_${user.uid}`, JSON.stringify(newItems));
                    setInput('');
                }
            };

            const remove = (id) => {
                const newItems = items.filter(i => i.id !== id);
                setItems(newItems);
                if(user) localStorage.setItem(`darNote_parked_${user.uid}`, JSON.stringify(newItems));
            };

            return (
                <div className="glass-bento p-5 rounded-3xl flex flex-col h-[280px]">

        const HorizontalLibrary = ({ user }) => {
            const fetchLibrary = async () => {
                if(!user) return [];
                try {
                    const db = window.firebase.db;

                    const notesQ = query(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'notes'), orderBy('updatedAt', 'desc'), limit(5));
                    
                    const [lSnap, nSnap] = await Promise.all([getDocs(logsQ), getDocs(notesQ)]);
                    const items = [];
                    lSnap.forEach(d => items.push({ id: d.id, ...d.data(), _type: 'log', _date: d.data().lastModified }));
                    nSnap.forEach(d => items.push({ id: d.id, ...d.data(), _type: 'note', _date: d.data().updatedAt }));
                    
                    return items.sort((a,b) => new Date(b._date) - new Date(a._date)).slice(0, 8);

                                    {item._type==='log' ? <Icons.Bug className="w-4 h-4 text-gray-400 group-hover:text-red-500 transition-colors"/> : <Icons.FileText className="w-4 h-4 text-gray-400 group-hover:text-blue-500 transition-colors"/>}

        const RecentDropdownMenu = ({ user, onClose }) => {
            const fetchLibrary = async () => {
                if(!user) return [];
                try {
                    const db = window.firebase.db;
                    const logsQ = query(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'error_logs'), orderBy('lastModified', 'desc'), limit(5));
                    const notesQ = query(collection(db, 'artifacts', APP_ID, 'users', user.uid, 'notes'), orderBy('updatedAt', 'desc'), limit(5));
                    
                    const [lSnap, nSnap] = await Promise.all([getDocs(logsQ), getDocs(notesQ)]);

                    return items.sort((a,b) => new Date(b._date) - new Date(a._date)).slice(0, 5);
                } catch (e) {
                    console.error("Library fetch failed:", e);

            const { data: items, loading } = useSessionCache(user ? `lib_menu_${user.uid}` : null, fetchLibrary, 5);

            return (
                <motion.div initial={{opacity:0, y:-10}} animate={{opacity:1, y:0}} className="absolute top-full left-0 mt-2 w-72 bg-white dark:bg-appleDarkSurface border border-appleLightBorder dark:border-white/10 rounded-2xl p-2 z-50 shadow-2xl flex flex-col">
                    <div className="px-3 py-2 text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1 flex justify-between items-center">
                        Recent Files
                    </div>
                    {loading ? (
                       <div className="p-6 flex justify-center"><div className="w-5 h-5 border-2 border-brand border-t-transparent rounded-full animate-spin"></div></div>
                    ) : items?.length > 0 ? (
                        items.map(item => (

                                 <div className="flex items-center gap-2 mb-1">
                                     {item._type === 'log' ? <Icons.Bug className="w-3.5 h-3.5 text-red-500"/> : <Icons.FileText className="w-3.5 h-3.5 text-blue-500"/>}
                                     <span className="text-sm font-bold truncate text-black dark:text-white">{item.title || 'Untitled'}</span>

                    ) : (
                        <div className="p-4 text-xs text-gray-500 text-center">No recent files found.</div>
                    )}
                </motion.div>
            );
        };

        const AIPlanner = ({ user, momentum }) => {
            const [state, setState] = useState('input'); // input | loading | select | timeline
            const [battery, setBattery] = useState(null); 
            const [tags, setTags] = useState([]);
            const [inputText, setInputText] = useState('');
            const [generatedPlans, setGeneratedPlans] = useState(null);
            const [activePlanKey, setActivePlanKey] = useState(null);
            const [activePlan, setActivePlan] = useState([]);
            const [greeting, setGreeting] = useState('');
            
            const isInsomnia = new Date().getHours() >= 23 || new Date().getHours() < 6;
            const timelineScrollRef = useRef(null);

            // PIXEL CONSTANT (1 min = 3 pixels. 1 hour = 180px)
            const PPM = 3; 
            const HOURS = Array.from({length: 24}, (_, i) => i);

            // Time Tracker hook
            const [currentTimeMins, setCurrentTimeMins] = useState(new Date().getHours() * 60 + new Date().getMinutes());
            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    setCurrentTimeMins(now.getHours() * 60 + now.getMinutes());
                }, 60000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const loadTodayPlan = async () => {
                    if(!user) return;
                    const todayStr = new Date().toISOString().split('T')[0];
                    const docRef = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', user.uid, 'daily_plans', todayStr);
                    const snap = await window.firebase.getDoc(docRef);
                    if (snap.exists() && snap.data().blocks && snap.data().blocks.length > 0) {
                        setActivePlan(snap.data().blocks);
                        setGreeting("Welcome back to your timeline. Stay focused.");
                        setState('timeline');
                    }
                };
                loadTodayPlan();
            }, [user]);

            useEffect(() => {
                if (state === 'timeline' && timelineScrollRef.current) {
                    const now = new Date();
                    const mins = now.getHours() * 60 + now.getMinutes();
                    // Scroll to current time, offset by ~100px so the red line isn't at the absolute top
                    timelineScrollRef.current.scrollTop = (mins * PPM) - 100;
                }
            }, [state]);

            const handleGenerate = async () => {
                if(!battery) { alert("Please do a quick battery check first!"); return; }
                setState('loading');
                const nowTimeStr = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                const ctx = { momentum, energy: battery, tags, currentTime: nowTimeStr };
                const res = await generateAIPlan(inputText, ctx, isInsomnia);
                setGreeting(res.greeting);
                setGeneratedPlans(res.plans);
                
                if (battery === 'burned' && res.plans.gentle && res.plans.gentle.length > 0) { 
                    setActivePlanKey('gentle'); selectPlan('gentle', res.plans.gentle); 
                } else {
                    setState('select');
                }
            };

            const selectPlan = async (key, blocks) => {
                setActivePlanKey(key);
                setActivePlan(blocks);
                setState('timeline');

                if(user) {
                    const todayStr = new Date().toISOString().split('T')[0];
                    await window.firebase.setDoc(window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', user.uid, 'daily_plans', todayStr), { blocks: blocks });
                }
            };

            const handleRecalibrate = () => {
                setState('input');
                setInputText("I got off track. Need a fresh schedule starting right now.");
                setBattery('low');
            };

            const toggleTag = (tag) => setTags(prev => prev.includes(tag) ? prev.filter(t=>t!==tag) : [...prev, tag]);

            return (
                <div className="w-full h-full flex flex-col relative pb-10 lg:pb-0">
                    <AnimatePresence mode="wait">
                        {state === 'input' && (
                            <motion.div key="input" initial={{opacity:0, y:20}} animate={{opacity:1, y:0}} exit={{opacity:0, y:-20}} className="flex-1 flex flex-col justify-center max-w-2xl mx-auto w-full px-4 py-8">
                                <div className="text-center mb-8">
                                    <div className="w-16 h-16 bg-brand/10 text-brand rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><Icons.Bot className="w-8 h-8"/></div>
                                    <h2 className="text-3xl font-bold mb-2 tracking-tight">{isInsomnia ? "Can't sleep? Let's protect tomorrow." : "What's on your plate?"}</h2>
                                    <p className="text-gray-500 text-sm">Tell me what you need to do, and I'll build a frictionless schedule.</p>
                                </div>
                                
                                <div className="glass-bento p-6 rounded-3xl space-y-6">
                                    <div>
                                        <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">1. Battery Check</div>
                                        <div className="flex gap-3">
                                            {[{id:'high', e:'🔋', l:'High'}, {id:'low', e:'🪫', l:'Low'}, {id:'burned', e:'🫠', l:'Burned Out'}].map(b => (
                                                <button key={b.id} onClick={()=>setBattery(b.id)} className={`flex-1 py-3 rounded-2xl flex flex-col items-center gap-1 transition-all border ${battery===b.id ? 'bg-brand/10 border-brand/50 text-brand font-bold' : 'bg-black/5 dark:bg-white/5 border-transparent text-gray-500 hover:bg-black/10 dark:hover:bg-white/10'}`}>
                                                    <span className="text-2xl">{b.e}</span><span className="text-[10px] uppercase tracking-wider">{b.l}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 flex justify-between">
                                            <span>2. Brain Dump</span>
                                            <span className="opacity-50">Optional Tags</span>
                                        </div>
                                        <textarea value={inputText} onChange={e=>setInputText(e.target.value)} placeholder="e.g. Read history chapter, do 5 math errors..." className="w-full bg-black/5 dark:bg-white/5 rounded-2xl p-4 text-sm focus:outline-none focus:ring-2 ring-brand/50 resize-none h-24 transition-all mb-3"/>
                                        <div className="flex flex-wrap gap-2">
                                            {['🔥 Critical', '🧊 Chill', '🧠 Brain Heavy', '🧹 Mindless', '⏱️ Quick', '⏳ Long'].map(t => (
                                                <button key={t} onClick={()=>toggleTag(t)} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-colors border ${tags.includes(t) ? 'bg-brand text-white border-brand' : 'bg-transparent border-gray-300 dark:border-white/20 text-gray-600 dark:text-gray-300 hover:bg-black/5 dark:hover:bg-white/5'}`}>{t}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <button onClick={handleGenerate} className="w-full py-4 bg-black text-white dark:bg-white dark:text-black rounded-2xl font-bold text-sm shadow-md hover:scale-[1.02] active:scale-95 transition-transform flex items-center justify-center gap-2"><Icons.Zap className="w-4 h-4"/> Generate Autopilot</button>
                                </div>
                            </motion.div>
                        )}

                        {state === 'loading' && (
                            <motion.div key="loading" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="flex-1 flex flex-col items-center justify-center">
                                <div className="w-16 h-16 border-4 border-brand/20 border-t-brand rounded-full animate-spin mb-6"></div>
                                <div className="text-sm font-bold text-gray-500 animate-pulse">Calculating absolute cognitive load...</div>
                            </motion.div>
                        )}

                        {state === 'select' && generatedPlans && (
                            <motion.div key="select" initial={{opacity:0, scale:0.95}} animate={{opacity:1, scale:1}} exit={{opacity:0, scale:0.95}} className="flex-1 flex flex-col justify-center max-w-4xl mx-auto w-full px-4 py-8">
                                <div className="text-center mb-8 max-w-lg mx-auto">
                                    <h2 className="text-2xl font-bold mb-4">{greeting}</h2>
                                    <p className="text-gray-500 text-sm">Choose your pacing for this session.</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {[
                                        {key: 'intense', title: 'Intense', emoji: '🔥', desc: 'Tight blocks. For high momentum.'},
                                        {key: 'balanced', title: 'Balanced', emoji: '⚖️', desc: 'Standard Pomodoro pacing.'},
                                        {key: 'gentle', title: 'Gentle', emoji: '☕', desc: 'Long breaks. Low energy mode.'}
                                    ].map(opt => (
                                        <button key={opt.key} onClick={()=>selectPlan(opt.key, generatedPlans[opt.key] || [])} className="glass-bento p-6 rounded-3xl text-left hover:scale-[1.02] transition-transform group flex flex-col h-full border-2 border-transparent hover:border-brand/50">
                                            <div className="text-4xl mb-4 group-hover:scale-110 transition-transform origin-left">{opt.emoji}</div>
                                            <h3 className="font-bold text-lg mb-2">{opt.title}</h3>
                                            <p className="text-sm text-gray-500 mb-6 flex-1">{opt.desc}</p>
                                            <div className="text-xs font-bold text-brand uppercase tracking-wider flex items-center gap-1 group-hover:gap-2 transition-all">Select Plan <Icons.ArrowRight className="w-3 h-3"/></div>
                                        </button>
                                    ))}
                                </div>
                            </motion.div>
                        )}

                        {state === 'timeline' && (
                            <motion.div key="timeline" initial={{opacity:0}} animate={{opacity:1}} className="flex-1 flex flex-col w-full h-full relative">
                                
                                <div className="sticky top-0 z-50 bg-appleLight/90 dark:bg-appleDark/90 backdrop-blur-md pt-4 pb-2 px-2 border-b border-appleLightBorder dark:border-white/10 flex justify-between items-center">
                                    <div className="text-sm font-bold text-brand px-4 truncate">{greeting}</div>
                                    <button onClick={handleRecalibrate} className="px-4 py-2 rounded-full bg-red-50 dark:bg-red-900/10 text-red-600 dark:text-red-400 text-xs font-bold hover:bg-red-100 dark:hover:bg-red-900/20 transition-colors flex items-center gap-2 shrink-0"><Icons.RefreshCw className="w-3 h-3"/> Recalibrate</button>
                                </div>

                                {/* Absolute Calendar Container */}
                                <div className="flex-1 overflow-y-auto hide-scroll relative" ref={timelineScrollRef}>
                                    <div className="relative w-full" style={{ height: `${24 * 60 * PPM}px` }}>
                                        
                                        {/* Background Grid Lines (24 Hours) */}
                                        {HOURS.map(h => (
                                            <div key={h} className="absolute w-full border-t border-appleLightBorder dark:border-white/5 flex items-start" style={{ top: `${h * 60 * PPM}px` }}>
                                                <span className="text-[10px] text-gray-400 font-mono w-14 text-right pr-3 pt-1">{h.toString().padStart(2,'0')}:00</span>
                                            </div>
                                        ))}

                                        {/* Live Current Time Line */}
                                        <div className="absolute w-full border-t-[1.5px] border-red-500 z-30 pointer-events-none transition-all duration-1000" style={{ top: `${currentTimeMins * PPM}px` }}>
                                            <div className="absolute left-[45px] w-2.5 h-2.5 rounded-full bg-red-500 -mt-[5.5px] shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div>
                                        </div>

                                        {/* Absolute Blocks */}
                                        {activePlan.map((block) => {
                                            if(!block.startTime || !block.endTime) return null;
                                            
                                            const [sh, sm] = block.startTime.split(':').map(Number);
                                            const [eh, em] = block.endTime.split(':').map(Number);
                                            
                                            let startMins = (sh * 60) + sm;
                                            let endMins = (eh * 60) + em;
                                            if (endMins <= startMins) endMins += 24 * 60; // handle midnight wrap logically
                                            
                                            const top = startMins * PPM;
                                            const height = (endMins - startMins) * PPM;

                                            return (
                                                <div key={block.id} 
                                                     className={`absolute right-4 left-[60px] rounded-2xl p-4 overflow-hidden border group time-block-hover flex flex-col justify-between
                                                     ${block.type==='break' ? 'bg-black/5 dark:bg-white/5 border-dashed border-gray-300 dark:border-white/20 z-10' : 'glass-bento border-appleLightBorder dark:border-white/10 z-20 cursor-pointer'}`}
                                                     style={{ top: `${top}px`, height: `${height}px` }}>
                                                    
                                                    <div>
                                                        <div className="flex justify-between items-start mb-1">
                                                            <div className="text-[10px] font-mono font-bold text-gray-500">{block.startTime} - {block.endTime}</div>
                                                            <div className="text-[10px] font-bold text-brand bg-brand/10 px-2 py-0.5 rounded">{endMins - startMins}m</div>
                                                        </div>
                                                        <div className={`font-bold text-sm leading-tight ${block.type==='break' ? 'text-gray-500' : ''}`}>{block.title}</div>
                                                    </div>

                                                    {/* Smart Hover Action Buttons - Reveal fully on hover if block is too small */}
                                                    {block.actionUrl && block.type !== 'break' && (
                                                        <div className="mt-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <a href={block.actionUrl} className="flex-1 text-center py-2 bg-brand text-white rounded-lg text-xs font-bold hover:bg-brandDarkSoft transition-colors">Start Session</a>
                                                            <button onClick={()=>{ alert('Click Ghost Timer button in sidebar!') }} className="px-3 py-2 bg-black/5 dark:bg-white/10 rounded-lg text-xs font-bold hover:bg-black/10 dark:hover:bg-white/20 transition-colors">5 Mins</button>
                                                        </div>
                                                    )}
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };


        const App = () => {
            const [user, setUser] = useState(null);
            const [theme, setTheme] = useState('dark');
            const [momentum, setMomentum] = useState(50);
            const [isAuthLoading, setIsAuthLoading] = useState(true);
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [showRecentMenu, setShowRecentMenu] = useState(false);

            const isInsomnia = new Date().getHours() >= 23 || new Date().getHours() < 6;

            useEffect(() => {
                const savedTheme = localStorage.getItem('darnote-theme') || 'dark';
                setTheme(savedTheme);
                if (isInsomnia) document.documentElement.classList.add('insomnia-mode');
                
                if (!localStorage.getItem('darnote_onboarded_v1')) {
                    setShowOnboarding(true);
                }
            }, [isInsomnia]);

            useEffect(() => {
                if(theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('darnote-theme', theme);
            }, [theme]);

            useEffect(() => {
                const u = window.firebase.onAuthStateChanged(window.firebase.auth, async (user) => {
                    if (user) {
                        setUser(user);
                        const mScore = Math.floor(Math.random() * 60) + 40; 
                        setMomentum(mScore);
                    } else { setUser(null); }
                    setIsAuthLoading(false);
                });
                return () => u();
            }, []);

            if (isAuthLoading) return <div className="min-h-screen flex items-center justify-center bg-appleLight dark:bg-appleDark"><div className="w-8 h-8 border-2 border-brand border-t-transparent rounded-full animate-spin"></div></div>;

            const greeting = isInsomnia ? "Late night?" : (new Date().getHours() < 12 ? "Good morning" : (new Date().getHours() < 17 ? "Good afternoon" : "Good evening"));

            return (
                <div className="min-h-screen flex flex-col max-w-[1800px] mx-auto w-full bg-appleLight dark:bg-appleDark selection:bg-brand/30">
                    
                    <AnimatePresence>
                        {showOnboarding && (
                            <OnboardingTutorial onComplete={() => {
                                localStorage.setItem('darnote_onboarded_v1', 'true');
                                setShowOnboarding(false);
                            }} />
                        )}
                    </AnimatePresence>

                    {!user ? (
                        <div className="flex-1 flex flex-col items-center justify-center p-4 relative overflow-hidden">
                            <div className="absolute top-6 right-6 flex items-center gap-2 z-50">
                                <button onClick={()=>setShowOnboarding(true)} className="p-2.5 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-brand transition-colors" title="How to use">
                                    <Icons.HelpCircle className="w-5 h-5"/>
                                </button>
                                <button onClick={()=>setTheme(theme==='dark'?'light':'dark')} className="p-2.5 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-gray-500 transition-colors">
                                    {theme==='dark' ? <Icons.Sun className="w-5 h-5"/> : <Icons.Moon className="w-5 h-5"/>}
                                </button>
                            </div>

                            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-brand/20 via-transparent to-transparent pointer-events-none"></div>
                            <div className="glass-bento p-10 rounded-[40px] max-w-sm w-full text-center relative z-10 shadow-2xl">
                                <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-16 h-16 mx-auto mb-6 rounded-2xl shadow-lg"/>
                                <h1 className="text-3xl font-bold tracking-tight mb-2 text-black dark:text-white">darNote</h1>
                                <p className="text-sm text-gray-500 dark:text-gray-400 mb-8 font-medium">The Command Center</p>
                                <button onClick={()=>window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="w-full bg-black text-white dark:bg-white dark:text-black py-4 rounded-2xl font-bold shadow-md hover:scale-[1.02] active:scale-95 transition-transform flex items-center justify-center gap-2 mb-3"><Icons.Google className="w-5 h-5"/> Continue with Google</button>
                                <button onClick={()=>window.firebase.signInAnonymously(window.firebase.auth)} className="w-full bg-appleLightBorder/50 dark:bg-white/5 text-black dark:text-white py-4 rounded-2xl font-bold hover:bg-appleLightBorder dark:hover:bg-white/10 transition-colors">Guest Mode</button>
                            </div>
                        </div>
                    ) : (
                        <>
                            {/* Top Bar - Flow State */}
                            <header className="h-20 px-6 lg:px-10 flex justify-between items-center shrink-0 z-40 bg-transparent">
                                <div className="relative z-50">
                                    <button onClick={() => setShowRecentMenu(!showRecentMenu)} className="flex items-center gap-3 text-left hover:bg-black/5 dark:hover:bg-white/5 p-2 -ml-2 rounded-2xl transition-colors">
                                        <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-10 h-10 rounded-xl shadow-sm"/>
                                        <div>
                                            <h1 className="text-xl font-bold tracking-tight leading-none">{greeting}, {user.displayName?.split(' ')[0] || 'User'}.</h1>
                                            <p className="text-[10px] text-gray-500 uppercase tracking-widest font-bold mt-1 flex items-center gap-1">Ready to flow. <Icons.ChevronDown className={`w-3 h-3 transition-transform ${showRecentMenu ? 'rotate-180' : ''}`}/></p>
                                        </div>
                                    </button>
                                    
                                    {showRecentMenu && (
                                        <>
                                            <div className="fixed inset-0 z-40" onClick={() => setShowRecentMenu(false)}></div>
                                            <RecentDropdownMenu user={user} onClose={() => setShowRecentMenu(false)} />
                                        </>
                                    )}
                                </div>

                                <div className="hidden md:flex items-center gap-3">
                                    <a href="el.html" className="px-4 py-2 rounded-full bg-red-50 dark:bg-red-900/10 text-red-600 dark:text-red-400 text-xs font-bold flex items-center gap-2 hover:bg-red-100 dark:hover:bg-red-900/20 transition-colors"><Icons.Bug className="w-4 h-4"/> Quick Log</a>
                                    <a href="note.html" className="px-4 py-2 rounded-full bg-blue-50 dark:bg-blue-900/10 text-blue-600 dark:text-blue-400 text-xs font-bold flex items-center gap-2 hover:bg-blue-100 dark:hover:bg-blue-900/20 transition-colors"><Icons.FileText className="w-4 h-4"/> New Note</a>
                                </div>

                                <div className="flex items-center gap-2">
                                    <button onClick={()=>setShowOnboarding(true)} className="p-2.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-brand transition-colors" title="How to use">
                                        <Icons.HelpCircle className="w-5 h-5"/>
                                    </button>
                                    <button onClick={()=>setTheme(theme==='dark'?'light':'dark')} className="p-2.5 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-gray-500 transition-colors">
                                        {theme==='dark' ? <Icons.Sun className="w-5 h-5"/> : <Icons.Moon className="w-5 h-5"/>}
                                    </button>
                                    {user.photoURL ? <img src={user.photoURL} className="w-9 h-9 rounded-full ml-2 border border-black/10 dark:border-white/10"/> : <div className="w-9 h-9 rounded-full bg-brand text-white flex items-center justify-center font-bold ml-2 text-sm">{user.displayName?.charAt(0) || 'U'}</div>}
                                    <button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="p-2.5 rounded-full hover:bg-red-50 dark:hover:bg-red-900/10 text-gray-500 hover:text-red-500 transition-colors"><Icons.MoreVertical className="w-5 h-5"/></button>
                                </div>
                            </header>

                            <main className="flex-1 flex flex-col lg:flex-row overflow-hidden pb-6">
                                {/* Center Stage - The Planner */}
                                <div className="flex-1 overflow-hidden px-4 lg:px-10 lg:pr-6 h-[calc(100vh-80px)]">
                                    <div className="h-full glass-bento rounded-[2.5rem] overflow-hidden flex flex-col shadow-sm border border-appleLightBorder dark:border-white/10">
                                        <AIPlanner user={user} momentum={momentum}/>
                                    </div>
                                    <div className="lg:hidden block pb-10 mt-4"><HorizontalLibrary user={user}/></div>
                                </div>

                                {/* Right Sidebar - Bento Widgets */}
                                <div className="w-full lg:w-[380px] shrink-0 overflow-y-auto hide-scroll px-4 lg:px-10 lg:pl-0 h-[calc(100vh-80px)] space-y-6 pb-10 hidden lg:block">
                                    <FocusTimer />
                                    <ParkItInbox user={user} />
                                    <HorizontalLibrary user={user}/>
                                </div>
                            </main>
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
