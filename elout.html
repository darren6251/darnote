<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    
    const app = initializeApp({ apiKey: "AIzaSyAvPEac-03kE4oazvaq8K3T2gxLPsnZO20", authDomain: "darnote625.firebaseapp.com", projectId: "darnote625", storageBucket: "darnote625.firebasestorage.app", messagingSenderId: "16458322562", appId: "1:16458322562:web:8894d71f3e6c326eba1a9b" });
    
    window.firebase = { 
        app, 
        auth: getAuth(app), 
        db: getFirestore(app), 
        collection, 
        getDocs, 
        query, 
        where, 
        orderBy, 
        onAuthStateChanged, 
        signInWithPopup, 
        GoogleAuthProvider,
        isReady: true 
    };
    
    window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }

    /* --- LAYOUT ENGINES --- */
    
    /* 1. QA Book (LQ) Layout - Has wide right margin for marking */
    .layout-qa .dse-layout-bg {
        background: white;
        background-image: linear-gradient(to right, transparent 0%, transparent calc(210mm - 90mm), black calc(210mm - 90mm), black calc(210mm - 90mm + 1px), transparent calc(210mm - 90mm + 1px));
        background-repeat: repeat-y;
        background-size: 100% 1px;
    }
    .layout-qa .dse-content-padding {
        padding-top: 25mm;
        padding-bottom: 25mm;
        padding-left: 20mm;
        padding-right: 95mm; /* Huge right margin */
    }

    /* 2. Question Paper (MC) Layout - Full width, no marking column */
    .layout-std .dse-layout-bg {
        background: white; /* No line */
    }
    .layout-std .dse-content-padding {
        padding-top: 25mm;
        padding-bottom: 25mm;
        padding-left: 25mm; /* Balanced margins */
        padding-right: 25mm;
    }

    /* Hidden Measuring Container */
    #measure-container {
        position: absolute;
        top: -9999px;
        left: -9999px;
        visibility: hidden;
        width: 210mm; /* A4 width */
        pointer-events: none;
    }

    @media print {
        @page { size: A4; margin: 0; }
        html, body { 
            height: 100%; 
            margin: 0 !important; 
            padding: 0 !important; 
            background: white !important; 
            color: black;
            -webkit-print-color-adjust: exact; 
            print-color-adjust: exact; 
        }
        
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        
        #root, #root > div { display: block !important; height: auto !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
        
        #preview-scroller {
            padding: 0 !important;
            margin: 0 !important;
            background: white !important;
            height: auto !important;
            overflow: visible !important;
            position: static !important;
            display: block !important;
        }

        #preview-wrapper {
            width: 30% !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
        }

        .paper-preview {
            width: 210mm !important;
            height: 297mm !important; /* Force exact height */
            margin: 0 !important;
            box-shadow: none !important;
            transform: none !important; 
            overflow: hidden !important; /* Clip content */
            page-break-after: always; /* Force break */
            position: relative;
        }

        .dse-layout-bg {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    }

    .print-only { display: none; }
    
    .paper-preview {
        width: 210mm;
        height: 297mm; /* Exact A4 Height */
        background: white;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
        margin: 2rem auto;
        position: relative;
        transition: transform 0.3s ease;
        overflow: hidden;
    }
    
    .filter-bw { filter: grayscale(100%) contrast(150%) brightness(110%); }
    .filter-high-contrast { filter: grayscale(100%) contrast(200%) brightness(120%); }
</style>

<body class="bg-gray-100 text-[#202124]">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect } = React;

    class ErrorBoundary extends React.Component {
        constructor(props) { super(props); this.state = { hasError: false, error: null }; }
        static getDerivedStateFromError(error) { return { hasError: true, error }; }
        render() {
            if (this.state.hasError) return <div className="p-8 text-center text-red-600"><h2>Crash!</h2><pre>{this.state.error.toString()}</pre><button onClick={()=>window.location.reload()} className="underline">Reload</button></div>;
            return this.props.children;
        }
    }

    const Icons = {
        Print: () => <i className="fa-solid fa-print"></i>,
        Refresh: () => <i className="fa-solid fa-arrows-rotate"></i>,
        Magic: () => <i className="fa-solid fa-wand-magic-sparkles"></i>,
        Check: () => <i className="fa-solid fa-check-double"></i>,
        Left: () => <i className="fa-solid fa-chevron-left"></i>,
        Google: () => <i className="fa-brands fa-google"></i>,
        Image: () => <i className="fa-solid fa-image"></i>,
        Spin: () => <i className="fa-solid fa-circle-notch fa-spin"></i>
    };

    /* --- DYNAMIC COVER PAGE --- */
    const DSECoverPage = ({ subject, year, hasLQ }) => {
        const getSubjectDetails = (s) => {
            const clean = (s || "GENERAL").toLowerCase().trim();
            if (clean.includes('m2') || clean.includes('algebra')) return { title: 'MATHEMATICS Extended Part', sub: 'Module 2 (Algebra and Calculus)', code: 'MATH-EP(M2)' };
            if (clean.includes('m1') || clean.includes('calculus')) return { title: 'MATHEMATICS Extended Part', sub: 'Module 1 (Calculus and Statistics)', code: 'MATH-EP(M1)' };
            if (clean.includes('math')) return { title: 'MATHEMATICS', sub: 'Compulsory Part', code: 'MATH-CP' };
            if (clean.includes('phys')) return { title: 'PHYSICS', sub: '', code: 'PHYSICS' };
            if (clean.includes('chem')) return { title: 'CHEMISTRY', sub: '', code: 'CHEMISTRY' };
            if (clean.includes('bio')) return { title: 'BIOLOGY', sub: '', code: 'BIOLOGY' };
            if (clean.includes('econ')) return { title: 'ECONOMICS', sub: '', code: 'ECONOMICS' };
            return { title: s ? s.toUpperCase() : "GENERAL", sub: '', code: (s ? s.toUpperCase().substring(0, 8) : "GEN") };
        };

        const info = getSubjectDetails(subject);
        const paperTitle = hasLQ ? "Question-Answer Book" : "Question Paper";

        return (
            <div className="paper-preview relative h-[297mm] w-[210mm] overflow-hidden page-break-after">
                {/* Only show marking margin line on cover if it's a QA Book */}
                {hasLQ && <div className="absolute top-0 right-[90mm] w-[1px] h-full bg-black z-0"></div>}
                
                {/* Diagonal Top Left */}
                <div className="absolute top-0 left-0 w-[45mm] h-[45mm] pointer-events-none z-10">
                     <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <line x1="0" y1="100" x2="100" y2="0" stroke="black" strokeWidth="2.5" />
                     </svg>
                     <div className="absolute top-2 left-6 font-bold text-sm leading-tight bg-white p-1">
                        {year}-DSE<br/>
                        {info.code.split('-')[0]}<br/>
                        {info.code.includes('M2') ? 'M2' : ''}
                     </div>
                </div>

                {/* Sidebar Elements - Only for QA Book */}
                {hasLQ && (
                    <div className="absolute top-0 right-0 w-[90mm] h-full pointer-events-none z-10">
                        <div className="absolute top-[15mm] left-[20mm] w-[50mm] h-[28mm] border border-black flex items-center justify-center text-center p-2 bg-white">
                            <span className="font-bold text-xs">Please stick the barcode label here.</span>
                        </div>
                        <div className="absolute top-[50mm] left-[4mm]">
                            <div className="flex items-end">
                                <div className="w-[45mm] h-[8mm] border border-black border-r-0 flex items-center pl-2 bg-white z-10">
                                    <span className="font-bold text-xs">Candidate Number</span>
                                </div>
                                <div className="flex">
                                    {[...Array(8)].map((_, i) => (
                                        <div key={i} className="w-[4.5mm] h-[8mm] border border-black -ml-[1px] bg-white"></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* Main Title Area */}
                <div className={`text-center mt-12 mb-12 px-4 pt-[25mm] ${hasLQ ? 'pr-[95mm] pl-[20mm]' : 'px-[25mm]'}`}>
                    <div className="text-xs font-serif mb-6">
                        HONG KONG EXAMINATIONS AND ASSESSMENT AUTHORITY<br/>
                        HONG KONG DIPLOMA OF SECONDARY EDUCATION EXAMINATION {year}
                    </div>
                    <div className="font-bold text-2xl mb-2">{info.title}</div>
                    {info.sub && <div className="font-bold text-xl mb-2">{info.sub}</div>}
                    <div className="font-bold text-xl mb-8 mt-4">{paperTitle}</div>
                    <div className="text-base font-serif">
                        Time Allowed: 2 hours 30 minutes<br/>
                        This paper must be answered in English
                    </div>
                </div>

                {/* Instructions */}
                <div className={`${hasLQ ? 'pr-[95mm] pl-[20mm]' : 'px-[25mm]'}`}>
                    <div className="font-bold mb-4">INSTRUCTIONS</div>
                    <ol className="list-decimal pl-5 text-sm space-y-3 text-justify font-sans">
                        {hasLQ && <li>Write your Candidate Number in the space provided on Page 1.</li>}
                        {hasLQ && <li>Stick barcode labels in the spaces provided on Pages 1, 3, 5, 7 and 9.</li>}
                        <li>Answer ALL questions.</li>
                        {hasLQ ? (
                            <li>Write your answers in the spaces provided in this Question-Answer Book. Do not write in the margins. Answers written in the margins will not be marked.</li>
                        ) : (
                            <li>Check that this question paper contains all pages.</li>
                        )}
                        <li>Unless otherwise specified, all working must be clearly shown.</li>
                        <li>Unless otherwise specified, numerical answers must be exact.</li>
                    </ol>
                </div>

                {/* QR and Credits - Added as requested */}
                <div className="absolute bottom-[20mm] left-[20mm] flex items-center gap-4 border p-2 border-black bg-white z-20">
                     <img src="https://lh3.googleusercontent.com/d/16ufgMjdObZP_crvaHyMMAtIkRpRmdBtS" className="w-16 h-16 object-contain" />
                     <div className="text-xs font-mono leading-tight">
                        <div className="font-bold">Made with darNote Error Log</div>
                        <div>darNote.3-shot.com</div>
                     </div>
                </div>

                {/* Footer */}
                <div className="absolute bottom-[15mm] right-[20mm] font-bold text-xs">
                    * {year} HKDSE MOCK *
                </div>
            </div>
        );
    };

    const QuestionBlock = ({ item, index, isScheme, type, onSwap, imgFilter }) => {
        let images = isScheme ? (item.sImgs || []) : (item.qImgs || []);
        const hasImages = images && images.length > 0;

        return (
            <div className="question-block group relative mb-6" data-id={item.id}>
                <div className="flex gap-4 items-start">
                    <div className="font-bold text-lg min-w-[30px]">{index + 1}.</div>
                    <div className="flex-1 space-y-4 w-full">
                        {hasImages ? (
                            images.map((src, i) => (
                                <img 
                                    key={i} 
                                    src={src} 
                                    onError={(e) => {e.target.style.display='none'}}
                                    className={`block max-w-[90%] h-auto object-contain border border-transparent ${!isScheme ? imgFilter : ''} rounded-sm my-2`} 
                                />
                            ))
                        ) : (
                            <div className="p-4 border border-dashed border-gray-300 text-gray-400 italic text-sm">
                                {isScheme ? "No marking scheme image uploaded." : (item.questionText || "No question content available.")}
                            </div>
                        )}
                        
                        {isScheme && (
                            <div className="mt-2 text-sm space-y-2">
                                {item.correctAnswer && <div className="bg-gray-100 p-2 rounded inline-block"><strong>Answer:</strong> <span className="font-mono text-lg font-bold">{item.correctAnswer}</span></div>}
                                {item.explanation && (
                                    <div className="bg-yellow-50 p-3 rounded border border-yellow-100">
                                        <div className="font-bold text-yellow-800 text-xs mb-1">NOTES / EXPLANATION:</div>
                                        <div className="whitespace-pre-wrap text-gray-800">{item.explanation}</div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
                {!isScheme && (
                    <button onClick={() => onSwap(index, type)} className="no-print absolute top-0 right-[-40px] p-2 bg-white shadow-md rounded-full text-primary opacity-0 group-hover:opacity-100 transition-opacity z-10 hover:bg-primary hover:text-white" title="Swap Question">
                        <Icons.Refresh />
                    </button>
                )}
            </div>
        );
    };

    const App = () => {
        const [user, setUser] = useState(null);
        const [isFirebaseReady, setIsFirebaseReady] = useState(false);
        const [rawLogs, setRawLogs] = useState([]);
        const [subjects, setSubjects] = useState([]);
        
        // Filters
        const [selectedSubject, setSelectedSubject] = useState('');
        const [selectedTopic, setSelectedTopic] = useState('');
        const [includeMC, setIncludeMC] = useState(true);
        const [includeLQ, setIncludeLQ] = useState(true);

        const [paper, setPaper] = useState({ mc: [], lq: [] });
        const [generatedAt, setGeneratedAt] = useState(null);
        const [printMode, setPrintMode] = useState(null); 
        const [imgFilter, setImgFilter] = useState('');
        const [isGenerating, setIsGenerating] = useState(false);

        // Pagination State
        const [measuredPages, setMeasuredPages] = useState([]);
        const [isCalculatingLayout, setIsCalculatingLayout] = useState(false);
        const measureRef = useRef(null);

        useEffect(() => {
            const check = () => { if(window.firebase?.isReady) setIsFirebaseReady(true); };
            if(!check()) { window.addEventListener('firebase-ready', check); setInterval(check, 500); }
        }, []);

        useEffect(() => {
            if (!isFirebaseReady) return;
            const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, u => {
                if (u) { setUser(u); fetchSubjects(u); } else setUser(null);
            });
            return () => unsub();
        }, [isFirebaseReady]);

        const fetchSubjects = async (u) => {
            try {
                const db = window.firebase.db;
                const snap = await window.firebase.getDocs(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', u.uid, 'subjects'));
                const subs = snap.docs.map(d => ({id: d.id, name: d.data().name||"Unknown", topics: d.data().topics||[]}));
                setSubjects(subs);
                if(subs.length) setSelectedSubject(subs[0].name);
            } catch(e) { console.error(e); }
        };

        const fetchAndGenerate = async () => {
            if (!selectedSubject) return alert("Select a subject!");
            if (!includeMC && !includeLQ) return alert("Select at least one section (MC or LQ)!");

            setIsGenerating(true);
            setGeneratedAt(null);
            setMeasuredPages([]); // Reset pages
            
            try {
                const db = window.firebase.db;
                let constraints = [window.firebase.where('subject', '==', selectedSubject)];
                if (selectedTopic) constraints.push(window.firebase.where('topic', '==', selectedTopic));
                
                const snap = await window.firebase.getDocs(window.firebase.query(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), ...constraints));
                
                const logs = snap.docs.map(d => ({
                    id: d.id, ...d.data(),
                    qImgs: d.data().questionImages || (d.data().imageUrl ? [d.data().imageUrl] : []),
                    sImgs: d.data().schemeImages || (d.data().markingSchemeUrl ? [d.data().markingSchemeUrl] : [])
                }));
                setRawLogs(logs); 

                if (logs.length === 0) { setIsGenerating(false); return alert("No questions found!"); }

                // Filter & Shuffle
                const shuffle = arr => [...arr].sort(() => 0.5 - Math.random());
                
                const mc = includeMC ? shuffle(logs.filter(l => l.questionType === 'MC')).slice(0, 36) : [];
                const lq = includeLQ ? shuffle(logs.filter(l => l.questionType === 'LQ')).slice(0, 16) : [];

                setPaper({ mc, lq });
                setGeneratedAt(new Date());
                setIsCalculatingLayout(true); // Trigger layout calc

            } catch (e) { alert("Error: " + e.message); } finally { setIsGenerating(false); }
        };

        const handleSwap = (idx, type) => {
            const list = type === 'mc' ? paper.mc : paper.lq;
            const pool = rawLogs.filter(l => l.questionType === (type === 'mc' ? 'MC' : 'LQ'));
            const currentIds = new Set(list.map(i => i.id));
            const avail = pool.filter(l => !currentIds.has(l.id));
            if (!avail.length) return alert("No alternatives available.");
            const newList = [...list];
            newList[idx] = avail[Math.floor(Math.random() * avail.length)];
            setPaper(prev => ({ ...prev, [type]: newList }));
            setIsCalculatingLayout(true); // Re-calculate after swap
        };

        // --- PAGINATION LOGIC ---
        useLayoutEffect(() => {
            if (isCalculatingLayout && measureRef.current) {
                // Wait a tiny bit for render
                setTimeout(() => calculatePages(), 100); 
            }
        }, [isCalculatingLayout, paper, printMode]);

        const calculatePages = () => {
            if (!measureRef.current) return;
            
            // Constants in MM (approximate conversion to px)
            // A4 Height = 297mm. Top/Bottom Padding = 25mm + 25mm = 50mm.
            // Usable Height = 247mm.
            // Pixel conversion: 1mm approx 3.78px. 247mm approx 933px.
            const PAGE_HEIGHT_PX = 930; // Safety buffer
            const pages = [];
            let currentPage = [];
            let currentHeight = 0;

            const elements = Array.from(measureRef.current.children);
            
            elements.forEach((el) => {
                const height = el.offsetHeight;
                const type = el.getAttribute('data-type'); // 'header', 'mc', 'lq', 'section-title'
                const dataIndex = parseInt(el.getAttribute('data-index'));
                const isItem = type === 'mc' || type === 'lq';

                // If single item is huge, it must go on a new page anyway.
                // If adding this item exceeds height, push old page and start new.
                if (currentHeight + height > PAGE_HEIGHT_PX && currentPage.length > 0) {
                    pages.push(currentPage);
                    currentPage = [];
                    currentHeight = 0;
                }

                // Push simplified representation for rendering
                currentPage.push({
                    type,
                    item: isItem ? (type === 'mc' ? paper.mc[dataIndex] : paper.lq[dataIndex]) : null,
                    index: dataIndex,
                    content: el.innerHTML // Just in case we need raw HTML, but we prefer react render
                });
                currentHeight += height;
            });

            if (currentPage.length > 0) pages.push(currentPage);

            setMeasuredPages(pages);
            setIsCalculatingLayout(false);
        };

        const currentYear = new Date().getFullYear();
        const hasLQ = paper.lq.length > 0;
        
        // Dynamic layout class for measuring container
        const measureLayoutClass = (hasLQ && printMode !== 'scheme') ? 'layout-qa' : 'layout-std';

        if (!isFirebaseReady) return <div className="h-screen flex items-center justify-center text-gray-500 font-medium"><div className="animate-spin w-6 h-6 border-2 border-primary border-t-transparent rounded-full mr-3"></div> Connecting...</div>;

        if (!user) return (
            <div className="h-screen w-full flex items-center justify-center bg-white flex-col gap-6 relative overflow-hidden">
                <div className="z-10 flex flex-col items-center">
                    <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-16 h-16 mb-6 rounded-2xl shadow-sm"/>
                    <h1 className="text-3xl font-bold text-dark tracking-tight font-sans mb-3">Exam Factory</h1>
                    <p className="text-sm text-gray-500 max-w-sm text-center mb-8">Sign in to access your error logs and generate mock papers.</p>
                    <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-primary text-white px-8 py-3 rounded-full font-medium flex gap-3 items-center hover:bg-blue-600 transition-all shadow-md hover:shadow-lg justify-center text-sm">
                        <Icons.Google /> Continue with Google
                    </button>
                </div>
            </div>
        );

        return (
            <div className="flex flex-col md:flex-row min-h-screen">
                
                {/* --- HIDDEN MEASURING LAYER --- */}
                {/* This renders everything in one long strip to measure heights */}
                <div id="measure-container" ref={measureRef} className={`bg-white ${measureLayoutClass}`}>
                     {/* We render structure based on print mode to measure accurately */}
                     {(printMode === 'question' || printMode === null) ? (
                        <>
                             {includeMC && paper.mc.length > 0 && (
                                <div data-type="section-title" className="font-bold text-lg mb-6 border-b-2 border-black pb-2">Section A: Multiple Choice</div>
                             )}
                             {includeMC && paper.mc.map((q, i) => (
                                <div key={`mc-${i}`} data-type="mc" data-index={i}>
                                    <QuestionBlock item={q} index={i} isScheme={false} type="mc" onSwap={()=>{}} imgFilter={imgFilter} />
                                </div>
                             ))}
                             {includeLQ && paper.lq.length > 0 && (
                                <div data-type="section-title" className="font-bold text-lg mb-6 border-b-2 border-black pb-2 mt-8">Section B: Long Questions</div>
                             )}
                             {includeLQ && paper.lq.map((q, i) => (
                                <div key={`lq-${i}`} data-type="lq" data-index={i}>
                                    <QuestionBlock item={q} index={i} isScheme={false} type="lq" onSwap={()=>{}} imgFilter={imgFilter} />
                                </div>
                             ))}
                             <div data-type="end-marker" className="text-center font-bold mt-16 mb-8 text-sm">END OF PAPER</div>
                        </>
                     ) : (
                        // Scheme Mode Measurement
                        <>
                            <div data-type="header" className="text-center font-bold text-xl mb-8 underline uppercase">Marking Scheme</div>
                             {includeMC && paper.mc.length > 0 && (
                                <div data-type="section-title" className="font-bold text-lg mb-6">Section A: MC Answers</div>
                             )}
                             {/* MC Answer Grid - Measure as one block usually, but let's just dump it */}
                             {includeMC && paper.mc.length > 0 && (
                                 <div data-type="mc-grid" className="grid grid-cols-4 gap-4 mb-8">
                                     {paper.mc.map((q, i) => (
                                         <div key={i} className="flex gap-2 text-sm border-b border-gray-100 pb-1">
                                             <span className="font-bold w-6">{i+1}.</span>
                                             <span className="font-mono">{q.correctAnswer || '-'}</span>
                                         </div>
                                     ))}
                                 </div>
                             )}
                             {includeLQ && paper.lq.map((q, i) => (
                                <div key={`lq-${i}`} data-type="lq" data-index={i}>
                                    <QuestionBlock item={q} index={i} isScheme={true} type="lq" />
                                </div>
                             ))}
                        </>
                     )}
                </div>

                {/* SIDEBAR CONTROLS */}
                <div className="w-full md:w-80 bg-white border-r border-gray-200 p-6 flex flex-col gap-6 fixed md:sticky top-0 h-screen overflow-y-auto no-print shadow-xl z-20">
                    <div className="flex items-center gap-3">
                        <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-8 h-8 rounded-lg"/>
                        <h1 className="font-bold text-lg text-dark">Exam Factory</h1>
                    </div>

                    <div className="space-y-4">
                        <div>
                            <label className="text-xs font-bold text-secondary uppercase block mb-1">Subject</label>
                            <select value={selectedSubject} onChange={e=>setSelectedSubject(e.target.value)} className="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm">
                                <option value="">Select Subject</option>
                                {subjects.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="text-xs font-bold text-secondary uppercase block mb-1">Topic</label>
                            <select value={selectedTopic} onChange={e=>setSelectedTopic(e.target.value)} className="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm">
                                <option value="">All Topics</option>
                                {selectedSubject && subjects.find(s=>s.name===selectedSubject)?.topics?.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>

                        {/* SECTION SELECTORS */}
                        <div className="bg-gray-50 p-3 rounded-lg border border-gray-200">
                            <label className="text-xs font-bold text-secondary uppercase block mb-2">Sections</label>
                            <div className="flex gap-4">
                                <label className="flex items-center gap-2 text-sm cursor-pointer">
                                    <input type="checkbox" checked={includeMC} onChange={e=>setIncludeMC(e.target.checked)} className="rounded text-primary focus:ring-primary"/>
                                    Include MC
                                </label>
                                <label className="flex items-center gap-2 text-sm cursor-pointer">
                                    <input type="checkbox" checked={includeLQ} onChange={e=>setIncludeLQ(e.target.checked)} className="rounded text-primary focus:ring-primary"/>
                                    Include LQ
                                </label>
                            </div>
                        </div>
                        
                        <div>
                            <label className="text-xs font-bold text-secondary uppercase block mb-1">Image Filter</label>
                            <button onClick={()=>setImgFilter(f => f===''?'filter-bw':f==='filter-bw'?'filter-high-contrast':'')} className="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm flex justify-between">
                                <span>{imgFilter === '' ? 'Original' : (imgFilter === 'filter-bw' ? 'B&W Clean' : 'High Contrast')}</span>
                                <Icons.Image />
                            </button>
                        </div>

                        <button onClick={fetchAndGenerate} disabled={isGenerating} className="w-full py-3 bg-primary text-white rounded-xl font-bold hover:bg-blue-600 shadow-md flex justify-center gap-2 disabled:opacity-70">
                            {isGenerating ? 'Fetching...' : <><Icons.Magic /> Generate</>}
                        </button>
                    </div>

                    {generatedAt && (
                        <div className="border-t border-gray-200 pt-6 space-y-3">
                            <div className="text-center mb-2">
                                <div className="text-sm font-bold text-dark">Paper Ready</div>
                                <div className="text-xs text-gray-500">{paper.mc.length} MC · {paper.lq.length} LQ</div>
                            </div>
                            <button onClick={() => { setPrintMode('question'); setIsCalculatingLayout(true); }} className={`w-full py-2 ${printMode !== 'scheme' ? 'bg-dark text-white' : 'bg-white border text-dark'} rounded-lg text-sm flex justify-center gap-2`}>
                                <Icons.Print /> Preview Question Paper
                            </button>
                            <button onClick={() => { setPrintMode('scheme'); setIsCalculatingLayout(true); }} className={`w-full py-2 ${printMode === 'scheme' ? 'bg-dark text-white' : 'bg-white border text-dark'} rounded-lg text-sm flex justify-center gap-2`}>
                                <Icons.Check /> Preview Marking Scheme
                            </button>
                            
                            <div className="flex gap-2 mt-2">
                                <button onClick={()=>window.print()} className="flex-1 py-2 bg-accent text-white rounded-lg text-sm font-bold hover:bg-green-600 shadow">
                                    <Icons.Print /> Print Now
                                </button>
                                <button onClick={()=>setIsCalculatingLayout(true)} className="w-10 py-2 bg-gray-200 text-gray-600 rounded-lg text-sm hover:bg-gray-300" title="Recalculate Layout">
                                    <Icons.Refresh />
                                </button>
                            </div>
                        </div>
                    )}
                    
                    <div className="mt-auto pt-4 border-t border-gray-200">
                        <a href="el.html" className="flex items-center gap-2 text-sm text-gray-600 hover:text-primary transition-colors">
                            <Icons.Left /> Back to Error Log
                        </a>
                    </div>
                </div>

                {/* PREVIEW AREA */}
                <div id="preview-scroller" className="flex-1 bg-gray-200 p-8 overflow-y-auto h-screen">
                    {!generatedAt ? (
                        <div className="h-full flex flex-col items-center justify-center text-gray-400">
                            <i className="fa-solid fa-print text-6xl mb-4 opacity-20"></i>
                            <p>Configure and generate to preview.</p>
                        </div>
                    ) : (
                        <div id="preview-wrapper" className="w-fit mx-auto pb-20">
                            
                            {/* 1. Cover Page (Only in Question Mode) */}
                            {printMode !== 'scheme' && (
                                <DSECoverPage subject={selectedSubject} year={currentYear} hasLQ={hasLQ} />
                            )}

                            {/* 2. Content Pages */}
                            {isCalculatingLayout ? (
                                <div className="text-center p-12 text-gray-500">
                                    <Icons.Spin /> Calculating Layout & Pagination...
                                </div>
                            ) : (
                                measuredPages.map((pageContent, pageIdx) => (
                                    <div 
                                        key={pageIdx} 
                                        className={`paper-preview ${printMode === 'scheme' ? 'layout-std' : measureLayoutClass} dse-content-padding bg-white relative overflow-hidden`}
                                    >
                                        <div className="h-full flex flex-col">
                                            {/* Render Page Items */}
                                            {pageContent.map((block, i) => {
                                                if (block.type === 'section-title') return <div key={i} className="font-bold text-lg mb-6 border-b-2 border-black pb-2">{printMode === 'scheme' ? 'Section A: MC Answers' : (block.content.includes('Multiple') ? 'Section A: Multiple Choice' : 'Section B: Long Questions')}</div>;
                                                if (block.type === 'end-marker') return <div key={i} className="text-center font-bold mt-16 mb-8 text-sm">END OF PAPER</div>;
                                                if (block.type === 'header') return <div key={i} className="text-center font-bold text-xl mb-8 underline uppercase">{block.content}</div>;
                                                if (block.type === 'mc-grid') {
                                                    // Re-render MC grid
                                                     return (
                                                         <div key={i} className="grid grid-cols-4 gap-4 mb-8">
                                                             {paper.mc.map((q, qIdx) => (
                                                                 <div key={qIdx} className="flex gap-2 text-sm border-b border-gray-100 pb-1">
                                                                     <span className="font-bold w-6">{qIdx+1}.</span>
                                                                     <span className="font-mono">{q.correctAnswer || '-'}</span>
                                                                 </div>
                                                             ))}
                                                         </div>
                                                     );
                                                }
                                                // Questions
                                                return (
                                                    <QuestionBlock 
                                                        key={`${block.type}-${block.index}`} 
                                                        item={block.item} 
                                                        index={block.index} 
                                                        isScheme={printMode === 'scheme'} 
                                                        type={block.type} 
                                                        onSwap={handleSwap} 
                                                        imgFilter={imgFilter} 
                                                    />
                                                );
                                            })}
                                        </div>

                                        {/* Footer: Page Number (Content starts at 1) */}
                                        <div className="absolute bottom-[15mm] left-[50%] -translate-x-1/2 text-xs font-bold">
                                            Page {pageIdx + 1}
                                        </div>
                                        <div className="absolute bottom-[15mm] right-[20mm] font-bold text-xs print-footer">
                                            * {currentYear} HKDSE MOCK *
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
