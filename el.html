        // --- GEMINI PROXY ---
        const callGemini = async (prompt, systemInstruction = "", imageBase64 = null) => {
            const proxyUrl = GEMINI_PROXY_URL;
            const parts = [{ text: `${systemInstruction}\n\nUser: ${prompt}` }];
            if (imageBase64) {
                let mimeType = "image/png"; let data = imageBase64;
                if (imageBase64.includes(",")) { 
                    const s = imageBase64.split(","); mimeType = s[0].match(/:(.*?);/)[1]; data = s[1]; 
                }
                parts.push({ inlineData: { mimeType, data } });
            }
            try {
                const response = await fetch(proxyUrl, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ contents: [{ parts }] }) 
                });
                
                if (!response.ok) return `Error: API Request Failed (${response.status})`;
                const data = await response.json();
                if (data.error) return `API Error: ${data.error.message}`;
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Error: Empty response.";
            } catch (error) { return `Error: ${error.message}`; }
        };

        // --- SMART QUOTA MANAGER ---
        const checkAndIncrementQuota = async (user, type) => {
            if (!user) return false;
            const limits = { chat: 5, practice: 10, ocr: 20 };
            const fieldMap = { chat: 'chat_count', practice: 'practice_count', ocr: 'ocr_count' };
            
            const limit = limits[type]; const field = fieldMap[type];
            if (!limit || !field) return false;

            const today = new Date().toISOString().split('T')[0];
            const ref = window.firebase.doc(
                window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today
            );
            
            try {
                const snap = await window.firebase.getDoc(ref);
                let count = snap.exists() ? (snap.data()[field] || 0) : 0;
                if (count >= limit) return false;
                
                await window.firebase.setDoc(
                    ref, { [field]: window.firebase.increment(1) }, { merge: true }
                );
                return count + 1; 
            } catch (e) { console.error("Quota check failed:", e); return false; }
        };

        // --- GDRIVE HOOK ---
        const useGoogleDrive = () => {
            const [tokenClient, setTokenClient] = useState(null);
            useEffect(() => {
                if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return;
                const load = async () => {
                    try {
                        if (window.gapi) { 
                            await new Promise(r => window.gapi.load('client', r)); 
                            await window.gapi.client.init({ 
                                apiKey: GDRIVE_API_KEY, 
                                discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] 
                            }); 
                        }
                        if (window.google) setTokenClient(
                            window.google.accounts.oauth2.initTokenClient({ 
                                client_id: GDRIVE_CLIENT_ID, 
                                scope: 'https://www.googleapis.com/auth/drive.file', callback: () => {} 
                            })
                        );
                    } catch(e) { console.error("Drive API Init Failed:", e); }
                };
                load();
            }, []);
            const saveToDrive = async (blob, filename) => {
                // Simplified for brevity - assumes logic works from previous version
                // In a real refactor, would keep full logic. Kept as provided in v1.
                try {
                    const token = await new Promise((resolve, reject) => {
                        if (!tokenClient) return reject("Auth not initialized");
                        const existing = window.gapi.client.getToken();
                        if (existing && Date.now() < existing.expiry) return resolve(existing.access_token);
                        tokenClient.callback = (resp) => { 
                            if (resp.error) reject(resp); resolve(resp.access_token); 
                        };
                        tokenClient.requestAccessToken({ prompt: '' });
                    });
                    
                    // Folder Search/Create
                    let folderId;
                    const q = `mimeType='application/vnd.google-apps.folder' and name='darNote_Errors' and trashed=false`;
                    const search = await fetch(
                        `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, 
                        { headers: { Authorization: `Bearer ${token}` } }
                    );
                    const searchData = await search.json();
                    if (searchData.files?.length) folderId = searchData.files[0].id;
                    else {
                        const create = await fetch(
                            'https://www.googleapis.com/drive/v3/files', 
                            { 
                                method: 'POST', 
                                headers: { 
                                    Authorization: `Bearer ${token}`, 
                                    'Content-Type': 'application/json' 
                                }, 
                                body: JSON.stringify({ 
                                    name: 'darNote_Errors', 
                                    mimeType: 'application/vnd.google-apps.folder' 
                                }) 
                            }
                        );
                        folderId = (await create.json()).id;
                    }
                    
                    const metadata = { name: filename, mimeType: blob.type, parents: [folderId] };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', blob);
                    const upRes = await fetch(
                        'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', 
                        { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form }
                    );
                    if(!upRes.ok) throw new Error(upRes.statusText);
                    const fileId = (await upRes.json()).id;
                    await fetch(
                        `https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, 
                        { 
                            method: 'POST', 
                            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, 
                            body: JSON.stringify({ role: 'reader', type: 'anyone' }) 
                        }
                    );
                    return `https://lh3.googleusercontent.com/d/${fileId}`;
                } catch (e) { console.error("Drive Upload Error:", e); throw e; }
            };
            return { saveToDrive };
        };

        const Lightbox = ({ images, initialIndex, onClose }) => {
            const [index, setIndex] = useState(initialIndex);
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowRight') setIndex((prev) => (prev + 1) % images.length);
                    if (e.key === 'ArrowLeft') setIndex((prev) => (prev - 1 + images.length) % images.length);
                };
                window.addEventListener('keydown', handleKeyDown); 
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [images.length, onClose]);
            if (!images || images.length === 0) return null;
            return (
                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} 
                    className="fixed inset-0 z-[60] bg-black/95 flex items-center justify-center backdrop-blur-sm">
                    <button onClick={onClose} className="absolute top-4 right-4 text-white p-2 rounded-full hover:bg-white/10">
                        <Icons.X className="w-8 h-8"/>
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); setIndex((prev) => (prev - 1 + images.length) % images.length); }}

                        <Icons.ChevronLeft className="w-8 h-8"/>
                    </button>

                        <Icons.ChevronRight className="w-8 h-8"/>
                    </button>

                    </div>

                }); 
            };
            const handlePaste = async () => { 
                try { 
                    const items = await navigator.clipboard.read(); 
                    for (const item of items) { 
                        for (const type of item.types) { 
                            if (type.startsWith("image/")) { 
                                const blob = await item.getType(type); onUpdate(blob, 'add'); 
                            } 
                        } 
                    } 
                } catch (err) { alert("No image found in clipboard."); } 
            };
            
            return (

            useEffect(() => {

            const generate = async () => {

                setQuota(newQuota);

                                            if(marked) { if(cor) bg="bg-green-500/20 border-green-500"; else if(sel) bg="bg-red-500/20 border-red-500"; } 
                                            else if(sel) bg="bg-brand/10 border-brand";
                                            return <button key={opt} onClick={()=>!marked&&setUserAnswers({...userAnswers, [i]:letter})} className={`text-left p-3 rounded-lg border text-sm ${bg}`}>{opt}</button>

                                            {marked && lqFeedback?.partFeedback[p.id] && <div className={`text-xs p-2 rounded flex justify-between ${lqFeedback.partFeedback[p.id].score===p.marks?'bg-green-500/10 text-green-500':'bg-red-500/10 text-red-400'}`}><span>{lqFeedback.partFeedback[p.id].comment}</span><span>{lqFeedback.partFeedback[p.id].score}/{p.marks}</span></div>}

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [subjects, setSubjects] = useState([]);
            const [activeLogId, setActiveLogId] = useState(() => new URLSearchParams(window.location.search).get('log'));
            
            // FILTERS & SORT

            const [searchQuery, setSearchQuery] = useState('');
            const [typeFilter, setTypeFilter] = useState('ALL'); // ALL, MC, LQ

            const { saveToDrive } = useGoogleDrive();
            const hoverTimeoutRef = useRef(null);

            const saveTimeoutRef = useRef(null);

            useEffect(() => {
                const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, async (u) => {
                    if (u) {
                        setUser(u);
                        // Fetch Subjects
                        window.firebase.getDocs(
                            window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', u.uid, 'subjects')
                        ).then(snap => setSubjects(snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=>a.name.localeCompare(b.name))));
                    } else setUser(null);
                });
                return () => unsub();
            }, []);

            useEffect(() => { document.documentElement.classList.toggle('dark', isDarkMode); }, [isDarkMode]);
            useEffect(() => { 
                const url = new URL(window.location); 
                if (activeLogId) url.searchParams.set('log', activeLogId); else url.searchParams.delete('log'); 
                window.history.pushState({}, '', url); 
            }, [activeLogId]);
            useEffect(() => { const h = () => setContextMenu({ ...contextMenu, visible: false }); window.addEventListener('click', h); return () => window.removeEventListener('click', h); }, [contextMenu]);

            // --- SERVER SIDE FILTER FETCH ---
            const fetchLogs = async (isLoadMore = false, uid = user?.uid) => {
                if (!uid) return;
                setIsLoadingLogs(true);
                try {
                    const db = window.firebase.db;
                    const logsRef = window.firebase.collection(db, 'artifacts', "darnote-app", 'users', uid, 'error_logs');
                    let q = window.firebase.query(logsRef);

                    // 1. Sidebar Filters (Subject/Mastery)
                    if (filter === 'active') {
                        q = window.firebase.query(q, window.firebase.where('mastered', '==', false));
                    } else if (filter === 'mastered') {
                        q = window.firebase.query(q, window.firebase.where('mastered', '==', true));
                    } else if (filter.startsWith('subject:')) {
                        const s = filter.split(':')[1];
                        q = window.firebase.query(q, window.firebase.where('subject', '==', s));
                    }

                    // 2. Type Filter
                    if (typeFilter !== 'ALL') {
                        q = window.firebase.query(q, window.firebase.where('questionType', '==', typeFilter));
                    }

                    // 3. Sorting
                    const dir = sortBy === 'date-desc' ? 'desc' : 'asc';
                    q = window.firebase.query(q, window.firebase.orderBy('createdAt', dir));

                    // 4. Pagination
                    if (isLoadMore && lastDoc) q = window.firebase.query(q, window.firebase.startAfter(lastDoc), window.firebase.limit(10));
                    else q = window.firebase.query(q, window.firebase.limit(10));

                    const snapshot = await window.firebase.getDocs(q);
                    const newLogs = snapshot.docs.map(d => {
                        const data = d.data();
                        return { id: d.id, ...data, questionImages: data.questionImages || (data.imageUrl ? [data.imageUrl] : []), schemeImages: data.schemeImages || (data.markingSchemeUrl ? [data.markingSchemeUrl] : []) };

                    if (isLoadMore) setLogs(prev => [...prev, ...newLogs]);
                    else setLogs(newLogs);

                    setLastDoc(snapshot.docs[snapshot.docs.length - 1]);
                    setHasMore(snapshot.docs.length === 10);

                        console.error("🔥 FIRESTORE INDEX MISSING! Click the link above to create it.");

                setIsLoadingLogs(false);

            // Trigger Fetch on Filters Change
            useEffect(() => { if(user) { setLastDoc(null); setLogs([]); fetchLogs(false); } }, [user, filter, typeFilter, sortBy]);

            const createLog = async () => {
                const newLog = { title: 'Untitled Mistake', subject: 'General', topic: '', questionImages: [], schemeImages: [], questionType: 'MC', correctAnswer: '', marks: '', explanation: '', mastered: false, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() };
                const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog);
                setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); setActiveLogId(docRef.id);
            };

            const updateLog = (id, updates) => {
                const ts = { ...updates, lastModified: new Date().toISOString() };
                setLogs(prev => prev.map(l => l.id === id ? { ...l, ...ts } : l));
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                pendingUpdatesRef.current[id] = { ...(pendingUpdatesRef.current[id] || {}), ...ts };
                saveTimeoutRef.current = setTimeout(async () => {
                    const ids = Object.keys(pendingUpdatesRef.current);
                    for (const logId of ids) {
                        const payload = pendingUpdatesRef.current[logId]; delete pendingUpdatesRef.current[logId];
                        await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', logId), payload);
                    }
                }, 2000);
            };

            // UTILS
            const handleDuplicate = async (id) => { const org = logs.find(l => l.id === id); if (!org) return; const { id: _, ...d } = org; const n = { ...d, title: `${d.title} (Copy)`, createdAt: new Date().toISOString() }; const ref = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), n); setLogs(p => [{...n, id: ref.id}, ...p]); };
            const handleDelete = async (id) => { if(!confirm("Delete?")) return; setLogs(p => p.filter(l => l.id !== id)); if (activeLogId === id) setActiveLogId(null); await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', id)); };
            const handleImageUpdate = async (data, action, type) => {
                if (!activeLogId) return;
                const isQ = type === 'question'; const setS = isQ ? setUploadingQ : setUploadingS; const f = isQ ? 'questionImages' : 'schemeImages'; const cur = isQ ? activeLog.questionImages : activeLog.schemeImages;
                if (action === 'remove') { updateLog(activeLogId, { [f]: cur.filter((_, i) => i !== data) }); return; }
                setS(true);
                try {
                    const blob = data instanceof Blob ? data : new Blob([data]); 
                    const url = await saveToDrive(blob, `ErrorLog_${type}_${Date.now()}.png`);
                    updateLog(activeLogId, { [f]: [...cur, url] });
                } catch(e) { alert("Upload Failed"); } setS(false);
            };
            const handleAutoTitle = async () => {
                if (!activeLog.questionImages?.length) return; 
                const nq = await checkAndIncrementQuota(user, 'ocr'); if (!nq) return alert("Limit!");
                try {
                    let url = activeLog.questionImages[0];
                    if(!url.startsWith('data:')) { const r = await fetch(url); const b = await r.blob(); url = await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b);}); }
                    const t = await callGemini("Analyze image. Identify core concept. Generate SHORT title (max 6 words).", "Summarizer", url);
                    updateLog(activeLogId, { title: t.replace(/^["']|["']$/g, '').trim() });
                } catch(e) {}
            };

            const activeLog = logs.find(l => l.id === activeLogId);
            // Client side text search only now
            const filteredLogs = logs.filter(l => (l.title || '').toLowerCase().includes(searchQuery.toLowerCase()));
            const currentSub = activeLog ? subjects.find(s=>s.name===activeLog.subject) : null;

            if (!user) return (
                <div className="h-screen w-full flex items-center justify-center bg-zinc-950 text-white flex-col gap-6">
                    <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-20 h-20 mb-4 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]"/>
                    <h1 className="text-3xl font-bold">darNote Error Log</h1>
                    <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-white text-black px-8 py-3 rounded-full font-bold flex gap-2 items-center hover:scale-105 transition-transform shadow-xl w-64 justify-center"><Icons.Google className="w-5 h-5"/> Sign In</button>
                </div>
            );

            return (
                <div className={`flex h-screen w-full transition-colors duration-300 ${isDarkMode ? 'dark bg-onyx' : 'bg-[#f4f4f5]'}`}>
                    <ContextMenu visible={contextMenu.visible} x={contextMenu.x} y={contextMenu.y} logId={contextMenu.logId} onDuplicate={handleDuplicate} onDelete={handleDelete} onCopy={()=>{}} onPaste={()=>{}}/>
                    <AnimatePresence>{previewLog && (
                        <div className="fixed z-[100] top-0 bottom-0 left-[340px] pointer-events-none flex flex-col justify-center p-4">
                            <motion.div initial={{ opacity: 0, x: -20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0 }} className="bg-white dark:bg-zinc-900 border rounded-xl shadow-2xl p-2 max-w-lg">
                                <img src={previewLog.questionImages?.[0]} className="rounded-lg object-contain max-h-[60vh] bg-zinc-100 dark:bg-black/50" />
                            </motion.div>
                        </div>
                    )}</AnimatePresence>

                    {/* SIDEBAR */}
                    <div className="w-[260px] flex-shrink-0 glass-panel flex flex-col justify-between p-5 z-20 hidden md:flex">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-1"><img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-8 h-8"/><div><div className="font-bold text-sm text-zinc-900 dark:text-white">darNote</div><div className="text-[10px] text-zinc-500 uppercase">Error Log</div></div></div>
                            <nav className="space-y-1">
                                <a href="note.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5"><Icons.Book className="w-4 h-4"/> Back to Notes</a>
                                {[{id: 'all', icon: Icons.Bug, label: 'All Errors'}, {id: 'active', icon: Icons.X, label: 'Needs Review'}, {id: 'mastered', icon: Icons.Check, label: 'Mastered'}].map(item => (<button key={item.id} onClick={()=>setFilter(item.id)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${filter===item.id ? 'bg-zinc-200 dark:bg-white/10 text-zinc-900 dark:text-white' : 'text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5'}`}><item.icon className="w-4 h-4"/> {item.label}</button>))}
                            </nav>
                            <div className="pt-4 border-t border-zinc-200 dark:border-white/10"><div className="px-2 text-[10px] font-bold text-zinc-400 mb-2 uppercase">Subjects</div><div className="space-y-0.5 max-h-[250px] overflow-y-auto">{subjects.map(s => (<button key={s.id} onClick={()=>setFilter(`subject:${s.name}`)} className="w-full text-left px-3 py-2 rounded-lg text-sm text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5">{s.name}</button>))}</div></div>
                        </div>
                        <div className="space-y-3 pt-4 border-t border-zinc-200 dark:border-white/10"><div className="flex items-center gap-3 px-2 py-1"><img src={user.photoURL} className="w-8 h-8 rounded-full"/><div className="text-xs font-bold text-zinc-900 dark:text-white truncate w-32">{user.displayName}</div></div><div className="flex gap-2"><button onClick={()=>setIsDarkMode(!isDarkMode)} className="flex-1 btn-ghost py-2 rounded-lg text-xs border border-zinc-200 dark:border-white/5">{isDarkMode ? 'Light' : 'Dark'}</button><button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="px-3 btn-ghost py-2 rounded-lg text-red-500"><Icons.Logout className="w-4 h-4"/></button></div></div>
                    </div>

                    {/* LIST */}
                    <div className="w-[320px] flex-shrink-0 border-r border-zinc-200 dark:border-white/5 bg-white dark:bg-surface flex flex-col z-10 shadow-lg">
                        <div className="p-4 border-b border-zinc-200 dark:border-white/5 space-y-3 bg-white dark:bg-surface">
                            <div className="flex gap-2">
                                <input type="text" placeholder="Search..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="input-field pl-9 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNzE3MTdhIiBzdHJva2Utd2lkdGg9IjIiPjxjaXJjbGUgY3g9IjExIiBjeT0iMTEiIHI9IjgiLz48cGF0aCBkPSJtMjEgMjEtNC4zLTQuMyIvPjwvc3ZnPg==')] bg-no-repeat bg-[length:16px] bg-[12px_center]"/>
                                <div className="relative">
                                    <button onClick={()=>setShowSortMenu(!showSortMenu)} className={`p-2 rounded-lg border hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter !== 'ALL' ? 'text-brand border-brand' : 'text-zinc-500 border-zinc-200 dark:border-white/10'}`}><Icons.Sort className="w-4 h-4"/></button>
                                    {showSortMenu && (
                                        <div className="absolute right-0 top-full mt-2 w-40 bg-white dark:bg-zinc-800 border rounded-lg shadow-xl z-50 py-1">
                                            <div className="px-3 py-1 text-[10px] font-bold text-zinc-400 uppercase">Sort Order</div>
                                            <button onClick={()=>{setSortBy('date-desc'); setShowSortMenu(false)}} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5">Date (Newest)</button>
                                            <button onClick={()=>{setSortBy('date-asc'); setShowSortMenu(false)}} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5">Date (Oldest)</button>
                                            <div className="h-px bg-zinc-200 dark:bg-white/10 my-1"></div>
                                            <div className="px-3 py-1 text-[10px] font-bold text-zinc-400 uppercase">Type Filter</div>
                                            {['ALL', 'MC', 'LQ'].map(t => <button key={t} onClick={()=>{setTypeFilter(t); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter===t?'font-bold text-brand':''}`}>{t}</button>)}
                                        </div>
                                    )}
                                </div>
                            </div>
                            <button onClick={createLog} className="w-full bg-brand text-white py-2.5 rounded-lg font-bold text-sm hover:bg-indigo-600 shadow-lg flex justify-center gap-2"><Icons.Plus className="w-4 h-4"/> Log New Error</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-2">
                            {filteredLogs.map(l => (
                                <motion.div key={l.id} onClick={()=>setActiveLogId(l.id)} onContextMenu={(e) => {e.preventDefault(); setContextMenu({ visible: true, x: e.clientX, y: e.clientY, logId: l.id })}} onMouseEnter={() => { if(l.questionImages?.length) setPreviewLog(l); }} onMouseLeave={() => setPreviewLog(null)} className={`p-3.5 rounded-xl cursor-pointer border transition-all ${activeLogId===l.id ? 'bg-zinc-100 dark:bg-white/10 border-zinc-300 dark:border-white/20' : 'bg-transparent border-transparent hover:bg-zinc-50 dark:hover:bg-white/5'}`}>
                                    <div className="flex justify-between items-start mb-1"><div className="font-semibold text-sm truncate pr-2 text-zinc-800 dark:text-zinc-200 w-full">{l.title}</div>{l.mastered && <Icons.Check className="w-4 h-4 text-green-500"/>}</div>
                                    <div className="flex justify-between items-center mt-2"><div className="flex gap-2"><span className="text-[10px] font-medium px-2 py-0.5 rounded bg-zinc-200 dark:bg-white/10 text-zinc-600 dark:text-zinc-400">{l.subject}</span><span className="text-[10px] px-2 py-0.5 rounded border border-zinc-200 dark:border-white/10 text-zinc-500">{l.questionType}</span></div><span className={`text-[10px] font-bold ${l.mastered ? 'text-green-600' : 'text-red-500'}`}>{l.mastered ? 'SOLVED' : 'REVIEW'}</span></div>
                                </motion.div>
                            ))}
                            {hasMore && !isLoadingLogs && <button onClick={() => fetchLogs(true)} className="w-full py-2 text-xs text-indigo-500 font-bold mt-2 border border-dashed rounded-lg hover:bg-zinc-50 dark:hover:bg-white/5">Load More (+10)</button>}
                            {isLoadingLogs && <div className="text-center text-zinc-400 py-4 text-xs animate-pulse">Loading Logs...</div>}
                        </div>
                    </div>

                    {/* EDITOR */}
                    <main className="flex-1 flex flex-col min-w-0 bg-[#f4f4f5] dark:bg-onyx relative transition-colors duration-300">
                        {activeLog ? (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col h-full">
                                <header className="h-16 flex items-center justify-between px-6 border-b border-zinc-200 dark:border-white/5 bg-white dark:bg-surface shrink-0 z-10">
                                    <div className="flex-1 flex items-center gap-2 mr-4">
                                        <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-xl font-bold outline-none w-full text-zinc-900 dark:text-white placeholder-zinc-400"/>
                                        <button onClick={handleAutoTitle} className="px-3 py-1.5 rounded-lg text-xs font-bold bg-zinc-100 dark:bg-white/10 hover:bg-brand hover:text-white transition-all flex gap-1"><Icons.Scan className="w-3 h-3"/> Auto-Title</button>
                                        <button onClick={() => setIsPracticeOpen(true)} className="px-3 py-1.5 rounded-lg text-xs font-bold bg-zinc-100 dark:bg-white/10 hover:bg-orange-500 hover:text-white transition-all flex gap-1"><Icons.Brain className="w-3 h-3"/> Practice</button>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-1.5 rounded-full text-xs font-bold border ${activeLog.mastered ? 'bg-green-500/10 border-green-500 text-green-600' : 'bg-red-500/10 border-red-500 text-red-600'}`}>{activeLog.mastered ? 'Mastered' : 'Needs Review'}</button>
                                        <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className="p-2 rounded-lg bg-brand/10 text-brand"><Icons.Bot className="w-5 h-5"/></button>
                                        <button onClick={() => handleDelete(activeLog.id)} className="p-2 rounded-lg hover:bg-red-50 text-zinc-400 hover:text-red-500"><Icons.Trash className="w-5 h-5"/></button>
                                    </div>
                                </header>
                                <div className="flex-1 overflow-y-auto p-6 md:p-10 scroll-smooth">
                                    <div className="max-w-5xl mx-auto space-y-8">
                                        <div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5 grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Subject</label><select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select></div>
                                            <div><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Topic</label><input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20" placeholder="Topic"/></div>
                                            <div><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Type</label><div className="flex bg-zinc-100 dark:bg-black/20 p-1 rounded-lg border border-zinc-200 dark:border-white/5">{['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-zinc-700 shadow-sm text-black dark:text-white' : 'text-zinc-500'}`}>{t}</button>))}</div></div>
                                        </div>
                                        <div className="space-y-6">
                                            <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label="Question Evidence" isUploading={uploadingQ}/>
                                            <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Marking Scheme" isUploading={uploadingS}/>
                                        </div>
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            <div className="lg:col-span-1 space-y-6"><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Correct Answer</label><input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-green-50 dark:bg-green-900/10 border border-green-200 dark:border-green-900/30 rounded-lg px-4 py-3 font-mono text-lg font-bold text-green-700 dark:text-green-400 focus:outline-none"/></div><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Marks Lost</label><input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 rounded-lg px-4 py-3 font-bold text-red-700 dark:text-red-400 focus:outline-none"/></div></div>
                                            <div className="lg:col-span-2 bg-white dark:bg-surface rounded-2xl border border-zinc-200 dark:border-white/5 shadow-sm overflow-hidden flex flex-col min-h-[250px]"><div className="px-5 py-3 border-b border-zinc-200 dark:border-white/5 bg-zinc-50/50 dark:bg-white/5 flex justify-between items-center"><span className="text-xs font-bold text-zinc-500 uppercase tracking-wider">Analysis / Logic Gap</span></div><textarea className="flex-1 w-full p-5 bg-transparent outline-none resize-none text-sm leading-7 text-zinc-700 dark:text-zinc-300" placeholder="Why did I fail?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/></div>
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-zinc-400 h-full">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center"><div className="w-20 h-20 bg-zinc-100 dark:bg-white/5 rounded-3xl flex items-center justify-center mb-6 mx-auto shadow-inner"><Icons.Bug className="w-10 h-10 opacity-30"/></div><h2 className="text-xl font-bold text-zinc-700 dark:text-zinc-200 mb-2">No Mistake Selected</h2><p className="text-sm max-w-xs mx-auto">Select a log from the sidebar.</p></motion.div>
                            </div>
                        )}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-[400px] z-30"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user}/></div>)}</AnimatePresence>
                        {isPracticeOpen && activeLog && <PracticeModal activeLog={activeLog} onClose={() => setIsPracticeOpen(false)} user={user} />}
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
