            const fileInputRef = useRef(null);
            const imageList = Array.isArray(images) ? images : (images ? [images] : []);
            
            const handleFiles = (files) => { Array.from(files).forEach(file => { if (file.type.startsWith('image/')) onUpdate(file, 'add'); }); };
            const handlePasteClick = async () => { try { const items = await navigator.clipboard.read(); for (const item of items) { for (const type of item.types) { if (type.startsWith("image/")) { const blob = await item.getType(type); onUpdate(blob, 'add'); } } } } catch (err) { alert("Clipboard permission denied or no image found."); } };
            
            return (
                <div className="space-y-2">
                    <div className="flex justify-between items-end px-1"><label className="text-sm font-bold text-zinc-700 dark:text-zinc-300 flex items-center gap-2">{label} <span className="text-[10px] font-normal text-zinc-400 bg-zinc-100 dark:bg-white/5 px-1.5 rounded">{imageList.length} files</span></label><div className="flex gap-2"><button onClick={handlePasteClick} className="text-[10px] flex items-center gap-1 text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 px-2 py-1 rounded transition-colors"><Icons.Clip className="w-3 h-3"/> Paste</button><button onClick={() => fileInputRef.current.click()} className="text-[10px] flex items-center gap-1 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-white/10 px-2 py-1 rounded transition-colors"><Icons.Plus className="w-3 h-3"/> Add</button></div><input type="file" multiple ref={fileInputRef} className="hidden" onChange={(e) => handleFiles(e.target.files)} accept="image/*" /></div>
                    <div className={`w-full min-h-[120px] bg-white dark:bg-surface border-2 border-dashed rounded-xl p-3 transition-all ${isDragging ? 'border-brand bg-brand/5' : 'border-zinc-300 dark:border-zinc-700'}`} onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={() => setIsDragging(false)} onDrop={(e) => { e.preventDefault(); setIsDragging(false); handleFiles(e.dataTransfer.files); }} onPaste={(e) => handleFiles(e.clipboardData.files)} tabIndex="0">
                        {imageList.length === 0 ? (<div className="h-24 flex flex-col items-center justify-center text-zinc-400 pointer-events-none">{isUploading ? <div className="w-6 h-6 border-2 border-brand border-t-transparent rounded-full animate-spin mb-1"/> : <Icons.Image className="w-6 h-6 mb-1 opacity-50"/>}<span className="text-xs">{isUploading ? "Uploading..." : "Drag images or Ctrl+V"}</span></div>) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                {imageList.map((url, idx) => (<div key={idx} onClick={() => setLightboxIndex(idx)} className="group relative aspect-square bg-zinc-100 dark:bg-black/20 rounded-lg overflow-hidden border border-zinc-200 dark:border-white/5 shadow-sm hover:shadow-md transition-all cursor-zoom-in"><img src={url} className="w-full h-full object-cover" /><div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2"><div className="p-1.5 bg-white/20 rounded-full text-white backdrop-blur-sm"><Icons.ZoomIn className="w-4 h-4"/></div><button onClick={(e) => { e.stopPropagation(); onUpdate(idx, 'remove'); }} className="p-1.5 bg-red-500/80 hover:bg-red-500 rounded-full text-white backdrop-blur-sm" title="Remove"><Icons.Trash className="w-4 h-4"/></button></div></div>))}
                                {isUploading && (<div className="aspect-square rounded-lg bg-zinc-50 dark:bg-white/5 flex items-center justify-center border border-zinc-200 dark:border-white/10 animate-pulse"><div className="w-5 h-5 border-2 border-brand border-t-transparent rounded-full animate-spin"></div></div>)}
                            </div>
                        )}
                    </div>
                    <AnimatePresence>{lightboxIndex !== null && (<Lightbox images={imageList} initialIndex={lightboxIndex} onClose={() => setLightboxIndex(null)} />)}</AnimatePresence>
                </div>
            );
        };

        const cleanLatex = (text) => {
            return text
                .replace(/\$\$/g, '\n').replace(/\$/g, '')
                .replace(/\\text\{([^}]+)\}/g, '$1')
                .replace(/\\times/g, '×').replace(/\\approx/g, '≈')
                .replace(/\\le/g, '≤').replace(/\\ge/g, '≥')
                .replace(/\\rightarrow/g, '→').replace(/\\cdot/g, '·')
                .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1/$2)')
                .replace(/\\/g, ''); 
        }

        const AIChat = ({ activeLog, onClose, user }) => {
            const [messages, setMessages] = useState([{role: 'ai', text: "I see your failure. How can I help you understand it?"}]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [quota, setQuota] = useState(0);
            const messagesEndRef = useRef(null);
            
            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
            useEffect(() => { const fetchQuota = async () => { if (!user) return; const today = new Date().toISOString().split('T')[0]; const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today); const snap = await window.firebase.getDoc(ref); if (snap.exists()) setQuota(snap.data().chat_count || 0); else setQuota(0); }; fetchQuota(); }, [user]);
            
            const handleSend = async () => {
                if(!input.trim()) return;
                const newQuota = await checkAndIncrementQuota(user, 'chat');
                const userMsg = input; setMessages(prev => [...prev, {role: 'user', text: userMsg}]); setInput(""); 
                if (newQuota === false) { setMessages(prev => [...prev, {role: 'ai', text: "🛑 **Daily Chat Limit (5/5) Reached**\n\nCome back tomorrow!"}]); return; }
                setQuota(newQuota);

                setLoading(true);
                let imgCtx = (activeLog.questionImages && activeLog.questionImages.length > 0) ? activeLog.questionImages[0] : (activeLog.imageUrl || null);
                
                if (imgCtx && (imgCtx.startsWith('http') || imgCtx.startsWith('https'))) {
                    try { const res = await fetch(imgCtx); const blob = await res.blob(); imgCtx = await new Promise((resolve) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(blob); }); } catch (e) { console.error("Image conversion failed", e); imgCtx = null; }
                }

                // If we have OCR text, prefer using that for context as it saves tokens and is cleaner, but pass image for visual context
                const qText = activeLog.questionText || "No text extracted.";
                
                const historyText = messages.slice(Math.max(messages.length - 6, 1)).map(m => `${m.role === 'user' ? 'Student' : 'Tutor'}: ${m.text}`).join('\n');
                const context = `Subject: ${activeLog.subject}, Topic: ${activeLog.topic}, Type: ${activeLog.questionType}, Student Answer: ${activeLog.correctAnswer}, Extracted Question Text: "${qText}". Explanation: ${activeLog.explanation}`;
                const systemPrompt = `You are a tutor. Context: ${context}. \nPREVIOUS CHAT (Last 3 turns):\n${historyText}\n\nINSTRUCTIONS:\n1. Be CONCISE (TL;DR style).\n2. Use standard MARKDOWN for tables, bolding, and lists.\n3. Put new logic/steps on new lines.\n4. STRICTLY NO LaTeX or '$' signs. Use Unicode math (e.g. "θ", "×", "≈", "²"). Write formulas in plain text.`;
                const fullUserPrompt = `Student Question: ${userMsg}`;

                let response = await callAI(fullUserPrompt, systemPrompt, imgCtx, GEMINI_PROXY_URL);
                response = cleanLatex(response);
                setMessages(prev => [...prev, {role: 'ai', text: response}]); setLoading(false);
            };

            return (
                <div className="flex flex-col h-full bg-white dark:bg-onyx border-l border-zinc-200 dark:border-white/10 shadow-2xl">
                    <div className="p-4 border-b border-zinc-200 dark:border-white/10 flex justify-between items-center bg-zinc-50 dark:bg-zinc-900">
                        <span className="font-bold text-sm flex items-center gap-2"><Icons.Bot className="w-4 h-4 text-brand"/> Tutor AI <span className="text-[10px] bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-2 py-0.5 rounded shadow-sm tracking-wide">GEMINI 3</span> <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${quota >= 5 ? 'bg-red-100 text-red-600' : 'bg-zinc-200 dark:bg-white/10 text-zinc-500'}`}>{quota}/5</span></span>
                        <button onClick={onClose}><Icons.X className="w-4 h-4 hover:text-red-500"/></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 markdown-content">{messages.map((m, i) => <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role==='user'?'bg-brand text-white rounded-br-none':'bg-zinc-100 dark:bg-zinc-800 rounded-bl-none text-zinc-900 dark:text-zinc-200'}`} dangerouslySetInnerHTML={{ __html: marked.parse(m.text, {breaks: true, gfm: true}) }} /></div>)}{loading && <div className="text-xs text-zinc-500 animate-pulse pl-2">Thinking...</div>} <div ref={messagesEndRef}/></div>
                    <div className="p-4 border-t border-zinc-200 dark:border-white/10 bg-white dark:bg-zinc-900 flex gap-2"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} className="flex-1 bg-zinc-100 dark:bg-black/30 border border-zinc-200 dark:border-white/10 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand dark:text-white" placeholder="Ask Tutor..."/><button onClick={handleSend} disabled={loading} className="bg-brand text-white rounded-full p-2 hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed"><Icons.Plus className="w-4 h-4 rotate-90"/></button></div>
                </div>
            );
        };

        const PracticeModal = ({ activeLog, onClose, user, subjects = [] }) => {
            const [loading, setLoading] = useState(false);
            // Default to 'topic' if no activeLog (arcade mode), else default to 'single'
            const [practiceMode, setPracticeMode] = useState(activeLog ? 'single' : 'topic'); 
            const [questions, setQuestions] = useState([]); 
            const [lqData, setLqData] = useState(null); 
            const [userAnswers, setUserAnswers] = useState({}); 
            const [marked, setMarked] = useState(false);
            const [lqFeedback, setLqFeedback] = useState(null);
            const [quota, setQuota] = useState(0);
            const [topicLogs, setTopicLogs] = useState([]);

            // Selection state for Topic Mode (Arcade)
            const [selectedSubject, setSelectedSubject] = useState(activeLog?.subject || (subjects.length > 0 ? subjects[0].name : ''));
            const [selectedTopic, setSelectedTopic] = useState(activeLog?.topic || '');

            useEffect(() => {
                const fetchQuota = async () => { if (!user) return; const today = new Date().toISOString().split('T')[0]; const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today); const snap = await window.firebase.getDoc(ref); if (snap.exists()) setQuota(snap.data().practice_count || 0); else setQuota(0); }; 
                fetchQuota();
                // If we have an active log, start drill. If arcade mode, wait for user to click "Generate".
                if (activeLog) generatePractice('single');
            }, []);

            // Helper to get topics for currently selected subject
            const currentSubjectObj = subjects.find(s => s.name === selectedSubject);
            const availableTopics = currentSubjectObj ? currentSubjectObj.topics : [];

            const generatePractice = async (mode = 'single') => {
                // Validation for Arcade Mode
                if (mode === 'topic' && !selectedSubject) { alert("Please select a subject!"); return; }

                setLoading(true);
                setPracticeMode(mode);
                setMarked(false);
                setUserAnswers({});
                setQuestions([]);
                setLqData(null);

                const newQuota = await checkAndIncrementQuota(user, 'practice');
                if (newQuota === false) { alert("Daily Practice Limit (10/10) Reached!"); onClose(); return; }
                setQuota(newQuota);

                let contextData = "";
                let imgCtx = null;

                if (mode === 'single' && activeLog) {
                    // Single Mode: Use current log's image or text
                    contextData = `Subject: ${activeLog.subject}. Topic: ${activeLog.topic}. Concept to drill: ${activeLog.explanation}. Question Text: ${activeLog.questionText || "See Image"}`;
                    imgCtx = (activeLog.questionImages && activeLog.questionImages.length > 0) ? activeLog.questionImages[0] : (activeLog.imageUrl || null);
                    
                    if (imgCtx && (imgCtx.startsWith('http') || imgCtx.startsWith('https'))) {
                        try { const res = await fetch(imgCtx); const blob = await res.blob(); imgCtx = await new Promise((r) => { const reader = new FileReader(); reader.onloadend = () => r(reader.result); reader.readAsDataURL(blob); }); } catch (e) { console.error(e); imgCtx = null; }
                    }
                } else {
                    // Topic Mode: Fetch other logs based on Selection (Arcade or Toggle)
                    const subj = selectedSubject;
                    const top = selectedTopic;
                    
                    try {
                        const db = window.firebase.db;
                        let constraints = [
                            window.firebase.where('subject', '==', subj),
                            window.firebase.limit(10)
                        ];
                        if (top) constraints.push(window.firebase.where('topic', '==', top));

                        const q = window.firebase.query(
                            window.firebase.collection(db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'),
                            ...constraints
                        );
                        const snap = await window.firebase.getDocs(q);
                        const logs = snap.docs.map(d => d.data());
                        setTopicLogs(logs);
                        
                        if (logs.length === 0) {
                            contextData = `Subject: ${subj}. Topic: ${top}. (No specific past mistakes found, generate general advanced practice for this topic).`;
                        } else {
                            const combinedText = logs.map((l, i) => `Mistake ${i+1}: ${l.questionText || l.explanation || "Visual Q"}`).join('\n');
                            contextData = `Subject: ${subj}. Topic: ${top}. Here are past mistakes in this topic:\n${combinedText}\nGenerate a CHALLENGING practice set to address these weak points.`;
                        }
                    } catch (e) { console.error("Topic fetch failed", e); contextData = `Focus on the topic: ${top} in subject ${subj}`; }
                }

                // Decide Question Type based on activeLog type or default to MC for Arcade
                const qType = activeLog ? (activeLog.questionType || 'MC') : 'MC';

                if (qType === 'MC') {
                    const prompt = `Context: ${contextData}\nGenerate 5 Multiple Choice Questions (ABCD). Return STRICTLY a JSON array: [{"q": "Question text", "options": ["A. ...", "B. ...", "C. ...", "D. ..."], "answer": "A", "explanation": "..."}]. Plain text only, NO LaTeX.`;
                    const res = await callAI(prompt, "You are a JSON generator.", imgCtx, GEMINI_PROXY_URL);
                    try { const json = JSON.parse(res.replace(/```json|```/g, '')); setQuestions(json); } catch(e) { alert("AI generation failed. Try again."); onClose(); }
                } else {
                    const prompt = `Context: ${contextData}\nGenerate 1 structured long question with 3 sub-parts. Return STRICTLY JSON: {"context": "Main question text...", "parts": [{"id": "a", "text": "Sub-question A", "marks": 2}, {"id": "b", "text": "...", "marks": 4}, {"id": "c", "text": "...", "marks": 4}]}. Plain text only, NO LaTeX.`;
                    const res = await callAI(prompt, "You are a JSON generator.", imgCtx, GEMINI_PROXY_URL);
                    try { const json = JSON.parse(res.replace(/```json|```/g, '')); setLqData(json); } catch(e) { alert("AI generation failed. Try again."); onClose(); }
                }
                setLoading(false);
            };

            const handleLqMark = async () => {
                setLoading(true);
                const prompt = `Mark this. Context: ${lqData.context}\nParts: ${JSON.stringify(lqData.parts)}\nAnswers: ${JSON.stringify(userAnswers)}\nReturn STRICTLY JSON: {"totalScore": 5, "maxScore": 10, "generalFeedback": "...", "partFeedback": {"a": {"score": 1, "comment": "..."}, "b": {"score": 4, "comment": "..."}}}. Plain text.`;
                const res = await callAI(prompt, "You are a strict examiner. Return JSON only.", null, GEMINI_PROXY_URL);
                try { const json = JSON.parse(res.replace(/```json|```/g, '')); setLqFeedback(json); setMarked(true); } catch(e) { alert("Marking failed."); }
                setLoading(false);
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-zinc-900 w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[85vh]">
                        <div className="p-4 border-b border-zinc-200 dark:border-white/10 flex flex-col gap-4 bg-zinc-50 dark:bg-zinc-900 rounded-t-2xl">
                            <div className="flex justify-between items-center">
                                <h3 className="font-bold flex items-center gap-2 text-lg dark:text-white"><Icons.Brain className="w-5 h-5 text-brand"/> {activeLog ? "Practice Mode" : "Arcade Mode"}</h3>
                                <button onClick={onClose}><Icons.X className="w-6 h-6 text-zinc-400 hover:text-white"/></button>
                            </div>
                            
                            {/* Controls Area */}
                            <div className="flex flex-wrap gap-3 items-center justify-between">
                                <div className="flex bg-zinc-200 dark:bg-black/20 p-1 rounded-lg">
                                    {activeLog && (
                                        <button onClick={() => generatePractice('single')} disabled={loading} className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${practiceMode==='single' ? 'bg-white dark:bg-zinc-700 shadow-sm text-black dark:text-white' : 'text-zinc-500'}`}>Focus Drill</button>
                                    )}
                                    <button onClick={() => !activeLog ? null : generatePractice('topic')} disabled={loading || !activeLog} className={`px-3 py-1 text-xs font-bold rounded-md transition-all ${practiceMode==='topic' ? 'bg-white dark:bg-zinc-700 shadow-sm text-black dark:text-white' : 'text-zinc-500'}`}>Topic Challenge</button>
                                </div>
                                
                                {/* Topic Selection Logic (Show if Arcade Mode OR if user wants to change topic in Topic Mode) */}
                                {(practiceMode === 'topic' || !activeLog) && (
                                    <div className="flex gap-2 flex-1 justify-end">
                                        <select value={selectedSubject} onChange={e=>setSelectedSubject(e.target.value)} className="bg-white dark:bg-black/30 border border-zinc-200 dark:border-white/10 rounded-lg px-2 py-1 text-xs max-w-[120px]">
                                            {subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                        </select>
                                        <select value={selectedTopic} onChange={e=>setSelectedTopic(e.target.value)} className="bg-white dark:bg-black/30 border border-zinc-200 dark:border-white/10 rounded-lg px-2 py-1 text-xs max-w-[120px]">
                                            <option value="">Any Topic</option>
                                            {availableTopics.map(t=><option key={t} value={t}>{t}</option>)}
                                        </select>
                                        {!activeLog && <button onClick={() => generatePractice('topic')} className="bg-brand text-white px-3 py-1 rounded-lg text-xs font-bold hover:bg-indigo-600">Start</button>}
                                        {activeLog && <button onClick={() => generatePractice('topic')} className="bg-zinc-200 dark:bg-white/10 px-2 py-1 rounded-lg text-xs hover:bg-zinc-300 dark:hover:bg-white/20" title="Refresh"><Icons.Refresh className="w-3 h-3"/></button>}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center py-10 space-y-4"><div className="w-10 h-10 border-4 border-brand border-t-transparent rounded-full animate-spin"></div><p className="text-zinc-500 animate-pulse">{practiceMode === 'single' ? "Analyzing mistake..." : "Compiling topic error logs..."}</p></div>
                            ) : questions.length > 0 ? (
                                <div className="space-y-8">{questions.map((q, idx) => (<div key={idx} className="space-y-3"><div className="font-semibold text-zinc-900 dark:text-zinc-100">{idx+1}. {q.q}</div><div className="grid grid-cols-1 sm:grid-cols-2 gap-2">{q.options.map((opt) => { const letter = opt.charAt(0); const isSelected = userAnswers[idx] === letter; const isCorrect = q.answer === letter; let bg = "bg-zinc-50 dark:bg-white/5 border-zinc-200 dark:border-white/10 hover:border-brand"; if (marked) { if (isCorrect) bg = "bg-green-500/20 border-green-500"; else if (isSelected) bg = "bg-red-500/20 border-red-500"; } else if (isSelected) { bg = "bg-brand/10 border-brand"; } return (<button key={opt} onClick={() => !marked && setUserAnswers({...userAnswers, [idx]: letter})} className={`text-left p-3 rounded-lg border text-sm transition-all dark:text-zinc-300 ${bg}`}>{opt}</button>); })}</div>{marked && (<div className="text-xs p-3 rounded bg-zinc-100 dark:bg-white/5 text-zinc-600 dark:text-zinc-400"><span className="font-bold">Explanation:</span> {q.explanation}</div>)}</div>))}</div>
                            ) : lqData ? (
                                <div className="space-y-6"><div className="p-4 bg-zinc-50 dark:bg-white/5 rounded-lg text-zinc-800 dark:text-zinc-200 font-medium">{lqData.context}</div>{lqData.parts.map((part) => (<div key={part.id} className="space-y-2"><div className="flex justify-between text-sm"><span className="font-bold dark:text-white">({part.id}) {part.text}</span><span className="text-zinc-500">[{part.marks} marks]</span></div><textarea value={userAnswers[part.id] || ''} onChange={e => setUserAnswers({...userAnswers, [part.id]: e.target.value})} disabled={marked} className="w-full bg-transparent border border-zinc-200 dark:border-white/10 rounded-lg p-3 text-sm focus:ring-1 focus:ring-brand outline-none dark:text-white" rows="3" placeholder="Type your answer here..."/>{marked && lqFeedback?.partFeedback[part.id] && (<div className={`text-xs p-2 rounded flex justify-between ${lqFeedback.partFeedback[part.id].score === part.marks ? 'bg-green-500/10 text-green-500' : 'bg-red-500/10 text-red-400'}`}><span>{lqFeedback.partFeedback[part.id].comment}</span><span className="font-bold">{lqFeedback.partFeedback[part.id].score}/{part.marks}</span></div>)}</div>))} {marked && (<div className="p-4 rounded-lg bg-brand/10 border border-brand/20 text-center"><div className="text-2xl font-bold text-brand">{lqFeedback.totalScore} / {lqFeedback.maxScore}</div><div className="text-sm text-brand/80">{lqFeedback.generalFeedback}</div></div>)}</div>
                            ) : (
                                !loading && practiceMode === 'topic' && !activeLog && <div className="flex flex-col items-center justify-center text-zinc-400 h-full"><Icons.Brain className="w-12 h-12 mb-2 opacity-20"/><p>Select a Subject & Topic to Start</p></div>
                            )}
                        </div>
                        <div className="p-4 border-t border-zinc-200 dark:border-white/10 bg-zinc-50 dark:bg-zinc-900/50 flex justify-between items-center rounded-b-2xl">
                            <span className={`text-xs px-2 py-0.5 rounded-full ${quota >= 10 ? 'bg-red-100 text-red-600' : 'bg-zinc-200 dark:bg-white/10 text-zinc-500'}`}>{quota}/10 Today</span>
                            {!marked && (questions.length > 0 || lqData) ? <button onClick={() => questions.length > 0 ? setMarked(true) : handleLqMark()} className="px-6 py-2 bg-brand text-white font-bold rounded-lg hover:bg-indigo-600 transition-colors shadow-lg">{questions.length > 0 ? 'Check Answers' : 'Submit for Grading'}</button> : <button onClick={onClose} className="px-6 py-2 bg-zinc-200 dark:bg-white/10 text-zinc-900 dark:text-white font-bold rounded-lg hover:bg-zinc-300 transition-colors">Close</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const ContextMenu = ({ visible, x, y, logId, onDuplicate, onDelete, onCopy, onPaste }) => {
            if (!visible) return null;
            return (
                <div className="fixed z-50 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-white/10 rounded-lg shadow-xl py-1 w-40 context-menu" style={{ top: y, left: x }}>
                    <button onClick={() => onDuplicate(logId)} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 flex items-center gap-2"><Icons.Plus className="w-3 h-3"/> Duplicate</button>
                    <button onClick={() => onCopy(logId)} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 flex items-center gap-2"><Icons.Copy className="w-3 h-3"/> Copy Data</button>
                    <button onClick={onPaste} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 flex items-center gap-2"><Icons.Clip className="w-3 h-3"/> Paste Log</button>
                    <div className="h-px bg-zinc-200 dark:bg-white/10 my-1"></div>
                    <button onClick={() => onDelete(logId)} className="w-full text-left px-3 py-2 text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 flex items-center gap-2"><Icons.Trash className="w-3 h-3"/> Delete</button>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [subjects, setSubjects] = useState([]);
            const [activeLogId, setActiveLogId] = useState(() => new URLSearchParams(window.location.search).get('log'));
            
            // FILTERS & SORTS
            const [filter, setFilter] = useState('all'); 
            const [typeFilter, setTypeFilter] = useState('ALL'); 
            const [sortBy, setSortBy] = useState('date-desc'); 
            
            const [searchQuery, setSearchQuery] = useState('');
            const [isAiOpen, setIsAiOpen] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [isAutoTitleLoading, setIsAutoTitleLoading] = useState(false);
            const [isLoadingLogs, setIsLoadingLogs] = useState(false);
            const [isPracticeOpen, setIsPracticeOpen] = useState(false);
            const { saveToDrive } = useGoogleDrive();
            const [uploadingQ, setUploadingQ] = useState(false);
            const [uploadingS, setUploadingS] = useState(false);
            
            // PAGINATION
            const [lastDoc, setLastDoc] = useState(null);
            const [hasMore, setHasMore] = useState(true);
            const [showSortMenu, setShowSortMenu] = useState(false);
            const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, logId: null });
            const [previewLog, setPreviewLog] = useState(null);
            const hoverTimeoutRef = useRef(null);
            const pendingUpdatesRef = useRef({});
            const saveTimeoutRef = useRef(null);
            
            // OCR TOGGLE
            const [showOcrText, setShowOcrText] = useState(false);

            // AUTH & INIT
            useEffect(() => {
                const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const db = window.firebase.db;
                        window.firebase.getDocs(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', u.uid, 'subjects')).then(snap => {
                            setSubjects(snap.docs.map(d => ({id: d.id, name: d.data().name, topics: d.data().topics || []})).sort((a,b)=>a.name.localeCompare(b.name)));
                        });
                    } else setUser(null);
                });
                return () => unsub();
            }, []);

            useEffect(() => { if(isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);
            useEffect(() => { const url = new URL(window.location); if (activeLogId) url.searchParams.set('log', activeLogId); else url.searchParams.delete('log'); window.history.pushState({}, '', url); }, [activeLogId]);
            useEffect(() => { const handleClick = () => setContextMenu({ ...contextMenu, visible: false }); window.addEventListener('click', handleClick); return () => window.removeEventListener('click', handleClick); }, [contextMenu]);

            const fetchLogs = async (isLoadMore = false, uid = user?.uid) => {
                if (!uid) return;
                setIsLoadingLogs(true);
                try {
                    const db = window.firebase.db;
                    const logsRef = window.firebase.collection(db, 'artifacts', "darnote-app", 'users', uid, 'error_logs');
                    let constraints = [];
                    if (filter === 'active') constraints.push(window.firebase.where('mastered', '==', false));
                    if (filter === 'mastered') constraints.push(window.firebase.where('mastered', '==', true));
                    if (filter.startsWith('subject:')) constraints.push(window.firebase.where('subject', '==', filter.split(':')[1]));
                    if (typeFilter !== 'ALL') constraints.push(window.firebase.where('questionType', '==', typeFilter));
                    const dir = sortBy === 'date-desc' ? 'desc' : 'asc';
                    constraints.push(window.firebase.orderBy('createdAt', dir));
                    if (isLoadMore && lastDoc) constraints.push(window.firebase.startAfter(lastDoc));
                    constraints.push(window.firebase.limit(10));
                    const q = window.firebase.query(logsRef, ...constraints);
                    let snapshot = await window.firebase.getDocs(q);
                    const newLogs = snapshot.docs.map(d => {
                        const data = d.data();
                        return { id: d.id, ...data, questionImages: data.questionImages || (data.imageUrl ? [data.imageUrl] : []), schemeImages: data.schemeImages || (data.markingSchemeUrl ? [data.markingSchemeUrl] : []) };
                    });
                    if (isLoadMore) setLogs(prev => [...prev, ...newLogs]);
                    else setLogs(newLogs);
                    setLastDoc(snapshot.docs[snapshot.docs.length - 1]);
                    setHasMore(snapshot.docs.length === 10);
                } catch(e) { console.error("Fetch Error", e); }
                setIsLoadingLogs(false);
            };

            useEffect(() => { if(user) { setLastDoc(null); setLogs([]); fetchLogs(false); } }, [sortBy, typeFilter, filter, user]); 

            const createLog = async () => {
                const newLog = { title: 'Untitled Mistake', subject: 'General', topic: '', questionImages: [], schemeImages: [], questionType: 'MC', correctAnswer: '', marks: '', explanation: '', questionText: '', mastered: false, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() };
                const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog);
                setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); setActiveLogId(docRef.id);
            };

            const updateLog = (id, updates) => {
                const timestampedUpdates = { ...updates, lastModified: new Date().toISOString() };
                setLogs(prev => prev.map(l => l.id === id ? { ...l, ...timestampedUpdates } : l));
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                pendingUpdatesRef.current[id] = { ...(pendingUpdatesRef.current[id] || {}), ...timestampedUpdates };
                saveTimeoutRef.current = setTimeout(async () => {
                    const ids = Object.keys(pendingUpdatesRef.current);
                    for (const logId of ids) {
                        const payload = pendingUpdatesRef.current[logId]; delete pendingUpdatesRef.current[logId];
                        await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', logId), payload);
                    }
                }, 3000);
            };

            const handleDelete = async (id) => { if(!confirm("Delete this log permanently?")) return; setLogs(prev => prev.filter(l => l.id !== id)); if (activeLogId === id) setActiveLogId(null); await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', id)); };
            const handleDuplicate = async (id) => { const original = logs.find(l => l.id === id); if (!original) return; const { id: _, ...data } = original; const newLog = { ...data, title: `${data.title} (Copy)`, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() }; const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog); setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); };
            const handleCopy = (id) => { const original = logs.find(l => l.id === id); if (original) navigator.clipboard.writeText(JSON.stringify(original)); };
            const handlePaste = async () => { try { const text = await navigator.clipboard.readText(); const data = JSON.parse(text); if (data.title && data.createdAt) { const { id, ...cleanData } = data; const newLog = { ...cleanData, title: `${cleanData.title} (Pasted)`, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() }; const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog); setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); } } catch(e) { alert("Invalid log data in clipboard"); } };
            const handleContextMenu = (e, logId) => { e.preventDefault(); setContextMenu({ visible: true, x: e.clientX, y: e.clientY, logId }); };
            const addTopicToSubject = async (subjectName) => { const subjectDoc = subjects.find(s => s.name === subjectName); if (!subjectDoc) { alert("Cannot add topic to General."); return; } const newTopic = prompt(`Add topic for ${subjectName}:`); if (!newTopic) return; setSubjects(prev => prev.map(s => s.id === subjectDoc.id ? {...s, topics: [...s.topics, newTopic]} : s)); const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'subjects', subjectDoc.id); await window.firebase.updateDoc(docRef, { topics: window.firebase.arrayUnion(newTopic) }); };
            
            // --- NEW: COMPRESSED UPLOAD & AUTO OCR PIPELINE ---
            const handleImageUpdate = async (data, action, type) => {
                if (!activeLogId) return;
                const isQ = type === 'question'; 
                const setSpinner = isQ ? setUploadingQ : setUploadingS; 
                const targetField = isQ ? 'questionImages' : 'schemeImages'; 
                const currentImages = isQ ? activeLog.questionImages : activeLog.schemeImages;
                
                if (action === 'remove') { 
                    const newArr = currentImages.filter((_, i) => i !== data); 
                    updateLog(activeLogId, { [targetField]: newArr }); 
                    return; 
                }
                
                setSpinner(true);
                try {
                    let blobToUpload = data;
                    // POTATO MODE: Compress if it's a file
                    if (data instanceof File || data instanceof Blob) {
                        blobToUpload = await compressImage(data);
                    }
                    
                    const finalUrl = await saveToDrive(blobToUpload, `ErrorLog_${type}_${Date.now()}.jpg`);
                    const newArr = [...currentImages, finalUrl]; 
                    
                    // 1. SHOW IMAGE IMMEDIATELY
                    updateLog(activeLogId, { [targetField]: newArr });
                    setSpinner(false); // Stop "Uploading" spinner
                    
                    // 2. BACKGROUND AUTO-OCR & TITLE (If Question)
                    if (isQ) {
                        const newQuota = await checkAndIncrementQuota(user, 'ocr');
                        if (newQuota === false) { console.log("OCR limit reached"); return; }
                        
                        setIsAutoTitleLoading(true); // Show "Analyzing..." on the Auto-Title button
                        
                        // Convert blob to base64 for AI
                        const reader = new FileReader();
                        reader.onloadend = async () => {
                            const base64 = reader.result;
                            try {
                                // Combined Prompt for Text Extraction + Title Summarization
                                const prompt = `Analyze this image. 1. Extract the exact text from the question (OCR). 2. Generate a concise title (max 6 words) based on the concept. Return STRICTLY valid JSON: { "text": "...", "title": "..." }.`;
                                
                                // >>>>>> USE CALLGROQ HERE INSTEAD OF CALLAI <<<<<<
                                const res = await callGroq(prompt, "You are a JSON generator.", base64);
                                const json = JSON.parse(res.replace(/```json|```/g, ''));
                                
                                // Update Log with AI results
                                const currentText = activeLog.questionText || "";
                                updateLog(activeLogId, { 
                                    title: json.title || activeLog.title,
                                    questionText: json.text || currentText
                                });
                            } catch (e) { console.error("Auto-OCR Failed", e); }
                            setIsAutoTitleLoading(false);
                        };
                        reader.readAsDataURL(blobToUpload);
                    }

                } catch(e) { 
                    alert("Upload Failed: " + e.message); 
                    setSpinner(false);
                } 
            };

            const handleAutoTitle = async () => {
                if (!activeLog.questionImages?.length && !activeLog.imageUrl) { alert("Paste image first!"); return; } 
                const newQuota = await checkAndIncrementQuota(user, 'ocr');
                if (newQuota === false) { alert("Daily OCR Limit (20/20) Reached!"); return; }
                setIsAutoTitleLoading(true);
                try {
                    let url = activeLog.questionImages?.[0] || activeLog.imageUrl; let base64 = url;
                    if(!url.startsWith('data:')) { const res = await fetch(url); const b = await res.blob(); base64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(b);}); }
                    
                    // >>>>>> USE CALLGROQ HERE INSTEAD OF CALLAI <<<<<<
                    const prompt = "1. Extract EXACT text. 2. Generate SHORT title (max 6 words). Return JSON: {title: '...', text: '...'}";
                    const res = await callGroq(prompt, "JSON Generator", base64);
                    const json = JSON.parse(res.replace(/```json|```/g, ''));
                    updateLog(activeLogId, { title: json.title, questionText: json.text });
                } catch(e) { alert("OCR Failed"); } setIsAutoTitleLoading(false);
            }

            const handleMouseEnter = (log) => { if (hoverTimeoutRef.current) clearTimeout(hoverTimeoutRef.current); hoverTimeoutRef.current = setTimeout(() => { const img = (log.questionImages && log.questionImages.length > 0) ? log.questionImages[0] : log.imageUrl; if (img) setPreviewLog(log); }, 600); };
            const handleMouseLeave = () => { if (hoverTimeoutRef.current) clearTimeout(hoverTimeoutRef.current); setPreviewLog(null); };

            const activeLog = logs.find(l => l.id === activeLogId);
            const filteredLogs = logs.filter(l => (l.title || '').toLowerCase().includes(searchQuery.toLowerCase()));
            const currentSub = activeLog ? subjects.find(s=>s.name===activeLog.subject) : null;

            if (!user) return (
                <div className="h-screen w-full flex items-center justify-center bg-zinc-950 text-white flex-col gap-6">
                    <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-20 h-20 mb-4 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]"/>
                    <h1 className="text-3xl font-bold">darNote Error Log</h1>
                    <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-white text-black px-8 py-3 rounded-full font-bold flex gap-2 items-center hover:scale-105 transition-transform shadow-xl w-64 justify-center"><Icons.Google className="w-5 h-5"/> Sign In</button>
                </div>
            );

            return (
                <div className={`flex h-screen w-full transition-colors duration-300 ${isDarkMode ? 'dark bg-onyx' : 'bg-[#f4f4f5]'}`}>
                    <ContextMenu visible={contextMenu.visible} x={contextMenu.x} y={contextMenu.y} logId={contextMenu.logId} onDuplicate={handleDuplicate} onDelete={handleDelete} onCopy={handleCopy} onPaste={handlePaste}/>
                    <AnimatePresence>{previewLog && (<div className="fixed z-[100] top-0 bottom-0 left-[340px] md:left-[600px] pointer-events-none flex flex-col justify-center p-4"><motion.div initial={{ opacity: 0, x: -20, scale: 0.95 }} animate={{ opacity: 1, x: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.95 }} className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-white/10 rounded-xl shadow-2xl p-2 max-w-lg max-h-[80vh] overflow-hidden flex flex-col"><div className="text-[10px] font-bold px-2 py-1 text-zinc-400 uppercase tracking-wider flex justify-between"><span>Preview</span><span className={previewLog.questionType === 'MC' ? 'text-indigo-500' : 'text-orange-500'}>{previewLog.questionType}</span></div><img src={previewLog.questionImages?.[0] || previewLog.imageUrl} className="rounded-lg object-contain max-h-[60vh] bg-zinc-100 dark:bg-black/50" /><div className="mt-2 px-2 pb-1"><div className="font-bold text-sm truncate text-zinc-900 dark:text-zinc-100">{previewLog.title}</div><div className="text-[10px] text-zinc-500 truncate">{previewLog.subject} • {previewLog.topic || 'No Topic'}</div></div></motion.div></div>)}</AnimatePresence>

                    {/* SIDEBAR */}
                    <div className="w-[260px] flex-shrink-0 glass-panel flex flex-col justify-between p-5 z-20 hidden md:flex transition-colors duration-300">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-1"><img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-8 h-8"/><div><div className="font-bold text-sm tracking-tight text-zinc-900 dark:text-white">darNote</div><div className="text-[10px] text-zinc-500 font-medium uppercase tracking-wider">Error Log</div></div></div>
                            <nav className="space-y-1">
                                <a href="note.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-white mb-4 border border-transparent hover:border-zinc-200 dark:hover:border-white/10 transition-all"><Icons.Book className="w-4 h-4"/> Back to Notes</a>
                                {[{id: 'all', icon: Icons.Bug, label: 'All Errors'}, {id: 'active', icon: Icons.X, label: 'Needs Review'}, {id: 'mastered', icon: Icons.Check, label: 'Mastered'}].map(item => (<button key={item.id} onClick={()=>setFilter(item.id)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${filter===item.id ? 'bg-zinc-200 dark:bg-white/10 text-zinc-900 dark:text-white shadow-sm' : 'text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-white'}`}><item.icon className="w-4 h-4"/> {item.label}</button>))}
                                <div className="h-4"></div>
                                <button onClick={()=>setIsPracticeOpen(true)} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-500/10 hover:bg-orange-100 dark:hover:bg-orange-500/20 transition-all border border-orange-200 dark:border-orange-500/20"><Icons.Brain className="w-4 h-4"/> Practice Arcade</button>
                            </nav>
                            <div className="pt-4 border-t border-zinc-200 dark:border-white/10"><div className="px-2 text-[10px] font-bold text-zinc-400 mb-2 uppercase tracking-widest">Subjects</div><div className="space-y-0.5 max-h-[250px] overflow-y-auto">{subjects.map(s => (<button key={s.id} onClick={()=>setFilter(`subject:${s.name}`)} className={`w-full text-left px-3 py-2 rounded-lg text-sm transition-colors hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5 ${filter === `subject:${s.name}` ? 'bg-zinc-100 dark:bg-white/10 text-brand' : 'text-zinc-500 dark:text-zinc-400'}`}>{s.name}</button>))}</div></div>
                        </div>
                        <div className="space-y-3 pt-4 border-t border-zinc-200 dark:border-white/10"><div className="flex items-center gap-3 px-2 py-1"><>{user.photoURL ? <img src={user.photoURL} className="w-8 h-8 rounded-full border border-zinc-200 dark:border-white/10"/> : <div className="w-8 h-8 rounded-full bg-zinc-200 dark:bg-white/10 flex items-center justify-center"><Icons.User className="w-4 h-4 text-zinc-500"/></div>}<div className="overflow-hidden"><div className="text-xs font-bold text-zinc-900 dark:text-white truncate w-32">{user.displayName}</div><div className="text-[10px] text-zinc-500 truncate">{user.email}</div></div></></div><div className="flex gap-2"><button onClick={()=>setIsDarkMode(!isDarkMode)} className="flex-1 btn-ghost py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-medium border border-zinc-200 dark:border-white/5 bg-white dark:bg-white/5 shadow-sm">{isDarkMode ? <><Icons.Sun className="w-3 h-3"/> Light</> : <><Icons.Moon className="w-3 h-3"/> Dark</>}</button><button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="px-3 btn-ghost py-2 rounded-lg text-red-500 border border-transparent"><Icons.Logout className="w-4 h-4"/></button></div></div>
                    </div>

                    {/* LIST */}
                    <div className="w-[320px] flex-shrink-0 border-r border-zinc-200 dark:border-white/5 bg-white dark:bg-surface flex flex-col z-10 shadow-lg">
                        <div className="p-4 border-b border-zinc-200 dark:border-white/5 space-y-3 bg-white dark:bg-surface z-20">
                            <div className="flex gap-2">
                                <input type="text" placeholder="Search..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="input-field pl-9 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNzE3MTdhIiBzdHJva2Utd2lkdGg9IjIiPjxjaXJjbGUgY3g9IjExIiBjeT0iMTEiIHI9IjgiLz48cGF0aCBkPSJtMjEgMjEtNC4zLTQuMyIvPjwvc3ZnPg==')] bg-no-repeat bg-[length:16px] bg-[12px_center]"/>
                                <div className="relative">
                                    <button onClick={()=>setShowSortMenu(!showSortMenu)} className={`p-2 rounded-lg border border-zinc-200 dark:border-white/10 hover:bg-zinc-100 dark:hover:bg-white/5 transition-colors ${typeFilter !== 'ALL' ? 'text-brand border-brand' : 'text-zinc-500'}`} title="Sort & Filter"><Icons.Sort className="w-4 h-4"/></button>
                                    {showSortMenu && (
                                        <div className="absolute right-0 top-full mt-2 w-40 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-white/10 rounded-lg shadow-xl z-50 py-1"><div className="px-3 py-1.5 text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Sort Order</div><button onClick={()=>{setSortBy('date-desc'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${sortBy==='date-desc'?'text-indigo-500 font-bold':''}`}>Date (Newest)</button><button onClick={()=>{setSortBy('date-asc'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${sortBy==='date-asc'?'text-indigo-500 font-bold':''}`}>Date (Oldest)</button><div className="h-px bg-zinc-200 dark:bg-white/10 my-1"></div><div className="px-3 py-1.5 text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Filter Type</div><button onClick={()=>{setTypeFilter('ALL'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter==='ALL'?'text-indigo-500 font-bold':''}`}>All Types</button><button onClick={()=>{setTypeFilter('MC'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter==='MC'?'text-indigo-500 font-bold':''}`}>MC Only</button><button onClick={()=>{setTypeFilter('LQ'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter==='LQ'?'text-indigo-500 font-bold':''}`}>LQ Only</button></div>
                                    )}
                                </div>
                            </div>
                            <button onClick={createLog} className="w-full bg-brand text-white py-2.5 rounded-lg font-bold text-sm hover:bg-indigo-600 shadow-lg transition-all flex justify-center items-center gap-2"><Icons.Plus className="w-4 h-4"/> Log New Error</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-2">
                            {filteredLogs.map(l => (
                                <motion.div 
                                    key={l.id} onClick={()=>setActiveLogId(l.id)} onContextMenu={(e) => handleContextMenu(e, l.id)} onMouseEnter={() => handleMouseEnter(l)} onMouseLeave={handleMouseLeave} className={`p-3.5 rounded-xl cursor-pointer border transition-all ${activeLogId===l.id ? 'bg-zinc-100 dark:bg-white/10 border-zinc-300 dark:border-white/20' : 'bg-transparent border-transparent hover:bg-zinc-50 dark:hover:bg-white/5'}`}
                                >
                                    <div className="flex justify-between items-start mb-1"><div className="font-semibold text-sm truncate pr-2 text-zinc-800 dark:text-zinc-200 w-full">{l.title}</div>{l.mastered && <Icons.Check className="w-4 h-4 text-green-500"/>}</div>
                                    <div className="flex justify-between items-center mt-2"><div className="flex gap-2"><span className="text-[10px] font-medium px-2 py-0.5 rounded bg-zinc-200 dark:bg-white/10 text-zinc-600 dark:text-zinc-400">{l.subject}</span>{l.topic && <span className="text-[10px] font-medium px-2 py-0.5 rounded border border-zinc-200 dark:border-white/10 text-zinc-500 truncate max-w-[80px]">{l.topic}</span>}</div><span className={`text-[10px] font-bold ${l.mastered ? 'text-green-600' : 'text-red-500'}`}>{l.mastered ? 'SOLVED' : 'REVIEW'}</span></div>
                                    <div className="mt-2 text-[9px] text-zinc-400 dark:text-zinc-500 text-right">{new Date(l.lastModified || l.createdAt).toLocaleDateString()}</div>
                                </motion.div>
                            ))}
                            {hasMore && !isLoadingLogs && (<button onClick={() => fetchLogs(true)} className="w-full py-2 text-xs text-indigo-500 hover:text-indigo-400 font-bold mt-2 border border-dashed border-zinc-300 dark:border-zinc-700 rounded-lg hover:bg-zinc-50 dark:hover:bg-white/5 transition-colors">Load More (+10)</button>)}
                            {isLoadingLogs && <div className="text-center text-zinc-400 py-4 text-xs animate-pulse">Loading Logs...</div>}
                        </div>
                    </div>

                    {/* EDITOR */}
                    <main className="flex-1 flex flex-col min-w-0 bg-[#f4f4f5] dark:bg-onyx relative transition-colors duration-300">
                        {activeLog ? (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col h-full">
                                <header className="h-16 flex items-center justify-between px-6 border-b border-zinc-200 dark:border-white/5 bg-white dark:bg-surface shrink-0 z-10">
                                    <div className="flex-1 flex items-center gap-2 mr-4">
                                        <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-xl font-bold outline-none w-full text-zinc-900 dark:text-white placeholder-zinc-400" placeholder="Untitled Mistake"/>
                                        <button onClick={handleAutoTitle} disabled={isAutoTitleLoading || (!activeLog.questionImages?.length && !activeLog.imageUrl)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isAutoTitleLoading ? 'bg-indigo-100 text-indigo-500 animate-pulse' : 'bg-zinc-100 dark:bg-white/10 text-zinc-600 dark:text-zinc-400 hover:bg-brand hover:text-white'}`}>{isAutoTitleLoading ? <div className="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <><Icons.Scan className="w-3 h-3"/><span className="hidden sm:inline">Auto-Title</span></>}</button>
                                        <button onClick={() => setIsPracticeOpen(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-zinc-100 dark:bg-white/10 text-zinc-600 dark:text-zinc-400 hover:bg-orange-500 hover:text-white transition-all ml-1" title="Generate Drill Questions"><Icons.Brain className="w-3 h-3"/> <span className="hidden sm:inline">Practice</span></button>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-1.5 rounded-full text-xs font-bold border transition-all ${activeLog.mastered ? 'bg-green-500/10 border-green-500 text-green-600' : 'bg-red-500/10 border-red-500 text-red-600'}`}>{activeLog.mastered ? 'Mastered' : 'Needs Review'}</button>
                                        <div className="h-6 w-px bg-zinc-200 dark:bg-white/10 mx-2"></div>
                                        <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-2 rounded-lg transition-colors ${!user ? 'cursor-not-allowed opacity-50 bg-zinc-100 dark:bg-white/5 text-zinc-400' : isAiOpen ? 'bg-brand/10 text-brand' : 'hover:bg-zinc-100 dark:hover:bg-white/5 text-zinc-500'}`} title={user ? "Open AI Tutor" : "Login required for AI Tutor"}><Icons.Bot className="w-5 h-5"/></button>
                                        <button onClick={() => handleDelete(activeLog.id)} className="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-zinc-400 hover:text-red-500 transition-colors"><Icons.Trash className="w-5 h-5"/></button>
                                    </div>
                                </header>
                                <div className="flex-1 overflow-y-auto p-6 md:p-10 scroll-smooth">
                                    <div className="max-w-5xl mx-auto space-y-8">
                                        <div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5 grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Subject</label><select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="input-field bg-zinc-50 dark:bg-black/20"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select></div>
                                            <div>
                                                <label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Topic</label>
                                                <div className="flex gap-2">
                                                    {activeLog.subject !== 'General' && currentSub ? (
                                                        <>
                                                            <select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20 flex-1">
                                                                <option value="">-- Select --</option>{currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}
                                                            </select>
                                                            <button onClick={() => addTopicToSubject(activeLog.subject)} className="px-3 rounded-lg bg-zinc-100 dark:bg-white/5 hover:bg-brand hover:text-white transition-colors text-zinc-500 border border-zinc-200 dark:border-white/10" title="Add New Topic"><Icons.Plus className="w-4 h-4"/></button>
                                                        </>
                                                    ) : ( <input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20 flex-1" placeholder="Custom" disabled={activeLog.subject !== 'General'}/> )}
                                                </div>
                                            </div>
                                            <div><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Type</label><div className="flex bg-zinc-100 dark:bg-black/20 p-1 rounded-lg border border-zinc-200 dark:border-white/5">{['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-zinc-700 shadow-sm text-black dark:text-white' : 'text-zinc-500'}`}>{t}</button>))}</div></div>
                                        </div>
                                        <div className="space-y-6">
                                            <div>
                                                <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label="Question Evidence" isUploading={uploadingQ}/>
                                                <div className="mt-2">
                                                    <button onClick={() => setShowOcrText(!showOcrText)} className="text-[10px] flex items-center gap-1 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors"><Icons.Scan className="w-3 h-3"/> {showOcrText ? "Hide Extracted Text" : "Check Extracted Text"}</button>
                                                    {showOcrText && (<textarea value={activeLog.questionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="mt-2 w-full p-3 text-xs bg-zinc-100 dark:bg-black/20 border border-zinc-200 dark:border-white/5 rounded-lg font-mono text-zinc-600 dark:text-zinc-400 focus:outline-none" rows="4" placeholder="AI will extract text here automatically..." />)}
                                                </div>
                                            </div>
                                            <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Marking Scheme" isUploading={uploadingS}/>
                                        </div>
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            <div className="lg:col-span-1 space-y-6"><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Correct Answer</label><input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-green-50 dark:bg-green-900/10 border border-green-200 dark:border-green-900/30 rounded-lg px-4 py-3 font-mono text-lg font-bold text-green-700 dark:text-green-400 focus:outline-none" placeholder="Ans"/></div><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Marks Lost</label><input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 rounded-lg px-4 py-3 font-bold text-red-700 dark:text-red-400 focus:outline-none" placeholder="-2"/></div></div>
                                            <div className="lg:col-span-2 bg-white dark:bg-surface rounded-2xl border border-zinc-200 dark:border-white/5 shadow-sm overflow-hidden flex flex-col min-h-[250px]"><div className="px-5 py-3 border-b border-zinc-200 dark:border-white/5 bg-zinc-50/50 dark:bg-white/5 flex justify-between items-center"><span className="text-xs font-bold text-zinc-500 uppercase tracking-wider">Analysis / Logic Gap</span><span className="text-[10px] text-zinc-400">Markdown supported</span></div><textarea className="flex-1 w-full p-5 bg-transparent outline-none resize-none text-sm leading-7 text-zinc-700 dark:text-zinc-300 placeholder-zinc-300 dark:placeholder-zinc-600" placeholder="• Why did I get this wrong?&#10;• What was the trap?&#10;• How do I solve it next time?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/></div>
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-zinc-400 h-full">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center"><div className="w-20 h-20 bg-zinc-100 dark:bg-white/5 rounded-3xl flex items-center justify-center mb-6 mx-auto shadow-inner"><Icons.Bug className="w-10 h-10 opacity-30"/></div><h2 className="text-xl font-bold text-zinc-700 dark:text-zinc-200 mb-2">No Mistake Selected</h2><p className="text-sm max-w-xs mx-auto">Select a log from the sidebar or create a new one to start documenting your learning journey.</p></motion.div>
                            </div>
                        )}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-[400px] z-30"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user}/></div>)}</AnimatePresence>
                        {isPracticeOpen && <PracticeModal activeLog={activeLog} onClose={() => setIsPracticeOpen(false)} user={user} subjects={subjects} />}
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
