                console.error("Failed to copy URL", err);

            if (await ensureAuth()) fileInputRef.current.click();

    const cleanLatex=(t)=>t.replace(/\$\$/g,'\n').replace(/\$/g,'').replace(/\\text\{([^}]+)\}/g,'$1').replace(/\\times/g,'×').replace(/\\approx/g,'≈').replace(/\\le/g,'≤').replace(/\\ge/g,'≥').replace(/\\rightarrow/g,'→').replace(/\\cdot/g,'·').replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g,'($1/$2)').replace(/\\/g,'');

    const AIChat = ({ activeLog, onClose, user, messages, setMessages }) => {

        const handleSend = async () => { if(!input.trim()) return; const limit = model === 'groq' ? limits.chat_groq : limits.chat_gemini; const newQuota = await checkAndIncrementQuota(user, 'chat', model); const userMsg = input; setMessages(prev => [...prev, {role: 'user', text: userMsg}]); setInput(""); if (newQuota === false) { setMessages(prev => [...prev, {role: 'ai', text: `🛑 **Daily Limit (${limit}/${limit}) Reached**\n\nCome back tomorrow!`}]); return; } setQuota(newQuota); setLoading(true); let imgContexts = []; if (model === 'gemini') { const rawImages = activeLog.questionImages?.length ? activeLog.questionImages : (activeLog.imageUrl ? [activeLog.imageUrl] : []); for (const rawUrl of rawImages) { if (rawUrl.startsWith('http') && !rawUrl.includes('drive.google.com')) { try { const res = await fetch(rawUrl); const blob = await res.blob(); const base64 = await new Promise((r) => { const reader = new FileReader(); reader.onloadend = () => r(reader.result); reader.readAsDataURL(blob); }); imgContexts.push(base64); } catch(e) {} } else if (rawUrl.startsWith('data:')) { imgContexts.push(rawUrl); } } } const qText = activeLog.questionText || "No text extracted."; const historyText = messages.slice(Math.max(messages.length - 6, 1)).map(m => `${m.role === 'user' ? 'Student' : 'Tutor'}: ${m.text}`).join('\n'); const context = `Subject: ${activeLog.subject}, Topic: ${activeLog.topic}, Type: ${activeLog.questionType}, Answer: ${activeLog.correctAnswer}, Text: "${qText}". Notes: ${activeLog.explanation}`; const systemPrompt = `You are a tutor of a note app:darNote. Context: ${context}. \nPREVIOUS CHAT:\n${historyText}\n\nINSTRUCTIONS:\n1. Be CONCISE (TL;DR).\n2. Markdown yes, LaTeX NO. Use Unicode math.`; let response = model === 'groq' ? await callGroq(userMsg, systemPrompt, imgContexts) : await callAI(userMsg, systemPrompt, imgContexts, GEMINI_PROXY_URL); response = cleanLatex(response); setMessages(prev => [...prev, {role: 'ai', text: response}]); setLoading(false); };
        return (<div className="flex flex-col h-full bg-[#f8fafc] dark:bg-onyx border-l border-light-gray dark:border-white/5 shadow-2xl"><div className="px-5 py-4 border-b border-light-gray dark:border-white/5 bg-white dark:bg-surface-dark flex flex-col gap-4"><div className="flex justify-between items-center"><span className="font-bold text-base flex items-center gap-2 text-dark dark:text-light"><div className="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center"><Icons.Bot className="w-4 h-4 text-primary"/></div> Workspace AI</span><button onClick={onClose} className="p-2 rounded-full hover:bg-light-gray dark:hover:bg-white/10 transition-colors"><Icons.X className="w-5 h-5 text-gray"/></button></div><div className="flex bg-light-gray/50 dark:bg-dark p-1 rounded-xl">{[{id:'gemini', name:'Gemini 1.5'}, {id:'groq', name:'ChatGPT'}].map(m=><button key={m.id} onClick={()=>setModel(m.id)} className={`flex-1 py-1.5 rounded-lg text-xs font-medium transition-all ${model===m.id ? `bg-white dark:bg-surface-dark shadow-sm text-primary dark:text-primary-light font-bold` : 'text-gray hover:text-dark dark:hover:text-light'}`}>{m.name} <span className={`${quota>=(m.id==='groq'?limits.chat_groq:limits.chat_gemini)?'text-danger':'text-gray'} ml-1`}>({quota}/{m.id==='groq'?limits.chat_groq:limits.chat_gemini})</span></button>)}</div></div><div className="flex-1 overflow-y-auto p-5 space-y-6 markdown-content">{messages.map((m, i) => <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}><div className={`max-w-[85%] p-4 text-sm shadow-sm ${m.role==='user'?'bg-primary text-white rounded-2xl rounded-tr-sm':'bg-white dark:bg-surface-dark text-dark dark:text-light border border-light-gray dark:border-white/5 rounded-2xl rounded-tl-sm'}`} dangerouslySetInnerHTML={{ __html: marked.parse(m.text, {breaks: true, gfm: true}) }} /></div>)}{loading && <div className="flex gap-1 pl-4"><div className="w-2 h-2 bg-primary/50 rounded-full animate-bounce"></div><div className="w-2 h-2 bg-primary/50 rounded-full animate-bounce" style={{animationDelay:'0.1s'}}></div><div className="w-2 h-2 bg-primary/50 rounded-full animate-bounce" style={{animationDelay:'0.2s'}}></div></div>} <div ref={messagesEndRef}/></div><div className="p-4 bg-white dark:bg-surface-dark border-t border-light-gray dark:border-white/5"><div className="flex gap-2 bg-[#f8fafc] dark:bg-dark border border-light-gray dark:border-white/5 rounded-full p-1 shadow-inner"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} className="flex-1 bg-transparent px-4 py-2 text-sm focus:outline-none dark:text-light placeholder-gray" placeholder={`Message ${model === 'gemini' ? 'Gemini' : 'ChatGPT'}...`}/><button onClick={handleSend} disabled={loading || !input.trim()} className="bg-primary text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-primary-dark disabled:opacity-50 transition-colors shadow-sm shrink-0"><Icons.Bot className="w-4 h-4"/></button></div></div></div>);
    };

    const PracticeModal = ({ activeLog, onClose, user, subjects = [], initialMode = 'topic' }) => {

                        const b64 = reader.result;
                        setLogs(currentLogs => { 
                            const targetLog = currentLogs.find(l => l.id === activeLogId); 
                            if (!targetLog) return currentLogs; 
                            const newArr = [...(targetLog[targetField] || []), b64]; 
                            updateLog(activeLogId, { [targetField]: newArr }); 
                            return currentLogs.map(l => l.id === activeLogId ? { ...l, [targetField]: newArr } : l); 
                        }); 
                        setSpinner(false); 
                    };
                    reader.readAsDataURL(blobToUpload);
                    return;
                }

                if (isQ && blobToUpload.type !== 'application/pdf') { 
                    const reader = new FileReader(); 
                    reader.onloadend = () => pendingOcrBlobs.current.push(reader.result); 
                    reader.readAsDataURL(blobToUpload); 
                    if (ocrTimerRef.current) clearTimeout(ocrTimerRef.current); 
                    setOcrPendingToast(15); 
                    ocrTimerRef.current = setTimeout(async () => { 
                        const newQuota = await checkAndIncrementQuota(user, 'ocr'); 
                        if (newQuota === false) return; 
                        if (pendingOcrBlobs.current.length > 0) performSmartOCR([...pendingOcrBlobs.current]); 
                    }, 15000); 
                } 
                const finalUrl = await saveToDrive(blobToUpload, `ErrorLog_${type}_${Date.now()}.${blobToUpload.type==='application/pdf'?'pdf':'jpg'}`, preFetchedToken); 
                setLogs(currentLogs => { 
                    const targetLog = currentLogs.find(l => l.id === activeLogId); 
                    if (!targetLog) return currentLogs; 
                    const newArr = [...(targetLog[targetField] || []), finalUrl]; 
                    updateLog(activeLogId, { [targetField]: newArr }); 
                    return currentLogs.map(l => l.id === activeLogId ? { ...l, [targetField]: newArr } : l); 
                }); 
                setSpinner(false); 
            } catch(e) { 
                alert("Upload Failed: " + e.message); 
                setSpinner(false); 
            } 
        };

            try { 
                let imagesToProcess = [];

                            try { 
                                const res = await fetch(url); const b = await res.blob(); const base64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(b);}); imagesToProcess.push(base64); 
                            } catch(e) {} 
                        } else { imagesToProcess.push(url); }

                                                    <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                        <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-danger"></div>
                                                        <label className="text-sm font-medium text-dark dark:text-light block mb-3 pl-2">Marks Deducted</label>
                                                        <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-light-gray/50 dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark rounded-xl px-4 py-3 font-mono text-lg font-bold text-danger focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-danger focus:outline-none transition-all" placeholder="-1"/>
                                                    </div>
                                                </div>
                                                <div className="lg:col-span-2 bg-white dark:bg-surface-dark rounded-3xl shadow-sm border border-light-gray dark:border-border-dark flex flex-col min-h-[240px] relative overflow-hidden">
                                                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-primary"></div>
                                                    {isAnalysisEmpty && (
                                                        <button onClick={() => setExpandedSections(p => ({...p, analysis: false}))} className="absolute top-4 right-4 p-2 bg-light-gray/50 dark:bg-dark rounded-full text-gray hover:text-danger hover:bg-danger/10 transition-all opacity-0 group-hover:opacity-100 z-10" title="Remove Section"><Icons.X className="w-4 h-4"/></button>
                                                    )}
                                                    <div className="px-6 md:px-8 py-4 border-b border-light-gray dark:border-border-dark flex justify-between items-center pl-8 pr-12">
                                                        <span className="text-sm font-medium text-dark dark:text-light flex items-center gap-2"><Icons.Brain className="w-4 h-4 text-primary"/> Retrospective</span>
                                                        <Icons.Bot className="w-4 h-4 text-gray opacity-50"/>
                                                    </div>
                                                    <textarea className="flex-1 w-full p-6 md:p-8 pl-8 bg-transparent outline-none resize-none text-base leading-relaxed text-dark dark:text-light placeholder-gray/70" placeholder="Analyze the failure point...&#10;1. What was the conceptual gap?&#10;2. How did the trick work?&#10;3. What is the mental model needed for next time?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <Dashboard logs={logs} setPracticeConfig={setPracticeConfig} />
                        )}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-full sm:w-[400px] z-40 sm:z-30 shadow-2xl"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>
                        {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                    </main>
                </div>
                
                {/* NEW: Global Floating Action Button (FAB) for Mobile */}
                {!activeLogId && mobileView === 'logs' && (
                    <button onClick={createLog} className="lg:hidden fixed bottom-20 right-5 z-40 bg-primary text-white w-14 h-14 rounded-full flex items-center justify-center shadow-[0_4px_15px_rgba(26,115,232,0.4)] hover:bg-primary-dark transition-transform active:scale-95">
                        <Icons.Plus className="w-6 h-6"/>
                    </button>
                )}

                {/* Mobile Bottom Navigation */}
                <div className="lg:hidden fixed bottom-0 left-0 right-0 h-16 bg-white dark:bg-surface-dark border-t border-light-gray dark:border-border-dark flex justify-around items-center px-2 z-50 pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.05)] dark:shadow-[0_-4px_10px_rgba(0,0,0,0.2)]">
                    <button onClick={() => { setMobileView('logs'); setActiveLogId(null); }} className={`flex flex-col items-center justify-center w-16 h-full gap-1 transition-colors ${mobileView === 'logs' && !activeLogId ? 'text-primary' : 'text-gray dark:text-zinc-400 hover:text-dark dark:hover:text-light'}`}>
                        <Icons.File className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Logs</span>
                    </button>
                    <button onClick={() => { if(!user) { alert("Guest Mode: Sign in to use Smart Drill."); return; } setPracticeConfig({ isOpen: true, mode: 'topic' }); }} className="flex flex-col items-center justify-center w-16 h-full gap-1 text-gray dark:text-zinc-400 hover:text-primary transition-colors">
                        <Icons.Brain className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Drill</span>
                    </button>
                    <button onClick={() => { setMobileView('dashboard'); setActiveLogId(null); }} className={`flex flex-col items-center justify-center w-16 h-full gap-1 transition-colors ${mobileView === 'dashboard' && !activeLogId ? 'text-primary' : 'text-gray dark:text-zinc-400 hover:text-dark dark:hover:text-light'}`}>
                        <Icons.ChartBar className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Stats</span>
                    </button>
                </div>

                <AnimatePresence>
                    {undoToast && (
                        <motion.div initial={{ y: 100, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 100, opacity: 0 }} className="fixed bottom-24 lg:bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-onyx dark:bg-white text-white dark:text-onyx px-5 py-3 rounded-full shadow-2xl flex items-center gap-4 text-sm font-medium border border-white/10 dark:border-black/10">
                            <span className="flex items-center gap-2 whitespace-nowrap"><Icons.Check className="w-4 h-4 text-success"/> Image removed</span>
                            <div className="w-px h-4 bg-white/20 dark:bg-black/20"></div>
                            <button onClick={handleUndo} className="text-primary-light dark:text-primary hover:opacity-80 transition-opacity uppercase font-bold tracking-wider text-xs whitespace-nowrap">Undo</button>
                            <button onClick={() => { setUndoToast(null); if(window.undoTimer) clearTimeout(window.undoTimer); }} className="text-gray-400 hover:text-white dark:hover:text-black transition-colors ml-1"><Icons.X className="w-4 h-4"/></button>
                        </motion.div>
                    )}
                </AnimatePresence>
            </div>
        );
    };

    const initApp = () => {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    };

    if (window.firebase) {
        initApp();
    } else {
        window.addEventListener('firebaseLoaded', initApp);
        // Fallback safety timeout
        setTimeout(() => {
            if (!window.firebase) {
                console.error("Firebase module loading timeout.");
                document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:#d93025;font-family:sans-serif;font-weight:500;">Failed to load application scripts. Please check your internet connection or disable adblockers.</div>';
            }
        }, 5000);
    }
</script>
</body>
</html>
