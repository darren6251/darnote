        // --- GEMINI PROXY ---
        const callGemini = async (prompt, systemInstruction = "", imageBase64 = null) => {
            const proxyUrl = GEMINI_PROXY_URL;
            const parts = [{ text: `${systemInstruction}\n\nUser: ${prompt}` }];
            if (imageBase64) {
                let mimeType = "image/png"; let data = imageBase64;
                if (imageBase64.includes(",")) { const s = imageBase64.split(","); mimeType = s[0].match(/:(.*?);/)[1]; data = s[1]; }
                parts.push({ inlineData: { mimeType, data } });
            }
            try {
                const response = await fetch(proxyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) });
                
                if (!response.ok) {
                    console.error(`Gemini Proxy Error: ${response.status} ${response.statusText}`);
                    return `Error: API Request Failed (${response.status} - ${response.statusText})`;
                }

                const data = await response.json();
                console.log("Gemini Raw Debug:", data); 

                if (data.error) return `API Error: ${data.error.message}`;
                
                const candidate = data.candidates?.[0];
                if (!candidate) return "Error: No candidates returned";
                
                if (candidate.finishReason && candidate.finishReason !== "STOP") {
                    return `Error: Response blocked due to ${candidate.finishReason}`;
                }

                return candidate.content?.parts?.[0]?.text || "Error: Empty response text.";
            } catch (error) { return `Error: ${error.message}`; }
        };

        // --- SMART QUOTA MANAGER ---
        const checkAndIncrementQuota = async (user, type) => {
            if (!user) return false;
            // LIMITS CONFIG
            const limits = { chat: 5, practice: 10, ocr: 20 };
            const fieldMap = { chat: 'chat_count', practice: 'practice_count', ocr: 'ocr_count' };
            
            const limit = limits[type];
            const field = fieldMap[type];
            if (!limit || !field) return false;

            const today = new Date().toISOString().split('T')[0];
            const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today);
            
            try {
                const snap = await window.firebase.getDoc(ref);
                let count = 0; 
                if (snap.exists()) {
                    count = snap.data()[field] || 0;
                }
                
                if (count >= limit) return false;
                
                if (snap.exists()) {
                    await window.firebase.updateDoc(ref, { [field]: window.firebase.increment(1) });
                } else {
                    await window.firebase.setDoc(ref, { [field]: 1 }, { merge: true });
                }
                return count + 1; // Return new count
            } catch (e) { console.error("Quota check failed:", e); return false; }
        };

        // --- GDRIVE HOOK ---

            const [tokenClient, setTokenClient] = useState(null);
            useEffect(() => {
                if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return;
                const load = async () => {
                    try {
                        if (window.gapi) { await new Promise(r => window.gapi.load('client', r)); await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] }); }
                        if (window.google) setTokenClient(window.google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: () => {} }));
                    } catch(e) { console.error("Drive API Init Failed:", e); }
                };
                load();
            }, []);
            const getAccessToken = () => new Promise((resolve, reject) => {
                if (!tokenClient) return reject("Auth not initialized");
                const existing = window.gapi.client.getToken();
                if (existing && Date.now() < existing.expiry) return resolve(existing.access_token);
                tokenClient.callback = (resp) => { if (resp.error) reject(resp); resolve(resp.access_token); };
                tokenClient.requestAccessToken({ prompt: '' });
            });
            const saveToDrive = async (blob, filename) => {
                try {
                    const token = await getAccessToken();
                    let folderId;
                    const q = `mimeType='application/vnd.google-apps.folder' and name='darNote_Errors' and trashed=false`;
                    const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` } });
                    const searchData = await search.json();
                    if (searchData.files?.length) folderId = searchData.files[0].id;
                    else {
                        const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'darNote_Errors', mimeType: 'application/vnd.google-apps.folder' }) });
                        folderId = (await create.json()).id;
                    }
                    const metadata = { name: filename, mimeType: blob.type, parents: [folderId] };
                    const form = new FormData();
                    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                    form.append('file', blob);
                    const upRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
                    if(!upRes.ok) throw new Error(upRes.statusText);
                    const fileId = (await upRes.json()).id;
                    await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) });
                    return `https://lh3.googleusercontent.com/d/${fileId}`;
                } catch (e) { console.error("Drive Upload Error:", e); throw e; }
            };
            return { saveToDrive };
        };

        // --- COMPONENTS ---
        const Lightbox = ({ images, initialIndex, onClose }) => {

                    if (e.key === 'Escape') onClose();

                    if (e.key === 'ArrowLeft') setIndex((prev) => (prev - 1 + images.length) % images.length);
                };
                window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown);
            }, [images.length, onClose]);
            if (!images || images.length === 0) return null;

                    <button onClick={(e) => { e.stopPropagation(); setIndex((prev) => (prev + 1) % images.length); }} className="absolute right-4 text-white/50 hover:text-white p-4 rounded-full hover:bg-white/10 transition-colors z-50 hidden sm:block"><Icons.ChevronRight className="w-8 h-8"/></button>

        const MultiImageUploader = ({ images = [], onUpdate, label, isUploading }) => {

            const handlePasteClick = async () => { try { const items = await navigator.clipboard.read(); for (const item of items) { for (const type of item.types) { if (type.startsWith("image/")) { const blob = await item.getType(type); onUpdate(blob, 'add'); } } } } catch (err) { alert("Clipboard permission denied or no image found."); } };
            return (
                <div className="space-y-2">
                    <div className="flex justify-between items-end px-1"><label className="text-sm font-bold text-zinc-700 dark:text-zinc-300 flex items-center gap-2">{label} <span className="text-[10px] font-normal text-zinc-400 bg-zinc-100 dark:bg-white/5 px-1.5 rounded">{imageList.length} files</span></label><div className="flex gap-2"><button onClick={handlePasteClick} className="text-[10px] flex items-center gap-1 text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 px-2 py-1 rounded transition-colors"><Icons.Clip className="w-3 h-3"/> Paste</button><button onClick={() => fileInputRef.current.click()} className="text-[10px] flex items-center gap-1 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-white/10 px-2 py-1 rounded transition-colors"><Icons.Plus className="w-3 h-3"/> Add</button></div><input type="file" multiple ref={fileInputRef} className="hidden" onChange={(e) => handleFiles(e.target.files)} accept="image/*" /></div>

        const cleanLatex = (text) => {
            return text
                .replace(/\$\$/g, '\n') // Block math to newline
                .replace(/\$/g, '') // Inline math delimiters
                .replace(/\\text\{([^}]+)\}/g, '$1') // \text{...} -> ...
                .replace(/\\times/g, '×')
                .replace(/\\approx/g, '≈')
                .replace(/\\le/g, '≤')
                .replace(/\\ge/g, '≥')
                .replace(/\\rightarrow/g, '→')
                .replace(/\\cdot/g, '·')
                .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1/$2)') // \frac{a}{b} -> (a/b)
                .replace(/\\/g, ''); // Remove remaining backslashes
        }

        const AIChat = ({ activeLog, onClose, user }) => {
            const [messages, setMessages] = useState([{role: 'ai', text: "I see your failure. How can I help you understand it?"}]);

                    if (u) {
                        setUser(u);
                        fetchLogs(false, u.uid);
                        // Fetch Subjects
                        const db = window.firebase.db;
                        window.firebase.getDocs(window.firebase.collection(db, 'artifacts', "darnote-app", 'users', u.uid, 'subjects')).then(snap => {
                            setSubjects(snap.docs.map(d => ({id: d.id, name: d.data().name, topics: d.data().topics || []})).sort((a,b)=>a.name.localeCompare(b.name)));
                        });
                    } else setUser(null);
                });
                return () => unsub();
            }, []);

            useEffect(() => { if(isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);
            useEffect(() => { const url = new URL(window.location); if (activeLogId) url.searchParams.set('log', activeLogId); else url.searchParams.delete('log'); window.history.pushState({}, '', url); }, [activeLogId]);
            useEffect(() => { const handleClick = () => setContextMenu({ ...contextMenu, visible: false }); window.addEventListener('click', handleClick); return () => window.removeEventListener('click', handleClick); }, [contextMenu]);

            // FETCH LOGS (Safety Net Sorting)
            const fetchLogs = async (isLoadMore = false, uid = user?.uid) => {
                if (!uid) return;
                setIsLoadingLogs(true);
                try {
                    const db = window.firebase.db;
                    const logsRef = window.firebase.collection(db, 'artifacts', "darnote-app", 'users', uid, 'error_logs');
                    let q = window.firebase.query(logsRef); // Start fresh
                    let fallbackSort = false;

                    // 1. FILTER: Apply Type Filter if set
                    if (typeFilter !== 'ALL') {
                        q = window.firebase.query(q, window.firebase.where('questionType', '==', typeFilter));
                    }

                    // 2. SORT: Date
                    const dir = sortBy === 'date-desc' ? 'desc' : 'asc';
                    q = window.firebase.query(q, window.firebase.orderBy('createdAt', dir));

                    // 3. PAGINATE
                    if (isLoadMore && lastDoc) q = window.firebase.query(q, window.firebase.startAfter(lastDoc), window.firebase.limit(10));
                    else q = window.firebase.query(q, window.firebase.limit(10));

                    let snapshot;
                    try {
                        snapshot = await window.firebase.getDocs(q);
                    } catch (error) {
                        // Catch missing index error here
                        if (error.code === 'failed-precondition' || error.message.includes('index')) {
                            console.warn("Firestore index missing for sort + filter. Falling back to simple sort.");
                            fallbackSort = true;
                            // Fallback: Just fetch by Date Descending (ignoring filter to prevent crash)
                            q = window.firebase.query(logsRef, window.firebase.orderBy('createdAt', 'desc'));
                            if (isLoadMore && lastDoc) q = window.firebase.query(q, window.firebase.startAfter(lastDoc), window.firebase.limit(10));
                            else q = window.firebase.query(q, window.firebase.limit(10));
                            snapshot = await window.firebase.getDocs(q);
                        } else {
                            throw error;
                        }
                    }

                    const newLogs = snapshot.docs.map(d => {
                        const data = d.data();
                        return { id: d.id, ...data, questionImages: data.questionImages || (data.imageUrl ? [data.imageUrl] : []), schemeImages: data.schemeImages || (data.markingSchemeUrl ? [data.markingSchemeUrl] : []) };
                    });

                    // NO Client Side Sort needed for Type anymore as we filter strictly

                    if (isLoadMore) setLogs(prev => [...prev, ...newLogs]);
                    else setLogs(newLogs);

                    setLastDoc(snapshot.docs[snapshot.docs.length - 1]);
                    setHasMore(snapshot.docs.length === 10);
                } catch(e) { console.error("Fetch Error", e); }
                setIsLoadingLogs(false);
            };

            // Trigger re-fetch on sort OR filter change
            useEffect(() => { 
                if(user) {
                    setLastDoc(null); // Reset pagination
                    setLogs([]); // Clear for visual clarity
                    fetchLogs(false); 
                }
            }, [sortBy, typeFilter]); // Added typeFilter dependency

            const createLog = async () => {
                const newLog = { title: 'Untitled Mistake', subject: 'General', topic: '', questionImages: [], schemeImages: [], questionType: 'MC', correctAnswer: '', marks: '', explanation: '', mastered: false, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() };
                const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog);
                setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); setActiveLogId(docRef.id);
            };

            // DEBOUNCED UPDATE (10s)
            const updateLog = (id, updates) => {
                const timestampedUpdates = { ...updates, lastModified: new Date().toISOString() };
                setLogs(prev => prev.map(l => l.id === id ? { ...l, ...timestampedUpdates } : l));
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                pendingUpdatesRef.current[id] = { ...(pendingUpdatesRef.current[id] || {}), ...timestampedUpdates };
                saveTimeoutRef.current = setTimeout(async () => {
                    const ids = Object.keys(pendingUpdatesRef.current);
                    for (const logId of ids) {
                        const payload = pendingUpdatesRef.current[logId]; delete pendingUpdatesRef.current[logId];
                        await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', logId), payload);
                    }
                }, 10000);
            };

            const handleContextMenu = (e, logId) => { e.preventDefault(); setContextMenu({ visible: true, x: e.clientX, y: e.clientY, logId }); };
            const handleDuplicate = async (id) => { const original = logs.find(l => l.id === id); if (!original) return; const { id: _, ...data } = original; const newLog = { ...data, title: `${data.title} (Copy)`, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() }; const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog); setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); };
            const handleDelete = async (id) => { if(!confirm("Delete this log permanently?")) return; setLogs(prev => prev.filter(l => l.id !== id)); if (activeLogId === id) setActiveLogId(null); await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', id)); };
            const handleCopy = (id) => { const original = logs.find(l => l.id === id); if (original) navigator.clipboard.writeText(JSON.stringify(original)); };
            const handlePaste = async () => { try { const text = await navigator.clipboard.readText(); const data = JSON.parse(text); if (data.title && data.createdAt) { const { id, ...cleanData } = data; const newLog = { ...cleanData, title: `${cleanData.title} (Pasted)`, createdAt: new Date().toISOString(), lastModified: new Date().toISOString() }; const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog); setLogs(prev => [{...newLog, id: docRef.id}, ...prev]); } } catch(e) { alert("Invalid log data in clipboard"); } };

            const addTopicToSubject = async (subjectName) => {
                const subjectDoc = subjects.find(s => s.name === subjectName); if (!subjectDoc) { alert("Cannot add topic to General."); return; }
                const newTopic = prompt(`Add topic for ${subjectName}:`); if (!newTopic) return;
                setSubjects(prev => prev.map(s => s.id === subjectDoc.id ? {...s, topics: [...s.topics, newTopic]} : s));
                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'subjects', subjectDoc.id);
                await window.firebase.updateDoc(docRef, { topics: window.firebase.arrayUnion(newTopic) });
            };

            const handleImageUpdate = async (data, action, type) => {
                if (!activeLogId) return;
                const isQ = type === 'question'; const setSpinner = isQ ? setUploadingQ : setUploadingS; const targetField = isQ ? 'questionImages' : 'schemeImages'; const currentImages = isQ ? activeLog.questionImages : activeLog.schemeImages;
                if (action === 'remove') { const newArr = currentImages.filter((_, i) => i !== data); updateLog(activeLogId, { [targetField]: newArr }); return; }
                setSpinner(true);
                try {
                    const blob = data instanceof Blob ? data : new Blob([data]); 
                    const finalUrl = await saveToDrive(blob, `ErrorLog_${type}_${Date.now()}.png`);
                    const newArr = [...currentImages, finalUrl]; 
                    updateLog(activeLogId, { [targetField]: newArr });
                } catch(e) { alert("Upload Failed: " + e.message); } setSpinner(false);
            };

            const handleAutoTitle = async () => {
                if (!activeLog.questionImages?.length && !activeLog.imageUrl) { alert("Paste image first!"); return; } 
                const newQuota = await checkAndIncrementQuota(user, 'ocr');
                if (newQuota === false) { alert("Daily OCR/Auto-Title Limit (20/20) Reached!"); return; }
                setIsAutoTitleLoading(true);
                try {
                    let url = activeLog.questionImages?.[0] || activeLog.imageUrl; let base64 = url;
                    if(!url.startsWith('data:')) { const res = await fetch(url); const b = await res.blob(); base64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(b);}); }
                    const title = await callGemini("Analyze image. Identify core question concept. Generate SHORT title (max 6 words). Return ONLY title.", "Concise Summarizer", base64);
                    updateLog(activeLogId, { title: title.replace(/^["']|["']$/g, '').trim() });
                } catch(e) { alert("OCR Failed"); } setIsAutoTitleLoading(false);
            }

            const handleMouseEnter = (log) => { if (hoverTimeoutRef.current) clearTimeout(hoverTimeoutRef.current); hoverTimeoutRef.current = setTimeout(() => { const img = (log.questionImages && log.questionImages.length > 0) ? log.questionImages[0] : log.imageUrl; if (img) setPreviewLog(log); }, 600); };
            const handleMouseLeave = () => { if (hoverTimeoutRef.current) clearTimeout(hoverTimeoutRef.current); setPreviewLog(null); };

            const activeLog = logs.find(l => l.id === activeLogId);
            const filteredLogs = logs.filter(l => {
                if (filter === 'mastered') return l.mastered; if (filter === 'active') return !l.mastered;
                if (filter.startsWith('subject:')) return l.subject === filter.split(':')[1];
                return true;
            }).filter(l => (l.title || '').toLowerCase().includes(searchQuery.toLowerCase()));
            const currentSub = activeLog ? subjects.find(s=>s.name===activeLog.subject) : null;

                </div>

                                >
                                    <div className="text-[10px] font-bold px-2 py-1 text-zinc-400 uppercase tracking-wider flex justify-between"><span>Quick Preview</span><span className={previewLog.questionType === 'MC' ? 'text-indigo-500' : 'text-orange-500'}>{previewLog.questionType}</span></div>
                                    <img src={previewLog.questionImages?.[0] || previewLog.imageUrl} className="rounded-lg object-contain max-h-[60vh] bg-zinc-100 dark:bg-black/50" />
                                    <div className="mt-2 px-2 pb-1"><div className="font-bold text-sm truncate text-zinc-900 dark:text-zinc-100">{previewLog.title}</div><div className="text-[10px] text-zinc-500 truncate">{previewLog.subject} • {previewLog.topic || 'No Topic'}</div></div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* SIDEBAR */}
                    <div className="w-[260px] flex-shrink-0 glass-panel flex flex-col justify-between p-5 z-20 hidden md:flex transition-colors duration-300">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-1"><img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-8 h-8"/><div><div className="font-bold text-sm tracking-tight text-zinc-900 dark:text-white">darNote</div><div className="text-[10px] text-zinc-500 font-medium uppercase tracking-wider">Error Log</div></div></div>
                            <nav className="space-y-1">
                                <a href="note.html" className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-white mb-4 border border-transparent hover:border-zinc-200 dark:hover:border-white/10 transition-all"><Icons.Book className="w-4 h-4"/> Back to Notes</a>
                                {[{id: 'all', icon: Icons.Bug, label: 'All Errors'}, {id: 'active', icon: Icons.X, label: 'Needs Review'}, {id: 'mastered', icon: Icons.Check, label: 'Mastered'}].map(item => (<button key={item.id} onClick={()=>setFilter(item.id)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${filter===item.id ? 'bg-zinc-200 dark:bg-white/10 text-zinc-900 dark:text-white shadow-sm' : 'text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-white'}`}><item.icon className="w-4 h-4"/> {item.label}</button>))}
                            </nav>
                            <div className="pt-4 border-t border-zinc-200 dark:border-white/10"><div className="px-2 text-[10px] font-bold text-zinc-400 mb-2 uppercase tracking-widest">Subjects</div><div className="space-y-0.5 max-h-[250px] overflow-y-auto">{subjects.map(s => (<button key={s.id} onClick={()=>setFilter(`subject:${s.name}`)} className="w-full text-left px-3 py-2 rounded-lg text-sm transition-colors text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5">{s.name}</button>))}</div></div>
                        </div>
                        <div className="space-y-3 pt-4 border-t border-zinc-200 dark:border-white/10"><div className="flex items-center gap-3 px-2 py-1"><>{user.photoURL ? <img src={user.photoURL} className="w-8 h-8 rounded-full border border-zinc-200 dark:border-white/10"/> : <div className="w-8 h-8 rounded-full bg-zinc-200 dark:bg-white/10 flex items-center justify-center"><Icons.User className="w-4 h-4 text-zinc-500"/></div>}<div className="overflow-hidden"><div className="text-xs font-bold text-zinc-900 dark:text-white truncate w-32">{user.displayName}</div><div className="text-[10px] text-zinc-500 truncate">{user.email}</div></div></></div><div className="flex gap-2"><button onClick={()=>setIsDarkMode(!isDarkMode)} className="flex-1 btn-ghost py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-medium border border-zinc-200 dark:border-white/5 bg-white dark:bg-white/5 shadow-sm">{isDarkMode ? <><Icons.Sun className="w-3 h-3"/> Light</> : <><Icons.Moon className="w-3 h-3"/> Dark</>}</button><button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="px-3 btn-ghost py-2 rounded-lg text-red-500 border border-transparent"><Icons.Logout className="w-4 h-4"/></button></div></div>
                    </div>

                    {/* LIST */}
                    <div className="w-[320px] flex-shrink-0 border-r border-zinc-200 dark:border-white/5 bg-white dark:bg-surface flex flex-col z-10 shadow-lg">
                        <div className="p-4 border-b border-zinc-200 dark:border-white/5 space-y-3 bg-white dark:bg-surface z-20">
                            <div className="flex gap-2">
                                <input type="text" placeholder="Search..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="input-field pl-9 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNzE3MTdhIiBzdHJva2Utd2lkdGg9IjIiPjxjaXJjbGUgY3g9IjExIiBjeT0iMTEiIHI9IjgiLz48cGF0aCBkPSJtMjEgMjEtNC4zLTQuMyIvPjwvc3ZnPg==')] bg-no-repeat bg-[length:16px] bg-[12px_center]"/>
                                <div className="relative">
                                    <button onClick={()=>setShowSortMenu(!showSortMenu)} className={`p-2 rounded-lg border border-zinc-200 dark:border-white/10 hover:bg-zinc-100 dark:hover:bg-white/5 transition-colors ${typeFilter !== 'ALL' ? 'text-brand border-brand' : 'text-zinc-500'}`} title="Sort & Filter Logs"><Icons.Sort className="w-4 h-4"/></button>
                                    {showSortMenu && (
                                        <div className="absolute right-0 top-full mt-2 w-40 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-white/10 rounded-lg shadow-xl z-50 py-1">
                                            <div className="px-3 py-1.5 text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Sort Order</div>
                                            <button onClick={()=>{setSortBy('date-desc'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${sortBy==='date-desc'?'text-indigo-500 font-bold':''}`}>Date (Newest)</button>
                                            <button onClick={()=>{setSortBy('date-asc'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${sortBy==='date-asc'?'text-indigo-500 font-bold':''}`}>Date (Oldest)</button>
                                            <div className="h-px bg-zinc-200 dark:bg-white/10 my-1"></div>
                                            <div className="px-3 py-1.5 text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Filter Type</div>
                                            <button onClick={()=>{setTypeFilter('ALL'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter==='ALL'?'text-indigo-500 font-bold':''}`}>All Types</button>
                                            <button onClick={()=>{setTypeFilter('MC'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter==='MC'?'text-indigo-500 font-bold':''}`}>MC Only</button>
                                            <button onClick={()=>{setTypeFilter('LQ'); setShowSortMenu(false)}} className={`w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 ${typeFilter==='LQ'?'text-indigo-500 font-bold':''}`}>LQ Only</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <button onClick={createLog} className="w-full bg-brand text-white py-2.5 rounded-lg font-bold text-sm hover:bg-indigo-600 shadow-lg transition-all flex justify-center items-center gap-2"><Icons.Plus className="w-4 h-4"/> Log New Error</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-2">
                            {filteredLogs.map(l => (
                                <motion.div 
                                    key={l.id} 
                                    onClick={()=>setActiveLogId(l.id)} 
                                    onContextMenu={(e) => handleContextMenu(e, l.id)}
                                    onMouseEnter={() => handleMouseEnter(l)}
                                    onMouseLeave={handleMouseLeave}
                                    className={`p-3.5 rounded-xl cursor-pointer border transition-all ${activeLogId===l.id ? 'bg-zinc-100 dark:bg-white/10 border-zinc-300 dark:border-white/20' : 'bg-transparent border-transparent hover:bg-zinc-50 dark:hover:bg-white/5'}`}
                                >
                                    <div className="flex justify-between items-start mb-1"><div className="font-semibold text-sm truncate pr-2 text-zinc-800 dark:text-zinc-200 w-full">{l.title}</div>{l.mastered && <Icons.Check className="w-4 h-4 text-green-500"/>}</div>
                                    <div className="flex justify-between items-center mt-2"><div className="flex gap-2"><span className="text-[10px] font-medium px-2 py-0.5 rounded bg-zinc-200 dark:bg-white/10 text-zinc-600 dark:text-zinc-400">{l.subject}</span>{l.topic && <span className="text-[10px] font-medium px-2 py-0.5 rounded border border-zinc-200 dark:border-white/10 text-zinc-500 truncate max-w-[80px]">{l.topic}</span>}</div><span className={`text-[10px] font-bold ${l.mastered ? 'text-green-600' : 'text-red-500'}`}>{l.mastered ? 'SOLVED' : 'REVIEW'}</span></div>

                            {hasMore && !isLoadingLogs && (

                                </button>

                                    <div className="flex-1 flex items-center gap-2 mr-4">

                                        <button onClick={handleAutoTitle} disabled={isAutoTitleLoading || (!activeLog.questionImages?.length && !activeLog.imageUrl)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isAutoTitleLoading ? 'bg-indigo-100 text-indigo-500 animate-pulse' : 'bg-zinc-100 dark:bg-white/10 text-zinc-600 dark:text-zinc-400 hover:bg-brand hover:text-white'}`}>{isAutoTitleLoading ? <div className="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <><Icons.Scan className="w-3 h-3"/><span className="hidden sm:inline">Auto-Title</span></>}</button>

                                        <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-1.5 rounded-full text-xs font-bold border transition-all ${activeLog.mastered ? 'bg-green-500/10 border-green-500 text-green-600' : 'bg-red-500/10 border-red-500 text-red-600'}`}>{activeLog.mastered ? 'Mastered' : 'Needs Review'}</button>
                                        <div className="h-6 w-px bg-zinc-200 dark:bg-white/10 mx-2"></div>
                                        <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-2 rounded-lg transition-colors ${!user ? 'cursor-not-allowed opacity-50 bg-zinc-100 dark:bg-white/5 text-zinc-400' : isAiOpen ? 'bg-brand/10 text-brand' : 'hover:bg-zinc-100 dark:hover:bg-white/5 text-zinc-500'}`} title={user ? "Open AI Tutor" : "Login required for AI Tutor"}><Icons.Bot className="w-5 h-5"/></button>
                                        <button onClick={() => handleDelete(activeLog.id)} className="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-zinc-400 hover:text-red-500 transition-colors"><Icons.Trash className="w-5 h-5"/></button>
                                    </div>
                                </header>

                                <div className="flex-1 overflow-y-auto p-6 md:p-10 scroll-smooth">
                                    <div className="max-w-5xl mx-auto space-y-8">
                                        <div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5 grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Subject</label><select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="input-field bg-zinc-50 dark:bg-black/20"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select></div>
                                            <div>
                                                <label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Topic</label>
                                                <div className="flex gap-2">
                                                    {activeLog.subject !== 'General' && currentSub ? (
                                                        <>
                                                            <select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20 flex-1">
                                                                <option value="">-- Select --</option>
                                                                {currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}
                                                            </select>
                                                            <button onClick={() => addTopicToSubject(activeLog.subject)} className="px-3 rounded-lg bg-zinc-100 dark:bg-white/5 hover:bg-brand hover:text-white transition-colors text-zinc-500 border border-zinc-200 dark:border-white/10" title="Add New Topic">
                                                                <Icons.Plus className="w-4 h-4"/>
                                                            </button>
                                                        </>
                                                    ) : (
                                                        <input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20 flex-1" placeholder="Custom" disabled={activeLog.subject !== 'General'}/>
                                                    )}
                                                </div>
                                            </div>
                                            <div><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Type</label><div className="flex bg-zinc-100 dark:bg-black/20 p-1 rounded-lg border border-zinc-200 dark:border-white/5">{['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-zinc-700 shadow-sm text-black dark:text-white' : 'text-zinc-500'}`}>{t}</button>))}</div></div>
                                        </div>
                                        <div className="space-y-6">
                                            <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label="Question Evidence" isUploading={uploadingQ}/>
                                            <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Marking Scheme" isUploading={uploadingS}/>
                                        </div>
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            <div className="lg:col-span-1 space-y-6"><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Correct Answer</label><input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-green-50 dark:bg-green-900/10 border border-green-200 dark:border-green-900/30 rounded-lg px-4 py-3 font-mono text-lg font-bold text-green-700 dark:text-green-400 focus:outline-none" placeholder="Ans"/></div><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Marks Lost</label><input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 rounded-lg px-4 py-3 font-bold text-red-700 dark:text-red-400 focus:outline-none" placeholder="-2"/></div></div>
                                            <div className="lg:col-span-2 bg-white dark:bg-surface rounded-2xl border border-zinc-200 dark:border-white/5 shadow-sm overflow-hidden flex flex-col min-h-[250px]"><div className="px-5 py-3 border-b border-zinc-200 dark:border-white/5 bg-zinc-50/50 dark:bg-white/5 flex justify-between items-center"><span className="text-xs font-bold text-zinc-500 uppercase tracking-wider">Analysis / Logic Gap</span><span className="text-[10px] text-zinc-400">Markdown supported</span></div><textarea className="flex-1 w-full p-5 bg-transparent outline-none resize-none text-sm leading-7 text-zinc-700 dark:text-zinc-300 placeholder-zinc-300 dark:placeholder-zinc-600" placeholder="• Why did I get this wrong?&#10;• What was the trap?&#10;• How do I solve it next time?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/></div>
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-zinc-400 h-full">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center"><div className="w-20 h-20 bg-zinc-100 dark:bg-white/5 rounded-3xl flex items-center justify-center mb-6 mx-auto shadow-inner"><Icons.Bug className="w-10 h-10 opacity-30"/></div><h2 className="text-xl font-bold text-zinc-700 dark:text-zinc-200 mb-2">No Mistake Selected</h2><p className="text-sm max-w-xs mx-auto">Select a log from the sidebar or create a new one to start documenting your learning journey.</p></motion.div>
                            </div>
                        )}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-[400px] z-30"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user}/></div>)}</AnimatePresence>
                        
                        {/* PRACTICE MODAL */}
                        {isPracticeOpen && activeLog && <PracticeModal activeLog={activeLog} onClose={() => setIsPracticeOpen(false)} user={user} />}
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
