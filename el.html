    const compressImage = async (fileOrBlob) => new Promise((resolve) => { const img = new Image(); const reader = new FileReader(); reader.onload = (e) => { img.src = e.target.result; img.onload = () => { const canvas = document.createElement('canvas'); const MAX_WIDTH = 3000; let width = img.width; let height = img.height; if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 1); } }; reader.readAsDataURL(fileOrBlob); });
    const callAI = async (prompt, systemInstruction = "", images = [], apiUrl = GEMINI_PROXY_URL) => { const parts = [{ text: `${systemInstruction}\n\nUser: ${prompt}` }]; if (images?.length > 0) { images.forEach(img => { let mimeType = "image/png", data = img; if (img.includes(",")) { const s = img.split(","); mimeType = s[0].match(/:(.*?);/)[1]; data = s[1]; } parts.push({ inlineData: { mimeType, data } }); }); } try { const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) }); if (!response.ok) return `Error: ${response.status}`; const data = await response.json(); if (data.error) return `API Error: ${data.error.message}`; return data.candidates?.[0]?.content?.parts?.[0]?.text || "Empty response."; } catch (error) { return `Error: ${error.message}`; } };

    const getLimits = async () => { const defaults = { chat_gemini: 5, chat_groq: 20, practice: 10, ocr: 20 }; try { const cfgRef = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'public', 'data', 'config', 'main'); const snap = await window.firebase.getDoc(cfgRef); if (snap.exists()) return { ...defaults, ...snap.data() }; } catch(e) {} return defaults; };
    
    // UPDATED: Now supports "Negative Number Hack" for students (verified OR temp_verified)
    const checkAndIncrementQuota = async (user, type, subtype = null) => { 
        if (!user) return false; 
        const limits = await getLimits(); 
        let field = '', limit = 0; 
        if (type === 'chat') { 
            if (subtype === 'groq') { field = 'chat_groq_count'; limit = limits.chat_groq; } 
            else { field = 'chat_count'; limit = limits.chat_gemini; } 
        } else if (type === 'practice') { field = 'practice_count'; limit = limits.practice; } 
        else if (type === 'ocr') { field = 'ocr_count'; limit = limits.ocr; } 

        const today = new Date().toISOString().split('T')[0]; 
        const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today); 

        try { 
            const snap = await window.firebase.getDoc(ref); 
            let count = 0;
            
            if (snap.exists()) {
                count = snap.data()[field] || 0;
            } else {
                // Initializing logic for the day
                const profileRef = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'settings', 'profile');
                const profileSnap = await window.firebase.getDoc(profileRef);
                const status = profileSnap.exists() ? profileSnap.data().studentStatus : null;
                const isStudent = status === 'verified' || status === 'temp_verified';
                // HACK: Start from -20 if student (or temp student) to give 20 extra credits
                count = isStudent ? -20 : 0;
                
                // If we are starting from negative, we must set it explicitly first
                if (count < 0) {
                     await window.firebase.setDoc(ref, { [field]: count + 1 }, { merge: true });
                     return count + 1;
                }

            if (count >= limit) return false; 
            
            if (snap.exists()) {
                 await window.firebase.setDoc(ref, { [field]: window.firebase.increment(1) }, { merge: true });
            } else {
                 await window.firebase.setDoc(ref, { [field]: 1 }, { merge: true });
            }
            return count + 1; 
        } catch (e) { return false; }

    const useGoogleDrive = () => { 
        const [tokenClient, setTokenClient] = useState(null); 
        useEffect(() => { 
            if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return; 
            const load = async () => { 
                if (window.gapi) { 
                    await new Promise(r => window.gapi.load('client', r)); 
                    await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });

            }; load();

        const getAccessToken = () => new Promise((resolve, reject) => { 
            if (!tokenClient) return reject("Auth not initialized"); 
            const existing = window.gapi.client.getToken(); 
            if (existing && Date.now() < existing.expiry) return resolve(existing.access_token); 
            tokenClient.callback = (resp) => { if (resp.error) reject(resp); resolve(resp.access_token); };

        const saveToDrive = async (blob, filename, preFetchedToken = null, folderName = 'darNote_Errors') => { 
            const token = preFetchedToken || await getAccessToken(); 
            let folderId; 
            const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`; 
            const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` } }); 
            const searchData = await search.json(); 
            if (searchData.files?.length) folderId = searchData.files[0].id; 
            else { 
                const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) }); 
                folderId = (await create.json()).id; 
            } 
            const metadata = { name: filename, mimeType: blob.type, parents: [folderId] }; 
            const form = new FormData(); 
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' })); 
            form.append('file', blob); 
            const upRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form }); 
            if(!upRes.ok) throw new Error(upRes.statusText); 
            const fileId = (await upRes.json()).id; 
            await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) }); 
            return blob.type === 'application/pdf' ? `https://drive.google.com/file/d/${fileId}/preview` : `https://lh3.googleusercontent.com/d/${fileId}`; 
        }; 
        return { saveToDrive, getAccessToken };

er && <div className="bg-green-900/20 border border-green-900/50 rounded px-3 py-2"><div className="text-[9px] text-green-500 font-bold uppercase">Answer</div><div className="text-lg font-mono font-bold text-green-400">{activeLog.correctAnswer}</div></div>}{activeLog.marks && <div className="bg-red-900/20 border border-red-900/50 rounded px-3 py-2"><div className="text-[9px] text-red-500 font-bold uppercase">Lost</div><div className="text-lg font-mono font-bold text-red-400">{activeLog.marks}</div></div>}</div>)}</div></div></div>)}</motion.div>);

ionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="mt-2 w-full p-3 text-xs bg-zinc-100 dark:bg-black/20 border border-zinc-200 dark:border-white/5 rounded-lg font-mono text-zinc-600 dark:text-zinc-400 focus:outline-none" rows="4" placeholder="AI will extract text here automatically..." />)}</div></div><MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label="Marking Scheme" isUploading={uploadingS} onImageClick={() => setCompareMode(true)} /></div><div className="grid grid-cols-1 lg:grid-cols-3 gap-6"><div className="lg:col-span-1 space-y-6"><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Correct Answer</label><input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-green-50 dark:bg-green-900/10 border border-green-200 dark:border-green-900/30 rounded-lg px-4 py-3 font-mono text-lg font-bold text-green-700 dark:text-green-400 focus:outline-none" placeholder="Ans"/></div><div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5"><label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Marks Lost</label><input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 rounded-lg px-4 py-3 font-bold text-red-700 dark:text-red-400 focus:outline-none" placeholder="-2"/></div></div><div className="lg:col-span-2 bg-white dark:bg-surface rounded-2xl border border-zinc-200 dark:border-white/5 shadow-sm overflow-hidden flex flex-col min-h-[250px]"><div className="px-5 py-3 border-b border-zinc-200 dark:border-white/5 bg-zinc-50/50 dark:bg-white/5 flex justify-between items-center"><span className="text-xs font-bold text-zinc-500 uppercase tracking-wider">Analysis / Logic Gap</span><span className="text-[10px] text-zinc-400">Markdown supported</span></div><textarea className="flex-1 w-full p-5 bg-transparent outline-none resize-none text-sm leading-7 text-zinc-700 dark:text-zinc-300 placeholder-zinc-300 dark:placeholder-zinc-600" placeholder="• Why did I get this wrong?&#10;• What was the trap?&#10;• How do I solve it next time?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/></div></div></div></div></motion.div>) : (<div className="flex-1 flex flex-col items-center justify-center text-zinc-400 h-full"><motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center"><div className="w-20 h-20 bg-zinc-100 dark:bg-white/5 rounded-3xl flex items-center justify-center mb-6 mx-auto shadow-inner"><Icons.Bug className="w-10 h-10 opacity-30"/></div><h2 className="text-xl font-bold text-zinc-700 dark:text-zinc-200 mb-2">No Mistake Selected</h2><p className="text-sm max-w-xs mx-auto">Select a log from the sidebar or create a new one to start documenting your learning journey.</p></motion.div></div>)}<AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-[400px] z-30"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>{practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}</main></div>);
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
