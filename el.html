        };

        // --- GEMINI & HELPERS ---
        const callGemini = async (prompt, sysInstruction="", imgBase64=null) => {
            const parts = [{ text: `${sysInstruction}\n\nUser: ${prompt}` }];
            if (imgBase64) {
                let mime="image/png", data=imgBase64;
                if(imgBase64.includes(",")){const s=imgBase64.split(","); mime=s[0].match(/:(.*?);/)[1]; data=s[1];}
                parts.push({ inlineData: { mimeType: mime, data } });
            }
            try {
                const r = await fetch(GEMINI_PROXY_URL, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({contents:[{parts}]})
                });
                if(!r.ok) throw new Error("API Error");
                const d = await r.json();
                return d.candidates?.[0]?.content?.parts?.[0]?.text || "Error: Empty";
            } catch(e) { return `Error: ${e.message}`; }
        };

        const checkAndIncrementQuota = async (user, type) => {
            if (!user) return false;
            const limits = { chat: 5, practice: 10, ocr: 20 };
            const field = `${type}_count`;
            const today = new Date().toISOString().split('T')[0];
            const ref = window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'ai_usage', today);
            try {
                const snap = await window.firebase.getDoc(ref);
                const count = snap.exists() ? (snap.data()[field] || 0) : 0;
                if (count >= limits[type]) return false;
                await window.firebase.setDoc(ref, { [field]: window.firebase.increment(1) }, { merge: true });
                return count + 1;
            } catch (e) { return false; }
        };

        const cleanLatex = (text) => {
            return text.replace(/\$\$/g, '\n').replace(/\$/g, '').replace(/\\text\{([^}]+)\}/g, '$1')
                .replace(/\\times/g, '×').replace(/\\approx/g, '≈').replace(/\\le/g, '≤').replace(/\\ge/g, '≥')
                .replace(/\\rightarrow/g, '→').replace(/\\cdot/g, '·').replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, '($1/$2)').replace(/\\/g, '');
        }

        const useGoogleDrive = () => {
            const [client, setClient] = useState(null);
            useEffect(() => {
                if(!GDRIVE_API_KEY) return;
                const init = async () => {
                    if(window.gapi) { await new Promise(r=>window.gapi.load('client',r)); await window.gapi.client.init({apiKey:GDRIVE_API_KEY, discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']}); }
                    if(window.google) setClient(window.google.accounts.oauth2.initTokenClient({client_id:GDRIVE_CLIENT_ID, scope:'https://www.googleapis.com/auth/drive.file', callback:()=>{}}));
                }; init();
            }, []);
            const saveToDrive = async (blob, name) => {
                if (!client) throw new Error("Auth error");
                const token = await new Promise((res, rej) => {
                    client.callback = (resp) => resp.error ? rej(resp) : res(resp.access_token);
                    client.requestAccessToken({prompt:''});
                });
                const folderUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='darNote_Errors' and trashed=false")}`;
                const search = await (await fetch(folderUrl, {headers:{Authorization:`Bearer ${token}`}})).json();
                let folderId = search.files?.[0]?.id;
                if (!folderId) {
                    const create = await fetch('https://www.googleapis.com/drive/v3/files', {
                        method:'POST', headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
                        body:JSON.stringify({name:'darNote_Errors', mimeType:'application/vnd.google-apps.folder'})
                    });
                    folderId = (await create.json()).id;
                }
                const meta = { name, mimeType: blob.type, parents: [folderId] };
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(meta)],{type:'application/json'}));
                form.append('file', blob);
                const up = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
                    method:'POST', headers:{Authorization:`Bearer ${token}`}, body:form
                });
                const fileId = (await up.json()).id;
                await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/permissions`, {
                    method:'POST', headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'}, body:JSON.stringify({role:'reader',type:'anyone'})
                });
                return `https://lh3.googleusercontent.com/d/${fileId}`;
            };
            return { saveToDrive };
        };

        // --- COMPONENTS ---
        const Lightbox = ({ imgs, idx, close }) => {
            const [i, setI] = useState(idx);
            useEffect(() => {
                const k = (e) => {
                    if(e.key==='Escape') close();
                    if(e.key==='ArrowRight') setI((p)=>(p+1)%imgs.length);
                    if(e.key==='ArrowLeft') setI((p)=>(p-1+imgs.length)%imgs.length);
                }; window.addEventListener('keydown', k); return ()=>window.removeEventListener('keydown',k);
            }, [imgs]);
            return (
                <div className="fixed inset-0 z-[60] bg-black/95 flex items-center justify-center backdrop-blur-sm" onClick={close}>
                    <button onClick={close} className="absolute top-4 right-4 text-white/50 hover:text-white"><Icons.X className="w-8 h-8"/></button>
                    <img onClick={e=>e.stopPropagation()} src={imgs[i]} className="max-h-[90vh] max-w-[90vw] object-contain rounded-lg"/>
                    <div className="absolute bottom-6 text-white/30 font-mono text-xs">{i+1} / {imgs.length}</div>
                </div>
            );
        };

        const MultiImageUploader = ({ images=[], onUpdate, label, loading }) => {
            const ref = useRef(null);
            const list = Array.isArray(images) ? images : (images?[images]:[]);
            const hFiles = (fs) => Array.from(fs).filter(f=>f.type.startsWith('image/')).forEach(f=>onUpdate(f,'add'));
            return (
                <div className="space-y-2">
                    <div className="flex justify-between items-center px-1">
                        <label className="text-sm font-bold text-zinc-700 dark:text-zinc-300 flex items-center gap-2">{label} <span className="bg-zinc-100 dark:bg-white/5 px-1.5 rounded text-[10px] text-zinc-400">{list.length}</span></label>
                        <div className="flex gap-2">
                            <button onClick={async()=>{try{const items=await navigator.clipboard.read(); for(const i of items){for(const t of i.types){if(t.startsWith("image/")){onUpdate(await i.getType(t),'add');}}}}catch(e){alert("Paste image failed");}}} className="text-[10px] text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 px-2 py-1 rounded flex gap-1"><Icons.Clip className="w-3 h-3"/> Paste</button>
                            <button onClick={()=>ref.current.click()} className="text-[10px] text-zinc-500 hover:bg-zinc-100 dark:hover:bg-white/10 px-2 py-1 rounded flex gap-1"><Icons.Plus className="w-3 h-3"/> Add</button>
                        </div>
                        <input type="file" multiple ref={ref} className="hidden" onChange={e=>hFiles(e.target.files)} accept="image/*"/>
                    </div>
                    <div className="w-full min-h-[100px] bg-white dark:bg-surface border-2 border-dashed border-zinc-200 dark:border-zinc-700 rounded-xl p-3" onDrop={e=>{e.preventDefault();hFiles(e.dataTransfer.files)}} onDragOver={e=>e.preventDefault()} onPaste={e=>hFiles(e.clipboardData.files)}>
                        {list.length===0 ? <div className="h-full flex items-center justify-center text-zinc-400 text-xs"><Icons.Image className="w-5 h-5 mr-2"/> Drag or Paste</div> : 
                        <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                            {list.map((u,i)=>(<div key={i} className="aspect-square bg-black/20 rounded relative group overflow-hidden"><img src={u} className="w-full h-full object-cover"/><button onClick={()=>onUpdate(i,'remove')} className="absolute top-1 right-1 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100"><Icons.Trash className="w-3 h-3"/></button></div>))}
                            {loading && <div className="aspect-square flex items-center justify-center bg-zinc-50 dark:bg-white/5 rounded animate-pulse"><div className="w-5 h-5 border-2 border-brand border-t-transparent rounded-full animate-spin"/></div>}
                        </div>}
                    </div>
                </div>
            );
        };

        const AIChat = ({ activeLog, onClose, user }) => {
            const [msgs, setMsgs] = useState([{role:'ai',text:"I see your failure. Ask me why."}]);
            const [txt, setTxt] = useState("");
            const [load, setLoad] = useState(false);
            const [quota, setQuota] = useState(0);
            const end = useRef(null);

            useEffect(()=>{end.current?.scrollIntoView({behavior:"smooth"});},[msgs]);
            const send = async () => {
                if(!txt.trim()) return;
                const nQ = await checkAndIncrementQuota(user, 'chat');
                const userMsg = txt; setMsgs(p=>[...p,{role:'user',text:userMsg}]); setTxt("");
                if(nQ===false) return setMsgs(p=>[...p,{role:'ai',text:"**Quota Reached.** Come back tomorrow."}]);
                setQuota(nQ); setLoad(true);
                let img = activeLog.questionImages?.[0] || activeLog.imageUrl;
                if(img && img.startsWith('http')) { try{const r=await fetch(img);const b=await r.blob();img=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}catch(e){img=null;} }
                const h = msgs.slice(-6).map(m=>`${m.role==='user'?'S':'T'}: ${m.text}`).join('\n');
                const sys = `Tutor. Context: ${activeLog.subject}, ${activeLog.topic}. Ans: ${activeLog.correctAnswer}. Expl: ${activeLog.explanation}. Chat: ${h}. Be concise. Markdown. No LaTeX.`;
                let res = await callGemini(userMsg, sys, img);
                res = cleanLatex(res);
                setMsgs(p=>[...p,{role:'ai',text:res}]); setLoad(false);
            };
            return (
                <div className="flex flex-col h-full bg-white dark:bg-onyx border-l border-zinc-200 dark:border-white/10 shadow-2xl">
                    <div className="p-3 border-b border-zinc-200 dark:border-white/10 flex justify-between bg-zinc-50 dark:bg-zinc-900">
                        <span className="font-bold text-xs flex items-center gap-2"><Icons.Bot className="w-4 h-4 text-brand"/> AI Tutor <span className="text-[10px] bg-indigo-500 text-white px-1.5 rounded">{quota}/5</span></span>
                        <button onClick={onClose}><Icons.X className="w-4 h-4"/></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 markdown-content text-sm">{msgs.map((m,i)=><div key={i} className={`p-3 rounded-xl max-w-[85%] ${m.role==='user'?'ml-auto bg-brand text-white':'bg-zinc-100 dark:bg-zinc-800'}`} dangerouslySetInnerHTML={{__html:marked.parse(m.text)}}/>)}{load && <div className="text-xs text-zinc-500 animate-pulse pl-2">Thinking...</div>}<div ref={end}/></div>
                    <div className="p-3 border-t border-zinc-200 dark:border-white/10 bg-white dark:bg-zinc-900 flex gap-2"><input value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} className="flex-1 bg-zinc-100 dark:bg-white/5 border border-zinc-200 dark:border-white/10 rounded-full px-3 py-2 text-xs" placeholder="Ask..."/><button onClick={send} disabled={load} className="bg-brand text-white rounded-full p-2"><Icons.Plus className="w-4 h-4 rotate-90"/></button></div>
                </div>
            );
        };

        const PracticeModal = ({ activeLog, onClose, user }) => {
            const [load, setLoad] = useState(true);
            const [mode, setMode] = useState(activeLog.questionType || 'MC');
            const [data, setData] = useState(null);
            const [ans, setAns] = useState({});
            const [marked, setMarked] = useState(false);
            const [feedback, setFeedback] = useState(null);

            useEffect(()=>{ gen(); },[]);
            const gen = async () => {
                setLoad(true);
                if((await checkAndIncrementQuota(user,'practice'))===false) { alert("Quota Reached"); onClose(); return; }
                let img = activeLog.questionImages?.[0] || activeLog.imageUrl;
                if(img && img.startsWith('http')) { try{const r=await fetch(img);const b=await r.blob();img=await new Promise(re=>{const fr=new FileReader();fr.onload=()=>re(fr.result);fr.readAsDataURL(b);});}catch(e){img=null;} }
                const p = mode==='MC' ? 'Gen 5 MCQs (ABCD). JSON array: [{"q":"..","options":["A..","B.."],"answer":"A","explanation":".."}]. No LaTeX.' : 'Gen 1 Long Q (3 parts). JSON: {"context":"..","parts":[{"id":"a","text":"..","marks":2}..]}. No LaTeX.';
                try { const r = await callGemini(p, "JSON Generator", img); setData(JSON.parse(r.replace(/```json|```/g,''))); } catch(e){ alert("Gen Failed"); onClose(); }
                setLoad(false);
            };
            const check = async () => {
                if(mode==='MC') return setMarked(true);
                setLoad(true);
                const p = `Mark answer. Ctx: ${data.context}. Parts: ${JSON.stringify(data.parts)}. Ans: ${JSON.stringify(ans)}. JSON: {"totalScore":5,"maxScore":10,"generalFeedback":"..","partFeedback":{"a":{"score":1,"comment":".."}}}.`;
                try { const r = await callGemini(p,"Examiner"); setFeedback(JSON.parse(r.replace(/```json|```/g,''))); setMarked(true); } catch(e){ alert("Marking Failed"); }
                setLoad(false);
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-zinc-900 w-full max-w-2xl rounded-2xl flex flex-col max-h-[85vh]">
                        <div className="p-4 border-b border-zinc-200 dark:border-white/10 flex justify-between"><h3 className="font-bold flex gap-2 dark:text-white"><Icons.Brain className="w-5 h-5"/> Practice</h3><button onClick={onClose}><Icons.X/></button></div>
                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                            {load ? <div className="text-center py-10 animate-pulse text-zinc-500">Generating Drill...</div> : mode==='MC' ? (
                                data?.map((q,i)=><div key={i} className="space-y-2"><div className="font-bold text-sm dark:text-white">{i+1}. {q.q}</div><div className="grid grid-cols-2 gap-2">{q.options.map(o=>{
                                    const l=o[0]; const sel=ans[i]===l; const cor=q.answer===l;
                                    let bg = "bg-zinc-50 dark:bg-white/5 border-zinc-200 dark:border-white/10";
                                    if(marked){ if(cor) bg="bg-green-500/20 border-green-500"; else if(sel) bg="bg-red-500/20 border-red-500"; }
                                    else if(sel) bg="bg-brand/10 border-brand";
                                    return <button key={o} onClick={()=>!marked&&setAns({...ans,[i]:l})} className={`p-2 rounded border text-xs text-left dark:text-zinc-300 ${bg}`}>{o}</button>
                                })}</div>{marked&&<div className="text-xs bg-zinc-100 dark:bg-white/5 p-2 rounded text-zinc-600 dark:text-zinc-400"><b>Why:</b> {q.explanation}</div>}</div>)
                            ) : (data && <div className="space-y-4"><div className="p-3 bg-zinc-50 dark:bg-white/5 rounded text-sm dark:text-zinc-200">{data.context}</div>{data.parts.map(pt=><div key={pt.id} className="space-y-1"><div className="flex justify-between text-xs font-bold dark:text-white"><span>({pt.id}) {pt.text}</span><span>[{pt.marks}]</span></div><textarea value={ans[pt.id]||''} onChange={e=>setAns({...ans,[pt.id]:e.target.value})} disabled={marked} className="w-full bg-transparent border border-zinc-200 dark:border-white/10 rounded p-2 text-xs dark:text-white"/><div className="text-xs text-right text-brand">{marked && `${feedback?.partFeedback[pt.id]?.score}/${pt.marks} - ${feedback?.partFeedback[pt.id]?.comment}`}</div></div>)}<div className="text-center font-bold text-xl text-brand">{marked && `${feedback?.totalScore} / ${feedback?.maxScore}`}</div></div>)}
                        </div>
                        <div className="p-4 border-t border-zinc-200 dark:border-white/10 flex justify-end gap-2">
                            {!marked ? <button onClick={check} className="bg-brand text-white px-4 py-2 rounded-lg font-bold text-sm">Submit</button> : <button onClick={onClose} className="bg-zinc-200 dark:bg-white/10 px-4 py-2 rounded-lg font-bold text-sm dark:text-white">Done</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const ContextMenu = ({ visible, x, y, logId, onDuplicate, onDelete, onCopy, onPaste }) => {
            if (!visible) return null;
            return (
                <div className="fixed z-50 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-white/10 rounded-lg shadow-xl py-1 w-40 context-menu" style={{ top: y, left: x }}>
                    <button onClick={() => onDuplicate(logId)} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 flex items-center gap-2"><Icons.Plus className="w-3 h-3"/> Duplicate</button>
                    <button onClick={() => onCopy(logId)} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 flex items-center gap-2"><Icons.Copy className="w-3 h-3"/> Copy Data</button>
                    <button onClick={onPaste} className="w-full text-left px-3 py-2 text-xs hover:bg-zinc-100 dark:hover:bg-white/5 flex items-center gap-2"><Icons.Clip className="w-3 h-3"/> Paste Log</button>
                    <div className="h-px bg-zinc-200 dark:bg-white/10 my-1"></div>
                    <button onClick={() => onDelete(logId)} className="w-full text-left px-3 py-2 text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-900/10 flex items-center gap-2"><Icons.Trash className="w-3 h-3"/> Delete</button>
                </div>
            );
        };

        // --- APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [subs, setSubs] = useState([]);
            const [activeId, setActiveId] = useState(()=>new URLSearchParams(window.location.search).get('log'));
            const [filter, setFilter] = useState('all'); // all, active, mastered, subject:X
            const [qType, setQType] = useState('ALL');   // ALL, MC, LQ
            const [sortBy, setSortBy] = useState('date-desc');
            const [search, setSearch] = useState('');
            const [aiOpen, setAiOpen] = useState(false);
            const [pracOpen, setPracOpen] = useState(false);
            const [dark, setDark] = useState(true);
            const [loading, setLoading] = useState(false);
            const [autoTitleLoading, setAutoTitleLoading] = useState(false);
            const [previewLog, setPreviewLog] = useState(null);
            const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, logId: null });
            
            // Pagination
            const [last, setLast] = useState(null);
            const [more, setMore] = useState(true);

            const { saveToDrive } = useGoogleDrive();
            const saveTimer = useRef(null);
            const hoverTimeoutRef = useRef(null);

            // Auth & Init
            useEffect(() => {
                const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, u => {
                    if(u) {
                        setUser(u); fetchLogs(false, u.uid);
                        window.firebase.getDocs(window.firebase.collection(window.firebase.db,'artifacts',"darnote-app",'users',u.uid,'subjects')).then(s=>setSubs(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name))));
                    } else setUser(null);
                });
                return () => unsub();
            }, []);

            useEffect(()=>{ document.documentElement.className = dark ? 'dark' : ''; },[dark]);
            useEffect(() => { const handleClick = () => setContextMenu({ ...contextMenu, visible: false }); window.addEventListener('click', handleClick); return () => window.removeEventListener('click', handleClick); }, [contextMenu]);
            
            // RE-FETCH ON FILTER CHANGE
            useEffect(() => { if(user) { setLogs([]); setLast(null); fetchLogs(false); } }, [filter, qType, sortBy]);

            const fetchLogs = async (isMore=false, uid=user?.uid) => {
                if(!uid) return;
                setLoading(true);
                try {
                    const db = window.firebase.db;
                    let q = window.firebase.collection(db, 'artifacts', "darnote-app", 'users', uid, 'error_logs');
                    
                    // 1. DATABASE FILTERING
                    if (filter === 'active') q = window.firebase.query(q, window.firebase.where('mastered', '==', false));
                    else if (filter === 'mastered') q = window.firebase.query(q, window.firebase.where('mastered', '==', true));
                    else if (filter.startsWith('subject:')) q = window.firebase.query(q, window.firebase.where('subject', '==', filter.split(':')[1]));
                    
                    if (qType !== 'ALL') q = window.firebase.query(q, window.firebase.where('questionType', '==', qType));

                    // 2. SORTING
                    q = window.firebase.query(q, window.firebase.orderBy('createdAt', sortBy==='date-desc'?'desc':'asc'));

                    // 3. PAGINATION
                    if(isMore && last) q = window.firebase.query(q, window.firebase.startAfter(last));
                    q = window.firebase.query(q, window.firebase.limit(10));

                    const snap = await window.firebase.getDocs(q);
                    const data = snap.docs.map(d=>({id:d.id, ...d.data(), questionImages:d.data().questionImages||(d.data().imageUrl?[d.data().imageUrl]:[]), schemeImages:d.data().schemeImages||(d.data().markingSchemeUrl?[d.data().markingSchemeUrl]:[])}));
                    
                    setLogs(p => isMore ? [...p, ...data] : data);
                    setLast(snap.docs[snap.docs.length-1]);
                    setMore(snap.docs.length === 10);
                } catch(e) { 
                    console.error(e);
                    if(e.message.includes("index")) alert("⚠️ INDEX MISSING: Open Console (F12) & Click the Firebase Link!");
                }
                setLoading(false);
            };

            const updateLog = (id, up) => {
                const u = { ...up, lastModified: new Date().toISOString() };
                setLogs(p=>p.map(l=>l.id===id?{...l,...u}:l));
                clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => window.firebase.updateDoc(window.firebase.doc(window.firebase.db,'artifacts',"darnote-app",'users',user.uid,'error_logs',id), u), 2000);
            };

            const activeLog = logs.find(l=>l.id===activeId);
            const currentSub = activeLog ? subs.find(s=>s.name===activeLog.subject) : null;

            // Restored Helpers
            const handleContextMenu = (e, logId) => { e.preventDefault(); setContextMenu({ visible: true, x: e.clientX, y: e.clientY, logId }); };
            const handleDuplicate = async (id) => { const original = logs.find(l => l.id === id); if (!original) return; const { id: _, ...data } = original; const newLog = { ...data, title: `${data.title} (Copy)`, createdAt: new Date().toISOString() }; const r = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog); setLogs(prev => [{...newLog, id: r.id}, ...prev]); };
            const handleDelete = async (id) => { if(!confirm("Delete?")) return; setLogs(p => p.filter(l => l.id !== id)); if (activeId === id) setActiveId(null); await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', id)); };
            const handleCopy = (id) => { const original = logs.find(l => l.id === id); if (original) navigator.clipboard.writeText(JSON.stringify(original)); };
            const handlePaste = async () => { try { const text = await navigator.clipboard.readText(); const data = JSON.parse(text); if (data.title && data.createdAt) { const { id, ...cleanData } = data; const newLog = { ...cleanData, title: `${cleanData.title} (Pasted)`, createdAt: new Date().toISOString() }; const r = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog); setLogs(prev => [{...newLog, id: r.id}, ...prev]); } } catch(e) { alert("Invalid log data"); } };
            const addTopicToSubject = async (subjectName) => { const subjectDoc = subs.find(s => s.name === subjectName); if (!subjectDoc) return; const newTopic = prompt(`Add topic for ${subjectName}:`); if (!newTopic) return; setSubs(prev => prev.map(s => s.id === subjectDoc.id ? {...s, topics: [...(s.topics||[]), newTopic]} : s)); await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'subjects', subjectDoc.id), { topics: window.firebase.arrayUnion(newTopic) }); };
            const handleAutoTitle = async () => { if (!activeLog.questionImages?.length && !activeLog.imageUrl) return alert("No Image"); if(await checkAndIncrementQuota(user,'ocr')===false) return alert("Quota Reached"); setAutoTitleLoading(true); try { let url = activeLog.questionImages?.[0] || activeLog.imageUrl; let base64 = url; if(!url.startsWith('data:')) { const res = await fetch(url); const b = await res.blob(); base64 = await new Promise(r=>{const rd=new FileReader(); rd.onload=()=>r(rd.result); rd.readAsDataURL(b);}); } const title = await callGemini("Identify concept. Short title (max 6 words).", "Summarizer", base64); updateLog(activeId, { title: title.replace(/^["']|["']$/g, '').trim() }); } catch(e) { alert("OCR Failed"); } setAutoTitleLoading(false); }
            const handleMouseEnter = (log) => { if (hoverTimeoutRef.current) clearTimeout(hoverTimeoutRef.current); hoverTimeoutRef.current = setTimeout(() => { const img = log.questionImages?.[0] || log.imageUrl; if (img) setPreviewLog(log); }, 600); };
            const handleMouseLeave = () => { if (hoverTimeoutRef.current) clearTimeout(hoverTimeoutRef.current); setPreviewLog(null); };

            // Login Screen
            if(!user) return <div className="h-screen w-full flex flex-col items-center justify-center bg-zinc-950 text-white gap-4"><img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-20"/><h1 className="text-2xl font-bold">Error Log Pro</h1><button onClick={()=>window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-white text-black px-6 py-2 rounded-full font-bold flex gap-2"><Icons.Google className="w-5"/> Sign In</button></div>;

            return (
                <div className="flex h-screen w-full transition-colors duration-300 dark:bg-onyx bg-[#f4f4f5]">
                    <ContextMenu visible={contextMenu.visible} x={contextMenu.x} y={contextMenu.y} logId={contextMenu.logId} onDuplicate={handleDuplicate} onDelete={handleDelete} onCopy={handleCopy} onPaste={handlePaste}/>
                    
                    {/* PREVIEW CARD */}
                    <AnimatePresence>
                        {previewLog && (
                            <div className="fixed z-[100] top-0 bottom-0 left-[340px] md:left-[540px] pointer-events-none flex flex-col justify-center p-4">
                                <motion.div initial={{ opacity: 0, x: -20, scale: 0.95 }} animate={{ opacity: 1, x: 0, scale: 1 }} exit={{ opacity: 0, scale: 0.95 }} className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-white/10 rounded-xl shadow-2xl p-2 max-w-lg max-h-[80vh] overflow-hidden flex flex-col">
                                    <div className="text-[10px] font-bold px-2 py-1 text-zinc-400 uppercase flex justify-between"><span>Quick Preview</span><span>{previewLog.questionType}</span></div>
                                    <img src={previewLog.questionImages?.[0] || previewLog.imageUrl} className="rounded-lg object-contain max-h-[60vh] bg-zinc-100 dark:bg-black/50" />
                                    <div className="mt-2 px-2 pb-1"><div className="font-bold text-sm truncate dark:text-zinc-100">{previewLog.title}</div><div className="text-[10px] text-zinc-500 truncate">{previewLog.subject}</div></div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* SIDEBAR */}
                    <div className="w-[240px] hidden md:flex flex-col glass-panel p-4 z-20">
                        <div className="flex items-center gap-2 mb-6"><img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-6"/><span className="font-bold text-sm dark:text-white">darNote</span></div>
                        <nav className="space-y-1">
                            <a href="note.html" className="btn-ghost flex items-center gap-3 px-3 py-2 rounded-lg text-xs mb-4"><Icons.Book className="w-4"/> Back to Notes</a>
                            {[{id:'all',l:'All Errors',i:Icons.Bug},{id:'active',l:'Needs Review',i:Icons.X},{id:'mastered',l:'Mastered',i:Icons.Check}].map(x=><button key={x.id} onClick={()=>setFilter(x.id)} className={`w-full flex gap-3 px-3 py-2 rounded-lg text-xs font-medium ${filter===x.id?'bg-zinc-200 dark:bg-white/10 dark:text-white':'btn-ghost'}`}><x.i className="w-4"/> {x.l}</button>)}
                        </nav>
                        <div className="mt-4 pt-4 border-t border-zinc-200 dark:border-white/10"><div className="text-[10px] font-bold text-zinc-400 mb-2 px-2">SUBJECTS</div><div className="space-y-0.5 overflow-y-auto max-h-[200px]">{subs.map(s=><button key={s.id} onClick={()=>setFilter(`subject:${s.name}`)} className="w-full text-left px-3 py-1.5 rounded-lg text-xs btn-ghost truncate">{s.name}</button>)}</div></div>
                        <div className="mt-auto pt-4 border-t border-zinc-200 dark:border-white/10 flex items-center gap-2"><img src={user.photoURL} className="w-8 h-8 rounded-full"/><div className="overflow-hidden"><div className="text-xs font-bold dark:text-white truncate">{user.displayName}</div></div><button onClick={()=>setDark(!dark)} className="ml-auto btn-ghost p-1 rounded"><Icons.Sun className="w-4"/></button></div>
                    </div>

                    {/* LIST */}
                    <div className="w-full md:w-[300px] flex-shrink-0 bg-white dark:bg-surface border-r border-zinc-200 dark:border-white/5 flex flex-col z-10">
                        <div className="p-3 border-b border-zinc-200 dark:border-white/5 space-y-2">
                            <div className="flex gap-2">
                                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." className="input-field"/>
                                <select value={qType} onChange={e=>setQType(e.target.value)} className="w-20 bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-white/10 rounded-lg text-xs px-1"><option value="ALL">All</option><option value="MC">MC</option><option value="LQ">LQ</option></select>
                            </div>
                            <button onClick={async()=>{const r=await window.firebase.addDoc(window.firebase.collection(window.firebase.db,'artifacts',"darnote-app",'users',user.uid,'error_logs'),{title:'New Mistake',subject:'General',createdAt:new Date().toISOString(),mastered:false,questionType:'MC'}); setActiveId(r.id); fetchLogs();}} className="w-full bg-brand text-white py-2 rounded-lg text-xs font-bold flex justify-center gap-2"><Icons.Plus className="w-4"/> New Log</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-2">
                            {logs.filter(l=>l.title.toLowerCase().includes(search.toLowerCase())).map(l=>(
                                <div key={l.id} onClick={()=>setActiveId(l.id)} onContextMenu={(e)=>handleContextMenu(e, l.id)} onMouseEnter={()=>handleMouseEnter(l)} onMouseLeave={handleMouseLeave} className={`p-3 rounded-xl cursor-pointer border transition-all ${activeId===l.id?'bg-zinc-100 dark:bg-white/10 border-zinc-300 dark:border-white/20':'border-transparent hover:bg-zinc-50 dark:hover:bg-white/5'}`}>
                                    <div className="flex justify-between mb-1"><div className="font-semibold text-xs truncate dark:text-zinc-200">{l.title}</div>{l.mastered&&<Icons.Check className="w-3 text-green-500"/>}</div>
                                    <div className="flex justify-between items-center"><span className="text-[10px] bg-zinc-200 dark:bg-white/10 px-1.5 py-0.5 rounded text-zinc-500">{l.subject}</span><span className={`text-[10px] font-bold ${l.mastered?'text-green-600':'text-red-500'}`}>{l.questionType}</span></div>
                                </div>
                            ))}
                            {more && <button onClick={()=>fetchLogs(true)} className="w-full py-2 text-xs text-zinc-400 border border-dashed rounded dark:border-zinc-700">{loading?'Loading...':'Load More'}</button>}
                        </div>
                    </div>

                    {/* EDITOR */}
                    <main className="flex-1 bg-[#f4f4f5] dark:bg-onyx relative flex flex-col min-w-0">
                        {activeLog ? (
                            <div className="flex flex-col h-full">
                                <header className="h-14 flex items-center justify-between px-4 bg-white dark:bg-surface border-b border-zinc-200 dark:border-white/5 shrink-0">
                                    <div className="flex items-center gap-2 flex-1 mr-4">
                                        <input value={activeLog.title} onChange={e=>updateLog(activeId,{title:e.target.value})} className="bg-transparent text-lg font-bold w-full outline-none dark:text-white"/>
                                        <button onClick={handleAutoTitle} disabled={autoTitleLoading} className="btn-ghost px-2 py-1 rounded-lg text-xs flex gap-1">{autoTitleLoading ? <div className="w-3 h-3 animate-spin border-2 border-brand rounded-full border-t-transparent"/> : <><Icons.Scan className="w-3"/> <span className="hidden sm:inline">Auto</span></>}</button>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>setPracOpen(true)} className="btn-ghost px-3 py-1.5 rounded-lg text-xs font-bold bg-zinc-100 dark:bg-white/10 hover:bg-orange-500 hover:text-white flex gap-1"><Icons.Brain className="w-3"/> Drill</button>
                                        <button onClick={()=>setAiOpen(!aiOpen)} className={`px-2 rounded-lg ${aiOpen?'text-brand bg-brand/10':'btn-ghost'}`}><Icons.Bot className="w-5"/></button>
                                        <button onClick={()=>handleDelete(activeId)} className="text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded-lg"><Icons.Trash className="w-4"/></button>
                                    </div>
                                </header>
                                <div className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
                                    <div className="bg-white dark:bg-surface p-4 rounded-xl border border-zinc-200 dark:border-white/5 grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div><div className="text-[10px] font-bold text-zinc-400 uppercase mb-1">Subject</div><select value={activeLog.subject} onChange={e=>updateLog(activeId,{subject:e.target.value, topic:''})} className="input-field bg-zinc-50 dark:bg-black/20 text-xs"><option>General</option>{subs.map(s=><option key={s.id}>{s.name}</option>)}</select></div>
                                        <div>
                                            <div className="text-[10px] font-bold text-zinc-400 uppercase mb-1">Topic</div>
                                            {activeLog.subject !== 'General' && currentSub ? (
                                                <div className="flex gap-1">
                                                    <select value={activeLog.topic||''} onChange={e=>updateLog(activeId,{topic:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20 text-xs flex-1"><option value="">--</option>{currentSub.topics?.map(t=><option key={t}>{t}</option>)}</select>
                                                    <button onClick={()=>addTopicToSubject(activeLog.subject)} className="px-2 bg-zinc-100 dark:bg-white/5 rounded text-zinc-500 hover:bg-brand hover:text-white"><Icons.Plus className="w-3"/></button>
                                                </div>
                                            ) : <input value={activeLog.topic||''} onChange={e=>updateLog(activeId,{topic:e.target.value})} className="input-field bg-zinc-50 dark:bg-black/20 text-xs"/>}
                                        </div>
                                        <div><div className="text-[10px] font-bold text-zinc-400 uppercase mb-1">Type</div><div className="flex bg-zinc-100 dark:bg-black/20 p-1 rounded-lg border border-zinc-200 dark:border-white/5">{['MC','LQ'].map(t=><button key={t} onClick={()=>updateLog(activeId,{questionType:t})} className={`flex-1 text-[10px] font-bold rounded py-1 ${activeLog.questionType===t?'bg-white dark:bg-zinc-700 shadow dark:text-white':'text-zinc-500'}`}>{t}</button>)}</div></div>
                                        <div><div className="text-[10px] font-bold text-zinc-400 uppercase mb-1">Status</div><button onClick={()=>updateLog(activeId,{mastered:!activeLog.mastered})} className={`w-full py-1.5 rounded-lg text-xs font-bold border ${activeLog.mastered?'bg-green-500/10 border-green-500 text-green-600':'bg-red-500/10 border-red-500 text-red-600'}`}>{activeLog.mastered?'Mastered':'Review'}</button></div>
                                    </div>
                                    <div className="space-y-4">
                                        <MultiImageUploader images={activeLog.questionImages} label="Question" onUpdate={async(d,a)=>{ if(a==='remove'){updateLog(activeId,{questionImages:activeLog.questionImages.filter((_,i)=>i!==d)});return;} try{const u=await saveToDrive(d,'Q.png'); updateLog(activeId,{questionImages:[...activeLog.questionImages,u]});}catch(e){alert("Upload Fail");} }}/>
                                        <MultiImageUploader images={activeLog.schemeImages} label="Marking Scheme" onUpdate={async(d,a)=>{ if(a==='remove'){updateLog(activeId,{schemeImages:activeLog.schemeImages.filter((_,i)=>i!==d)});return;} try{const u=await saveToDrive(d,'S.png'); updateLog(activeId,{schemeImages:[...activeLog.schemeImages,u]});}catch(e){alert("Upload Fail");} }}/>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="space-y-4">
                                            <div className="bg-white dark:bg-surface p-4 rounded-xl border border-zinc-200 dark:border-white/5"><div className="text-[10px] font-bold text-zinc-400 uppercase mb-2">Answer</div><input value={activeLog.correctAnswer} onChange={e=>updateLog(activeId,{correctAnswer:e.target.value})} className="w-full bg-green-50 dark:bg-green-900/10 border-green-200 dark:border-green-900/30 border rounded px-3 py-2 font-mono font-bold text-green-700 dark:text-green-400 outline-none"/></div>
                                            <div className="bg-white dark:bg-surface p-4 rounded-xl border border-zinc-200 dark:border-white/5"><div className="text-[10px] font-bold text-zinc-400 uppercase mb-2">Marks Lost</div><input value={activeLog.marks} onChange={e=>updateLog(activeId,{marks:e.target.value})} className="w-full bg-red-50 dark:bg-red-900/10 border-red-200 dark:border-red-900/30 border rounded px-3 py-2 font-bold text-red-700 dark:text-red-400 outline-none"/></div>
                                        </div>
                                        <div className="md:col-span-2 bg-white dark:bg-surface rounded-xl border border-zinc-200 dark:border-white/5 flex flex-col min-h-[200px]"><div className="px-4 py-2 border-b border-zinc-200 dark:border-white/5 bg-zinc-50 dark:bg-white/5 text-[10px] font-bold text-zinc-500 uppercase">Analysis / Logic Gap</div><textarea value={activeLog.explanation} onChange={e=>updateLog(activeId,{explanation:e.target.value})} className="flex-1 w-full p-4 bg-transparent outline-none resize-none text-sm dark:text-zinc-300" placeholder="Why did I fail?"/></div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center justify-center h-full text-zinc-400"><Icons.Bug className="w-16 h-16 opacity-20 mb-4"/><div className="text-lg font-bold">No Mistake Selected</div></div>
                        )}
                        <AnimatePresence>{aiOpen && activeLog && <div className="absolute top-0 right-0 bottom-0 w-[350px] z-30"><AIChat activeLog={activeLog} onClose={()=>setAiOpen(false)} user={user}/></div>}</AnimatePresence>
                        {pracOpen && activeLog && <PracticeModal activeLog={activeLog} onClose={()=>setPracOpen(false)} user={user}/>}
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
