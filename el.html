                            {[{id: 'all', icon: 'Dashboard', label: 'All Errors'}, {id: 'active', icon: 'Target', label: 'Needs Review'}, {id: 'mastered', icon: 'Check', label: 'Mastered'}].map(item => {
                                const Icon = Icons[item.icon];
                                return (<button key={item.id} onClick={()=>setFilter(item.id)} className={`flex items-center gap-3 px-4 py-3 rounded-r-full text-sm font-medium transition-colors w-[95%] ${filter===item.id ? 'bg-primary/10 text-primary dark:bg-primary-light/15 dark:text-primary-light font-bold' : 'text-gray hover:bg-black/5 dark:hover:bg-white/5 hover:text-dark dark:hover:text-light'}`}><Icon className="w-5 h-5"/> {item.label}</button>);
                            })}
                            <div className="h-4"></div>
                            <button onClick={()=>setPracticeConfig({ isOpen: true, mode: 'topic' })} className="flex items-center gap-3 px-4 py-3 rounded-r-full text-sm font-medium transition-colors w-[95%] text-dark dark:text-light hover:bg-black/5 dark:hover:bg-white/5 mt-2"><Icons.Brain className="w-5 h-5 text-primary"/> Smart Drill</button>
                        </nav>
                        <div className="flex-1 overflow-y-auto">
                            <div className="px-5 text-[11px] font-bold text-gray mb-3 uppercase tracking-wider">Subjects</div>
                            <div className="space-y-0.5">{subjects.map(s => (<SidebarSubjectItem key={s.id} subject={s} currentFilter={filter} onSelect={setFilter} />))}</div>
                        </div>
                    </div>
                    
                    {/* Log List Column */}
                    <div className={`flex-shrink-0 bg-[#f8fafc] dark:bg-onyx flex-col z-10 border-r border-light-gray dark:border-border-dark ${activeLogId || (mobileView !== 'logs') ? 'hidden lg:flex w-[340px]' : 'flex w-full lg:w-[340px]'}`}>
                        <div className="p-4 border-b border-light-gray dark:border-border-dark flex gap-2 shrink-0 lg:hidden">
                             {/* Mobile Search - shown only when top header search is hidden */}
                             <div className="w-full bg-white dark:bg-dark flex items-center px-3 py-2 rounded-full border border-light-gray dark:border-white/10">
                                 <Icons.Search className="w-4 h-4 text-gray mr-2"/>
                                 <input type="text" placeholder="Search..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="bg-transparent border-none outline-none w-full text-sm text-dark dark:text-light placeholder-gray"/>
                             </div>
                        </div>
                        <div className="px-4 py-3 border-b border-light-gray dark:border-border-dark flex justify-between items-center bg-[#f8fafc] dark:bg-onyx shrink-0">
                            <span className="text-sm font-medium text-gray">Logs ({filteredLogs.length})</span>
                            <div className="relative"><button onClick={()=>setShowSortMenu(!showSortMenu)} className={`p-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors ${typeFilter !== 'ALL' ? 'text-primary bg-primary/10' : 'text-gray'}`} title="Filter"><Icons.Sort className="w-5 h-5"/></button>{showSortMenu && (<div className="absolute right-0 top-full mt-2 w-44 bg-white dark:bg-surface-dark border border-light-gray dark:border-white/10 rounded-xl shadow-ds-hover z-50 py-2"><div className="px-4 py-1.5 text-[10px] font-bold text-gray uppercase tracking-wider">Sort</div><button onClick={()=>{setSortBy('date-desc'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2 text-sm hover:bg-black/5 dark:hover:bg-white/5 ${sortBy==='date-desc'?'text-primary font-semibold':'text-dark dark:text-light'}`}>Newest</button><button onClick={()=>{setSortBy('date-asc'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2 text-sm hover:bg-black/5 dark:hover:bg-white/5 ${sortBy==='date-asc'?'text-primary font-semibold':'text-dark dark:text-light'}`}>Oldest</button><div className="h-px bg-light-gray dark:bg-white/10 my-2"></div><div className="px-4 py-1.5 text-[10px] font-bold text-gray uppercase tracking-wider">Type</div><button onClick={()=>{setTypeFilter('ALL'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2 text-sm hover:bg-black/5 dark:hover:bg-white/5 ${typeFilter==='ALL'?'text-primary font-semibold':'text-dark dark:text-light'}`}>All</button><button onClick={()=>{setTypeFilter('MC'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2 text-sm hover:bg-black/5 dark:hover:bg-white/5 ${typeFilter==='MC'?'text-primary font-semibold':'text-dark dark:text-light'}`}>MC Only</button><button onClick={()=>{setTypeFilter('LQ'); setShowSortMenu(false)}} className={`w-full text-left px-4 py-2 text-sm hover:bg-black/5 dark:hover:bg-white/5 ${typeFilter==='LQ'?'text-primary font-semibold':'text-dark dark:text-light'}`}>LQ Only</button></div>)}</div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-3 space-y-2 pb-20 lg:pb-3">
                            {filteredLogs.map(l => (
                                <motion.div key={l.id} onClick={()=>setActiveLogId(l.id)} onContextMenu={(e) => handleContextMenu(e, l.id)} onMouseEnter={() => handleMouseEnter(l)} onMouseLeave={handleMouseLeave} className={`p-4 rounded-2xl cursor-pointer transition-all border ${activeLogId===l.id ? 'bg-[#e8f0fe] dark:bg-[#1a2332] border-transparent shadow-sm' : 'bg-white dark:bg-surface-dark border-light-gray dark:border-white/5 hover:border-gray/30 hover:shadow-sm'}`}>
                                    <div className="flex justify-between items-start mb-2">
                                        <div className={`font-semibold text-sm truncate pr-2 w-full ${activeLogId===l.id ? 'text-[#1967d2] dark:text-[#8ab4f8]' : 'text-dark dark:text-light'}`}>{l.title}</div>
                                        {l.mastered ? <Icons.Check className="w-4 h-4 text-success shrink-0"/> : <div className="w-2 h-2 rounded-full bg-warning mt-1.5 shrink-0"></div>}
                                    </div>
                                    <div className={`text-xs truncate mb-3 font-medium ${activeLogId===l.id ? 'text-[#1967d2] dark:text-[#8ab4f8]' : 'text-gray'}`}>{l.subject} {l.topic ? `• ${l.topic}` : ''}</div>
                                    <div className="flex justify-end items-center">
                                        <div className="text-[10px] text-gray">{new Date(l.lastModified || l.createdAt).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</div>
                                    </div>
                                </motion.div>
                            ))}
                            {hasMore && !isLoadingLogs && (<button onClick={() => fetchLogs(true)} className="w-full py-3 text-sm text-primary font-medium hover:bg-primary/5 rounded-xl transition-colors">Load More</button>)}
                            {isLoadingLogs && <div className="text-center text-gray py-6 text-sm flex items-center justify-center gap-2"><div className="w-4 h-4 border-2 border-gray border-t-transparent rounded-full animate-spin"></div> Fetching...</div>}
                        </div>
                    </div>

                    {/* Main Content Area - The Editor */}
                    <main className={`flex-1 flex-col min-w-0 bg-[#f0f4f9] dark:bg-onyx relative transition-colors duration-300 ${(!activeLogId && mobileView === 'logs') ? 'hidden lg:flex' : 'flex w-full'}`}>
                        {activeLog ? (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col h-full">
                                <header className="h-[72px] flex items-center justify-between px-4 md:px-10 bg-white dark:bg-surface-dark shrink-0 z-10 rounded-b-3xl md:rounded-b-none border-b border-light-gray dark:border-border-dark md:border-none shadow-sm md:shadow-none mb-4 md:mb-0">
                                    <div className="flex-1 flex items-center gap-2 md:gap-4 mr-2 md:mr-4 overflow-hidden">
                                        <button onClick={() => setActiveLogId(null)} className="lg:hidden p-2 rounded-full hover:bg-light-gray dark:hover:bg-white/10 text-gray shrink-0"><Icons.ChevronLeft className="w-5 h-5"/></button>
                                        <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-lg md:text-2xl font-normal outline-none w-full text-dark dark:text-light placeholder-gray truncate" placeholder="Untitled document"/>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <button onClick={handleAutoTitle} onDragOver={handleOcrDragOver} onDragLeave={handleOcrDragLeave} onDrop={handleOcrDrop} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium transition-all ${isAutoTitleLoading ? 'bg-primary/10 text-primary animate-pulse' : isOcrDragging ? 'bg-primary text-white scale-105 shadow-md ring-2 ring-primary/30 border-primary' : 'bg-[#f1f3f4] dark:bg-dark text-dark dark:text-light hover:bg-[#e8eaed] dark:hover:bg-white/10 border border-transparent'} relative group`} title="Click to parse attached images, or Drag & Drop a screenshot here"><div className="absolute inset-0 rounded-full bg-primary/20 opacity-0 group-hover:opacity-100 dark:group-hover:opacity-0 transition-opacity pointer-events-none" style={{display: isOcrDragging ? 'none' : 'block'}}></div>{isAutoTitleLoading ? <div className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <><Icons.Bot className="w-4 h-4"/><span className="hidden sm:inline">{isOcrDragging ? "Drop to Scan!" : "AI Parse"}</span></>}</button>
                                            <AnimatePresence>{ocrPendingToast > 0 && (<motion.div initial={{opacity:0, scale:0.8}} animate={{opacity:1, scale:1}} exit={{opacity:0}} className="bg-dark text-white text-[10px] font-medium px-3 py-1.5 rounded-full flex items-center gap-2 shadow-md"><div className="w-1.5 h-1.5 rounded-full bg-success animate-pulse"/>Parsing in {ocrPendingToast}s</motion.div>)}</AnimatePresence>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1 shrink-0">
                                        <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-2 rounded-full text-sm font-medium transition-all flex items-center gap-2 ${activeLog.mastered ? 'bg-[#f0fdf4] text-success dark:bg-[#12311e]' : 'bg-white border border-light-gray dark:bg-surface-dark dark:border-white/10 text-dark dark:text-light hover:bg-black/5 dark:hover:bg-white/5'}`}>{activeLog.mastered ? <><Icons.Check className="w-4 h-4"/> Mastered</> : 'Mark Mastered'}</button>
                                        <div className="h-6 w-px bg-light-gray dark:bg-border-dark mx-2"></div>
                                        <button onClick={()=> user ? setIsAiOpen(!isAiOpen) : null} disabled={!user} className={`p-2.5 rounded-full transition-colors ${!user ? 'opacity-50 text-gray' : isAiOpen ? 'bg-primary/10 text-primary' : 'text-gray hover:bg-black/5 dark:hover:bg-white/5'}`} title="AI Assistant"><Icons.Bot className="w-5 h-5"/></button>
                                        <button onClick={() => handleDelete(activeLog.id)} className="p-2.5 rounded-full hover:bg-danger/10 text-gray hover:text-danger transition-colors"><Icons.Trash className="w-5 h-5"/></button>
                                    </div>
                                </header>
                                <div className="flex-1 overflow-y-auto px-4 md:px-10 pb-24 md:pb-20 pt-4 scroll-smooth">
                                    <div className="max-w-4xl mx-auto space-y-6">
                                        
                                        {/* Meta Data Card (Google Forms style) */}
                                        <div className="bg-white dark:bg-surface-dark p-6 md:p-8 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark grid grid-cols-1 md:grid-cols-3 gap-6 relative overflow-hidden">
                                            <div className="absolute top-0 left-0 right-0 h-2 bg-primary"></div>
                                            <div>
                                                <label className="text-sm font-medium text-dark dark:text-light block mb-2">Subject</label>
                                                <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="form-control cursor-pointer"><option>General</option>{subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}</select>
                                            </div>
                                            <div>
                                                <label className="text-sm font-medium text-dark dark:text-light block mb-2">Topic</label>
                                                <div className="flex gap-2">{activeLog.subject !== 'General' && currentSub ? (<><select value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="form-control flex-1 cursor-pointer"><option value="">-- Unassigned --</option>{currentSub.topics.map(t => <option key={t} value={t}>{t}</option>)}</select><button onClick={() => addTopicToSubject(activeLog.subject)} className="w-12 rounded-xl bg-light-gray/50 dark:bg-dark hover:bg-[#e8eaed] dark:hover:bg-white/10 transition-colors text-gray flex items-center justify-center border border-transparent"><Icons.Plus className="w-4 h-4"/></button></>) : ( <input value={activeLog.topic || ''} onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} className="form-control flex-1" placeholder="Custom" disabled={activeLog.subject !== 'General'}/> )}</div>
                                            </div>
                                            <div>
                                                <label className="text-sm font-medium text-dark dark:text-light block mb-2">Format</label>
                                                <div className="flex bg-light-gray/50 dark:bg-dark p-1 rounded-xl h-[46px]">{['MC', 'LQ'].map(t => (<button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`flex-1 rounded-lg text-sm font-medium transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-surface-dark shadow-sm text-primary dark:text-primary-light' : 'text-gray hover:text-dark dark:hover:text-light'}`}>{t}</button>))}</div>
                                            </div>
                                        </div>
                                        
                                        {/* Evidence Block */}
                                        <div className="bg-white dark:bg-surface-dark p-6 md:p-8 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark space-y-8">
                                            <div>
                                                <MultiImageUploader images={activeLog.questionImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'question')} label={<><Icons.Scan className="w-4 h-4 text-gray"/> Original Question</>} isUploading={uploadingQ} onImageClick={() => setCompareMode(true)} />
                                                <div className="mt-4 pl-1">
                                                    <button onClick={() => setShowOcrText(!showOcrText)} className="text-xs flex items-center gap-1.5 text-gray hover:text-primary transition-colors font-medium"><Icons.File className="w-3.5 h-3.5"/> {showOcrText ? "Hide Extracted Text" : "View Extracted Text"}</button>
                                                    {showOcrText && (<textarea value={activeLog.questionText || ""} onChange={(e) => updateLog(activeLog.id, { questionText: e.target.value })} className="mt-3 w-full p-4 text-sm bg-[#f8fafc] dark:bg-dark border border-light-gray dark:border-border-dark rounded-2xl text-dark dark:text-light focus:outline-none focus:border-primary transition-colors font-sans leading-relaxed" rows="4" placeholder="AI text extraction goes here..." />)}
                                                </div>
                                            </div>
                                            <div className="h-px bg-light-gray dark:bg-border-dark"></div>
                                            <MultiImageUploader images={activeLog.schemeImages} onUpdate={(d, a) => handleImageUpdate(d, a, 'scheme')} label={<><Icons.Check className="w-4 h-4 text-gray"/> Solution / Marking Scheme</>} isUploading={uploadingS} onImageClick={() => setCompareMode(true)} />
                                        </div>

                                        {/* Analysis Grid */}
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            <div className="lg:col-span-1 space-y-6">
                                                <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-success"></div>
                                                    <label className="text-sm font-medium text-dark dark:text-light block mb-3 pl-2">Correct Answer</label>
                                                    <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-light-gray/50 dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark rounded-xl px-4 py-3 font-mono text-lg font-bold text-success focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-success focus:outline-none transition-all" placeholder="e.g. A, 42"/>
                                                </div>
                                                <div className="bg-white dark:bg-surface-dark p-6 rounded-3xl shadow-sm border border-light-gray dark:border-border-dark relative overflow-hidden">
                                                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-danger"></div>
                                                    <label className="text-sm font-medium text-dark dark:text-light block mb-3 pl-2">Marks Deducted</label>
                                                    <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-light-gray/50 dark:bg-dark border border-transparent hover:border-light-gray dark:hover:border-border-dark rounded-xl px-4 py-3 font-mono text-lg font-bold text-danger focus:bg-white dark:focus:bg-[#1a1a1c] focus:border-danger focus:outline-none transition-all" placeholder="-1"/>
                                                </div>
                                            </div>
                                            <div className="lg:col-span-2 bg-white dark:bg-surface-dark rounded-3xl shadow-sm border border-light-gray dark:border-border-dark flex flex-col min-h-[240px] relative overflow-hidden">
                                                <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-primary"></div>
                                                <div className="px-6 md:px-8 py-4 border-b border-light-gray dark:border-border-dark flex justify-between items-center pl-8">
                                                    <span className="text-sm font-medium text-dark dark:text-light flex items-center gap-2"><Icons.Brain className="w-4 h-4 text-primary"/> Retrospective</span>
                                                    <Icons.Bot className="w-4 h-4 text-gray opacity-50"/>
                                                </div>
                                                <textarea className="flex-1 w-full p-6 md:p-8 pl-8 bg-transparent outline-none resize-none text-base leading-relaxed text-dark dark:text-light placeholder-gray/70" placeholder="Analyze the failure point...&#10;1. What was the conceptual gap?&#10;2. How did the trick work?&#10;3. What is the mental model needed for next time?" value={activeLog.explanation} onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}/>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <Dashboard logs={logs} setPracticeConfig={setPracticeConfig} />
                        )}
                        <AnimatePresence>{isAiOpen && activeLog && user && (<div className="absolute top-0 right-0 bottom-0 w-full sm:w-[400px] z-40 sm:z-30 shadow-2xl"><AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user} messages={chatMessages} setMessages={setChatMessages}/></div>)}</AnimatePresence>
                        {practiceConfig.isOpen && <PracticeModal activeLog={activeLog} onClose={() => setPracticeConfig({...practiceConfig, isOpen: false})} user={user} subjects={subjects} initialMode={practiceConfig.mode} />}
                    </main>
                </div>
                
                {/* Mobile Bottom Navigation */}
                <div className="lg:hidden fixed bottom-0 left-0 right-0 h-16 bg-white dark:bg-surface-dark border-t border-light-gray dark:border-border-dark flex justify-around items-center px-2 z-50 pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.05)] dark:shadow-[0_-4px_10px_rgba(0,0,0,0.2)]">
                    <button onClick={() => { setMobileView('logs'); setActiveLogId(null); }} className={`flex flex-col items-center justify-center w-16 h-full gap-1 transition-colors ${mobileView === 'logs' && !activeLogId ? 'text-primary' : 'text-gray dark:text-zinc-400 hover:text-dark dark:hover:text-light'}`}>
                        <Icons.File className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Logs</span>
                    </button>
                    <button onClick={() => setPracticeConfig({ isOpen: true, mode: 'topic' })} className="flex flex-col items-center justify-center w-16 h-full gap-1 text-gray dark:text-zinc-400 hover:text-primary transition-colors">
                        <Icons.Brain className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Drill</span>
                    </button>
                    <button onClick={() => { setMobileView('dashboard'); setActiveLogId(null); }} className={`flex flex-col items-center justify-center w-16 h-full gap-1 transition-colors ${mobileView === 'dashboard' && !activeLogId ? 'text-primary' : 'text-gray dark:text-zinc-400 hover:text-dark dark:hover:text-light'}`}>
                        <Icons.ChartBar className="w-5 h-5"/>
                        <span className="text-[10px] font-medium">Stats</span>
                    </button>
                </div>
            </div>
        );
    };
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
