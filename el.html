        // CONFIG
        const GDRIVE_API_KEY = "AIzaSyCScFR_D0snZ6hrHob5fUQM7Y2NhK-kTIA"; 
        const GDRIVE_CLIENT_ID = "256215327792-oglegui0q8qj507oao2c2733thcl9lrc.apps.googleusercontent.com"; 

        const { useState, useEffect, useRef, useMemo } = React;

        // ICONS
        const Icons = {
            Plus: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,

            Check: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Image: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
            Bot: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>,
            X: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 18 18"/></svg>,
            Logout: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Google: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/><path d="M12 11h9c.1 1.4.1 2.9-.4 4.3-1.1 3-4.1 5.3-7.6 5.6-5 .5-9.4-3.1-9.9-8.1C2.5 7.1 6 2.3 11 2c2.5-.1 4.9.9 6.7 2.6l-2.7 2.8c-1-.7-2.3-1.1-3.6-1-2.9.2-5.1 2.8-4.9 5.7.2 2.6 2.4 4.7 5 4.7 2 0 3.6-1.1 4.3-2.9H12v-3z" fill="currentColor"/></svg>,
            Sun: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>,
            Moon: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
            User: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Scan: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>,
            Lock: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            File: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        };

        // --- GEMINI PROXY ---
        const callGemini = async (prompt, systemInstruction = "", imageBase64 = null) => {
            const proxyUrl = "https://gemini-proxy-157237873670.us-central1.run.app/proxy";
            const parts = [{ text: `${systemInstruction}\n\nUser: ${prompt}` }];
            
            if (imageBase64) {
                let mimeType = "image/png";
                let data = imageBase64;
                if (imageBase64.includes(",")) {
                   const split = imageBase64.split(",");
                   const match = split[0].match(/:(.*?);/);
                   if (match) mimeType = match[1];
                   data = split[1];
                }
                parts.push({ inlineData: { mimeType, data } });
            }

            const payload = { contents: [{ parts }] };
            try {
                const response = await fetch(proxyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
            } catch (error) { return `Error: ${error.message}`; }
        };

        // --- GDRIVE HOOK ---
        const useGoogleDrive = () => {
            const [tokenClient, setTokenClient] = useState(null);
            
            useEffect(() => {
                if(!GDRIVE_API_KEY || !GDRIVE_CLIENT_ID) return;
                const loadGapi = async () => {
                    if (window.gapi) {
                         await new Promise(r => window.gapi.load('client', r));
                         await window.gapi.client.init({ apiKey: GDRIVE_API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
                    }
                };
                loadGapi();
                if (window.google && window.google.accounts) {
                    const client = window.google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file', callback: () => {} });
                    setTokenClient(client);
                }
            }, []);

            const getAccessToken = () => new Promise((resolve, reject) => {
                if (!tokenClient) return reject("Auth not initialized");
                const existing = window.gapi.client.getToken();
                if (existing && Date.now() < existing.expiry) return resolve(existing.access_token);
                tokenClient.callback = (resp) => { if (resp.error) reject(resp); resolve(resp.access_token); };
                tokenClient.requestAccessToken({ prompt: '' });
            });

            const getOrCreateFolder = async (folderName, accessToken) => {
                const q = `mimeType='application/vnd.google-apps.folder' and name='${folderName}' and trashed=false`;
                const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${accessToken}` }});
                const data = await search.json();
                if (data.files?.length > 0) return data.files[0].id;
                const create = await fetch('https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: folderName, mimeType: 'application/vnd.google-apps.folder' }) });
                const createdData = await create.json();
                return createdData.id;
            };

            const calculateMD5 = (blob) => new Promise((resolve, reject) => {
                if (!window.SparkMD5) return resolve(null);
                const reader = new FileReader();
                reader.onload = (e) => { const spark = new SparkMD5.ArrayBuffer(); spark.append(e.target.result); resolve(spark.end()); };
                reader.onerror = reject;
                reader.readAsArrayBuffer(blob);
            });

            const saveToDrive = async (blob, filename) => {
                const token = await getAccessToken();
                const parentId = await getOrCreateFolder('darNote_Errors', token);
                
                const md5Hash = await calculateMD5(blob);
                if (md5Hash) {
                    const listQuery = `'${parentId}' in parents and trashed = false and mimeType contains 'image/'`;
                    const listReq = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(listQuery)}&orderBy=createdTime desc&pageSize=50&fields=files(id,md5Checksum,webContentLink,webViewLink)`, { headers: { Authorization: `Bearer ${token}` } });
                    const listData = await listReq.json();
                    const contentMatch = listData.files?.find(f => f.md5Checksum === md5Hash);
                    if (contentMatch) return `https://lh3.googleusercontent.com/d/${contentMatch.id}`;
                }

                const metadata = { name: filename, mimeType: blob.type, parents: [parentId] };
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', blob);

                const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
                const fileData = await uploadRes.json();
                
                await fetch(`https://www.googleapis.com/drive/v3/files/${fileData.id}/permissions`, { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ role: 'reader', type: 'anyone' }) });
                return `https://lh3.googleusercontent.com/d/${fileData.id}`;
            };
            return { saveToDrive };
        };

        // --- IMAGE UPLOADER COMPONENT ---
        const ImageUploader = ({ imageUrl, onUpload, label, isUploading }) => {
            const [isDragging, setIsDragging] = useState(false);

            const handleDragOver = (e) => { e.preventDefault(); setIsDragging(true); };
            const handleDragLeave = (e) => { e.preventDefault(); setIsDragging(false); };
            const handleDrop = async (e) => {
                e.preventDefault(); setIsDragging(false);
                const items = e.dataTransfer.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].kind === 'file' && items[i].type.startsWith('image/')) {
                        const file = items[i].getAsFile();
                        onUpload(file);
                        return; 
                    }
                }
            };
            const handlePaste = (e) => {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const blob = items[i].getAsFile();
                        onUpload(blob);
                        return;
                    }
                }
            };

            return (
                <div className="space-y-2">
                    <div className="flex justify-between items-end px-1">
                        <label className="text-sm font-bold text-zinc-700 dark:text-zinc-300">{label}</label>
                        <span className="text-[10px] text-zinc-400">Drag & Drop / Paste (Ctrl+V)</span>
                    </div>
                    <div 
                        className={`w-full min-h-[350px] bg-white dark:bg-surface border-2 border-dashed rounded-2xl flex items-center justify-center relative overflow-hidden group transition-all ${isDragging || isUploading ? 'border-brand bg-brand/5' : 'border-zinc-300 dark:border-zinc-700 hover:border-brand dark:hover:border-brand'}`}
                        onPaste={handlePaste} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop} tabIndex="0"
                    >
                        {isUploading && (
                            <div className="absolute inset-0 bg-white/80 dark:bg-black/80 z-20 flex flex-col items-center justify-center backdrop-blur-sm">
                                <div className="w-10 h-10 border-4 border-brand border-t-transparent rounded-full animate-spin mb-3"></div>
                                <div className="text-sm font-bold text-brand animate-pulse">Uploading to Drive...</div>
                            </div>
                        )}
                        {imageUrl ? (
                            <div className="relative w-full h-full p-4 group">
                                <img src={imageUrl} className="w-full h-full object-contain rounded-lg drop-shadow-lg" />
                                <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center backdrop-blur-[2px]">
                                    <Icons.Image className="w-8 h-8 text-white mb-2"/>
                                    <span className="text-white font-bold text-sm">Drag new image here to replace</span>
                                </div>
                            </div>
                        ) : (
                            <div className={`text-center p-10 pointer-events-none transition-opacity ${isDragging ? 'opacity-50' : 'opacity-60 group-hover:opacity-100'}`}>
                                <div className="w-16 h-16 bg-zinc-100 dark:bg-zinc-800 rounded-full flex items-center justify-center mx-auto mb-4 text-zinc-400 group-hover:text-brand group-hover:scale-110 transition-all"><Icons.Image className="w-8 h-8"/></div>
                                <h3 className="font-bold text-lg text-zinc-700 dark:text-zinc-200">No Image Uploaded</h3>
                                <p className="text-sm text-zinc-500 mt-2">Drag image here or click & <kbd className="font-mono bg-zinc-200 dark:bg-zinc-700 px-1 rounded">Ctrl + V</kbd></p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- AI CHAT COMPONENT ---
        const AIChat = ({ activeLog, onClose, user }) => {
            const [messages, setMessages] = useState([{role: 'ai', text: "I see your failure. How can I help you understand it?"}]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [dailyCount, setDailyCount] = useState(0);
            const messagesEndRef = useRef(null);

            const QUOTA_LIMIT = 10;
            const todayDate = new Date().toISOString().split('T')[0];

            useEffect(() => {
                if(!user) return;
                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'ai_usage', todayDate);
                const unsub = window.firebase.onSnapshot(docRef, (doc) => {
                    if (doc.exists()) { setDailyCount(doc.data().count || 0); } else { setDailyCount(0); }
                });
                return () => unsub();
            }, [user, todayDate]);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            const handleSend = async () => {
                if(!input.trim()) return;
                if (dailyCount >= QUOTA_LIMIT) {
                    setMessages(prev => [...prev, {role: 'ai', text: "<span class='text-red-500 font-bold'>DAILY LIMIT REACHED.</span> You have used all 10 AI requests for today. Try thinking for yourself now! 🧠"}]);
                    return;
                }
                const userMsg = input;
                setMessages(prev => [...prev, {role: 'user', text: userMsg}]);
                setInput("");
                setLoading(true);

                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'ai_usage', todayDate);
                await window.firebase.setDoc(docRef, { count: window.firebase.increment(1), date: todayDate }, { merge: true });

                const context = `
                    Student is analyzing a mistake.
                    Subject: ${activeLog.subject}
                    Topic: ${activeLog.topic || 'N/A'}
                    Question Type: ${activeLog.questionType}
                    Student's Correct Answer: ${activeLog.correctAnswer}
                    Student's Explanation: ${activeLog.explanation}
                    Marks: ${activeLog.marks}
                    Image of Question (Url): ${activeLog.imageUrl || "No image provided"}
                    Marking Scheme Image (Url): ${activeLog.markingSchemeUrl || "No scheme provided"}
                `;
                const systemPrompt = `You are a supportive but witty tutor. The student is looking at an error log. Context: ${context}. Answer their question effectively.`;
                
                const response = await callGemini(userMsg, systemPrompt);
                setMessages(prev => [...prev, {role: 'ai', text: response}]);
                setLoading(false);
            };

            const remaining = Math.max(0, QUOTA_LIMIT - dailyCount);

            return (
                <motion.div initial={{ x: 300, opacity: 0 }} animate={{ x: 0, opacity: 1 }} exit={{ x: 300, opacity: 0 }} className="flex flex-col h-full bg-white dark:bg-onyx border-l border-zinc-200 dark:border-white/10 shadow-2xl">
                    <div className="p-4 border-b border-zinc-200 dark:border-white/10 flex justify-between items-center bg-zinc-50 dark:bg-zinc-900">
                        <div className="flex flex-col">
                            <span className="font-bold text-sm flex items-center gap-2"><Icons.Bot className="w-4 h-4 text-brand"/> Tutor AI</span>
                            <span className={`text-[10px] font-mono ${remaining === 0 ? 'text-red-500 font-bold' : 'text-zinc-500'}`}>
                                {remaining} / {QUOTA_LIMIT} left
                            </span>
                        </div>
                        <button onClick={onClose}><Icons.X className="w-4 h-4 hover:text-red-500 transition-colors"/></button>
                    </div>
                    
                    <div className="h-1 w-full bg-zinc-200 dark:bg-zinc-800">
                        <div className={`h-full transition-all duration-500 ${remaining === 0 ? 'bg-red-500' : 'bg-brand'}`} style={{ width: `${(dailyCount / QUOTA_LIMIT) * 100}%` }}></div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map((m, i) => (
                            <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-3 rounded-2xl text-sm shadow-sm ${m.role === 'user' ? 'bg-brand text-white rounded-br-none' : 'bg-white border border-zinc-200 dark:border-white/10 dark:bg-zinc-800 rounded-bl-none text-zinc-800 dark:text-zinc-200'}`}>
                                    <div dangerouslySetInnerHTML={{ __html: marked.parse(m.text) }} />
                                </div>
                            </motion.div>
                        ))}
                        {loading && <div className="text-xs text-zinc-500 animate-pulse pl-2">Thinking...</div>}
                        <div ref={messagesEndRef} />
                    </div>
                    
                    <div className="p-4 border-t border-zinc-200 dark:border-white/10 bg-white dark:bg-zinc-900 flex gap-2 relative">
                        {remaining === 0 && (
                             <div className="absolute inset-0 bg-white/50 dark:bg-black/50 backdrop-blur-sm z-10 flex items-center justify-center">
                                 <div className="bg-white dark:bg-zinc-800 border border-red-500 text-red-500 px-4 py-2 rounded-lg text-xs font-bold shadow-lg flex items-center gap-2">
                                     <Icons.Lock className="w-4 h-4"/> Quota Exceeded
                                 </div>
                             </div>
                        )}
                        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter' && handleSend()} placeholder={remaining > 0 ? "Ask about this error..." : "Come back tomorrow..."} disabled={remaining===0} className="flex-1 bg-zinc-100 dark:bg-black/30 border border-zinc-200 dark:border-white/10 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-brand dark:text-white transition-shadow disabled:opacity-50"/>
                        <button onClick={handleSend} disabled={remaining===0} className="bg-brand text-white rounded-full p-2 hover:bg-indigo-600 transition-colors shadow-lg shadow-indigo-500/30 disabled:bg-zinc-400 disabled:shadow-none"><Icons.Plus className="w-4 h-4 rotate-90"/></button>
                    </div>
                </motion.div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [logs, setLogs] = useState([]);
            const [subjects, setSubjects] = useState([]);
            
            // 1. ROTATING LOGIC: Initialize state from URL params
            const [activeLogId, setActiveLogId] = useState(() => {
                const params = new URLSearchParams(window.location.search);
                return params.get('log');
            });

            const [filter, setFilter] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [isAiOpen, setIsAiOpen] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(true);
            const [isAutoTitleLoading, setIsAutoTitleLoading] = useState(false);
            const { saveToDrive } = useGoogleDrive();
            
            // Image Upload State for Active Log
            const [isUploadingQ, setIsUploadingQ] = useState(false);
            const [isUploadingS, setIsUploadingS] = useState(false); 

            useEffect(() => { window.firebase.onAuthStateChanged(window.firebase.auth, setUser); }, []);
            
            useEffect(() => {
                if(isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            // 2. ROTATING LOGIC: URL Persistence
            useEffect(() => {
                const url = new URL(window.location);
                if (activeLogId) {
                    url.searchParams.set('log', activeLogId);
                } else {
                    url.searchParams.delete('log');
                }
                
                // Only push state if URL actually changed to prevent history spam
                if (url.href !== window.location.href) {
                    window.history.pushState({}, '', url);
                }
            }, [activeLogId]);

            // 3. ROTATING LOGIC: Handle Browser Back/Forward
            useEffect(() => {
                const onPopState = () => {
                    const id = new URLSearchParams(window.location.search).get('log');
                    setActiveLogId(id);
                };
                window.addEventListener('popstate', onPopState);
                return () => window.removeEventListener('popstate', onPopState);
            }, []);

            useEffect(() => {
                if (!user) return;
                const db = window.firebase.db;
                const appId = "darnote-app";
                
                const logsUnsub = window.firebase.onSnapshot(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'error_logs'), (snap) => {
                    const data = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setLogs(data);
                });
                
                const subUnsub = window.firebase.onSnapshot(window.firebase.collection(db, 'artifacts', appId, 'users', user.uid, 'subjects'), (snap) => {
                    setSubjects(snap.docs.map(d => ({
                        id: d.id, 
                        name: d.data().name, 
                        topics: d.data().topics || []
                    })).sort((a,b) => a.name.localeCompare(b.name)));
                });
                return () => { logsUnsub(); subUnsub(); };
            }, [user]);

            const createLog = async () => {
                if (!user) return;
                const newLog = {
                    title: 'Untitled Mistake',
                    subject: 'General',
                    topic: '',
                    imageUrl: '',
                    markingSchemeUrl: '', 
                    questionType: 'MC', 
                    correctAnswer: '',
                    marks: '',
                    explanation: '',
                    mastered: false,
                    createdAt: new Date().toISOString()
                };
                const docRef = await window.firebase.addDoc(window.firebase.collection(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs'), newLog);
                setActiveLogId(docRef.id);
            };

            const updateLog = async (id, updates) => {
                await window.firebase.updateDoc(window.firebase.doc(window.firebase.db, 'artifacts', "darnote-app", 'users', user.uid, 'error_logs', id), updates);
            };

            const addTopicToSubject = async (subjectName) => {
                const subjectDoc = subjects.find(s => s.name === subjectName);
                if (!subjectDoc) { alert("Cannot add topic to General/Unknown subject."); return; }
                
                const newTopic = prompt(`Add a new topic for ${subjectName}:`);
                if (!newTopic) return;

                const docRef = window.firebase.doc(window.firebase.db, 'artifacts', 'darnote-app', 'users', user.uid, 'subjects', subjectDoc.id);
                await window.firebase.updateDoc(docRef, {
                    topics: window.firebase.arrayUnion(newTopic)
                });
            };

            const handleUpload = async (blob, type) => {
                if (!activeLogId) return;
                const setUploading = type === 'question' ? setIsUploadingQ : setIsUploadingS;
                setUploading(true);
                try {
                    const url = await saveToDrive(blob, `ErrorLog_${type}_${Date.now()}.png`);
                    if (type === 'question') updateLog(activeLogId, { imageUrl: url });
                    else updateLog(activeLogId, { markingSchemeUrl: url });
                } catch(err) { alert("Upload failed: " + err); }
                setUploading(false);
            };

            const handleAutoTitle = async () => {
                if (!activeLogId || !activeLog.imageUrl) { alert("Please paste an image first!"); return; }
                setIsAutoTitleLoading(true);
                try {
                    const response = await fetch(activeLog.imageUrl);
                    if (!response.ok) throw new Error("Failed to fetch image for OCR.");
                    const blob = await response.blob();
                    
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64data = reader.result;
                        const prompt = "Analyze this image. If it contains a question, identify the core concept or question text and generate a SHORT, descriptive title (max 6 words). Return ONLY the title.";
                        const title = await callGemini(prompt, "You are a concise summarizer.", base64data);
                        updateLog(activeLogId, { title: title.replace(/^["']|["']$/g, '').trim() });
                        setIsAutoTitleLoading(false);
                    };
                    reader.readAsDataURL(blob);

                } catch(e) { console.error(e); alert("OCR Failed. Image might be restricted (CORS) or AI is busy."); setIsAutoTitleLoading(false); }
            }

            const activeLog = logs.find(l => l.id === activeLogId);
            const filteredLogs = logs.filter(l => {
                if (filter === 'mastered') return l.mastered;
                if (filter === 'active') return !l.mastered;
                if (filter.startsWith('subject:')) return l.subject === filter.split(':')[1];
                return true;
            }).filter(l => (l.title || '').toLowerCase().includes(searchQuery.toLowerCase()));

            // Helper to get topics for active log
            const currentSubjectData = activeLog ? subjects.find(s => s.name === activeLog.subject) : null;
            const currentTopics = currentSubjectData ? currentSubjectData.topics : [];

            if (!user) return (
                <div className="h-screen w-full flex items-center justify-center bg-zinc-950 text-white relative overflow-hidden">
                     <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-indigo-900/20 via-black to-black animate-pulse"></div>
                     <motion.div initial={{opacity:0, y:20}} animate={{opacity:1, y:0}} className="z-10 text-center flex flex-col items-center">
                        <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-20 h-20 mb-6 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]"/>
                        <h1 className="text-3xl font-bold mb-2 tracking-tight">darNote Error Log</h1>
                        <p className="text-zinc-500 mb-8">Document your failures. Learn from them.</p>
                        <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-white text-black px-8 py-3 rounded-full font-bold flex gap-2 items-center hover:scale-105 transition-transform shadow-xl"><Icons.Google className="w-5 h-5"/> Sign In</button>
                     </motion.div>
                </div>
            );

            return (
                <div className={`flex h-screen w-full transition-colors duration-300 ${isDarkMode ? 'dark bg-onyx' : 'bg-[#f4f4f5]'}`}>
                    
                    {/* SIDEBAR */}
                    <div className="w-[260px] flex-shrink-0 glass-panel flex flex-col justify-between p-5 z-20 hidden md:flex transition-colors duration-300">
                        <div className="space-y-6">
                            <div className="flex items-center gap-3 px-1">
                                <img src="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png" className="w-8 h-8"/>
                                <div>
                                    <div className="font-bold text-sm tracking-tight text-zinc-900 dark:text-white">darNote</div>
                                    <div className="text-[10px] text-zinc-500 font-medium uppercase tracking-wider">Error Log</div>
                                </div>
                            </div>
                            
                            <nav className="space-y-1">
                                {[
                                    {id: 'all', icon: Icons.Bug, label: 'All Errors'},
                                    {id: 'active', icon: Icons.X, label: 'Needs Review'},
                                    {id: 'mastered', icon: Icons.Check, label: 'Mastered'}
                                ].map(item => (
                                    <button key={item.id} onClick={()=>setFilter(item.id)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${filter===item.id ? 'bg-zinc-200 dark:bg-white/10 text-zinc-900 dark:text-white shadow-sm' : 'text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-white/5 hover:text-zinc-900 dark:hover:text-white'}`}>
                                        <item.icon className="w-4 h-4"/> {item.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="pt-4 border-t border-zinc-200 dark:border-white/10">
                                <div className="px-2 text-[10px] font-bold text-zinc-400 mb-2 uppercase tracking-widest">Subjects</div>
                                <div className="space-y-0.5 max-h-[250px] overflow-y-auto">
                                    {subjects.map(s => (
                                        <button key={s.id} onClick={()=>setFilter(`subject:${s.name}`)} className={`w-full text-left px-3 py-2 rounded-lg text-sm transition-colors ${filter === `subject:${s.name}` ? 'bg-indigo-50 dark:bg-indigo-500/10 text-brand dark:text-indigo-400 font-medium' : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white hover:bg-zinc-100 dark:hover:bg-white/5'}`}>
                                            <span className={`w-1.5 h-1.5 rounded-full inline-block mr-2 ${filter === `subject:${s.name}` ? 'bg-brand' : 'bg-zinc-300 dark:bg-zinc-600'}`}></span>
                                            {s.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="space-y-3 pt-4 border-t border-zinc-200 dark:border-white/10">
                             <div className="flex items-center gap-3 px-2 py-1">
                                {user.photoURL ? <img src={user.photoURL} className="w-8 h-8 rounded-full border border-zinc-200 dark:border-white/10"/> : <div className="w-8 h-8 rounded-full bg-zinc-200 dark:bg-white/10 flex items-center justify-center"><Icons.User className="w-4 h-4 text-zinc-500"/></div>}
                                <div className="overflow-hidden">
                                    <div className="text-xs font-bold text-zinc-900 dark:text-white truncate w-32">{user.displayName || 'User'}</div>
                                    <div className="text-[10px] text-zinc-500 truncate">{user.email}</div>
                                </div>
                             </div>
                             <div className="flex gap-2">
                                <button onClick={()=>setIsDarkMode(!isDarkMode)} className="flex-1 btn-ghost py-2 rounded-lg flex items-center justify-center gap-2 text-xs font-medium border border-zinc-200 dark:border-white/5 bg-white dark:bg-white/5 shadow-sm">
                                    {isDarkMode ? <><Icons.Sun className="w-3 h-3"/> Light</> : <><Icons.Moon className="w-3 h-3"/> Dark</>}
                                </button>
                                <button onClick={()=>window.firebase.signOut(window.firebase.auth)} className="px-3 btn-ghost py-2 rounded-lg text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/10 border border-transparent">
                                    <Icons.Logout className="w-4 h-4"/>
                                </button>
                             </div>
                        </div>
                    </div>

                    {/* LIST VIEW */}
                    <div className="w-[320px] flex-shrink-0 border-r border-zinc-200 dark:border-white/5 bg-white dark:bg-surface flex flex-col z-10 shadow-[4px_0_24px_-12px_rgba(0,0,0,0.1)]">
                        <div className="p-4 border-b border-zinc-200 dark:border-white/5 space-y-3 bg-white dark:bg-surface z-20">
                            <input type="text" placeholder="Search mistakes..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="input-field pl-9 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHZpZXdCb3g9IjAgMCAyNCAyNCIgc3Ryb2tlPSIjNzE3MTdhIiBzdHJva2Utd2lkdGg9IjIiPjxjaXJjbGUgY3g9IjExIiBjeT0iMTEiIHI9IjgiLz48cGF0aCBkPSJtMjEgMjEtNC4zLTQuMyIvPjwvc3ZnPg==')] bg-no-repeat bg-[length:16px] bg-[12px_center]"/>
                            <button onClick={createLog} className="w-full bg-brand text-white py-2.5 rounded-lg font-bold text-sm hover:bg-indigo-600 shadow-lg shadow-indigo-500/20 transition-all flex justify-center items-center gap-2 active:scale-95"><Icons.Plus className="w-4 h-4"/> Log New Error</button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-2">
                            <AnimatePresence>
                                {filteredLogs.map(l => (
                                    <motion.div 
                                        initial={{ opacity: 0, y: 10 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        exit={{ opacity: 0, height: 0 }}
                                        key={l.id} 
                                        onClick={()=>setActiveLogId(l.id)} 
                                        className={`p-3.5 rounded-xl cursor-pointer border transition-all relative overflow-hidden group ${activeLogId===l.id ? 'bg-zinc-100 dark:bg-white/10 border-zinc-300 dark:border-white/20 shadow-md' : 'bg-transparent border-transparent hover:bg-zinc-50 dark:hover:bg-white/5'}`}
                                    >
                                        <div className="flex justify-between items-start mb-1">
                                            <div className="font-semibold text-sm truncate pr-2 text-zinc-800 dark:text-zinc-200 w-full">{l.title}</div>
                                            {l.mastered && <Icons.Check className="w-4 h-4 text-green-500 shrink-0"/>}
                                        </div>
                                        <div className="flex justify-between items-center mt-2">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-medium px-2 py-0.5 rounded bg-zinc-200 dark:bg-white/10 text-zinc-600 dark:text-zinc-400">{l.subject}</span>
                                                {l.topic && <span className="text-[10px] font-medium px-2 py-0.5 rounded border border-zinc-200 dark:border-white/10 text-zinc-500 dark:text-zinc-500 truncate max-w-[80px]">{l.topic}</span>}
                                            </div>
                                            <span className={`text-[10px] font-bold ${l.mastered ? 'text-green-600 dark:text-green-400' : 'text-red-500'}`}>{l.mastered ? 'SOLVED' : 'REVIEW'}</span>
                                        </div>
                                        {!l.mastered && <div className="absolute left-0 top-0 bottom-0 w-1 bg-red-500"></div>}
                                    </motion.div>
                                ))}
                            </AnimatePresence>
                            {filteredLogs.length === 0 && <div className="text-center text-zinc-400 py-10 text-sm">No logs found.</div>}
                        </div>
                    </div>

                    {/* EDITOR */}
                    <main className="flex-1 flex flex-col min-w-0 bg-[#f4f4f5] dark:bg-onyx relative transition-colors duration-300">
                        {activeLog ? (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col h-full">
                                <header className="h-16 flex items-center justify-between px-6 border-b border-zinc-200 dark:border-white/5 bg-white dark:bg-surface shrink-0 z-10">
                                    <div className="flex-1 flex items-center gap-2 mr-4">
                                        <input value={activeLog.title} onChange={e=>updateLog(activeLog.id, {title:e.target.value})} className="bg-transparent text-xl font-bold outline-none w-full text-zinc-900 dark:text-white placeholder-zinc-400" placeholder="Untitled Mistake"/>
                                        <button onClick={handleAutoTitle} disabled={isAutoTitleLoading || !activeLog.imageUrl} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isAutoTitleLoading ? 'bg-indigo-100 text-indigo-500 animate-pulse' : 'bg-zinc-100 dark:bg-white/10 text-zinc-600 dark:text-zinc-400 hover:bg-brand hover:text-white dark:hover:bg-brand'}`} title="Auto-generate title from image">
                                            {isAutoTitleLoading ? <div className="w-3 h-3 border-2 border-current border-t-transparent rounded-full animate-spin"/> : <Icons.Scan className="w-3 h-3"/>}
                                            <span className="hidden sm:inline">Auto-Title</span>
                                        </button>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={()=>updateLog(activeLog.id, {mastered: !activeLog.mastered})} className={`px-4 py-1.5 rounded-full text-xs font-bold border transition-all ${activeLog.mastered ? 'bg-green-500/10 border-green-500 text-green-600 dark:text-green-400' : 'bg-red-500/10 border-red-500 text-red-600 dark:text-red-400'}`}>
                                            {activeLog.mastered ? 'Mastered' : 'Needs Review'}
                                        </button>
                                        <div className="h-6 w-px bg-zinc-200 dark:bg-white/10 mx-2"></div>
                                        <button onClick={()=>setIsAiOpen(!isAiOpen)} className={`p-2 rounded-lg transition-colors ${isAiOpen ? 'bg-brand/10 text-brand' : 'hover:bg-zinc-100 dark:hover:bg-white/5 text-zinc-500 dark:text-zinc-400'}`} title="Open AI Tutor"><Icons.Bot className="w-5 h-5"/></button>
                                        <button onClick={()=>{if(confirm('Delete this log permanently?')) {deleteDoc(doc(window.firebase.db,'artifacts',"darnote-app",'users',user.uid,'error_logs',activeLog.id)); setActiveLogId(null);}}} className="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-zinc-400 hover:text-red-500 transition-colors"><Icons.Trash className="w-5 h-5"/></button>
                                    </div>
                                </header>

                                <div className="flex-1 overflow-y-auto p-6 md:p-10 scroll-smooth">
                                    <div className="max-w-5xl mx-auto space-y-8">
                                        
                                        {/* META CARD */}
                                        <div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5 grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div>
                                                <label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Subject</label>
                                                <select value={activeLog.subject} onChange={e=>updateLog(activeLog.id, {subject:e.target.value, topic: ''})} className="input-field bg-zinc-50 dark:bg-black/20">
                                                    <option>General</option>
                                                    {subjects.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Topic / Sub-Topic</label>
                                                <div className="flex gap-2">
                                                    {activeLog.subject !== 'General' && currentSubjectData ? (
                                                        <select 
                                                            value={activeLog.topic || ''} 
                                                            onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} 
                                                            className="input-field bg-zinc-50 dark:bg-black/20 flex-1"
                                                        >
                                                            <option value="">-- Select Topic --</option>
                                                            {currentTopics.map(t => <option key={t} value={t}>{t}</option>)}
                                                        </select>
                                                    ) : (
                                                        <input 
                                                            value={activeLog.topic || ''} 
                                                            onChange={e=>updateLog(activeLog.id, {topic:e.target.value})} 
                                                            className="input-field bg-zinc-50 dark:bg-black/20 flex-1" 
                                                            placeholder="Custom Topic"
                                                            disabled={activeLog.subject !== 'General'}
                                                        />
                                                    )}
                                                    {activeLog.subject !== 'General' && (
                                                        <button 
                                                            onClick={() => addTopicToSubject(activeLog.subject)}
                                                            className="px-3 py-2 bg-zinc-100 dark:bg-white/10 rounded-lg text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-white/20 transition-colors"
                                                            title="Add New Topic"
                                                        >
                                                            <Icons.Plus className="w-4 h-4"/>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-1 block">Question Type</label>
                                                <div className="flex bg-zinc-100 dark:bg-black/20 p-1 rounded-lg border border-zinc-200 dark:border-white/5">
                                                    {['MC', 'LQ'].map(t => (
                                                        <button key={t} onClick={()=>updateLog(activeLog.id, {questionType: t})} className={`flex-1 py-1.5 rounded-md text-xs font-bold transition-all ${activeLog.questionType===t ? 'bg-white dark:bg-zinc-700 shadow-sm text-black dark:text-white' : 'text-zinc-500'}`}>{t}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        {/* IMAGE UPLOADERS */}
                                        <div className="space-y-6">
                                            <ImageUploader 
                                                imageUrl={activeLog.imageUrl} 
                                                onUpload={(f) => handleUpload(f, 'question')} 
                                                label="Question Image" 
                                                isUploading={isUploadingQ}
                                            />
                                            
                                            {/* CONDITIONAL MARKING SCHEME UPLOADER */}
                                            {activeLog.questionType === 'LQ' && (
                                                <motion.div initial={{opacity:0, height:0}} animate={{opacity:1, height:'auto'}}>
                                                    <ImageUploader 
                                                        imageUrl={activeLog.markingSchemeUrl} 
                                                        onUpload={(f) => handleUpload(f, 'scheme')} 
                                                        label="Marking Scheme / Answer Key" 
                                                        isUploading={isUploadingS}
                                                    />
                                                </motion.div>
                                            )}
                                        </div>

                                        {/* ANALYSIS GRID */}
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                            {/* Left Col: Answer & Marks */}
                                            <div className="lg:col-span-1 space-y-6">
                                                <div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5">
                                                    <label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Correct Answer</label>
                                                    <input value={activeLog.correctAnswer} onChange={e=>updateLog(activeLog.id, {correctAnswer:e.target.value})} className="w-full bg-green-50 dark:bg-green-900/10 border border-green-200 dark:border-green-900/30 rounded-lg px-4 py-3 font-mono text-lg font-bold text-green-700 dark:text-green-400 focus:outline-none" placeholder="Ans"/>
                                                </div>
                                                <div className="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-zinc-200 dark:border-white/5">
                                                    <label className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-2 block">Marks Lost</label>
                                                    <input value={activeLog.marks} onChange={e=>updateLog(activeLog.id, {marks:e.target.value})} className="w-full bg-red-50 dark:bg-red-900/10 border border-red-200 dark:border-red-900/30 rounded-lg px-4 py-3 font-bold text-red-700 dark:text-red-400 focus:outline-none" placeholder="-2"/>
                                                </div>
                                            </div>

                                            {/* Right Col: Explanation */}
                                            <div className="lg:col-span-2 bg-white dark:bg-surface rounded-2xl border border-zinc-200 dark:border-white/5 shadow-sm overflow-hidden flex flex-col min-h-[250px]">
                                                <div className="px-5 py-3 border-b border-zinc-200 dark:border-white/5 bg-zinc-50/50 dark:bg-white/5 flex justify-between items-center">
                                                    <span className="text-xs font-bold text-zinc-500 uppercase tracking-wider">Analysis / Logic Gap</span>
                                                    <span className="text-[10px] text-zinc-400">Markdown supported</span>
                                                </div>
                                                <textarea 
                                                    className="flex-1 w-full p-5 bg-transparent outline-none resize-none text-sm leading-7 text-zinc-700 dark:text-zinc-300 placeholder-zinc-300 dark:placeholder-zinc-600" 
                                                    placeholder="• Why did I get this wrong?&#10;• What was the trap?&#10;• How do I solve it next time?"
                                                    value={activeLog.explanation}
                                                    onChange={e=>updateLog(activeLog.id, {explanation:e.target.value})}
                                                />
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </motion.div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-zinc-400 h-full">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="text-center">
                                    <div className="w-20 h-20 bg-zinc-100 dark:bg-white/5 rounded-3xl flex items-center justify-center mb-6 mx-auto shadow-inner"><Icons.Bug className="w-10 h-10 opacity-30"/></div>
                                    <h2 className="text-xl font-bold text-zinc-700 dark:text-zinc-200 mb-2">No Mistake Selected</h2>
                                    <p className="text-sm max-w-xs mx-auto">Select a log from the sidebar or create a new one to start documenting your learning journey.</p>
                                </motion.div>
                            </div>
                        )}
                        
                        {/* AI SLIDEOUT */}
                        <AnimatePresence>
                            {isAiOpen && activeLog && (
                                <div className="absolute top-0 right-0 bottom-0 w-[400px] z-30">
                                    <AIChat activeLog={activeLog} onClose={()=>setIsAiOpen(false)} user={user}/>
                                </div>
                            )}
                        </AnimatePresence>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
