<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>darNote - Admin Command Center</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/darren6251/darnote/refs/heads/main/darNote%20logo.png">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#1a73e8', 'primary-dark': '#1557b0', danger: '#d93025', success: '#1e8e3e', warning: '#f9ab00', dark: '#202124', 'surface-dark': '#1e1e20', onyx: '#121212' } } } }
</script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, getDocs, collection, query, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    const app = initializeApp({ apiKey: "AIzaSyAvPEac-03kE4oazvaq8K3T2gxLPsnZO20", authDomain: "darnote625.firebaseapp.com", projectId: "darnote625" });
    window.firebase = { app, auth: getAuth(app), db: getFirestore(app), signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, doc, getDoc, setDoc, getDocs, collection, query, updateDoc, deleteDoc };
</script>
<style>
    body { @apply bg-[#f0f4f9] text-[#202124] dark:bg-onyx dark:text-[#e8eaed]; font-family: 'Inter', sans-serif; overflow: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { @apply bg-white/20 rounded-full hover:bg-white/40; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect } = React;
    const ADMIN_UID = "lwIrCVDB6vT7s9lmJTc5MunPjfw2";
    const APP_ID = "darnote-app";

    const App = () => {
        const [user, setUser] = useState(null);
        const [isCheckingAuth, setIsCheckingAuth] = useState(true);
        const [activeTab, setActiveTab] = useState('global'); // global, students, user

        // Global Config State
        const [globalConfig, setGlobalConfig] = useState({ chat_gemini: 5, chat_groq: 20, practice: 10, ocr: 20 });
        const [configSaving, setConfigSaving] = useState(false);

        // Verification State
        const [pendingStudents, setPendingStudents] = useState([]);
        const [loadingStudents, setLoadingStudents] = useState(false);

        // User Inspector State
        const [searchUid, setSearchUid] = useState("");
        const [inspectedUser, setInspectedUser] = useState(null);
        const [inspectLoading, setInspectLoading] = useState(false);

        useEffect(() => {
            const unsub = window.firebase.onAuthStateChanged(window.firebase.auth, (u) => {
                setUser(u);
                setIsCheckingAuth(false);
                if (u && u.uid === ADMIN_UID) {
                    fetchGlobalConfig();
                    fetchVerifications();
                }
            });
            return () => unsub();
        }, []);

        const fetchGlobalConfig = async () => {
            try {
                const ref = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'public', 'data', 'config', 'main');
                const snap = await window.firebase.getDoc(ref);
                if (snap.exists()) setGlobalConfig(snap.data());
            } catch(e) { console.error("Failed to fetch config", e); }
        };

        const saveGlobalConfig = async () => {
            setConfigSaving(true);
            try {
                const ref = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'public', 'data', 'config', 'main');
                await window.firebase.setDoc(ref, globalConfig, { merge: true });
                alert("Global Config Updated!");
            } catch(e) { alert("Error saving config: " + e.message); }
            setConfigSaving(false);
        };

        const fetchVerifications = async () => {
            setLoadingStudents(true);
            try {
                const q = window.firebase.query(window.firebase.collection(window.firebase.db, 'artifacts', APP_ID, 'public', 'data', 'verified_students'));
                const snap = await window.firebase.getDocs(q);
                
                const students = [];
                for (let doc of snap.docs) {
                    const data = doc.data();
                    // Fetch their profile to see if they are fully verified
                    const profRef = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', data.uid, 'settings', 'profile');
                    const profSnap = await window.firebase.getDoc(profRef);
                    let profileData = profSnap.exists() ? profSnap.data() : {};
                    students.push({ id: doc.id, ...data, profile: profileData });
                }
                setPendingStudents(students);
            } catch(e) { console.error("Error fetching students", e); }
            setLoadingStudents(false);
        };

        const approveStudent = async (student) => {
            if (!confirm(`Approve ${student.school} ID for UID: ${student.uid}?`)) return;
            try {
                const profRef = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', student.uid, 'settings', 'profile');
                await window.firebase.setDoc(profRef, { 
                    studentStatus: 'verified', 
                    studentVerificationCooldown: null 
                }, { merge: true });
                alert("Student Approved. Limits lifted!");
                fetchVerifications();
            } catch (e) { alert("Error: " + e.message); }
        };

        const rejectStudent = async (student) => {
            if (!confirm(`Reject & Delete record for UID: ${student.uid}?`)) return;
            try {
                // Remove from registry
                await window.firebase.deleteDoc(window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'public', 'data', 'verified_students', student.id));
                // Update profile
                const profRef = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', student.uid, 'settings', 'profile');
                await window.firebase.setDoc(profRef, { 
                    studentStatus: 'none', 
                    proofUrl: null 
                }, { merge: true });
                fetchVerifications();
            } catch (e) { alert("Error: " + e.message); }
        };

        const inspectUser = async () => {
            if (!searchUid.trim()) return;
            setInspectLoading(true);
            setInspectedUser(null);
            try {
                const today = new Date().toISOString().split('T')[0];
                const profileRef = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', searchUid, 'settings', 'profile');
                const usageRef = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', searchUid, 'ai_usage', today);
                
                const [profSnap, usageSnap] = await Promise.all([
                    window.firebase.getDoc(profileRef),
                    window.firebase.getDoc(usageRef)
                ]);

                setInspectedUser({
                    uid: searchUid,
                    profile: profSnap.exists() ? profSnap.data() : {},
                    usage: usageSnap.exists() ? usageSnap.data() : { chat_count: 0, chat_groq_count: 0, practice_count: 0, ocr_count: 0 },
                    todayStr: today
                });
            } catch(e) { alert("Could not fetch user. Error: " + e.message); }
            setInspectLoading(false);
        };

        const resetUserUsage = async (field) => {
            if (!inspectedUser) return;
            try {
                const usageRef = window.firebase.doc(window.firebase.db, 'artifacts', APP_ID, 'users', inspectedUser.uid, 'ai_usage', inspectedUser.todayStr);
                await window.firebase.setDoc(usageRef, { [field]: 0 }, { merge: true });
                alert(`Reset ${field} to 0!`);
                inspectUser(); // Refresh
            } catch(e) { alert("Failed to reset: " + e.message); }
        };

        if (isCheckingAuth) return <div className="h-screen w-full flex items-center justify-center bg-onyx text-white">Checking Credentials...</div>;
        
        if (!user) {
            return (
                <div className="h-screen w-full flex items-center justify-center bg-onyx flex-col gap-6">
                    <div className="text-center">
                        <i className="fa-solid fa-shield-halved text-5xl text-primary mb-4"></i>
                        <h1 className="text-3xl font-bold text-white mb-2">Admin Command Center</h1>
                        <p className="text-gray-400 mb-8">Restricted Access.</p>
                        <button onClick={() => window.firebase.signInWithPopup(window.firebase.auth, new window.firebase.GoogleAuthProvider())} className="bg-primary text-white px-8 py-3 rounded-full font-bold hover:bg-primary-dark transition-all">Sign In</button>
                    </div>
                </div>
            );
        }

        if (user.uid !== ADMIN_UID) {
            return (
                <div className="h-screen w-full flex items-center justify-center bg-onyx flex-col gap-6">
                    <div className="text-center bg-surface-dark p-10 rounded-3xl border border-danger/30 max-w-md shadow-2xl">
                        <i className="fa-solid fa-triangle-exclamation text-6xl text-danger mb-4"></i>
                        <h1 className="text-2xl font-bold text-white mb-2">Unauthorized Identity</h1>
                        <p className="text-gray-400 mb-4 text-sm">UID: {user.uid}</p>
                        <p className="text-danger font-medium mb-8">You are not the Supreme Architect. Begone.</p>
                        <button onClick={() => window.firebase.signOut(window.firebase.auth)} className="bg-danger/20 text-danger border border-danger/50 px-8 py-2.5 rounded-full font-bold hover:bg-danger/30 transition-all">Sign Out</button>
                    </div>
                </div>
            );
        }

        return (
            <div className="flex h-screen bg-onyx text-[#e8eaed] overflow-hidden">
                {/* Sidebar */}
                <div className="w-64 bg-surface-dark border-r border-white/5 flex flex-col z-10 shrink-0">
                    <div className="p-6 border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <i className="fa-solid fa-server text-primary text-xl"></i>
                            <span className="font-bold text-lg text-white">OmniControl</span>
                        </div>
                        <div className="text-[10px] text-gray-500 mt-1 font-mono">{user.uid}</div>
                    </div>
                    <div className="flex-1 py-4 space-y-1 px-3">
                        <button onClick={() => setActiveTab('global')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors ${activeTab === 'global' ? 'bg-primary/20 text-primary font-bold' : 'text-gray-400 hover:bg-white/5 hover:text-white'}`}><i className="fa-solid fa-globe w-5"></i> Global Quotas</button>
                        <button onClick={() => setActiveTab('students')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors ${activeTab === 'students' ? 'bg-primary/20 text-primary font-bold' : 'text-gray-400 hover:bg-white/5 hover:text-white'}`}><i className="fa-solid fa-id-card w-5"></i> Verifications</button>
                        <button onClick={() => setActiveTab('user')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors ${activeTab === 'user' ? 'bg-primary/20 text-primary font-bold' : 'text-gray-400 hover:bg-white/5 hover:text-white'}`}><i className="fa-solid fa-user-secret w-5"></i> User Inspector</button>
                    </div>
                    <div className="p-4 border-t border-white/5">
                        <button onClick={() => window.firebase.signOut(window.firebase.auth)} className="w-full flex items-center justify-center gap-2 text-gray-400 hover:text-danger hover:bg-danger/10 py-2 rounded-lg transition-colors text-sm font-medium"><i className="fa-solid fa-right-from-bracket"></i> Lock Down</button>
                    </div>
                </div>

                {/* Main Content */}
                <div className="flex-1 flex flex-col h-full bg-[#121212] overflow-y-auto custom-scrollbar">
                    
                    {/* GLOBAL CONFIG TAB */}
                    {activeTab === 'global' && (
                        <div className="p-8 max-w-4xl mx-auto w-full">
                            <h2 className="text-3xl font-bold text-white mb-2 border-b border-white/10 pb-4">Global Quota Defaults</h2>
                            <p className="text-sm text-gray-400 mb-8">These limits apply daily to all standard (non-verified) users.</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <div className="bg-surface-dark p-6 rounded-2xl border border-white/5">
                                    <label className="text-xs text-gray-400 uppercase tracking-wider font-bold mb-3 flex items-center gap-2"><i className="fa-solid fa-robot text-primary"></i> Gemini Chats</label>
                                    <input type="number" value={globalConfig.chat_gemini} onChange={(e) => setGlobalConfig({...globalConfig, chat_gemini: Number(e.target.value)})} className="w-full bg-[#1a1a1c] border border-white/10 rounded-xl px-4 py-3 text-white font-mono outline-none focus:border-primary"/>
                                </div>
                                <div className="bg-surface-dark p-6 rounded-2xl border border-white/5">
                                    <label className="text-xs text-gray-400 uppercase tracking-wider font-bold mb-3 flex items-center gap-2"><i className="fa-solid fa-bolt text-warning"></i> Groq Chats</label>
                                    <input type="number" value={globalConfig.chat_groq} onChange={(e) => setGlobalConfig({...globalConfig, chat_groq: Number(e.target.value)})} className="w-full bg-[#1a1a1c] border border-white/10 rounded-xl px-4 py-3 text-white font-mono outline-none focus:border-primary"/>
                                </div>
                                <div className="bg-surface-dark p-6 rounded-2xl border border-white/5">
                                    <label className="text-xs text-gray-400 uppercase tracking-wider font-bold mb-3 flex items-center gap-2"><i className="fa-solid fa-brain text-[#0f9d58]"></i> Practice Generations</label>
                                    <input type="number" value={globalConfig.practice} onChange={(e) => setGlobalConfig({...globalConfig, practice: Number(e.target.value)})} className="w-full bg-[#1a1a1c] border border-white/10 rounded-xl px-4 py-3 text-white font-mono outline-none focus:border-primary"/>
                                </div>
                                <div className="bg-surface-dark p-6 rounded-2xl border border-white/5">
                                    <label className="text-xs text-gray-400 uppercase tracking-wider font-bold mb-3 flex items-center gap-2"><i className="fa-solid fa-eye text-[#a142f4]"></i> OCR / Image Scans</label>
                                    <input type="number" value={globalConfig.ocr} onChange={(e) => setGlobalConfig({...globalConfig, ocr: Number(e.target.value)})} className="w-full bg-[#1a1a1c] border border-white/10 rounded-xl px-4 py-3 text-white font-mono outline-none focus:border-primary"/>
                                </div>
                            </div>
                            <button onClick={saveGlobalConfig} disabled={configSaving} className="bg-primary hover:bg-primary-dark text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-lg flex items-center gap-2">
                                {configSaving ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"/> : <i className="fa-solid fa-floppy-disk"></i>}
                                Save Global Defaults
                            </button>
                        </div>
                    )}

                    {/* STUDENT VERIFICATIONS TAB */}
                    {activeTab === 'students' && (
                        <div className="p-8 max-w-6xl mx-auto w-full">
                            <div className="flex justify-between items-end mb-8 border-b border-white/10 pb-4">
                                <div>
                                    <h2 className="text-3xl font-bold text-white mb-2">Student ID Pipeline</h2>
                                    <p className="text-sm text-gray-400">Review pending IDs. Approving them permanently unlocks their quotas.</p>
                                </div>
                                <button onClick={fetchVerifications} className="bg-surface-dark hover:bg-white/10 border border-white/10 px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2"><i className="fa-solid fa-rotate-right"></i> Refresh List</button>
                            </div>

                            {loadingStudents ? (
                                <div className="flex flex-col items-center justify-center py-20 text-gray-500"><i className="fa-solid fa-circle-notch fa-spin text-3xl mb-4"></i>Loading Database...</div>
                            ) : pendingStudents.length === 0 ? (
                                <div className="bg-surface-dark border border-dashed border-white/10 rounded-3xl p-16 text-center text-gray-500">No students are currently waiting for approval. Queue is clear!</div>
                            ) : (
                                <div className="space-y-4">
                                    {pendingStudents.map(student => (
                                        <div key={student.id} className="bg-surface-dark border border-white/10 rounded-2xl p-6 flex flex-col md:flex-row gap-6 items-center">
                                            <div className="flex-1 space-y-2">
                                                <div className="flex items-center gap-3">
                                                    <span className="text-xl font-bold text-white">{student.profile?.verifiedData?.fullName || "Name Unknown"}</span>
                                                    {student.profile?.studentStatus === 'verified' && <span className="bg-success/20 text-success text-[10px] uppercase font-bold px-2 py-0.5 rounded">Verified</span>}
                                                    {student.profile?.studentStatus === 'temp_verified' && <span className="bg-warning/20 text-warning text-[10px] uppercase font-bold px-2 py-0.5 rounded">Pending Review</span>}
                                                </div>
                                                <div className="text-sm text-gray-400"><i className="fa-solid fa-school mr-2"></i>{student.school || student.profile?.verifiedData?.schoolName || "School Unknown"}</div>
                                                <div className="text-xs font-mono text-gray-600 bg-black/50 px-2 py-1 rounded inline-block">UID: {student.uid}</div>
                                            </div>
                                            
                                            {student.profile?.proofUrl && (
                                                <div className="shrink-0 w-48 h-32 bg-black rounded-xl overflow-hidden border border-white/10 relative group">
                                                    <img src={student.profile.proofUrl} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" />
                                                    <a href={student.profile.proofUrl} target="_blank" className="absolute inset-0 flex items-center justify-center bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity text-white font-bold text-sm backdrop-blur-sm"><i className="fa-solid fa-up-right-from-square mr-2"></i> View ID Full</a>
                                                </div>
                                            )}

                                            <div className="flex flex-col gap-2 shrink-0">
                                                {student.profile?.studentStatus !== 'verified' && (
                                                    <button onClick={() => approveStudent(student)} className="bg-success/20 hover:bg-success/30 text-success border border-success/30 px-6 py-2 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-check"></i> Approve & Verify</button>
                                                )}
                                                <button onClick={() => rejectStudent(student)} className="bg-danger/10 hover:bg-danger/20 text-danger border border-danger/30 px-6 py-2 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-trash"></i> Reject & Delete</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* USER INSPECTOR TAB */}
                    {activeTab === 'user' && (
                        <div className="p-8 max-w-5xl mx-auto w-full">
                            <h2 className="text-3xl font-bold text-white mb-2 border-b border-white/10 pb-4">Target Inspector</h2>
                            <p className="text-sm text-gray-400 mb-8">Input a specific User UID to rip open their profile and manually reset usage flags.</p>

                            <div className="flex gap-4 mb-8">
                                <input type="text" value={searchUid} onChange={(e) => setSearchUid(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && inspectUser()} placeholder="Paste target UID here..." className="flex-1 bg-surface-dark border border-white/10 rounded-xl px-4 py-3 text-white font-mono outline-none focus:border-primary shadow-inner" />
                                <button onClick={inspectUser} disabled={inspectLoading || !searchUid.trim()} className="bg-primary hover:bg-primary-dark text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-lg disabled:opacity-50 flex items-center gap-2">
                                    {inspectLoading ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"/> : <i className="fa-solid fa-magnifying-glass"></i>} Inspect Target
                                </button>
                            </div>

                            {inspectedUser && (
                                <div className="space-y-6">
                                    <div className="bg-surface-dark border border-white/10 rounded-2xl p-6">
                                        <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><i className="fa-solid fa-address-card text-primary"></i> Profile Data</h3>
                                        <pre className="bg-[#121212] p-4 rounded-xl text-xs font-mono text-gray-300 overflow-x-auto border border-white/5">
                                            {JSON.stringify(inspectedUser.profile, null, 2)}
                                        </pre>
                                    </div>

                                    <div className="bg-surface-dark border border-white/10 rounded-2xl p-6">
                                        <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2"><i className="fa-solid fa-chart-line text-warning"></i> Today's Usage ({inspectedUser.todayStr})</h3>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                            <div className="bg-[#121212] p-4 rounded-xl border border-white/5 flex flex-col items-center justify-center relative overflow-hidden">
                                                <div className="text-xs text-gray-500 uppercase font-bold mb-2">Gemini Calls</div>
                                                <div className="text-3xl font-bold text-white">{inspectedUser.usage.chat_count || 0}</div>
                                                <button onClick={() => resetUserUsage('chat_count')} className="mt-4 text-[10px] bg-primary/20 text-primary hover:bg-primary/40 px-3 py-1 rounded w-full font-bold transition-colors">RESET TO 0</button>
                                            </div>
                                            <div className="bg-[#121212] p-4 rounded-xl border border-white/5 flex flex-col items-center justify-center">
                                                <div className="text-xs text-gray-500 uppercase font-bold mb-2">Groq Calls</div>
                                                <div className="text-3xl font-bold text-white">{inspectedUser.usage.chat_groq_count || 0}</div>
                                                <button onClick={() => resetUserUsage('chat_groq_count')} className="mt-4 text-[10px] bg-warning/20 text-warning hover:bg-warning/40 px-3 py-1 rounded w-full font-bold transition-colors">RESET TO 0</button>
                                            </div>
                                            <div className="bg-[#121212] p-4 rounded-xl border border-white/5 flex flex-col items-center justify-center">
                                                <div className="text-xs text-gray-500 uppercase font-bold mb-2">Drill Gens</div>
                                                <div className="text-3xl font-bold text-white">{inspectedUser.usage.practice_count || 0}</div>
                                                <button onClick={() => resetUserUsage('practice_count')} className="mt-4 text-[10px] bg-[#0f9d58]/20 text-[#0f9d58] hover:bg-[#0f9d58]/40 px-3 py-1 rounded w-full font-bold transition-colors">RESET TO 0</button>
                                            </div>
                                            <div className="bg-[#121212] p-4 rounded-xl border border-white/5 flex flex-col items-center justify-center">
                                                <div className="text-xs text-gray-500 uppercase font-bold mb-2">OCR Scans</div>
                                                <div className="text-3xl font-bold text-white">{inspectedUser.usage.ocr_count || 0}</div>
                                                <button onClick={() => resetUserUsage('ocr_count')} className="mt-4 text-[10px] bg-[#a142f4]/20 text-[#a142f4] hover:bg-[#a142f4]/40 px-3 py-1 rounded w-full font-bold transition-colors">RESET TO 0</button>
                                            </div>
                                        </div>
                                        <p className="text-xs text-gray-500 mt-4 italic text-center">* Resetting a stat to 0 immediately restores their daily quota for that specific tool.</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
